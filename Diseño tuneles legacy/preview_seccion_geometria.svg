<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M 55 0 L 0 0 0 55" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 14px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 12px Arial, sans-serif; fill: #334155; letter-spacing: .2px; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; }
      .value { font: 700 14px Arial, sans-serif; fill: #1e3a8a; }
      .field { fill: #fff; stroke: #60a5fa; stroke-width: 1.5; rx: 5; }
      .dim { stroke: #94a3b8; stroke-width: 1.4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .sep { stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#f8fafc"/>
  <rect x="24" y="24" width="1052" height="672" rx="12" fill="url(#grid)"/>

  <text x="54" y="62" class="title">Previsualización propuesta · sección transversal</text>
  <text x="54" y="88" class="subtitle">Campos de dimensiones fuera de la sección · acera–arcén–calzada–arcén–acera</text>

  <!-- Campos superiores, separados del dibujo -->
  <rect x="74" y="112" width="144" height="48" class="field" filter="url(#shadow)"/>
  <text x="88" y="132" class="label">FORMA</text>
  <text x="88" y="151" class="value">Bóveda</text>

  <rect x="246" y="112" width="144" height="48" class="field" filter="url(#shadow)"/>
  <text x="260" y="132" class="label">Nº CARRILES</text>
  <text x="260" y="151" class="value">2</text>

  <rect x="418" y="112" width="144" height="48" class="field" filter="url(#shadow)"/>
  <text x="432" y="132" class="label">ANCHO CARRIL</text>
  <text x="432" y="151" class="value">3,50 m</text>

  <rect x="834" y="112" width="174" height="48" class="field" filter="url(#shadow)"/>
  <text x="848" y="132" class="label">H PARED / H HASTIAL</text>
  <text x="848" y="151" class="value">4,50 m</text>

  <!-- Volumen de la sección, sin línea de contorno exterior -->
  <path d="M184 390 L184 315 C184 208 348 177 550 177 C752 177 916 208 916 315 L916 390 L184 390 Z"
        fill="#cbd5e1"/>
  <path d="M212 390 L212 322 C212 246 366 211 550 211 C734 211 888 246 888 322 L888 390 Z"
        fill="#e5e7eb"/>

  <!-- Banda funcional, de fuera hacia dentro: acera, arcén, calzada, arcén, acera -->
  <rect x="170" y="390" width="112" height="58" fill="#cbd5e1"/>
  <rect x="282" y="390" width="82" height="58" fill="#64748b"/>
  <rect x="364" y="390" width="372" height="58" fill="#374151"/>
  <rect x="736" y="390" width="82" height="58" fill="#64748b"/>
  <rect x="818" y="390" width="112" height="58" fill="#cbd5e1"/>

  <!-- Separación fina acera/arcén y arcén/calzada -->
  <line x1="282" y1="390" x2="282" y2="448" class="sep"/>
  <line x1="364" y1="390" x2="364" y2="448" class="sep"/>
  <line x1="736" y1="390" x2="736" y2="448" class="sep"/>
  <line x1="818" y1="390" x2="818" y2="448" class="sep"/>

  <!-- Calzada, ejes y sentido -->
  <line x1="364" y1="419" x2="736" y2="419" stroke="#f8fafc" stroke-width="2" stroke-dasharray="10 10" opacity=".8"/>
  <text x="550" y="414" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="13" font-weight="700">CALZADA · 7,00 m</text>
  <text x="550" y="438" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="11">superficie de cálculo</text>

  <!-- Etiquetas de superficies -->
  <text x="226" y="375" text-anchor="middle" class="label">ACERA IZQ.</text>
  <text x="323" y="375" text-anchor="middle" class="label">ARCÉN IZQ.</text>
  <text x="777" y="375" text-anchor="middle" class="label">ARCÉN DER.</text>
  <text x="874" y="375" text-anchor="middle" class="label">ACERA DER.</text>

  <!-- Cota de altura libre a la izquierda -->
  <line x1="143" y1="211" x2="143" y2="448" class="dim"/>
  <rect x="48" y="292" width="82" height="48" class="field" filter="url(#shadow)"/>
  <text x="89" y="311" text-anchor="middle" class="label">H LIBRE</text>
  <text x="89" y="330" text-anchor="middle" class="value">5,50 m</text>

  <!-- Cota de altura de hastial a la derecha -->
  <line x1="957" y1="315" x2="957" y2="448" class="dim"/>
  <rect x="971" y="350" width="86" height="48" class="field" filter="url(#shadow)"/>
  <text x="1014" y="369" text-anchor="middle" class="label">H PARED</text>
  <text x="1014" y="388" text-anchor="middle" class="value">4,50 m</text>

  <!-- Campos inferiores, alineados con cada superficie y sin solaparse -->
  <rect x="178" y="490" width="96" height="54" class="field" filter="url(#shadow)"/>
  <text x="226" y="510" text-anchor="middle" class="label">ACERA IZQ.</text>
  <text x="226" y="531" text-anchor="middle" class="value">1,20 m</text>

  <rect x="275" y="490" width="96" height="54" class="field" filter="url(#shadow)"/>
  <text x="323" y="510" text-anchor="middle" class="label">ARCÉN IZQ.</text>
  <text x="323" y="531" text-anchor="middle" class="value">1,00 m</text>

  <rect x="729" y="490" width="96" height="54" class="field" filter="url(#shadow)"/>
  <text x="777" y="510" text-anchor="middle" class="label">ARCÉN DER.</text>
  <text x="777" y="531" text-anchor="middle" class="value">1,00 m</text>

  <rect x="826" y="490" width="96" height="54" class="field" filter="url(#shadow)"/>
  <text x="874" y="510" text-anchor="middle" class="label">ACERA DER.</text>
  <text x="874" y="531" text-anchor="middle" class="value">1,20 m</text>

  <!-- Ancho total bajo la sección -->
  <line x1="170" y1="466" x2="930" y2="466" class="dim"/>
  <rect x="453" y="575" width="194" height="54" class="field" filter="url(#shadow)"/>
  <text x="550" y="595" text-anchor="middle" class="label">ANCHO TOTAL W</text>
  <text x="550" y="616" text-anchor="middle" class="value">11,40 m</text>

  <text x="550" y="663" text-anchor="middle" class="small">La línea exterior de contorno se elimina; se mantienen solo los separadores internos de superficies.</text>
</svg>
