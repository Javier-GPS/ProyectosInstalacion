          {form.luminaires_result && onGoToMap && (
            <button onClick={onGoToMap}
              style={{padding:"8px 18px", fontSize:".8rem", fontWeight:700,
                      cursor:"pointer", borderRadius:6,
                      background:"#fffbeb", color:"#92400e",
                      border:"2px solid #d97706", whiteSpace:"nowrap"}}>
              🗺 Ver posición en mapa
            </button>
          )}
        </div>
        {error && <Alert type="danger" style={{marginTop:8}}>{error}</Alert>}
      </div>

            {lumResult && (
        <>
          {/* ══ Fila 1: Zonas CIE (izquierda) + KPIs / chips (derecha) ══ */}
          {(() => {
            const ZK_LBL = { access:'Acceso', threshold:'Umbral', transition:'Transición',
              interior:'Interior', transition_b:'Trans. B', threshold_b:'Umbral B',
              exit:'Salida', parting:'Post-sal.' };
            const ZK_BG = { access:'#fdecea', threshold:'#fff8e1', transition:'#e0f7fa',
              interior:'#e8f5e9', transition_b:'#cce5ff', threshold_b:'#fff3cd',
              exit:'#f3e5f5', parting:'#fdecea' };
            const sortedZ = Object.entries(result.zones||{}).sort(([,a],[,b])=>a.s_start-b.s_start);
            return (
              <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:10}}>
                <div style={{flex:"0 0 38%",minWidth:0}}>
                  <div className="card" style={{marginBottom:0}}>
                    <div className="card-title" style={{fontSize:".76rem",marginBottom:6}}>📏 Zonas Normativas CIE 88</div>
                    <table className="result-table" style={{fontSize:".73rem"}}>
                      <thead><tr>
                        <th>Zona</th>
                        <th style={{textAlign:"right"}}>m</th>
                        <th style={{textAlign:"right"}}>L req. (cd/m²)</th>
                      </tr></thead>
                      <tbody>
                        {sortedZ.map(([key,z])=>(
                          <tr key={key} style={{background:ZK_BG[key]||'#fff'}}>

                            <td>TOTAL</td>
                            {zoneKeys.map((zk,i)=>{
                              const colN=MODELS.reduce((s,m)=>s+(agg[m].n[zk]||0),0);
                              return <td key={i} style={{textAlign:"center"}}>{colN||"—"}</td>;
                            })}
                            <td style={{textAlign:"center",borderLeft:"2px solid var(--salvi-line)"}}>{grandN}</td>
                            <td style={{textAlign:"right"}}>{(grandPw/1000).toFixed(1)}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* ══ Perfil CIE 88 + layout luminarias ══ */}
          <div className="card">
            <div className="card-title">📈 Perfil de Luminancia + Layout Aphex</div>
            <TunnelLuminanceLayout result={result} lumResult={lumResult} photoResult={photoResult}/>
          </div>

          {/* Avisos */}
          {lumResult.warnings?.length > 0 && (
            <div className="card">
              {_asArr(lumResult.warnings).map((w,i)=><Alert key={i} type="warning">⚠️ {w}</Alert>)}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function StepReport({ result, form, tubes, onChange }) {
  const [generating, setGenerating]       = useState(false);
  const [generatingXls, setGeneratingXls] = useState(false);
  const [generatingAll, setGeneratingAll] = useState(false);
  const [status, setStatus]               = useState(null);
  const [reportVersion, setReportVersion] = useState("v2");

  if (!result || !result.success) {
    return <Alert type="info">Completa el cálculo antes de generar el informe.</Alert>;
  }

  const { summary, classification, zones, control } = result;

  // Tubos con resultado calculado
  const calculatedTubes = tubes
    ? Object.entries(tubes).filter(([,t]) => t.result?.success)
    : [];
  const isMultiTube = calculatedTubes.length > 1;

  const handleGenerate = async () => {
    setGenerating(true);
    const hasValidatedPhotometry = !!(
      form?.luminaires_result?.zones?.length && form?.photometric_result?.real_profile?.available
    );
    setStatus({
      type:"info",
      msg: hasValidatedPhotometry
        ? "Preparando el informe Word con los resultados fotométricos ya validados…"
        : "Calculando fotometría CIE 140 para completar el informe Word; puede tardar unos instantes…"
    });
    try {
      const resp = await fetch('/api/tunnel/report', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          ...form,
          report_version: reportVersion,
          luminaire: {...DEFAULT_LUM_CONFIG, ...(form.lum_config || {})},
        })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({error: resp.statusText}));
        setStatus({type:"error", msg:`Error ${resp.status}: ${err.error || resp.statusText}`});
        return;
      }
      // Descargar el blob
      const blob = await resp.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `informe_tunel_${form.tube_id || 'T1'}.docx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus({type:"success", msg:"✅ Informe completo descargado correctamente."});
    } catch(e) {
      setStatus({type:"error", msg:`Error de conexión: ${e.message}`});
    } finally {
      setGenerating(false);
    }
  };

  // Zonas: adaptar tanto formato array como objeto
  const zonesArr = Array.isArray(zones)
    ? zones
    : Object.values(zones || {});

  // Handler informe combinado (multi-tubo)
  const handleCombined = async () => {
    setGeneratingAll(true);
    setStatus({type:"info", msg:`Generando informe combinado (${calculatedTubes.length} tubos)…`});
    try {
      // Construir payload con solo los forms de los tubos calculados
      const tubesPayload = {};
      calculatedTubes.forEach(([id, t]) => {
        tubesPayload[id] = {
          form: {
            ...t.form,
            luminaire: {...DEFAULT_LUM_CONFIG, ...(t.form.lum_config || {})},
          },
        };
      });
      const resp = await fetch('/api/tunnel/report-combined', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          tubes: tubesPayload,
          project_name: form.project_name || '',
          report_version: reportVersion,
        })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({error: resp.statusText}));
        setStatus({type:"error", msg:`Error ${resp.status}: ${err.error || resp.statusText}`});
        return;
      }
      const blob = await resp.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `informe_${(form.project_name||'tunel').replace(/\s+/g,'_')}_completo.docx`;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus({type:"success", msg:`✅ Informe combinado descargado (${calculatedTubes.length} tubos).`});
    } catch(e) {
      setStatus({type:"error", msg:`Error: ${e.message}`});
    } finally {
      setGeneratingAll(false);

          {isMultiTube && (<>

                  const resp = await fetch('/api/tunnel/export-excel-combined', {

                  if (!resp.ok) {
                    const err = await resp.json().catch(() => ({error: resp.statusText}));

                  }
                  const blob = await resp.blob();
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');

                  a.download = `calculo_${(form.project_name||'tunel').replace(/\s+/g,'_')}_completo.xlsx`;

function TubeComparison({ tubes }) {
  const tubeIds    = Object.keys(tubes).filter(id => tubes[id].result?.success);
  if (tubeIds.length < 2) return null;

  const metrics = [
    {key:"L20",     label:"L₂₀ (cd/m²)",   path: r => r.summary.L20},
    {key:"Lth",     label:"Lth (cd/m²)",    path: r => r.summary.Lth},
    {key:"Lin",     label:"Lin (cd/m²)",    path: r => r.summary.Lin},
    {key:"L_night", label:"L_noche (cd/m²)",path: r => r.summary.L_night},
    {key:"SD",      label:"SD (m)",          path: r => r.summary.SD_m},
    {key:"kfactor", label:"Factor k",        path: r => r.summary.k_factor},
    {key:"optical", label:"Clase óptica",    path: r => r.classification.optical.replace(/_/g," ")},
    {key:"daylighting",label:"Ilum. diurna", path: r => r.classification.daylighting},
  ];

  return (
    <div className="card" style={{marginTop:16}}>
      <div className="card-title">
        <span className="section-icon">🔀</span>Comparativa de Tubos
      </div>
      <div style={{overflowX:"auto"}}>
        <table className="result-table" style={{fontSize:".85rem"}}>
          <thead>
            <tr>
              <th style={{textAlign:"left"}}>Parámetro</th>
              {tubeIds.map(id => (
                <th key={id} style={{background:"var(--brand-lt)",color:"var(--brand-dk)"}}>
                  Tubo {id}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {metrics.map(({key, label, path}) => {
              const vals = tubeIds.map(id => {
                try { return path(tubes[id].result); } catch { return "—"; }
              });
              const allSame = vals.every(v => v === vals[0]);
              return (
                <tr key={key}>
                  <td style={{fontWeight:600,color:"var(--gray-700)"}}>{label}</td>
                  {vals.map((v, i) => (
                    <td key={i} style={{
                      textAlign:"center",
                      fontWeight: !allSame && typeof v === "number" ? 700 : 400,
                      color: !allSame && typeof v === "number" && i === 0 ? "var(--brand)" : "inherit"
                    }}>
                      {v}
                    </td>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p style={{fontSize:".78rem",color:"var(--gray-400)",marginTop:8}}>
        Diferencias resaltadas en azul (T1). Los dos tubos se calculan independientemente.
      </p>
    </div>
  );
}

function TunnelPerspective({ form, result, onChange }) {
  const W  = parseFloat(form.width_m)  || 8;
  const H  = parseFloat(form.height_m) || 5;
  const L  = parseFloat(form.length_m) || 500;
  const lanes = parseInt(form.num_lanes) || 2;
  const dir   = form.traffic_direction === 'two_way' ? '⇅' : '↑';
  const slope = parseFloat(form.gradient_pct) || 0;
  const shRightM = Math.max(0, parseFloat(form.shoulder_right_m) || 0);

  const setGeomPart = (key, value) => {
    onChange(key, value);
    if(!['num_lanes','lane_width_m','shoulder_left_m','shoulder_right_m','sidewalk_left_m','sidewalk_right_m'].includes(key)) return;
    const p = {
      num_lanes: form.num_lanes, lane_width_m: form.lane_width_m,
      shoulder_left_m: form.shoulder_left_m, shoulder_right_m: form.shoulder_right_m,
      sidewalk_left_m: form.sidewalk_left_m, sidewalk_right_m: form.sidewalk_right_m,
      [key]: value,
    };
    const total = (parseInt(p.num_lanes)||2) * (parseFloat(p.lane_width_m)||3.5)
      + (parseFloat(p.shoulder_left_m)||0) + (parseFloat(p.shoulder_right_m)||0)
      + (parseFloat(p.sidewalk_left_m)||0) + (parseFloat(p.sidewalk_right_m)||0);
    onChange('width_m', Math.round(total*100)/100);
  };
  const editNumber = (x, y, value, key, opts={}) => (
    <foreignObject x={x} y={y} width={opts.width||52} height={opts.height||22}>
      <input type="number" value={value??''} min={opts.min} max={opts.max} step={opts.step||0.1}
        title={opts.title||key}
        onChange={e=>opts.recompute ? setGeomPart(key,e.target.value) : onChange(key,e.target.value)}
        style={{width:'100%',height:'100%',boxSizing:'border-box',padding:'2px 3px',fontFamily:'inherit',fontSize:'11px',fontWeight:700,
          textAlign:'center',border:'none',outline:'none',borderRadius:4,background:'#fff',color:'#111827'}}/>
    </foreignObject>
  );
  const editSelect = (x, y, value, key, options, opts={}) => (
    <foreignObject x={x} y={y} width={opts.width||58} height={opts.height||22}>
      <select value={value??''} title={opts.title||key}
        onChange={e=>opts.recompute ? setGeomPart(key,e.target.value) : onChange(key,e.target.value)}
        style={{width:'100%',height:'100%',boxSizing:'border-box',padding:'1px 2px',fontFamily:'inherit',fontSize:'11px',fontWeight:700,
          border:'none',outline:'none',borderRadius:4,background:'#fff',color:'#111827'}}>
        {options.map(([v,label])=><option key={v} value={v}>{label}</option>)}
      </select>
    </foreignObject>
  );

  // A compact, editable photometric value.  It lives above the tunnel so the
  // values remain readable without covering the reflective lining or road.
  const editLuminancePill = (x, y, label, value, key, opts={}) => (
    <foreignObject x={x} y={y} width={opts.width||136} height={26}>
      <div style={{height:'100%',boxSizing:'border-box',display:'flex',alignItems:'center',gap:3,
        padding:'2px 7px',background:'#fff',borderRadius:7,fontFamily:'inherit',color:'#111827'}}>
        <span style={{fontSize:'10px',fontWeight:700,whiteSpace:'nowrap'}}>{label}</span>
        <input type="number" value={Number(value)>0 ? Number(value).toFixed(1) : ''} min={opts.min} max={opts.max} step={opts.step||0.1}
          title={opts.title||label}
          onChange={e=>onChange(key,e.target.value)}
          style={{width:0,flex:1,minWidth:0,padding:0,fontFamily:'inherit',fontSize:'10px',fontWeight:700,
            color:'#111827',background:'transparent',border:'none',outline:'none',textAlign:'center'}}/>
        <span style={{fontSize:'8px',fontWeight:600,whiteSpace:'nowrap'}}>cd/m²</span>
      </div>
    </foreignObject>
  );

  // SVG viewport
  const SVG_W = 620, SVG_H = 390;
  const margin = { top: 78, right: 34, bottom: 108, left: 70 };
  const tW = SVG_W - margin.left - margin.right;   // tunnel drawing width
  const tH = SVG_H - margin.top  - margin.bottom;  // tunnel drawing height

  // Scale: fit tunnel cross-section into drawing area
  const scaleX = tW / (W + 1);
  const scaleY = tH / (H + 0.8);
  const sc = Math.min(scaleX, scaleY);
  const tw = W * sc;   // scaled tunnel width
  const th = H * sc;   // scaled tunnel height

  // Center in drawing area
  const ox = margin.left + (tW - tw) / 2;
  const oy = margin.top  + (tH - th);

  // Arch path — usa forma real del túnel
  const _shape = form.tunnel_shape || 'horseshoe';
  const _HpRaw = parseFloat(form.H_pared_m);
  const _Hp    = Number.isFinite(_HpRaw) ? _HpRaw : 3.0;
  const wallH_px = Math.min(_Hp, H) / H * th;
  const archH_px = th - wallH_px;
  let archPath;
  if (_shape === 'rectangular') {
    archPath = `M ${ox} ${oy} L ${ox} ${oy+th} L ${ox+tw} ${oy+th} L ${ox+tw} ${oy} Z`;
  } else if (_shape === 'circular') {
    const R_m = ((W/2)**2 + H**2) / (2*H);
    const R_px = R_m * sc;
    const z_ctr = H - R_m;
    const largeArc = z_ctr >= -0.001 ? 1 : 0;
    archPath = `M ${ox} ${oy+th} A ${R_px} ${R_px} 0 ${largeArc} 1 ${ox+tw} ${oy+th} Z`;
  } else {
    const _ax = ox + tw/2, _ay = oy + archH_px;
    archPath = `M ${ox} ${oy+th} L ${ox} ${_ay} A ${tw/2} ${archH_px} 0 0 1 ${ox+tw} ${_ay} L ${ox+tw} ${oy+th} Z`;
  }

  // Road surface
  const roadY  = oy + th;
  const roadH  = 6;
  const laneWidthM = parseFloat(form.lane_width_m) || 3.5;
  const shLeftM = Math.max(0, parseFloat(form.shoulder_left_m) || 0);
  const swLeftM = Math.max(0, parseFloat(form.sidewalk_left_m) || 0);
  const swRightM = Math.max(0, parseFloat(form.sidewalk_right_m) || 0);
  const laneStartM = swLeftM + shLeftM;
  const laneW  = laneWidthM / W * tw;
  const liningBaseY = roadY - roadH - 2;
  const liningInset = 4;
  // H_pared_m define el revestimiento de pared, no el contorno completo. Se
  // mide desde la rasante y se representa también en tubos circulares.
  const liningHeightM = Math.max(0, Math.min(_Hp, H));
  const liningHeightPx = liningHeightM / H * th;
  const liningTopY = liningBaseY - liningHeightPx;
  let wallLiningPath;
  if (_shape === 'rectangular') {
    wallLiningPath = `M ${ox+liningInset} ${liningBaseY} L ${ox+liningInset} ${liningTopY} M ${ox+tw-liningInset} ${liningBaseY} L ${ox+tw-liningInset} ${liningTopY}`;
  } else if (_shape === 'circular') {
    const R_m = ((W/2)**2 + H**2) / (2*H);
    const zCtrM = H - R_m;
    const dxM = Math.sqrt(Math.max(0, R_m*R_m - (liningHeightM-zCtrM)**2));
    const rawLeftX = ox + ((W/2-dxM) / W) * tw;
    const rawRightX = ox + ((W/2+dxM) / W) * tw;
    const leftTopX = Math.max(ox+liningInset, Math.min(ox+tw/2, rawLeftX+liningInset));
    const rightTopX = Math.min(ox+tw-liningInset, Math.max(ox+tw/2, rawRightX-liningInset));
    const R_px = Math.max(tw/2, R_m * sc - liningInset);
    wallLiningPath = `M ${ox+liningInset} ${liningBaseY} A ${R_px} ${R_px} 0 0 1 ${leftTopX} ${liningTopY} M ${ox+tw-liningInset} ${liningBaseY} A ${R_px} ${R_px} 0 0 0 ${rightTopX} ${liningTopY}`;
  } else {
    const wallTopY = Math.max(oy + archH_px + 1, liningTopY);
    wallLiningPath = `M ${ox+liningInset} ${liningBaseY} L ${ox+liningInset} ${wallTopY} M ${ox+tw-liningInset} ${liningBaseY} L ${ox+tw-liningInset} ${wallTopY}`;
  }
  // Las cotas inferiores tienen un ancho visual mínimo independiente de la
  // altura del tubo; así las aceras y arcenes nunca se fusionan visualmente.
  const floorDimensionWidth = Math.max(tw, 420);
  const floorDimensionLeft = SVG_W/2 - floorDimensionWidth/2;
  const floorSlots = [0.07, 0.25, 0.50, 0.75, 0.93].map(p => floorDimensionLeft + floorDimensionWidth*p);
  const editCarriagewayWidth = (x, y) => (
    <foreignObject x={x} y={y} width={58} height={22}>
      <input type="number" value={Number(laneWidthM * lanes).toFixed(2)} min="2.5" max="30" step="0.1"
        title="Anchura total de calzada (m)"
        onChange={e=>{
          const next = parseFloat(e.target.value);
          if (Number.isFinite(next) && next > 0) setGeomPart('lane_width_m', next / Math.max(1, lanes));
        }}
        style={{width:'100%',height:'100%',boxSizing:'border-box',padding:'2px 3px',fontFamily:'inherit',fontSize:'11px',fontWeight:700,
          textAlign:'center',border:'none',outline:'none',borderRadius:4,background:'#fff',color:'#111827'}}/>
    </foreignObject>
  );

  // Pavement markings
  const markings = [];
  for (let i = 1; i < lanes; i++) {
    markings.push(ox + ((laneStartM + laneWidthM * i) / W) * tw);
  }

  // Result-based info. The displayed values are calculated by default but can
  // be overridden directly from this central section.
  const calcLthA = Number(result?.summary?.Lth || 0);
  const calcLthB = Number(result?.lth?.Lth_b ?? calcLthA);
  const calcLin = Number(result?.summary?.Lin || 0);
  const editablePhotometricValue = (override, calculated) => {
    const parsed = parseFloat(override);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : calculated;
  };
  const Lth = editablePhotometricValue(form.lth_override, calcLthA);
  const LthB = editablePhotometricValue(form.lth_b_override, calcLthB);
  const Lin = editablePhotometricValue(form.interior_luminance_override, calcLin);
  const kpi = result?.success;
  const isTwoWayPhoto = form.traffic_direction === 'two_way';
  const luminancePillWidth = 136;
  const luminancePillCount = isTwoWayPhoto ? 3 : 2;
  const luminancePillStartX = (SVG_W - (luminancePillCount*luminancePillWidth + (luminancePillCount-1)*8)) / 2;

  const ORIENT_ARROW = {
    N:'↑',NE:'↗',E:'→',SE:'↘',S:'↓',SW:'↙',W:'←',NW:'↖'
  };

  return (
    <div style={{display:'flex',gap:10,padding:'10px 12px',flexWrap:'nowrap',alignItems:'flex-start',minWidth:0,overflowX:'auto'}}>
      {/* SVG section */}
      <div style={{flex:'1 1 0',minWidth:500,background:'var(--salvi-surface)',border:'1px solid var(--salvi-line)',borderRadius:8,padding:8}}>
        <div style={{fontSize:'.72rem',fontWeight:700,color:'#111827',marginBottom:4,textAlign:'center',letterSpacing:'.08em',textTransform:'uppercase'}}>
          Sección transversal
        </div>
        <div style={{fontSize:'.68rem',fontFamily:'inherit',color:'#111827',background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:4,padding:'3px 6px',marginBottom:5,textAlign:'center'}}>Campos editables en su posición: forma · W total · H libre · N carriles · carril · arcenes · aceras · H hastiales · Lth · Lin</div>
        <svg viewBox={`0 0 ${SVG_W} ${SVG_H}`} style={{width:'100%',height:'auto',display:'block'}}>
          {/* Ground */}
          <rect x={0} y={roadY} width={SVG_W} height={SVG_H - roadY + 1} fill="#d1d5db"/>
          {/* Tunnel interior */}
          <path d={archPath} fill="#1e293b" stroke="#334155" strokeWidth="2"/>
          {/* Revestimiento reflectante: sigue toda la geometría interior del tubo. */}
          <path d={wallLiningPath} fill="none" stroke="#f8fafc" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" opacity="0.95"/>
          {/* Road surface */}
          <rect x={ox} y={roadY - roadH} width={tw} height={roadH} fill="#374151"/>
          {shLeftM > 0.01 && <rect x={ox + swLeftM/W*tw} y={roadY-roadH} width={shLeftM/W*tw} height={roadH} fill="#475569"/>}
          {shRightM > 0.01 && <rect x={ox + tw - (swRightM+shRightM)/W*tw} y={roadY-roadH} width={shRightM/W*tw} height={roadH} fill="#475569"/>}
          {swLeftM > 0.01 && <rect x={ox} y={roadY-roadH} width={swLeftM/W*tw} height={roadH} fill="#64748b"/>}
          {swRightM > 0.01 && <rect x={ox+tw-swRightM/W*tw} y={roadY-roadH} width={swRightM/W*tw} height={roadH} fill="#64748b"/>}
          {/* SeparaciÃ³n fina entre acera y calzada */}
          <line x1={ox + swLeftM/W*tw} y1={roadY-roadH} x2={ox + swLeftM/W*tw} y2={roadY}
            stroke="#e2e8f0" strokeWidth="1"/>
          <line x1={ox + tw - swRightM/W*tw} y1={roadY-roadH} x2={ox + tw - swRightM/W*tw} y2={roadY}
            stroke="#e2e8f0" strokeWidth="1"/>
          {/* Lane markings */}
          {markings.map((x, i) => (
            <line key={i} x1={x} y1={roadY - roadH + 1} x2={x} y2={roadY - 1}
              stroke="#fbbf24" strokeWidth="1.5" strokeDasharray="8 5"/>
          ))}
          {/* Kerb lines */}
          <rect x={ox} y={roadY - roadH} width={3} height={roadH} fill="#6b7280"/>
          <rect x={ox + tw - 3} y={roadY - roadH} width={3} height={roadH} fill="#6b7280"/>

          {/* Width annotation */}
          <line x1={ox} y1={roadY + 13} x2={ox + tw} y2={roadY + 13} stroke="#94a3b8" strokeWidth="1"/>
          <line x1={ox} y1={roadY + 9} x2={ox} y2={roadY + 17} stroke="#94a3b8" strokeWidth="1"/>
          <line x1={ox + tw} y1={roadY + 9} x2={ox + tw} y2={roadY + 17} stroke="#94a3b8" strokeWidth="1"/>
          {editNumber(ox + tw/2 - 30, roadY + 17, form.width_m, 'width_m', {min:3, max:30, step:0.1, width:60, title:'Anchura interior total (m)'})}

          {/* Height annotation */}
          <line x1={ox - 18} y1={oy} x2={ox - 18} y2={roadY - roadH} stroke="#94a3b8" strokeWidth="1"/>
          <line x1={ox - 22} y1={oy} x2={ox - 14} y2={oy} stroke="#94a3b8" strokeWidth="1"/>
          <line x1={ox - 22} y1={roadY - roadH} x2={ox - 14} y2={roadY - roadH} stroke="#94a3b8" strokeWidth="1"/>
          {editNumber(4, oy + (roadY - roadH - oy)/2 - 11, form.height_m, 'height_m', {min:2.5, max:12, step:0.1, width:54, title:'Altura libre (m)'})}

          {/* Altura del revestimiento de pared: acotada en cualquier forma de tubo. */}
          <>
            <line x1={ox + tw + 18} y1={liningTopY} x2={ox + tw + 18} y2={liningBaseY} stroke="#111827" strokeWidth="1"/>
            <path d={`M ${ox+tw+14} ${liningTopY+5} L ${ox+tw+18} ${liningTopY} L ${ox+tw+22} ${liningTopY+5}
                      M ${ox+tw+14} ${liningBaseY-5} L ${ox+tw+18} ${liningBaseY} L ${ox+tw+22} ${liningBaseY-5}`}
                  fill="none" stroke="#111827" strokeWidth="1"/>
          </>

          {/* Dimensiones editables fuera del contorno */}
          {editSelect(8, 12, form.tunnel_shape||'horseshoe', 'tunnel_shape', [['horseshoe','Herradura'],['circular','Circular'],['rectangular','Rectangular']], {width:110, title:'Forma de la sección'})}
          {editSelect(SVG_W/2 - 70, 12, form.num_lanes, 'num_lanes', [[1,'1 carril'],[2,'2 carriles'],[3,'3 carriles'],[4,'4 carriles']], {recompute:true, width:72, title:'Número de carriles'})}
          {editNumber(SVG_W/2 + 8, 12, form.lane_width_m, 'lane_width_m', {min:2.5, max:4.5, step:0.05, width:62, title:'Ancho de carril (m)', recompute:true})}
          {editNumber(ox + tw + 32, liningBaseY - liningHeightPx/2 - 11, form.H_pared_m, 'H_pared_m', {min:0, max:H, step:0.1, width:54, title:'Altura del revestimiento de pared (m)'})}

          {/* Aceras, arcenes y calzada: una fila exterior, alineada con cada franja. */}
          <text x={floorSlots[0]} y={roadY + 52} textAnchor="middle" fill="#111827" fontFamily="inherit" fontSize="8">Acera izq.</text>
          <text x={floorSlots[1]} y={roadY + 52} textAnchor="middle" fill="#111827" fontFamily="inherit" fontSize="8">Arcén izq.</text>
          <text x={floorSlots[2]} y={roadY + 52} textAnchor="middle" fill="#111827" fontFamily="inherit" fontSize="8">Calzada</text>
          <text x={floorSlots[3]} y={roadY + 52} textAnchor="middle" fill="#111827" fontFamily="inherit" fontSize="8">Arcén der.</text>
          <text x={floorSlots[4]} y={roadY + 52} textAnchor="middle" fill="#111827" fontFamily="inherit" fontSize="8">Acera der.</text>
          {editNumber(floorSlots[0] - 24, roadY + 56, form.sidewalk_left_m, 'sidewalk_left_m', {min:0, max:5, step:0.1, width:48, title:'Acera izquierda (m)', recompute:true})}
          {editNumber(floorSlots[1] - 24, roadY + 56, form.shoulder_left_m, 'shoulder_left_m', {min:0, max:4, step:0.1, width:48, title:'Arcén izquierdo (m)', recompute:true})}
          {editCarriagewayWidth(floorSlots[2] - 29, roadY + 56)}
          {editNumber(floorSlots[3] - 24, roadY + 56, form.shoulder_right_m, 'shoulder_right_m', {min:0, max:4, step:0.1, width:48, title:'Arcén derecho (m)', recompute:true})}
          {editNumber(floorSlots[4] - 24, roadY + 56, form.sidewalk_right_m, 'sidewalk_right_m', {min:0, max:5, step:0.1, width:48, title:'Acera derecha (m)', recompute:true})}

          {/* Traffic arrow */}
          {Array.from({length: lanes}, (_,i) => (
            <text key={i} x={ox + ((laneStartM + laneWidthM*(i+0.5))/W)*tw} y={roadY - 2} textAnchor="middle"
              fill="#fbbf24" fontSize="11" fontWeight="bold">
              {dir}
            </text>
          ))}

          {/* Portal orientation label */}
          <text x={SVG_W - 10} y={28} textAnchor="end" fill="#111827" fontFamily="inherit" fontSize="10">
            Portal {ORIENT_ARROW[form.portal_orientation]||''} {form.portal_orientation}
          </text>

          {/* Slope */}
          {slope !== 0 && (
            <text x={8} y={48} textAnchor="start" fill="#111827" fontFamily="inherit" fontSize="10">
              Pend. {slope > 0 ? '+' : ''}{slope}%
            </text>
          )}

          {/* Luminances: siempre editables; antes de calcular quedan vacías. */}
          <g>
            {editLuminancePill(luminancePillStartX, 40, isTwoWayPhoto ? 'Lth A' : 'Lth', Lth, 'lth_override',
              {min:0.1, max:5000, step:0.1, width:luminancePillWidth, title:'Lth calculada / valor de proyecto (cd/m²)'})}
            {isTwoWayPhoto && editLuminancePill(luminancePillStartX + luminancePillWidth + 8, 40, 'Lth B', LthB, 'lth_b_override',
              {min:0.1, max:5000, step:0.1, width:luminancePillWidth, title:'Lth portal B calculada / valor de proyecto (cd/m²)'})}
            {editLuminancePill(luminancePillStartX + (isTwoWayPhoto ? 2 : 1) * (luminancePillWidth + 8), 40, 'Lin', Lin, 'interior_luminance_override',
              {min:0.1, max:20, step:0.1, width:luminancePillWidth, title:'Lin interior calculada / valor de proyecto (cd/m²)'})}
          </g>
        </svg>
      </div>

      {/* Data table */}
      <div style={{flex:'0 0 178px',width:178,minWidth:178,maxWidth:190,display:'flex',flexDirection:'column',gap:6}}>
        <div style={{background:'var(--salvi-surface)',border:'1px solid var(--salvi-line)',borderRadius:8,padding:'7px 8px',fontSize:'.68rem'}}>
          <div style={{fontWeight:700,color:'var(--salvi-black)',marginBottom:6,fontSize:'.68rem',textTransform:'uppercase',letterSpacing:'.07em'}}>Geometría</div>
          {[
            ['Longitud', `${L.toLocaleString()} m`],
            ['Anchura', `${W} m`],
            ['Altura libre', `${H} m`],
            ['Carriles', lanes],
            ['Ancho carril', `${laneWidthM} m`],
            ['Arcenes', `${shLeftM} / ${shRightM} m`],
            ['Aceras', `${swLeftM} / ${swRightM} m`],
            ['Circulación', form.traffic_direction==='one_way'?'Un sentido':'Bidireccional'],
            ['Pendiente', `${slope > 0 ? '+' : ''}${slope} %`],
            ['Portal', form.portal_orientation],
          ].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'2px 0',borderBottom:'1px solid var(--salvi-line)'}}>
              <span style={{color:'var(--salvi-grey)'}}>{k}</span>
              <span style={{fontWeight:600,color:'var(--salvi-black)'}}>{v}</span>
            </div>
          ))}
        </div>
        {kpi && (
          <div style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:8,padding:'7px 8px',fontSize:'.68rem'}}>
            <div style={{fontWeight:700,color:'#166534',marginBottom:6,fontSize:'.68rem',textTransform:'uppercase',letterSpacing:'.07em'}}>Fotometría CIE 88</div>
            {[
              ['L₂₀', `${result.summary.L20} cd/m²`],
              ['Lth',  `${Lth} cd/m²`],
              ['Lin',  `${Lin} cd/m²`],
              ['SD',   `${result.summary.SD_m} m`],
              ['k',    result.summary.k_factor],
            ].map(([k,v])=>(
              <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'2px 0',borderBottom:'1px solid #bbf7d0'}}>
                <span style={{color:'#166534'}}>{k}</span>
                <span style={{fontWeight:600,color:'#14532d'}}>{v}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// LumConfigPanel — configuración de luminarias en panel izquierdo
// ══════════════════════════════════════════════════════════════════
function LumConfigPanel({ lum, onChange, roadWidthM, heightM, hParedM, tunnelShape }) {
  const round2 = v => Math.round(v*100)/100;
  const half   = Math.max(0.6, (roadWidthM || 10.5) / 2);
  const wallVal = lum.wall_offset_m ?? DEFAULT_LUM_CONFIG.wall_offset_m;
  const axisVal = round2(half - wallVal);

  // En sección herradura, el arranque de bóveda (H_pared_m) hace que el
  // contorno se curve hacia dentro por encima de esa altura — una luminaria
  // montada ahí no puede pegarse tanto a la pared como una montada en el
  // tramo recto. Si la disposición es de pared (bilateral/lateral) y la
  // altura de montaje cae en la zona curva, se calcula la distancia mínima
  // a la pared que mantiene la luminaria dentro del contorno real (misma
  // elipse que usa TunnelSectionPreview) y se sube el offset automáticamente
  // en vez de dejar que se muestre "fuera del contorno".
  React.useEffect(() => {
    const wallAdjacent = ['bilateral_sym','bilateral_stag','lateral_left','lateral_right'].includes(lum.arrangement);
    if (!wallAdjacent || (tunnelShape||'horseshoe') !== 'horseshoe') return;
    const H  = heightM ?? 5.5;
    const Hp = Math.min(hParedM ?? 3.0, H);
    const zM = lum.mounting_height_m ?? DEFAULT_LUM_CONFIG.mounting_height_m;
    if (zM <= Hp) return;   // tramo recto: cualquier offset razonable es válido
    const a = half, b = H - Hp;
    if (b <= 0) return;
    const ratio = (zM - Hp) / b;
    if (ratio >= 1) return;  // altura por encima de la clave: no hay posición segura
    const safeOffset = round2(Math.min(round2(half - 0.05), a * (1 - Math.sqrt(1 - ratio*ratio)) + 0.05));
    const current = lum.wall_offset_m ?? DEFAULT_LUM_CONFIG.wall_offset_m;
    if (current < safeOffset) {
      onChange({ wall_offset_m: safeOffset, axis_offset_m: round2(half - safeOffset) });
    }
  }, [lum.arrangement, lum.mounting_height_m, roadWidthM, heightM, hParedM, tunnelShape]);
  // "Distancia a pared" y "Distancia al eje" describen la misma fila de
  // luminarias desde referencias opuestas (pared vs eje): wall + axis = W/2.
  const pairedOffsetInput = (val, onSet) => (
    <div style={{display:'flex',alignItems:'center',gap:4}}>
      <input type="number" min={0.05} max={round2(half-0.05)} step={0.05}
        value={val}
        onChange={e=>{
          const v = parseFloat(e.target.value);
          if(!isNaN(v)) onSet(Math.max(0.05, Math.min(round2(half-0.05), v)));
        }}
        style={{width:0,flex:1,padding:'4px 6px',fontSize:'.7rem',border:'1px solid var(--salvi-line)',borderRadius:4}}/>
      <span style={{fontSize:'.66rem',color:'var(--salvi-grey)'}}>m</span>
    </div>
  );
  const label = text => (
    <div style={{fontSize:'.64rem',fontWeight:600,color:'var(--salvi-grey)',marginBottom:3,
                 textTransform:'uppercase',letterSpacing:'.05em',whiteSpace:'nowrap',
                 overflow:'hidden',textOverflow:'ellipsis'}} title={text}>{text}</div>
  );
  const cell = (text, children) => (
    <div style={{minWidth:0}}>
      {label(text)}
      {children}
    </div>
  );
  // Fila de 2 columnas: [labelA, childA, labelB, childB]

          No instala luminarias exteriores. Modela la luminancia natural que

// LumModelsSummary — tabla compacta: modelos usados x cantidad + total
// ══════════════════════════════════════════════════════════════════
function LumModelsSummary({ luminairesResult }) {
  const zones = luminairesResult?.zones || [];
  if (!zones.length) return null;

  const counts = {};
  let total = 0;
  const physicalFactor = physicalLuminairesPerPosition(
    luminairesResult?.arrangement,
  );
  zones.forEach(z => {
    const sps = z.setpoints;
    if (sps && sps.length) {
      sps.forEach(sp => {
        const m = sp.model || '—';
        counts[m] = (counts[m] || 0) + physicalFactor;
        total += physicalFactor;
      });
    } else if ((z.n_luminaires || 0) > 0) {
      const m = z.model || '—';
      counts[m] = (counts[m] || 0) + z.n_luminaires;
      total += z.n_luminaires;
    }
  });
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return null;

  return (
    <div style={{padding:'0 10px 10px'}}>
      <div style={{fontSize:'.63rem',fontWeight:700,color:'var(--salvi-blue)',textTransform:'uppercase',
                   letterSpacing:'.08em',margin:'12px 0 6px',borderBottom:'1px solid var(--salvi-line)',paddingBottom:3}}>
        Modelos utilizados
      </div>
      <table style={{width:'100%',fontSize:'.72rem',borderCollapse:'collapse'}}>
        <tbody>
          {rows.map(([model, n]) => (
            <tr key={model}>
              <td style={{padding:'2px 0',color:'var(--salvi-black)'}}>{model}</td>
              <td style={{padding:'2px 0',textAlign:'right',fontWeight:600,color:'var(--salvi-black)'}}>{n}</td>
            </tr>
          ))}
          <tr>
            <td style={{padding:'4px 0 0',fontWeight:700,borderTop:'1px solid var(--salvi-line)',color:'var(--salvi-black)'}}>Total luminarias</td>
            <td style={{padding:'4px 0 0',textAlign:'right',fontWeight:700,borderTop:'1px solid var(--salvi-line)',color:'var(--salvi-black)'}}>{total}</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function QualitySensitivityPanel({ form, lum, tiltOverrides, tandemOverrides }) {
  const [u0Values,setU0Values]=useState(['0.40','0.50','0.60']);
  const [ulValues,setUlValues]=useState(['0.60','0.70','0.80']);
  const [matrix,setMatrix]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);

  // La matriz depende del diseño completo, no solo de U0/Ul. Al recalcular
  // luminarias los totales o las separaciones pueden cambiar; en ese caso se
  // elimina la matriz anterior para no mostrar datos obsoletos.
  const designSignature=(()=>{
    const result=form?.luminaires_result||{};
    const totals=result.totals||{};
    const zones=(result.zones||[]).map(zone=>[
      zone.zone_name,zone.n_luminaires,zone.d_used,zone.current_mA,
      zone.power_w,zone.tilt_deg
    ].join(':')).join('|');
    return [result.tube_id,totals.n_luminaires,totals.power_kw,zones,
      lum?.U0_obj,lum?.Ul_obj,lum?.optimization_goal].join('|');
  })();
  React.useEffect(()=>{
    setMatrix(null);
    setError(null);
  },[designSignature]);

  const updateAxis=(setter,index,value)=>{
    setter(previous=>previous.map((item,itemIndex)=>itemIndex===index?value:item));
    setMatrix(null);
    setError(null);
  };

  const calculateMatrix=async()=>{
    const parsedU0=u0Values.map(Number);
    const parsedUl=ulValues.map(Number);
    if(parsedU0.some(value=>!Number.isFinite(value)||value<0.10||value>0.90) ||
       parsedUl.some(value=>!Number.isFinite(value)||value<0.10||value>0.95)){
      setError('Revisa los valores: U₀ admite 0,10–0,90 y Uₗ 0,10–0,95.');
      return;
    }
    setLoading(true);
    setError(null);
    try{
      const response=await fetch('/api/tunnel/luminaires/sensitivity',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          ...form,
          luminaire:lum,
          tilt_overrides:tiltOverrides,
          tandem_overrides:tandemOverrides,
          u0_values:parsedU0,
          ul_values:parsedUl,
          calculation_phase:'base',
        }),
      });
      const data=await response.json();
      if(!data.success){
        setError(data.error||'No se pudo calcular la matriz U₀/Uₗ.');
        return;
      }
      setMatrix(data.sensitivity);
    }catch(exc){
      setError(`Error: ${exc.message}`);
    }finally{
      setLoading(false);
    }
  };

  const renderMatrix=(metric,title,unit,digits)=>{
    if(!matrix) return null;
    const valid=(matrix.rows||[]).flatMap(row=>row.cells||[])
      .map(cell=>cell?.[metric]).filter(value=>Number.isFinite(value));
    const minValue=valid.length?Math.min(...valid):0;
    const maxValue=valid.length?Math.max(...valid):0;
    const active=matrix.active||{};
    return <div style={{flex:'1 1 360px',minWidth:0}}>
      <div style={{fontSize:'.72rem',fontWeight:700,marginBottom:5}}>{title}</div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.68rem',textAlign:'center'}}>
          <thead>
            <tr>
              <th style={{padding:'5px 7px',border:'1px solid var(--salvi-line)',background:'#f8fafc'}}>
                Uₗ \ U₀
              </th>
              {(matrix.u0_values||[]).map(value=>
                <th key={value} style={{padding:'5px 7px',border:'1px solid var(--salvi-line)',background:'#f8fafc'}}>
                  {Number(value).toFixed(2)}
                </th>
              )}
            </tr>
          </thead>
          <tbody>
            {(matrix.rows||[]).map(row=>
              <tr key={row.Ul}>
                <th style={{padding:'6px 7px',border:'1px solid var(--salvi-line)',background:'#f8fafc'}}>
                  {Number(row.Ul).toFixed(2)}
                </th>
                {(row.cells||[]).map(cell=>{
                  const value=cell?.[metric];
                  const ratio=Number.isFinite(value)&&maxValue>minValue
                    ?(value-minValue)/(maxValue-minValue):0;
                  const isActive=Math.abs((cell?.U0||0)-(active.U0||-1))<1e-6 &&
                                 Math.abs((cell?.Ul||0)-(active.Ul||-1))<1e-6;
                  const background=cell?.error?'#fef2f2'
                    :`hsl(${120-ratio*75} 70% 94%)`;
                  const calculationLabel=cell?.approximate
                    ?'Estimacion geometrica; requiere validacion completa'
                    :'Calculo completo para esta combinacion';
                  return <td key={`${cell?.U0}-${cell?.Ul}`}
                    title={cell?.error||`${calculationLabel}. Interdistancia BASE: ${cell?.base_spacing_m??'—'} m`}
                    style={{padding:'7px',border:isActive?'2px solid var(--salvi-black)':'1px solid var(--salvi-line)',
                            background,fontWeight:isActive?800:600,position:'relative'}}>
                    {Number.isFinite(value)?`${Number(value).toFixed(digits)}${unit}`:'—'}
                    {isActive&&<span style={{display:'block',fontSize:'.52rem',marginTop:2,color:'var(--salvi-grey)'}}>ACTUAL</span>}
                  </td>;
                })}
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </div>;
  };

  return <div id="quality-sensitivity-panel" style={{padding:'10px 11px',border:'1px solid var(--salvi-line)',
                      borderRadius:8,background:'var(--salvi-surface)'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,flexWrap:'wrap'}}>
      <div>
        <div style={{fontSize:'.74rem',fontWeight:800}}>SENSIBILIDAD DE UNIFORMIDAD U₀ / Uₗ</div>
        <div style={{fontSize:'.63rem',color:'var(--salvi-grey)',marginTop:2}}>
          Compara geometrías independientes con la estrategia y límites actuales. No modifica el diseño seleccionado.
        </div>
      </div>
      <button onClick={calculateMatrix} disabled={loading}
        style={{padding:'6px 10px',fontSize:'.67rem',fontWeight:700,cursor:loading?'wait':'pointer',
                border:'1px solid var(--salvi-black)',borderRadius:5,
                background:loading?'#e5e7eb':'var(--salvi-black)',color:loading?'#4b5563':'#fff'}}>
        {loading?'Calculando 9 combinaciones…':'Analizar U₀ / Uₗ'}
      </button>
    </div>

    <div style={{display:'flex',gap:14,flexWrap:'wrap',marginTop:9}}>
      <div style={{display:'flex',alignItems:'center',gap:5}}>
        <span style={{fontSize:'.63rem',fontWeight:700}}>Columnas U₀</span>
        {u0Values.map((value,index)=>
          <input key={index} type="number" min="0.10" max="0.90" step="0.05" value={value}
            onChange={event=>updateAxis(setU0Values,index,event.target.value)}
            style={{width:58,padding:'4px 5px',fontSize:'.66rem',textAlign:'center',
                    border:'1px solid var(--salvi-line)',borderRadius:4}}/>
        )}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:5}}>
        <span style={{fontSize:'.63rem',fontWeight:700}}>Filas Uₗ</span>
        {ulValues.map((value,index)=>
          <input key={index} type="number" min="0.10" max="0.95" step="0.05" value={value}
            onChange={event=>updateAxis(setUlValues,index,event.target.value)}
            style={{width:58,padding:'4px 5px',fontSize:'.66rem',textAlign:'center',
                    border:'1px solid var(--salvi-line)',borderRadius:4}}/>
        )}
      </div>
    </div>

    {error&&<div style={{fontSize:'.66rem',color:'#b91c1c',marginTop:7}}>⚠️ {error}</div>}
    {loading&&<div style={{fontSize:'.64rem',color:'#1e3a8a',marginTop:7}}>
      Se están resolviendo las combinaciones en paralelo; el diseño actual permanece disponible.
    </div>}
    {matrix&&<>
      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginTop:11}}>
        {renderMatrix('power_kw','Potencia instalada',' kW',2)}
        {renderMatrix('n_luminaires','Nº de luminarias físicas','',0)}
      </div>
      <div style={{fontSize:'.59rem',color:'var(--salvi-grey)',marginTop:7}}>
        {matrix.n_successful}/{matrix.n_combinations} combinaciones calculadas en {Number(matrix.request_elapsed_s||matrix.elapsed_s||0).toFixed(1)} s
        {' · '}objetivo: {matrix.optimization_goal==='min_power'?'menor potencia acotada':'menor nº de luminarias'}
        {matrix.mode==='full_layout'&&<>{' · '}valores obtenidos con el cálculo completo por combinación.</>}
        {matrix.mode==='full_layout_with_estimates'&&<>{' · '}algunas celdas son estimaciones por fallo aislado; revisa su tooltip y valida antes de aplicar.</>}
        {' · '}pasa el cursor por una celda para ver la interdistancia BASE.
      </div>
    </>}
  </div>;
}


// ══════════════════════════════════════════════════════════════════
// LuminaireSectionEditor — sección interactiva + cálculo + resultados
// ══════════════════════════════════════════════════════════════════
// Definicion unica de escenas compartida por las fases Luminarias y Control.
const SCENE_DEFINITIONS = [
  {key:'sunny',label:'Soleado',factor:1,color:'#d97706'},
  {key:'normal',label:'Normal',factor:.70,color:'#2563eb'},
  {key:'overcast',label:'Cubierto',factor:.30,color:'#64748b'},
  {key:'dusk',label:'Crepuscular',factor:.05,color:'#7c3aed'},
  {key:'night_normal',label:'Noche normal',factor:0,color:'#334155'},
  {key:'night_reduced',label:'Noche reducida',factor:0,color:'#111827'},
];
const LUMINAIRE_SCENE_DEFINITIONS = SCENE_DEFINITIONS;

function LuminaireSectionEditor({ result, form, onChange, onGoToMap, toolbarSlot }) {
  // Persist lumResult across wizard navigation by seeding from form.luminaires_result
  const [lumResult,    setLumResult]   = useState(form.luminaires_result || null);
  const [photoResult,  setPhotoResult] = useState(form.photometric_result || null);
  const [loading,      setLoading]     = useState(false);
  const [error,        setError]       = useState(null);
  const [tiltOverrides,   setTiltOverrides]   = useState(form.tilt_overrides || {});
  const [tandemOverrides, setTandemOverrides] = useState(form.tandem_overrides || {});
  const [manualLuminaireOverrides, setManualLuminaireOverrides] = useState(
    form.manual_luminaire_overrides || {}
  );
  const [lumFilters,     setLumFilters]       = useState({});
  const [lumSort,        setLumSort]          = useState({key:'id',direction:'asc'});
  const [luminaireAuditMode,setLuminaireAuditMode] = useState('active');
  const [calcMode,      setCalcMode]      = useState(
    form.calc_mode || form.photometric_result?.calc_mode || 'direct'
  ); // 'direct' | 'radiosity'
  const [recalcSceneRunning,setRecalcSceneRunning] = useState(false);
  const [activeCalculationPhase, setActiveCalculationPhase] = useState('base');
  const [calculationElapsedS,setCalculationElapsedS] = useState(0);
  const [roi,           setRoi]           = useState({kwhCost:0.15, hoursYear:8760, treatCostM2:15, open:true});
  const [mousePos,      setMousePos]      = useState({x:0,y:0});
  const [planFieldIndex,setPlanFieldIndex] = useState(0);
  const [planPositionM,setPlanPositionM] = useState(null);
  const [luminaireSceneKey,setLuminaireSceneKey] = useState(
    form.luminaires_scene_key || 'sunny'
  );
  const sceneCurrentOverrides=form.scene_current_overrides || {};

  // El cálculo CIE 140 de todas las escenas puede llevar varios segundos.
  // El contador confirma que la petición sigue viva en vez de aparentar un
  // bloqueo mientras el servidor termina la siguiente fase.
  React.useEffect(()=>{
    if(!loading){ setCalculationElapsedS(0); return undefined; }
    const started=Date.now();
    const tick=()=>setCalculationElapsedS(Math.max(0,Math.floor((Date.now()-started)/1000)));
    tick();
    const timer=setInterval(tick,250);
    return ()=>clearInterval(timer);
  },[loading]);

  // El componente se desmonta al ir al mapa. Los dos resultados canónicos
  // viven en el formulario del tubo y deben rehidratarse al volver, incluida
  // la malla real_profile que alimenta la curva longitudinal CIE 140.
  React.useEffect(() => {
    setLumResult(form.luminaires_result || null);
  }, [form.luminaires_result]);
  React.useEffect(() => {
    setPhotoResult(form.photometric_result || null);
  }, [form.photometric_result]);
  React.useEffect(() => {
    setManualLuminaireOverrides(form.manual_luminaire_overrides || {});
  }, [form.manual_luminaire_overrides]);
  React.useEffect(() => {
    const requested=form.luminaires_scene_key || 'sunny';
    if (LUMINAIRE_SCENE_DEFINITIONS.some(scene=>scene.key===requested)) {
      setLuminaireSceneKey(requested);
    }
  }, [form.luminaires_scene_key]);

  const changeCalcMode = mode => {
    setCalcMode(mode);
    onChange('calc_mode',mode);
  };
  const recalcActiveLuminaireScene=async()=>{
    if(recalcSceneRunning||!form.luminaires_result||!luminaireScene?.key) return;
    setRecalcSceneRunning(true);
    setError(null);
    try {
      const response=await fetch('/api/tunnel/recalc-scene',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...form,luminaire:lum,scene:luminaireScene.key}),
      });
      const data=await response.json();
      if(!data.success) throw new Error(data.error||'No se pudo recalcular la escena.');
      const previous=form.photometric_result||{};
      const previousScene=previous.scenarios?.[luminaireScene.key]||{};
      const nextPhoto={...previous,scenarios:{...(previous.scenarios||{}),[luminaireScene.key]:{
        ...previousScene,...data.verification,
      }}};
      setPhotoResult(nextPhoto);
      onChange('photometric_result',nextPhoto);
    } catch(error) {
      setError(error.message||String(error));
    } finally {
      setRecalcSceneRunning(false);
    }
  };
  const changeTiltOverride = (zoneName,value) => {
    const next={...tiltOverrides,[zoneName]:value};
    setTiltOverrides(next);
    onChange('tilt_overrides',next);
  };
  const changeTandemOverride = (zoneName,value,automaticValue) => {
    const next={...tandemOverrides};
    if(value===automaticValue) delete next[zoneName];
    else next[zoneName]=value;
    setTandemOverrides(next);
    onChange('tandem_overrides',next);
  };
  const setManualLuminaireField = (key, field, originalValue, nextValue) => {
    const numericValue=Number(nextValue);
    if (!Number.isFinite(numericValue)) return;
    const previous=manualLuminaireOverrides[key] || {original:{}};
    const values={...(previous.values||{})};
    if (Math.abs(numericValue-Number(originalValue))<1e-8) delete values[field];
    else values[field]=numericValue;
    const next={...manualLuminaireOverrides};
    if (!Object.keys(values).length) delete next[key];
    else next[key]={
      original:{...(previous.original||{}),[field]:Number(originalValue)},
      values,
    };
    setManualLuminaireOverrides(next);
    onChange('manual_luminaire_overrides',next);
  };
  const resetManualLuminaire = key => {
    if (!manualLuminaireOverrides[key]) return;
    const next={...manualLuminaireOverrides};
    delete next[key];
    setManualLuminaireOverrides(next);
    onChange('manual_luminaire_overrides',next);
  };
  const resetManualZone = zoneName => {
    const next={...manualLuminaireOverrides};
    Object.keys(next).forEach(key=>{
      if(key.startsWith(`${zoneName}|`)) delete next[key];
    });
    setManualLuminaireOverrides(next);
    onChange('manual_luminaire_overrides',next);
  };
  const setSceneCurrentOverride = (row,nextValue) => {
    if(!row.sceneEditable) return;
    const requested=Number(nextValue);
    if(!Number.isFinite(requested)) return;
    const maxCurrent=Math.max(1,Number(lum.I_max_mA||750));
    const minCurrent=Math.max(1,(Number(lum.I_min_pct??30)>1
      ? Number(lum.I_min_pct??30)/100 : Number(lum.I_min_pct??30))*350);
    const current=requested<=0?0:Math.min(maxCurrent,Math.max(minCurrent,requested));
    const previous=sceneCurrentOverrides[row.sceneOverrideKey]||{};
    const original=Number(previous.original_current_mA??row.mA??row.design_mA??0);
    const next={...sceneCurrentOverrides};
    if(Math.abs(current-original)<1e-8) delete next[row.sceneOverrideKey];
    else next[row.sceneOverrideKey]={original_current_mA:original,current_mA:current};
    onChange('scene_current_overrides',next);
  };
  const resetSceneCurrentOverride = row => {
    if(!sceneCurrentOverrides[row.sceneOverrideKey]) return;
    const next={...sceneCurrentOverrides};
    delete next[row.sceneOverrideKey];
    onChange('scene_current_overrides',next);
  };
  const toggleSceneState = row => {
    if(!row.sceneEditable) return;
    if(row.sceneCurrentOverride?.current_mA>0 || row.mA>0) setSceneCurrentOverride(row,0);
    else setSceneCurrentOverride(row,row.sceneCurrentOverride?.original_current_mA||row.design_mA||350);
  };
  const resetAllManualLuminaires = () => {
    setManualLuminaireOverrides({});
    onChange('manual_luminaire_overrides',{});
  };

  // Sigue el cursor mientras dura el cálculo (feedback visual: puede tardar 1-2 min)
  React.useEffect(() => {
    if (!loading) return;
    const onMove = e => setMousePos({x:e.clientX, y:e.clientY});
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, [loading]);

  if (!result?.success) return (
    <div style={{padding:24,textAlign:'center',color:'var(--salvi-grey)',fontSize:'.82rem'}}>
      Completa el cálculo CIE 88:2004 antes de dimensionar las luminarias.
    </div>
  );

  const lum = {...DEFAULT_LUM_CONFIG, ...(form.lum_config||{})};
  const W   = parseFloat(form.width_m)  || 8;
  const H   = parseFloat(form.height_m) || 5;
  const controlSceneKeys=[
    'sunny','normal','overcast','dusk','night_normal','night_reduced'
  ];
  const hasCompleteControlProfiles=controlSceneKeys.every(sceneKey=>{
    const sceneProfile=photoResult?.scenarios?.[sceneKey]?.profile
      || (sceneKey==='sunny'?photoResult?.real_profile:null);
    return !!sceneProfile?.available;
  });
  const needsControlValidation=(
    !!lumResult
    && lumResult.architecture==='permanent_base_plus_portal_reinforcement'
    && !hasCompleteControlProfiles
  );
  const luminaireScene=(
    LUMINAIRE_SCENE_DEFINITIONS.find(scene=>scene.key===luminaireSceneKey)
    || LUMINAIRE_SCENE_DEFINITIONS[0]
  );
  const profileForLuminaireScene=sceneKey=>(
    photoResult?.scenarios?.[sceneKey]?.profile
    || photoResult?.scenarios?.[sceneKey]?.verification?.profile
    || (sceneKey==='sunny' ? photoResult?.real_profile : null)
  );
  const selectedSceneVerification=photoResult?.scenarios?.[luminaireScene.key]
    || (luminaireScene.key==='sunny' ? photoResult : null);
  const selectedSceneProfile=profileForLuminaireScene(luminaireScene.key);
  const selectedSceneAvailable=!!selectedSceneProfile?.available;
  const LinDesign=Number(result.summary?.Lin||0);
  const selectedSceneLin=luminaireScene.key==='night_normal'
    ? Number(result.summary?.L_night_normal ?? form.night_normal_luminance_cd_m2 ?? LinDesign)
    : luminaireScene.key==='night_reduced'
      ? Number(result.summary?.L_night_reduced ?? form.night_reduced_luminance_cd_m2
        ?? result.summary?.L_night ?? form.night_luminance_cd_m2 ?? LinDesign)
      : LinDesign;
  const selectedSceneLth=Number(
    selectedSceneVerification?.Lth_cd_m2
    ?? (luminaireScene.key.startsWith('night_')
      ? selectedSceneLin
      : Math.max(selectedSceneLin,Number(result.summary?.Lth||0)*luminaireScene.factor))
  );
  const selectedSceneChart=(()=>{
    const original=result.chart||{};
    const originalData=Array.isArray(original.data)?original.data:[];
    if(!originalData.length) return original;
    const controlledZones=new Set([
      'THRESHOLD','TRANSITION','INTERIOR','TRANSITION_B','THRESHOLD_B',
    ]);
    const nightTunnelZones=new Set([...controlledZones,'EXIT']);
    const exitZone=result.zones?.exit;
    const exitStart=Number(exitZone?.s_start), exitEnd=Number(exitZone?.s_end);
    const exitTargetRaw=Number(exitZone?.L_end ?? exitZone?.L_min_required ?? selectedSceneLin);
    const exitTarget=exitZone?.project_override
      ? exitTargetRaw : Math.max(selectedSceneLin,exitTargetRaw);
    const exitRequiredAt=s=>{
      if(!exitZone||!Number.isFinite(exitStart)||!Number.isFinite(exitEnd)||exitEnd<=exitStart) return null;
      const fraction=Math.min(1,Math.max(0,(Number(s)-exitStart)/(exitEnd-exitStart)));
      return Math.max(0,selectedSceneLin+fraction*(exitTarget-selectedSceneLin));
    };
    // Fuente normativa de Lreq: la L_required real del perfil CIE 140 de
    // esta escena (misma serie que la fase Control y el informe). Solo se
    // usa la escala Lin + factor*(L-Lin) como respaldo cuando no hay perfil.
    const profileRequiredAt=s=>{
      const source=(selectedSceneProfile?.fields||[])
        .filter(item=>Number.isFinite(Number(item?.s)))
        .map(item=>({s:Number(item.s), value:Number(item?.L_required)}))
        .filter(item=>Number.isFinite(item.value))
        .sort((a,b)=>a.s-b.s);
      if(!source.length) return null;
      if(source.length===1||Number(s)<=source[0].s) return source[0].value;
      if(Number(s)>=source[source.length-1].s) return source[source.length-1].value;
      for(let i=1;i<source.length;i++){
        const low=source[i-1], high=source[i];
        if(Number(s)<=high.s){
          const span=Math.max(1e-9,high.s-low.s);
          return low.value+(high.value-low.value)*((Number(s)-low.s)/span);
        }
      }
      return source[source.length-1].value;
    };
    const sceneData=originalData.map(point=>{
      const zone=String(point.zone||'').toUpperCase();
      const designRequired=Number(point.L||0);
      const profileLreq=profileRequiredAt(Number(point.s));
      let L;
      if(Number.isFinite(profileLreq)) {
        L=Math.max(0,profileLreq);
      } else if(luminaireScene.key==='night_normal'||luminaireScene.key==='night_reduced') {
        L=nightTunnelZones.has(zone)?selectedSceneLin:0;
      } else if(zone==='EXIT') {
        L=Math.max(0,exitRequiredAt(point.s) ?? designRequired);
      } else if(controlledZones.has(zone)) {
        L=Math.max(selectedSceneLin,selectedSceneLin+luminaireScene.factor*(designRequired-selectedSceneLin));
      } else {
        L=Math.max(0,designRequired*luminaireScene.factor);
      }
      return {...point,L};
    });
    return {
      ...original,
      data:sceneData,
      s:sceneData.map(point=>point.s),
      L_required:sceneData.map(point=>point.L),
    };
  })();
  const operationForLuminaireScene=(setpoint,zone,scene)=>{
    const stored=setpoint?.scenario_operating_points?.[scene.key];
    if(stored && (!scene.key.startsWith('night_')||stored.manual_current_override)) {
      return stored;
    }
    if(scene.key==='night_normal') {
      return zone.control_layer==='permanent'
        ? {state:'on',current_mA:setpoint.current_mA,power_w:setpoint.power_w,flux_lm:setpoint.flux_lm}
        : {state:'off',current_mA:0,power_w:0,flux_lm:0};
    }
    if(scene.key==='night_reduced') {
      return zone.control_layer==='permanent'
        ? {state:'on',current_mA:setpoint.night_current_mA,power_w:setpoint.night_power_w,flux_lm:setpoint.night_flux_lm}
        : {state:'off',current_mA:0,power_w:0,flux_lm:0};
    }
    return stored || {state:'on',current_mA:setpoint.current_mA,power_w:setpoint.power_w,flux_lm:setpoint.flux_lm};
  };
  const sceneOperationForLuminaire=(setpoint,zone)=>
    operationForLuminaireScene(setpoint,zone,luminaireScene);
  const changeLuminaireScene=sceneKey=>{
    setLuminaireSceneKey(sceneKey);
    setPlanFieldIndex(0);
    setPlanPositionM(null);
    onChange('luminaires_scene_key',sceneKey);
  };

  const handleCalculate = async (phase='full', modeOverride=calcMode) => {
    if (loading) return;
    setActiveCalculationPhase(phase);
    setLoading(true); setError(null);
    try {
      const resp = await fetch('/api/tunnel/luminaires', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({...form, luminaire: lum, tilt_overrides: tiltOverrides, tandem_overrides: tandemOverrides, manual_luminaire_overrides: manualLuminaireOverrides, calc_mode: modeOverride, calculation_phase: phase}),
      });
      const data = await resp.json();
      if (!data.success) { setError(data.error||'Error de cálculo'); return; }
      const designedArrangement=data.luminaires?.arrangement||lum.arrangement;
      setLumResult(data.luminaires);
      setPhotoResult(data.photometric || null);
      setPlanFieldIndex(0);
      setPlanPositionM(0);
      if(designedArrangement!==lum.arrangement){
        onChange('lum_config',{...lum,arrangement:designedArrangement});
      }
      onChange('luminaires_result', {...data.luminaires, arrangement: designedArrangement});
      onChange('photometric_result', data.photometric || null);
      onChange('installed_power_kw',installedSunnyPowerKw(data.luminaires));
    } catch(e) { setError(`Error: ${e.message}`); }
    finally { setLoading(false); }
  };
  const calculateWithCalcMode = mode => {
    if (loading) return;
    changeCalcMode(mode);
    // La respuesta contiene el perfil CIE 140 de soleado, normal, cubierto,
    // crepuscular y ambas noches; no se cambia sólo el rótulo del modo.
    handleCalculate('full',mode);
  };

  // El botón fijo del panel izquierdo emite esta petición. Mantener la
  // ejecución aquí garantiza que usa el mismo estado, overrides y modo
  // fotométrico que el resto de la fase Luminarias.
  React.useEffect(()=>{
    const runFullCalculation=()=>handleCalculate('full');
    window.addEventListener('salvi:calculate-luminaires-full',runFullCalculation);
    return ()=>window.removeEventListener('salvi:calculate-luminaires-full',runFullCalculation);
  },[handleCalculate]);

  // ── Arrangement buttons ────────────────────────────────────────
  const ARRANGEMENTS = [
    {id:'central_single',  label:'Central simple'},
    {id:'central_double',  label:'Central doble'},
    {id:'central_offset',  label:'Central desplazado'},
    {id:'lateral_left',    label:'Lateral izq.'},
    {id:'lateral_right',   label:'Lateral der.'},
    {id:'bilateral_sym',   label:'Bilateral sim.'},
    {id:'bilateral_stag',  label:'Bilateral alt.'},
  ];

  // ── Results tables ─────────────────────────────────────────────
  const MODEL_COLOR  = {S:'#f0fdf4',M:'#eff6ff',L:'#fdf2f8'};
  const MODEL_BORDER = {S:'#22c55e',M:'#3b82f6',L:'#a855f7'};

  return (
    <div style={{padding:'12px',display:'flex',flexDirection:'column',gap:12,flex:1,minHeight:0}}>

      {/* Indicador "Calculando…" que sigue al cursor (el cálculo puede tardar 1-2 min) */}
      {loading && ReactDOM.createPortal(
        <div style={{position:'fixed',left:mousePos.x+16,top:mousePos.y+16,zIndex:99999,pointerEvents:'none',
                     background:'var(--salvi-black)',color:'#fff',padding:'5px 10px',borderRadius:6,
                     fontSize:'.72rem',fontWeight:600,display:'flex',alignItems:'center',gap:6,
                     boxShadow:'0 2px 10px rgba(0,0,0,.35)',whiteSpace:'nowrap'}}>
          <svg width="12" height="12" viewBox="0 0 12 12" style={{animation:'spin 1s linear infinite',flexShrink:0}}>
            <circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" strokeWidth="2" strokeDasharray="16 8"/>
          </svg>
          {calculationElapsedS<5
            ? 'Preparando diseño fotométrico…'
            : calculationElapsedS<18
              ? `Dimensionando instalación física · ${calculationElapsedS} s`
              : `Verificando escenas CIE 140 · ${calculationElapsedS} s`}
        </div>,
        document.body
      )}

      {/* ── Cross-section + arrangement selector ── */}
      <div style={{background:'var(--salvi-surface)',border:'1px solid var(--salvi-line)',borderRadius:8,padding:'10px 12px'}}>
        <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--salvi-grey)',marginBottom:6,textTransform:'uppercase',letterSpacing:'.07em'}}>
          Sección transversal — disposición de luminarias
        </div>
        <TunnelSectionPreview form={form} lumConfig={lum}/>
        <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:8}}>
          {ARRANGEMENTS.map(({id,label})=>{
            const active = lum.arrangement===id;
            return (
              <button key={id}
                onClick={()=>onChange('lum_config',{...DEFAULT_LUM_CONFIG,...form.lum_config,arrangement:id})}
                style={{padding:'4px 9px',fontSize:'.66rem',fontWeight:active?700:400,cursor:'pointer',
                        border:`1.5px solid ${active?'var(--salvi-black)':'var(--salvi-line)'}`,borderRadius:5,
                        background:active?'var(--salvi-black)':'#fff',color:active?'#fff':'var(--salvi-grey)',
                        transition:'all .12s'}}>
                {label}
              </button>
            );
          })}
        </div>
      </div>

      {/* ── Acción principal y modo fotométrico ── */}
      {(() => {
        const toolbarContent = (
          <div>
            {error && <div style={{fontSize:'.7rem',color:'#b91c1c',background:'#fef2f2',border:'1px solid #fecaca',
                                   borderRadius:5,padding:'4px 8px',marginBottom:6}}>❌ {error}</div>}
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
              {/* Pill: Directo */}
              <button onClick={()=>calculateWithCalcMode('direct')} disabled={loading}
                style={{flex:1,padding:'5px 8px',fontSize:'.71rem',fontWeight:calcMode==='direct'?700:500,
                        border:'1.5px solid var(--salvi-black)',borderRadius:999,cursor:'pointer',
                        background:'#fff',color:'var(--salvi-black)',whiteSpace:'nowrap',
                        transition:'all .12s',
                        boxShadow:calcMode==='direct'?'inset 0 0 0 2px var(--salvi-black)':'none'}}>
                Directo
              </button>

              {/* Toggle switch iOS-style */}
              <div onClick={()=>calculateWithCalcMode(calcMode==='direct'?'radiosity':'direct')}
                style={{position:'relative',width:36,height:20,borderRadius:10,cursor:'pointer',
                        background:'var(--salvi-black)',flexShrink:0,transition:'background .2s'}}>
                <div style={{position:'absolute',top:3,
                             left:calcMode==='direct'?3:17,
                             width:14,height:14,borderRadius:'50%',
                             background:'#fff',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.3)'}}/>
              </div>

              {/* Pill: con reflexiones */}
