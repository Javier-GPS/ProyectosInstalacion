            {/* ── Lista de luminarias ──────────────────────────────────── */}
            {zoneList.filter(z=>z.n_luminaires>0).length>0&&(()=>{
              /* Parámetros geométricos */
              const W_m        = parseFloat(form.width_m)||11.5;
              const wo         = parseFloat(lum?.wall_offset_m||0.30);
              const arr        = lumResult.arrangement||'bilateral_sym';

              /* GPS — disponible si el usuario ha fijado el portal en el mapa */
              const hasGPS = !!(parseFloat(form.lat) && parseFloat(form.lng));
              const _entryLat = parseFloat(form.lat)||0;
              const _entryLng = parseFloat(form.lng)||0;
              const _OCTANT   = {N:0,NE:45,E:90,SE:135,S:180,SW:225,W:270,NW:315};
              const _bearing  = _OCTANT[form.portal_orientation]??180;
              const _moveAlong = (latD,lngD,distM,brg) => {
                const R=6371000,d=distM/R,th=brg*Math.PI/180;
                const p1=latD*Math.PI/180,l1=lngD*Math.PI/180;
                const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(th));
                const l2=l1+Math.atan2(Math.sin(th)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
                return [p2*180/Math.PI,(l2*180/Math.PI+540)%360-180];
              };
               // Cuando el túnel procede de OSM, las coordenadas GPS recorren
               // su eje real. X/Y se mantienen como coordenadas locales CIE.
               const _osmRoute = _asArr(form.osm_tunnel_geometry)
                 .map(point => ({
                   lat: Number(point?.lat),
                   lng: Number(point?.lng ?? point?.lon),
                 }))
                 .filter(point => Number.isFinite(point.lat) && Number.isFinite(point.lng));
               const _gpsHaversine = (a,b) => {
                 const R=6371000,toRad=d=>d*Math.PI/180;
                 const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
                 const h=Math.sin(dLat/2)**2+
                   Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
                 return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
               };
               const _gpsBearing = (a,b) => {
                 const toRad=d=>d*Math.PI/180;
                 const dLng=toRad(b.lng-a.lng);
                 const y=Math.sin(dLng)*Math.cos(toRad(b.lat));
                 const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-
                   Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(dLng);
                 return (Math.atan2(y,x)*180/Math.PI+360)%360;
               };
               const _routeAxisAt = xM => {
                 if(_osmRoute.length<2) {
                   const [lat,lng]=_moveAlong(_entryLat,_entryLng,xM,_bearing);
                   return {lat,lng,bearing:_bearing};
                 }
                 let remaining=Math.max(0,Number(xM)||0);
                 for(let i=1;i<_osmRoute.length;i++) {
                   const start=_osmRoute[i-1],end=_osmRoute[i];
                   const segmentLength=_gpsHaversine(start,end);
                   const bearing=_gpsBearing(start,end);
                   if(remaining<=segmentLength+1e-6) {
                     const [lat,lng]=_moveAlong(start.lat,start.lng,remaining,bearing);
                     return {lat,lng,bearing};
                   }
                   remaining-=segmentLength;
                 }
                 // Si la longitud calculada supera el eje OSM, se prolonga su
                 // tangente final para mantener la progresiva de proyecto.
                 const last=_osmRoute[_osmRoute.length-1];
                 const previous=_osmRoute[_osmRoute.length-2];
                 const bearing=_gpsBearing(previous,last);
                 const [lat,lng]=_moveAlong(last.lat,last.lng,remaining,bearing);
                 return {lat,lng,bearing};
               };
               const _lumGPS = (xM, yM) => {
                /* eje del túnel a distancia xM desde portal A */
                 const axisPoint = _routeAxisAt(xM);
                /* desplazamiento transversal: y=0 → pared izq, y=W_m → pared der */
                 const perpBrg = (axisPoint.bearing+90)%360;
                 const [lat,lng] = _moveAlong(
                   axisPoint.lat,axisPoint.lng,yM-W_m/2,perpBrg,
                 );
                return [lat.toFixed(6),lng.toFixed(6)];
              };
              const _aphexModelLabel = modelId => {
                const raw = String(modelId||'').trim();
                const m = raw.match(/^APHEX_([SML])_(.+)$/);
                if (!m) return raw || '—';
                return `Aphex ${m[1]} ${m[2].replace(/Wx2$/,'W ×2')}`;
              };

              /* Cada escena se construye desde la misma geometría física. Así
                 la auditoría muestra las seis consignas consecutivas sin mezclar
                 la Lreq/Lest de la escena seleccionada con otra distinta. */
              const buildLuminaireRowsForScene = (sceneDef, sceneRank=0) => {
                let rows=[], gid=1;
                const sceneProfile=profileForLuminaireScene(sceneDef.key);
                const profileFields=_asArr(sceneProfile?.fields).filter(field =>
                  Number.isFinite(Number(field?.field_start))
                    && Number.isFinite(Number(field?.field_end))
                    && Number(field.field_end)>Number(field.field_start)
                );
                for(const z of zoneList.filter(z=>z.n_luminaires>0)){
                  const n=luminairePositionCount(z);
                  const hasSP=z.setpoints && z.setpoints.length===n;
                  const dAct=parseFloat(z.d_used)||1;
                  const sStart=parseFloat(z.s_start)||0;
                  // Las transiciones B se generan desde el portal opuesto;
                  // ordenar por x conserva un ID físico creciente en la tabla.
                  const spOrdered=hasSP ? [...z.setpoints].sort((a,b)=>parseFloat(a.s)-parseFloat(b.s)) : null;
                  for(let i=0;i<n;i++){
                    const sp=hasSP ? spOrdered[i] : null;
                    const overrideKey=sp ? `${z.zone_name}|${sp.idx}` : null;
                    const manual=overrideKey ? (manualLuminaireOverrides[overrideKey]||null) : null;
                    const manualValues=manual?.values||{};
                    const originalX=sp ? parseFloat(sp.s) : sStart+(i+0.5)*dAct;
                    const originalTilt=sp!=null ? sp.tilt_deg : z.tilt_deg;
                    const originalCurrent=sp ? sp.current_mA : z.current_mA;
                     const fallback={
                      current_mA:z.current_mA,power_w:z.power_w,flux_lm:z.flux_lm,
                      night_current_mA:z.night_current_mA,night_power_w:z.night_power_w,
                      night_flux_lm:z.night_flux_lm,
                     };
                     const sceneOverrideKey=`${sceneDef.key}|${z.zone_name}|${Number(sp?.idx)||i+1}`;
                     const sceneCurrentOverride=sceneOverrideKey
                       ? sceneCurrentOverrides[sceneOverrideKey] : null;
                     const sceneEditable=!sceneDef.key.startsWith('night_')
                       || z.control_layer==='permanent';
                     const physicalEditable=luminaireAuditMode==='active'
                       && sceneDef.key==='sunny';
                     const sceneOperation=operationForLuminaireScene(sp||fallback,z,sceneDef);
                     const sceneActive=sceneOperation?.state!=='off'
                       && Number(sceneOperation?.flux_lm||0)>0;
                     const sceneCurrent=sceneActive
                       ? Number((sceneCurrentOverride?.current_mA??sceneOperation?.current_mA)||0) : 0;
                     const effectiveActive=sceneActive&&sceneCurrent>0;
                     const dali=effectiveActive
                       ? Math.max(1,Math.min(254,Math.round(254*sceneCurrent/Math.max(1,Number(lum.I_max_mA||750))))) : 0;
                     const speedMs=Math.max(1,Number(form.speed_kmh||80))/3.6;
                     const flickerHz=dAct>0?speedMs/dAct:0;
                     const flickerRange=lumResult?.performance?.flicker?.range_hz||[2.5,15];
                     const xPos=manualValues.s ?? originalX;
                    const modelId=sp?sp.model:z.model;
                    const physicalYs=physicalLuminaireYPositions(arr,W_m,wo,sp?.idx || i+1);
                    for(const yPos of physicalYs){
                      rows.push({
                        id:gid++,sceneKey:sceneDef.key,sceneLabel:sceneDef.label,
                        sceneColor:sceneDef.color,sceneRank,
                        zone:z.zone_name,overrideKey,manual,originalX,originalTilt,originalCurrent,
                        x:xPos,y:yPos,model:modelId,modelLabel:_aphexModelLabel(modelId),
                        optic:sp?sp.optic:z.optic,tilt:manualValues.tilt_deg ?? originalTilt,
                         lumens:effectiveActive ? Number(sceneOperation?.flux_lm ?? (sp?sp.flux_lm:z.flux_lm)) : 0,
                         base_mA:z.control_layer==='permanent'
                           ? (sp?.base_current_mA ?? sp?.current_mA ?? z.current_mA) : null,
                         mA:sceneCurrent,dali,
                         sceneOverrideKey,sceneCurrentOverride,sceneEditable,physicalEditable,
                         flickerHz,
                         flickerCritical:flickerHz>=Number(flickerRange[0]||2.5)-1e-9
                           && flickerHz<=Number(flickerRange[1]||15)+1e-9,
                         spacingM:dAct,
                        design_mA:manualValues.current_mA ?? originalCurrent,
                         status:!effectiveActive ? 'OFF' : (sceneDef.key==='sunny'&&Object.keys(manualValues).length?'ON · manual':'ON'),
                         W:effectiveActive ? Number((sceneOperation?.power_w ?? (sp?sp.power_w:z.power_w))||0) : 0,
                        L_req:sp?sp.L_req:z.L_required,L_est:sp?.L_est ?? z.L_estimated,
                        U0:sp?.U0 ?? z.UF,Ul:z.Ul,tandem:sp?.tandem||null,pair:sp?.pair??null,
                      });
                    }
                  }
                }
                /* Distancia al siguiente de la misma fila: en bilateral o
                   tándem el siguiente registro puede pertenecer a otra fila. */
                for(let i=0;i<rows.length;i++){
                  const cur=rows[i]; let nxt=null;
                  for(let j=i+1;j<rows.length;j++){
                    if(rows[j].zone!==cur.zone) break;
                    if(Math.abs(rows[j].y-cur.y)<.01){nxt=rows[j];break;}
                  }
                  cur.d_nxt=nxt ? (nxt.x-cur.x).toFixed(1) : '—';
                }
                const fieldForLuminaire=lm=>{
                  const sameZone=profileFields.filter(field=>field.zone_name===lm.zone);
                  if(!sameZone.length) return null;
                  const adjacent=sameZone.filter(field=>Number(lm.x)>=Number(field.field_start)-1e-4
                    && Number(lm.x)<=Number(field.field_end)+1e-4);
                  const candidates=adjacent.length?adjacent:sameZone;
                  return [...candidates].sort((a,b)=>{
                    const reqA=Number(a.L_required??0), reqB=Number(b.L_required??0);
                    const ratioA=Number(a.Lavg_governing??a.L??0)/Math.max(reqA,1e-9);
                    const ratioB=Number(b.Lavg_governing??b.L??0)/Math.max(reqB,1e-9);
                    if(Math.abs(ratioA-ratioB)>1e-8) return ratioA-ratioB;
                    return Math.abs(Number(a.s)-Number(lm.x))-Math.abs(Number(b.s)-Number(lm.x));
                  })[0];
                };
                 rows.forEach(lm=>{
                   const field=fieldForLuminaire(lm);
                   if(!field) return;
                   // U0 y Ul deben proceder de la misma malla CIE 140 que
                   // gobierna Lavg/Lreq en esta escena, no del setpoint de
                   // diseño (que puede conservar 0 como valor histórico).
                   const fieldU0=Number(field.U0);
                   const fieldUl=Number(field.Ul);
                   if(Number.isFinite(fieldU0)) lm.U0=fieldU0;
                   if(Number.isFinite(fieldUl)) lm.Ul=fieldUl;
                   const Lavg=Number(field.Lavg_governing??field.L);
                   const Lreq=Number(field.L_required);
                   if(!Number.isFinite(Lavg)||!Number.isFinite(Lreq)||Lreq<=0) return;
                   lm.governingField={
                     start:Number(field.field_start),end:Number(field.field_end),
                     lane:Number(field.governing_lane_number??field.observer_lane_number??1),
                     direction:Number(field.governing_direction??field.observer_direction??1),
                     Lavg,Lreq,ratio:Lavg/Lreq,
                     U0:Number.isFinite(fieldU0)?fieldU0:null,
                     Ul:Number.isFinite(fieldUl)?fieldUl:null,
                   };
                });
                return rows;
              };
              const lumList=buildLuminaireRowsForScene(luminaireScene);
              const tableLumList=luminaireAuditMode==='all'
                ? LUMINAIRE_SCENE_DEFINITIONS.flatMap((scene,rank)=>buildLuminaireRowsForScene(scene,rank))
                : lumList;

               const familyOfM=m=>!m?'M':(/_S_|^S$/.test(m)?'S':/_M_|^M$/.test(m)?'M':/_L_|^L$/.test(m)?'L':'M');
              const clrM=m=>{const f=familyOfM(m); return f==='S'?'#22c55e':f==='M'?'#3b82f6':'#a855f7';};

              /* ── Filtros por columna ──────────────────────────────────────
                 Un input de texto libre por columna. Numéricas aceptan
                 operador + valor (">0.4", "<=20", "!=0") o rango ("10-50");
                 sin operador reconocido cae a comparación exacta o texto. */
              const LUM_COL_DEFS = [
                ...(luminaireAuditMode==='all' ? [{ type:'text', get: lm => lm.sceneLabel }] : []),
                { type:'num',  get: lm => lm.id },
                { type:'text', get: lm => lm.zone },
                { type:'text', get: lm => lm.tandem || '' },
                { type:'num',  get: lm => lm.x },
                { type:'num',  get: lm => lm.y },
                { type:'num',  get: lm => (lm.d_nxt==='—' ? null : parseFloat(lm.d_nxt)) },
                { type:'text', get: lm => lm.optic || '' },
                { type:'num',  get: lm => lm.tilt!=null ? parseFloat(lm.tilt) : null },
                  { type:'num',  get: lm => lm.lumens!=null ? parseFloat(lm.lumens) : null },
                  { type:'num',  get: lm => lm.base_mA!=null ? parseFloat(lm.base_mA) : null },
                  { type:'num',  get: lm => lm.design_mA!=null ? parseFloat(lm.design_mA) : null },
                  { type:'num',  get: lm => lm.mA!=null ? parseFloat(lm.mA) : null },
                  { type:'num',  get: lm => lm.dali },
                  { type:'text', get: lm => lm.status },
                 { type:'num',  get: lm => lm.W!=null ? parseFloat(lm.W) : null },
                 { type:'text', get: lm => lm.modelLabel || lm.model || '' },
                 { type:'text', get: lm => lm.governingField
                   ? `${lm.governingField.start.toFixed(1)}-${lm.governingField.end.toFixed(1)}` : '' },
                 { type:'num',  get: lm => lm.governingField?.Lavg ?? null },
                 { type:'num',  get: lm => lm.governingField?.Lreq ?? null },
                 { type:'num',  get: lm => lm.governingField?.ratio ?? null },
                 { type:'num',  get: lm => lm.U0 },
                 { type:'num',  get: lm => lm.Ul },
                 { type:'num',  get: lm => lm.flickerHz },
                ...(hasGPS ? [
                  { type:'num', get: lm => parseFloat(_lumGPS(lm.x, lm.y)[0]) },
                  { type:'num', get: lm => parseFloat(_lumGPS(lm.x, lm.y)[1]) },
                ] : []),
              ];
              const _matchNum = (value, filterStr) => {
                if (!filterStr) return true;
                if (value == null || isNaN(value)) return false;
                const s = filterStr.trim();
                const m = s.match(/^(>=|<=|!=|>|<|=)?\s*(-?\d+\.?\d*)$/);
                if (m) {
                  const op = m[1] || '=';
                  const num = parseFloat(m[2]);
                  if (op==='>')  return value >  num;
                  if (op==='>=') return value >= num;
                  if (op==='<')  return value <  num;
                  if (op==='<=') return value <= num;
                  if (op==='!=') return Math.abs(value-num) > 1e-9;
                  return Math.abs(value-num) < 1e-9;
                }
                const r = s.match(/^(-?\d+\.?\d*)\s*-\s*(-?\d+\.?\d*)$/);
                if (r) {
                  const a = parseFloat(r[1]), b = parseFloat(r[2]);
                  return value >= Math.min(a,b) && value <= Math.max(a,b);
                }
                return String(value).includes(s);
              };
              const _matchText = (value, filterStr) =>
                !filterStr || String(value||'').toLowerCase().includes(filterStr.trim().toLowerCase());
              const filteredLumList = tableLumList.filter(lm =>
                LUM_COL_DEFS.every((col, i) => {
                  const f = lumFilters[i];
                  if (!f) return true;
                  return col.type==='num' ? _matchNum(col.get(lm), f) : _matchText(col.get(lm), f);
                })
              );
              const toggleLumSort = key => setLumSort(previous => ({
                key,
                direction:previous.key===key&&previous.direction==='asc'?'desc':'asc',
              }));
              const sortedLumList=[...filteredLumList].sort((a,b)=>{
                if(luminaireAuditMode==='all' && a.sceneRank!==b.sceneRank) {
                  return a.sceneRank-b.sceneRank;
                }
                 const value=lm=>({
                   id:lm.id,
                   x:Number(lm.x),
                   state:lm.status==='OFF'?1:0,
                   power:Number(lm.W||0),
                   spacing:Number(lm.d_nxt||0),tilt:Number(lm.tilt||0),
                   flux:Number(lm.lumens||0),base:Number(lm.base_mA||0),
                   design:Number(lm.design_mA||0),current:Number(lm.mA||0),
                   dali:Number(lm.dali||0),Lavg:Number(lm.governingField?.Lavg||0),
                   ratio:Number(lm.governingField?.ratio||0),U0:Number(lm.U0||0),
                   Ul:Number(lm.Ul||0),flicker:Number(lm.flickerHz||0),
                 })[lumSort.key];
                const av=value(a), bv=value(b);
                const compared=typeof av==='number'&&typeof bv==='number'
                  ? av-bv : String(av).localeCompare(String(bv),'es');
                const tie=(a.id-b.id)||(a.sceneRank-b.sceneRank);
                return (lumSort.direction==='asc'?1:-1)
                  *(Math.abs(compared)>1e-9?compared:tie);
              });
              const LUM_HEADERS=[
                ...(luminaireAuditMode==='all' ? [['Escena',null]] : []),
                 ['ID','id'],['Zona',null],['Par',null],['x (m)','x'],['y (m)',null],
                 ['d→ (m)','spacing'],['Lente',null],['Tilt','tilt'],['Lúmenes (lm)','flux'],
                 ['mA base','base'],['mA diseño','design'],[luminaireAuditMode==='all'?'mA escena':`mA ${luminaireScene.label}`,'current'],['DALI est.','dali'],['Estado','state'],['W','power'],
                 ['Modelo Aphex',null],['Campo CIE 140',null],['Lest gob.',null],
                 ['Lreq',null],['Lavg/Lreq','ratio'],['U0','U0'],['Ul','Ul'],['Flicker','flicker'],
                ...(hasGPS?[['Lat',null],['Lon',null]]:[]),
              ];
              const lumFiltersActive = Object.values(lumFilters).some(v => v);

              /* Exportar la tabla a .xls real (SpreadsheetML/HTML, MIME ms-excel) —
                 sin depender de ninguna libreria externa; Excel lo abre nativamente. */
              const exportLumListXls = () => {
                const headers = [...(luminaireAuditMode==='all'?['Escena']:[]),
                   ...['ID','Zona','Par','x (m)','y (m)','d→ (m)','Óptica',
                    'Tilt (°)','Lúmenes (lm)','mA base','mA diseño',luminaireAuditMode==='all'?'mA escena':`mA ${luminaireScene.label}`,'DALI est.','Estado','W','Modelo Aphex',
                   'DALI est.','Campo CIE 140 (m)','Lest gob. (cd/m²)','Lreq (cd/m²)','Lest/Lreq','U0','Ul','Flicker (Hz)'], ...(hasGPS?['Lat','Lon']:[])];
                const rows = sortedLumList.map(lm => {
                  const row = [
                    ...(luminaireAuditMode==='all'?[lm.sceneLabel]:[]),
                    lm.id, lm.zone, lm.tandem||'', lm.x.toFixed(1), lm.y.toFixed(2), lm.d_nxt,
                     lm.optic||'', lm.tilt!=null?parseFloat(lm.tilt).toFixed(0):'0',
                     lm.lumens?Math.round(parseFloat(lm.lumens)):'',
                      lm.base_mA!=null?Math.round(parseFloat(lm.base_mA)):'',
                      lm.design_mA!=null?Math.round(parseFloat(lm.design_mA)):'',
                      lm.mA?Math.round(parseFloat(lm.mA)):'', lm.dali||'', lm.status, lm.W?Math.round(parseFloat(lm.W)):'',
                    lm.modelLabel||lm.model||'',
                    lm.governingField?`${lm.governingField.start.toFixed(1)}–${lm.governingField.end.toFixed(1)} · C${lm.governingField.lane}`:'',
                    lm.governingField?lm.governingField.Lavg.toFixed(1):'',
                    lm.governingField?lm.governingField.Lreq.toFixed(1):'',
                     lm.governingField?lm.governingField.ratio.toFixed(3):'',
                     lm.U0!=null?parseFloat(lm.U0).toFixed(3):'', lm.Ul!=null?parseFloat(lm.Ul).toFixed(3):'',
                     lm.flickerHz!=null?parseFloat(lm.flickerHz).toFixed(1):'',
                  ];
                  if (hasGPS) { const [lt,ln]=_lumGPS(lm.x,lm.y); row.push(lt,ln); }
                  return row;
                });
                const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                const thead = `<tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
                const tbody = rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
                const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Luminarias</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head>
<body><table border="1">${thead}${tbody}</table></body></html>`;
                const blob = new Blob(['﻿'+html], {type:'application/vnd.ms-excel'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `lista_luminarias_${form.tube_id||'T1'}.xls`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
              };
              const editNumber = (lm, field, value, original, opts={}) => {
                if (!lm.overrideKey) return <span>{Number(value).toFixed(opts.digits??1)}</span>;
                const edited=Object.prototype.hasOwnProperty.call(lm.manual?.values||{},field);
                return <input type="number" min={opts.min} max={opts.max} step={opts.step||0.1}
                  value={Number(value).toFixed(opts.digits??1)}
                  title={edited?`Manual · original: ${Number(original).toFixed(opts.digits??1)}`:'Editar y verificar'}
                  onChange={event=>setManualLuminaireField(
                    lm.overrideKey,field,original,event.target.value
                  )}
                  style={{width:opts.width||58,textAlign:'right',fontFamily:'monospace',fontSize:'.62rem',
                    padding:'1px 3px',border:`1px solid ${edited?'#f59e0b':'transparent'}`,
                    borderRadius:3,background:edited?'#fffbeb':'transparent',fontWeight:edited?700:600}}/>;
              };

              return (
                <div style={{background:'var(--salvi-surface)',border:'1px solid var(--salvi-line)',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                    <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--salvi-grey)',
                        textTransform:'uppercase',letterSpacing:'.07em'}}>
                      Lista de luminarias ({sortedLumList.length}{lumFiltersActive?` / ${tableLumList.length}`:''} registros)
                    </div>
                    <div style={{display:'flex',gap:3,marginLeft:4,padding:2,border:'1px solid var(--salvi-line)',borderRadius:5,background:'#fff'}}>
                      <button onClick={()=>{setLuminaireAuditMode('active');setLumFilters({});}}
                        style={{padding:'3px 8px',fontSize:'.64rem',fontWeight:700,cursor:'pointer',border:'none',borderRadius:3,
                          background:luminaireAuditMode==='active'?'var(--salvi-black)':'transparent',
                          color:luminaireAuditMode==='active'?'#fff':'var(--salvi-grey)'}}>
                        Escena activa
                      </button>
                      <button onClick={()=>{setLuminaireAuditMode('all');setLumFilters({});}}
                        style={{padding:'3px 8px',fontSize:'.64rem',fontWeight:700,cursor:'pointer',border:'none',borderRadius:3,
                          background:luminaireAuditMode==='all'?'var(--salvi-black)':'transparent',
                          color:luminaireAuditMode==='all'?'#fff':'var(--salvi-grey)'}}>
                        Las 6 escenas
                      </button>
                    </div>
                    {lumFiltersActive && (
                      <button onClick={()=>setLumFilters({})}
                        style={{padding:'3px 10px',fontSize:'.68rem',fontWeight:600,cursor:'pointer',
                          borderRadius:4,border:'1px solid var(--salvi-line)',
                          background:'#fff',color:'#b91c1c'}}>
                        ✕ Limpiar filtros
                      </button>
                    )}
                    {Object.keys(manualLuminaireOverrides).length>0 && (
                      <button onClick={resetAllManualLuminaires}
                        style={{padding:'3px 10px',fontSize:'.68rem',fontWeight:600,cursor:'pointer',
                          borderRadius:4,border:'1px solid #f59e0b',background:'#fffbeb',color:'#92400e'}}>
                        ↶ Restablecer {Object.keys(manualLuminaireOverrides).length} modificaciones
                      </button>
                    )}
                    <button type="button" onClick={recalcActiveLuminaireScene}
                      disabled={recalcSceneRunning||!form.luminaires_result}
                      style={{padding:'3px 10px',fontSize:'.68rem',fontWeight:600,cursor:'pointer',
                        borderRadius:4,border:'1px solid #7c3aed',background:'#f5f3ff',color:'#5b21b6'}}>
                      {recalcSceneRunning?'Recalculando escena…':'🔄 Recalcular escena'}
                    </button>
                    <button onClick={exportLumListXls}
                      style={{marginLeft:lumFiltersActive?0:'auto',padding:'3px 10px',fontSize:'.68rem',fontWeight:600,
                        cursor:'pointer',borderRadius:4,border:'1px solid var(--salvi-line)',
                        background:'#fff',color:'var(--salvi-black)',display:'flex',alignItems:'center',gap:5}}>
                      📊 Exportar a Excel
                    </button>
                  </div>
                  <div style={{overflowY:'auto',maxHeight:320,border:'1px solid var(--salvi-line)',borderRadius:4}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.63rem'}}>
                      <thead style={{position:'sticky',top:0,background:'#f8fafc',zIndex:1}}>
                        <tr>
                          {LUM_HEADERS.map(([h,sortKey],i)=>{
                            const active=lumSort.key===sortKey;
                            return <th key={i} onClick={sortKey?()=>toggleLumSort(sortKey):undefined}
                              title={sortKey?'Ordenar esta columna':undefined}
                              style={{padding:'3px 6px',textAlign:i>=2?'right':'left',
                                borderBottom:'1px solid var(--salvi-line)',fontWeight:700,

                              <td style={{padding:'2px 6px',color:'#94a3b8',fontFamily:'monospace'}}>
