function ldtMustBeMirroredForInterior(arrangement, yPos, widthM) {
  return ['bilateral_sym','bilateral','bilateral_stag','staggered',
          'central_double','lateral_right','unilateral'].includes(String(arrangement||''))
    && Number(yPos) > Number(widthM) / 2;
}

function WallLuminanceSideView({field, profile, fieldPositionM, viewStart, viewEnd, xTicks}) {
  const wall=field?.wall || {};
  const xs=Array.isArray(wall.sample_x_m) ? wall.sample_x_m.map(Number) : [];
  const zs=Array.isArray(wall.sample_z_m) ? wall.sample_z_m.map(Number) : [];
  const left=Array.isArray(wall.L_left_grid) ? wall.L_left_grid : [];
  const right=Array.isArray(wall.L_right_grid) ? wall.L_right_grid : [];
  const available=xs.length>1 && zs.length>1 && left.length===xs.length && right.length===xs.length;
  const criterion=Number(wall.ratio_required ?? profile?.wall_luminance?.ratio ?? 0.60);
  const automatic=Number(profile?.wall_luminance?.ratio_automatic ?? criterion);
  const tunnelClass=profile?.wall_luminance?.tunnel_class ?? '—';
  const height=Number(wall.height_m ?? profile?.wall_luminance?.height_m ?? 2);
  const roadL=Number(field?.Lavg_governing ?? field?.L ?? 0);
  const leftAvg=Number(wall.L_left_avg ?? 0), rightAvg=Number(wall.L_right_avg ?? 0);
  const ratio=Number(wall.ratio ?? 0);
  const allValues=[...left,...right].flat().map(Number).filter(Number.isFinite);
  const minValue=allValues.length ? Math.min(...allValues) : 0;
  const maxValue=allValues.length ? Math.max(...allValues) : 1;
  const pairedValues=left.flatMap((row,xIndex)=>(row||[]).map((value,zIndex)=>[
    Number(value),Number(right?.[xIndex]?.[zIndex])
  ])).filter(([a,b])=>Number.isFinite(a)&&Number.isFinite(b));
  // Se decide con los propios resultados CIE 140, no sólo con el tipo de
  // implantación. Así se ve una segunda pared cuando hay una asimetría real.
  const relativeDifference=pairedValues.length
    ? pairedValues.reduce((sum,[a,b])=>sum+Math.abs(a-b)/Math.max(.05,(Math.abs(a)+Math.abs(b))/2),0)/pairedValues.length
    : Infinity;
  const symmetric=relativeDifference<=0.025;
  const wallColor=value => {
    const t=Math.max(0,Math.min(1,(Number(value)-minValue)/Math.max(.001,maxValue-minValue)));
    const stops=[[0,[14,165,233]],[.30,[34,211,238]],[.58,[34,197,94]],[.80,[163,230,53]],[1,[250,204,21]]];
    const pair=stops.find((stop,index)=>index<stops.length-1&&t<=stops[index+1][0])||stops[stops.length-2];
    const index=stops.indexOf(pair), next=stops[index+1];
    const local=(t-pair[0])/Math.max(1e-9,next[0]-pair[0]);
    const rgb=pair[1].map((component,i)=>Math.round(component+(next[1][i]-component)*local));
    return `rgb(${rgb.join(',')})`;
  };
  const WallMap=({label,values,side})=>{
    const VBW=760, VBH=270, ML=64, MR=24, MT=51, MB=46;
    const mapW=VBW-ML-MR, mapH=VBH-MT-MB;
    // Conserva exactamente el dominio longitudinal de la planta. El color se
    // limita al campo CIE 140; el contexto queda visible a sus lados.
    const dataStart=Number(field?.field_start??xs[0]), dataEnd=Number(field?.field_end??xs[xs.length-1]);
    const xMin=Number.isFinite(Number(viewStart)) ? Number(viewStart) : dataStart;
    const xMax=Number.isFinite(Number(viewEnd)) ? Number(viewEnd) : dataEnd;
    const xScale=value=>ML+(Number(value)-xMin)/Math.max(.001,xMax-xMin)*mapW;
    const zScale=value=>MT+mapH-(Number(value)/Math.max(.1,height))*mapH;
    const bounds=(items,value)=>{
      if(value<=items[0]) return [items[0],items[0]];
      if(value>=items[items.length-1]) return [items[items.length-1],items[items.length-1]];
      const upper=items.findIndex(item=>item>=value);
      return [items[upper-1],items[upper]];
    };
    const valueAt=(x,z)=>{
      const [x0,x1]=bounds(xs,x), [z0,z1]=bounds(zs,z);
      const xi0=xs.indexOf(x0), xi1=xs.indexOf(x1), zi0=zs.indexOf(z0), zi1=zs.indexOf(z1);
      const v00=Number(values?.[xi0]?.[zi0]), v10=Number(values?.[xi1]?.[zi0]);
      const v01=Number(values?.[xi0]?.[zi1]), v11=Number(values?.[xi1]?.[zi1]);
      if(![v00,v10,v01,v11].every(Number.isFinite)) return minValue;
      const tx=x0===x1?0:(x-x0)/(x1-x0), tz=z0===z1?0:(z-z0)/(z1-z0);
      return (v00+(v10-v00)*tx)*(1-tz)+(v01+(v11-v01)*tx)*tz;
    };
    const cells=[];
    const columns=72, rows=32;
    for(let row=0;row<rows;row++) for(let column=0;column<columns;column++) {
      const x0=dataStart+column*(dataEnd-dataStart)/columns, x1=dataStart+(column+1)*(dataEnd-dataStart)/columns;
      const z0=row*height/rows, z1=(row+1)*height/rows;
      cells.push({x:xScale(x0),y:zScale(z1),w:xScale(x1)-xScale(x0)+.2,h:zScale(z0)-zScale(z1)+.2,
        value:valueAt((x0+x1)/2,(z0+z1)/2)});
    }
    const slider=Number.isFinite(Number(fieldPositionM))
      ? Math.max(xMin,Math.min(xMax,Number(fieldPositionM))) : (dataStart+dataEnd)/2;
    const axisTicks=Array.isArray(xTicks)&&xTicks.length ? xTicks : xs;
    return <div style={{width:'100%',overflowX:'auto'}}>
      <svg viewBox={`0 0 ${VBW} ${VBH}`} role="img"
           aria-label={`${label}: vista lateral de luminancia de pared asociada al campo CIE 140`}
           style={{display:'block',width:'100%',minWidth:620,background:'#f8fafc',borderRadius:5}}>
        <rect x={ML} y="20" width={mapW} height="21" fill="#94a3b8"/>
        <text x={ML+mapW/2} y="35" textAnchor="middle" fill="#fff" fontSize="11" fontWeight="700">{label}</text>
        <rect x={ML} y={MT} width={mapW} height={mapH} fill="#454b52"/>
        {cells.map((cell,index)=><rect key={`${side}-heat-${index}`} x={cell.x} y={cell.y} width={cell.w} height={cell.h} fill={wallColor(cell.value)}/>) }
        <rect x={xScale(dataStart)} y={MT} width={Math.max(1,xScale(dataEnd)-xScale(dataStart))} height={mapH} fill="none" stroke="#ef4444" strokeWidth="2"/>
        <text x={(xScale(dataStart)+xScale(dataEnd))/2} y={MT-7} textAnchor="middle" fill="#b91c1c" fontSize="11" fontWeight="700">Campo de cálculo CIE 140</text>
        {xs.map((x,xIndex)=>zs.map((z,zIndex)=>{
          const value=Number(values?.[xIndex]?.[zIndex]??0);
          return <text key={`${side}-value-${xIndex}-${zIndex}`} x={xScale(x)} y={zScale(z)+3} textAnchor="middle"
                       fill="#fff" stroke="#27313a" strokeWidth="2.2" paintOrder="stroke" fontSize="9" fontWeight="700">
            <title>{`s=${x.toFixed(2)} m · h=${z.toFixed(2)} m · L pared=${value.toFixed(3)} cd/m²`}</title>
            {value>=10?value.toFixed(0):value.toFixed(1)}
          </text>;
        }))}
        <line x1={xScale(slider)} x2={xScale(slider)} y1={MT} y2={MT+mapH} stroke="#7c3aed" strokeWidth="2.5"/>
        <text x={xScale(slider)} y={MT+14} textAnchor="middle" fill="#fff" stroke="#4c1d95" strokeWidth="2" paintOrder="stroke" fontSize="9" fontWeight="700">Slider</text>
        <line x1={ML} x2={ML+mapW} y1={MT+mapH+12} y2={MT+mapH+12} stroke="#64748b"/>
        {axisTicks.map((x,index)=><g key={`${side}-x-${index}`}><line x1={xScale(x)} x2={xScale(x)} y1={MT+mapH+8} y2={MT+mapH+17} stroke="#64748b"/><text x={xScale(x)} y={MT+mapH+31} textAnchor="middle" fill="#475569" fontSize="10">{Number(x).toFixed(1)}</text></g>)}
        <text x={ML+mapW/2} y={VBH-7} textAnchor="middle" fill="#334155" fontSize="10">Distancia al origen del túnel, s (m)</text>
        <line x1={ML-12} x2={ML-12} y1={MT} y2={MT+mapH} stroke="#64748b"/>
        {zs.map((z,index)=><g key={`${side}-z-${index}`}><line x1={ML-17} x2={ML-8} y1={zScale(z)} y2={zScale(z)} stroke="#64748b"/><text x={ML-22} y={zScale(z)+3} textAnchor="end" fill="#475569" fontSize="10">{z.toFixed(2)}</text></g>)}
        <text x={17} y={MT+mapH/2} textAnchor="middle" fill="#334155" fontSize="10" transform={`rotate(-90 17 ${MT+mapH/2})`}>Altura de pared, h (m)</text>
      </svg>
    </div>;
  };

  return <div style={{marginTop:10,borderTop:'1px solid #dbeafe',paddingTop:9}}>
    <div style={{display:'flex',justifyContent:'space-between',gap:8,alignItems:'baseline',flexWrap:'wrap'}}>
      <div style={{fontSize:'.66rem',fontWeight:800,color:'#1e3a5f',textTransform:'uppercase',letterSpacing:'.05em'}}>
        Vista lateral de paredes · campo CIE 140
      </div>
      {available&&<span style={{fontSize:'.61rem',fontWeight:700,padding:'3px 7px',borderRadius:10,
        background:wall.compliant?'#dcfce7':'#fee2e2',color:wall.compliant?'#166534':'#b91c1c'}}>
        {wall.compliant?'✓ Cumple':'⚠ Revisar'} · {Math.round(ratio*100)} % / {Math.round(criterion*100)} %
      </span>}
    </div>
    {available ? <>
       <div style={{display:'grid',gap:10,marginTop:7}}>
         <WallMap label={symmetric
           ? `Pared lateral · distribución simétrica · media ${leftAvg.toFixed(2)} cd/m²`
           : `Pared izquierda · media ${leftAvg.toFixed(2)} cd/m²`}
           values={left} side="left"/>
         {!symmetric&&<WallMap label={`Pared derecha · media ${rightAvg.toFixed(2)} cd/m²`}
           values={right} side="right"/>}
       </div>
      <div style={{fontSize:'.6rem',color:'#475569',lineHeight:1.45,marginTop:6}}>
        Valores calculados sobre la franja de pared 0–{height.toFixed(2)} m; calzada gobernante {roadL.toFixed(2)} cd/m².
        {' '}Criterio CIE 88:2004 aplicado: Lpared mínima media / Lcalzada ≥ {Math.round(criterion*100)} %
        {' '}(clase {tunnelClass}).
        {profile?.wall_luminance?.source==='project_override' &&
          ` Proyecto fijado al ${Math.round(criterion*100)} %; referencia CIE 88:2004 ${Math.round(automatic*100)} %.`}
      </div>
    </> : <div style={{fontSize:'.61rem',color:'#64748b',marginTop:5}}>
      Recalcula el diseño CIE 140 para disponer de las muestras verticales de pared de este campo.
    </div>}
  </div>;
}

function PhotometricSectionInspector({
  profile, field, fieldPositionM, luminaireResult, form, lumConfig,
}) {
  const W = Math.max(1, parseFloat(form?.width_m) || 10.5);
  const H = Math.max(1, parseFloat(lumConfig?.mounting_height_m) || parseFloat(form?.height_m) || 5.5);
  const arrangement = luminaireResult?.arrangement || lumConfig?.arrangement || 'central_single';
  const wallOffset = Math.max(0.05, parseFloat(lumConfig?.wall_offset_m) || 0.30);
  const allSetpoints = (luminaireResult?.zones || []).flatMap(zone =>
    (zone.setpoints || []).map(setpoint => ({...setpoint, __zone:zone}))
  ).filter(item => Number.isFinite(Number(item.s)));
  const fieldType = String(field?.zone_type || '').toLowerCase();
  const inCurrentZone = allSetpoints.filter(item => {
    const zone = item.__zone || {};
    const zoneType = String(zone.zone_type || '').toLowerCase();
    const x = Number(item.s);
    return zoneType === fieldType
      && x >= Number(field?.field_start ?? -Infinity) - 0.01
      && x <= Number(field?.field_end ?? Infinity) + 0.01;
  });
  const candidates = inCurrentZone.length ? inCurrentZone : allSetpoints;
  const selected = candidates.reduce((best,item) => {
    if (!best) return item;
    return Math.abs(Number(item.s) - fieldPositionM) < Math.abs(Number(best.s) - fieldPositionM)
      ? item : best;
  }, null);
  const optic = selected?.optic || selected?.__zone?.optic || luminaireResult?.optic || lumConfig?.optic || null;
  const selectedYs = selected
    ? physicalLuminaireYPositions(arrangement, W, wallOffset, Number(selected.idx) || 1)
    : [];

  if (!selected) return null;

  const sectionW = 580, sectionH = 240, floorY = 196;
  const wallLeft = 92, wallRight = 488, centre = (wallLeft + wallRight) / 2;
  const ySection = y => wallLeft + (Number(y) / W) * (wallRight - wallLeft);
  const liningHeight = Math.min(H, Math.max(0.25, parseFloat(form?.H_pared_m) || 2));
  const liningTop = floorY - (liningHeight / H) * 105;

  return (
    <div style={{marginTop:12,padding:'10px 12px',border:'1px solid #bfdbfe',borderRadius:7,background:'#f8fbff'}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'baseline',flexWrap:'wrap'}}>
        <div>
          <div style={{fontSize:'.68rem',fontWeight:800,color:'#1e3a5f',textTransform:'uppercase',letterSpacing:'.06em'}}>
            Sección de implantación en s = {Number(selected.s).toFixed(1)} m
          </div>
          <div style={{fontSize:'.63rem',color:'#526579',marginTop:2}}>
            Luminaria más próxima al deslizador ({Math.abs(Number(selected.s)-fieldPositionM).toFixed(1)} m) ·
            {' '}óptica {optic || '—'} · x={Number(selected.s).toFixed(1)} m ·
            {' '}flujo {Math.round(Number(selected.flux_lm || selected.__zone?.flux_lm || 0)).toLocaleString('es-ES')} lm
          </div>
        </div>
        <span style={{fontSize:'.62rem',fontWeight:700,color:'#166534',background:'#dcfce7',borderRadius:12,padding:'3px 8px'}}>
          ✓ Luminarias orientadas hacia el interior
        </span>
      </div>

      <div style={{display:'block',marginTop:7}}>
        <div style={{overflowX:'auto'}}>
          <svg viewBox={`0 0 ${sectionW} ${sectionH}`} role="img"
               aria-label="Sección transversal de la luminaria seleccionada y orientación fotométrica"
               style={{display:'block',width:'100%',minWidth:340,maxHeight:255}}>
            <path d={`M${wallLeft},${floorY} L${wallLeft},128 Q${wallLeft},48 ${centre},35 Q${wallRight},48 ${wallRight},128 L${wallRight},${floorY} Z`}
                  fill="#1f2c42" stroke="#334155" strokeWidth="4"/>
            <line x1={wallLeft} x2={wallRight} y1={floorY} y2={floorY} stroke="#64748b" strokeWidth="8"/>
            <line x1={wallLeft+3} x2={wallLeft+3} y1={floorY-2} y2={liningTop} stroke="#f8fafc" strokeWidth="5" strokeLinecap="round"/>
            <line x1={wallRight-3} x2={wallRight-3} y1={floorY-2} y2={liningTop} stroke="#f8fafc" strokeWidth="5" strokeLinecap="round"/>
            <text x={wallLeft-6} y={liningTop-6} textAnchor="end" fill="#64748b" fontSize="10">Pared reflectante {liningHeight.toFixed(1)} m</text>
            {[1,2,3].map(index => {
              const y = floorY - index * (floorY-88) / 3;
              return <line key={`guide-${index}`} x1={wallLeft} x2={wallRight} y1={y} y2={y}
                           stroke="#94a3b8" strokeWidth=".7" opacity=".28"/>;
            })}
            {selectedYs.map((y,index) => {
              const mirrored = ldtMustBeMirroredForInterior(arrangement,y,W);
              const x = ySection(y);
              const inward = x < centre ? 1 : -1;
              return <g key={`section-lum-${index}`}>
                <rect x={x-12} y="69" width="24" height="8" rx="2" fill="#f59e0b" stroke="#fff" strokeWidth="1.5"/>
                <line x1={x} x2={x+inward*45} y1="80" y2="100" stroke="#fbbf24" strokeWidth="2.4" markerEnd="url(#section-arrow)"/>
                <text x={x} y="62" textAnchor="middle" fill="#111827" fontSize="10" fontWeight="700">
                  {mirrored ? 'Óptica reflejada' : 'Óptica nativa'}
                </text>
                <text x={x} y="113" textAnchor="middle" fill="#fef3c7" fontSize="9">hacia interior</text>
              </g>;
            })}
            <defs><marker id="section-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker></defs>
            <line x1={wallLeft} x2={wallRight} y1="218" y2="218" stroke="#94a3b8" strokeWidth="1"/>
            <line x1={wallLeft} x2={wallLeft} y1="212" y2="224" stroke="#94a3b8" strokeWidth="1"/>
            <line x1={wallRight} x2={wallRight} y1="212" y2="224" stroke="#94a3b8" strokeWidth="1"/>
            <text x={centre} y="235" textAnchor="middle" fill="#475569" fontSize="10">Ancho pared a pared: {W.toFixed(2)} m · altura de montaje: {H.toFixed(2)} m</text>
          </svg>
        </div>

      </div>
    </div>
  );
}

function NormativePlanView({
  profile, zoneList, luminaireResult, form, lumConfig,
  fieldIndex=0, onFieldIndexChange=()=>{},
  positionM=null, onPositionChange=()=>{}, resetKey=null,
  operatingScene=null, operationResolver=null, includeNatural=false, sceneLabel=null,
}) {
  const fields = profile?.fields || [];
  const [renderMode, setRenderMode] = useState('heatmap');
  const [observerSelection, setObserverSelection] = useState('auto');
  const safeFieldIndex = Math.max(0, Math.min(fieldIndex, Math.max(0, fields.length - 1)));
  const resetKeyRef = React.useRef(resetKey);

  React.useEffect(() => {
    if (fieldIndex !== safeFieldIndex) onFieldIndexChange(safeFieldIndex);
  }, [fields.length, fieldIndex]);
  React.useEffect(() => {
    if (resetKeyRef.current === resetKey) return;
    resetKeyRef.current = resetKey;
    onPositionChange(Number(fields[safeFieldIndex]?.s) || 0);
  }, [resetKey, fields.length, safeFieldIndex]);

  if (!profile?.available || !fields.length) return null;

  const field = fields[safeFieldIndex];
  const naturalContribution = includeNatural
    ? Number(field.natural_daylight_cd_m2||0) : 0;
  const observerOptions = field.observer_grids || [];
  const observerKey = observer =>
    `${Number(observer.lane_index)||0}:${Number(observer.direction)>=0?1:-1}`;
  const governingObserverKey =
    `${Math.max(0,Number(field.observer_lane_number||1)-1)}:${Number(field.observer_direction)>=0?1:-1}`;
  const selectedObserver = (
    observerSelection === 'auto'
      ? observerOptions.find(observer=>observerKey(observer)===governingObserverKey)
      : observerOptions.find(observer=>observerKey(observer)===observerSelection)
  ) || observerOptions.find(observer=>observerKey(observer)===governingObserverKey)
    || observerOptions[0] || null;
  const W = Math.max(1, parseFloat(form.width_m) || 10.5);
  const nLanes = Math.max(1, parseInt(form.num_lanes) || 2);
  let laneW = Math.max(0.1, parseFloat(form.lane_width_m) || 3.5);
  let shoulderLeft = Math.max(0, parseFloat(form.shoulder_left_m) || 0);
  let shoulderRight = Math.max(0, parseFloat(form.shoulder_right_m) || 0);
  const sidewalkLeft = Math.max(0, parseFloat(form.sidewalk_left_m) || 0);
  const sidewalkRight = Math.max(0, parseFloat(form.sidewalk_right_m) || 0);
  // Misma convención que _lane_layout() del backend: W es pared-a-pared;
  // aceras físicas se dibujan, pero se excluyen de L / U0 / Ul CIE 140.
  const carriagewayStart = sidewalkLeft;
  const carriagewayEnd = Math.max(carriagewayStart + 0.1, W - sidewalkRight);
  const carriagewayW = Math.max(0.1, carriagewayEnd - carriagewayStart);
  const availableW = Math.max(0.1, carriagewayW - shoulderLeft - shoulderRight);
  if (nLanes * laneW > availableW + 1e-6) laneW = availableW / nLanes;
  if (shoulderLeft + shoulderRight <= 1e-9 && nLanes * laneW < carriagewayW) {
    shoulderLeft = (carriagewayW - nLanes * laneW) / 2;
    shoulderRight = carriagewayW - shoulderLeft - nLanes * laneW;
  }
  const laneStart = carriagewayStart + shoulderLeft;
  const laneEnd = Math.min(carriagewayEnd, laneStart + nLanes * laneW);
  const tunnelLength = Math.max(
    parseFloat(profile?.length_m) || 0,
    parseFloat(form.length_m) || 0,
    ...zoneList.map(z => parseFloat(z.s_end) || 0),
  );
  // El deslizador representa metros reales del túnel, no el índice de campo.
  // Los campos CIE 140 no siempre tienen una separación uniforme, por lo que
  // al moverlo se selecciona el centro de campo más próximo a la posición.
  const sliderLength = Math.max(
    0.1,
    tunnelLength,
    Number(fields[fields.length - 1]?.field_end) || 0,
    Number(fields[fields.length - 1]?.s) || 0,
  );
  // La posición del slider es continua y no se sustituye por el índice del
  // campo. El índice solo identifica la malla CIE 140 más próxima que se
  // muestra y se usa para resaltar la luminaria/campo de referencia.
  const fieldPositionM = Math.max(
    0,
    Math.min(
      sliderLength,
      positionM!=null && Number.isFinite(Number(positionM))
        ? Number(positionM) : Number(field.s) || 0,
    ),
  );
  const nearestFieldIndex = position => {
    const target = Math.max(0, Math.min(sliderLength, Number(position) || 0));
    return fields.reduce((bestIndex, candidate, index) => {
      const bestS = Number(fields[bestIndex]?.s) || 0;
      const candidateS = Number(candidate?.s) || 0;
      return Math.abs(candidateS - target) < Math.abs(bestS - target)
        ? index : bestIndex;
    }, 0);
  };

  const spacing = Math.max(0.1, field.field_end - field.field_start);
  const contextM = Math.max(2, Math.min(8, spacing * 0.18));
  let viewStart = Math.max(0, field.field_start - contextM);
  let viewEnd = Math.min(tunnelLength || field.field_end + contextM, field.field_end + contextM);
  if (viewEnd - viewStart < spacing + 1) {
    viewStart = Math.max(0, field.field_start - 0.5);
    viewEnd = field.field_end + 0.5;
  }

  const VBW = 1200, VBH = 470;
  const ML = 78, MR = 24, MT = 62, MB = 58;
  const roadW = VBW - ML - MR;
  const roadH = VBH - MT - MB;
  const xScale = x => ML + (x - viewStart) / Math.max(0.1, viewEnd - viewStart) * roadW;
  const yScale = y => MT + y / W * roadH;
  const fieldPoints = (field.grid_points || []).map((point,index) => {
    const selectedValue = selectedObserver?.values?.[index];
    const artificialValue = selectedValue == null
      ? Number(point.L) : Number(selectedValue);
    return {...point,L:artificialValue+naturalContribution};
  });
  const Lvalues = fieldPoints.map(p => Number(p.L)).filter(Number.isFinite);
  const Lmin = Lvalues.length ? Math.min(...Lvalues) : 0;
  const Lmax = Lvalues.length ? Math.max(...Lvalues) : 1;
  const lColor = value => {
    const t = Math.max(0, Math.min(1, (Number(value) - Lmin) / Math.max(0.001, Lmax - Lmin)));
    return `hsl(${215 - 215 * t},78%,43%)`;
  };
  const fmtL = value => Number(value) >= 100 ? Number(value).toFixed(0) : Number(value).toFixed(1);

  const ZLABEL = {
    threshold:'Umbral A', transition:'Transición A', interior:'Interior',
    transition_b:'Transición B', threshold_b:'Umbral B',
  };
  const ZCOLOR = {
    threshold:'#f59e0b', transition:'#0891b2', interior:'#16a34a',
    transition_b:'#0284c7', threshold_b:'#ca8a04',
  };
  const zoneType = String(field.zone_type || '').toLowerCase();
  const zoneLabel = ZLABEL[zoneType] || field.zone_name || zoneType || 'Zona';
  const zoneColor = ZCOLOR[zoneType] || '#64748b';

  const metricsForField = candidate => {
    const pts = candidate?.grid_points || [];
    const values = pts.map(p=>Number(p.L)).filter(Number.isFinite);
    if (!values.length) return {U0:0,Ul:0};
    const avg = values.reduce((sum,value)=>sum+value,0) / values.length;
    const U0 = Math.min(...values) / Math.max(0.001,avg);
    const xs = [...new Set(pts.map(p=>Number(p.x)))].sort((a,b)=>a-b);
    const laneUls = Array.from({length:nLanes},(_,laneIndex)=>{
      const laneCenter = laneStart + (laneIndex + 0.5) * laneW;
      const lineValues = xs.map(x=>{
        const column = pts.filter(p=>Math.abs(Number(p.x)-x)<1e-6);
        if (!column.length) return null;
        return Number(column.reduce((best,p)=>
          Math.abs(Number(p.y)-laneCenter)<Math.abs(Number(best.y)-laneCenter)?p:best
        ,column[0]).L);
      }).filter(Number.isFinite);
      return lineValues.length
        ? Math.min(...lineValues) / Math.max(0.001,Math.max(...lineValues))
        : 0;
    });
    return {U0,Ul:laneUls.length?Math.min(...laneUls):0};
  };
  // Los valores de cabecera deben corresponder a la misma malla que se está
  // mostrando. `field.grid_points` es la del observador gobernante; al elegir
  // otro carril/sentido usamos sus valores sin cambiar la geometría CIE 140.
  const fieldMetrics = metricsForField({
    ...field,
    grid_points: fieldPoints,
  });
  const zoneFieldMetrics = fields
    .filter(candidate=>String(candidate.zone_type||'').toLowerCase()===zoneType)
    .map(metricsForField);
  const zoneU0 = zoneFieldMetrics.length
    ? zoneFieldMetrics.reduce((sum,m)=>sum+m.U0,0)/zoneFieldMetrics.length : 0;
  const zoneUl = zoneFieldMetrics.length
    ? zoneFieldMetrics.reduce((sum,m)=>sum+m.Ul,0)/zoneFieldMetrics.length : 0;

  // Marching squares sobre la malla regular CIE 140. Las líneas se calculan
  // directamente con los mismos valores mostrados, sin interpolar otra malla.
  const gridXs = [...new Set(fieldPoints.map(p=>Number(p.x)))].sort((a,b)=>a-b);
  const gridYs = [...new Set(fieldPoints.map(p=>Number(p.y)))].sort((a,b)=>a-b);
  const gridValue = new Map(fieldPoints.map(p=>[
    `${Number(p.x).toFixed(6)}|${Number(p.y).toFixed(6)}`, Number(p.L)
  ]));
  const valueAt = (x,y) => gridValue.get(`${x.toFixed(6)}|${y.toFixed(6)}`);
  // Mapa cromático continuo para leer rápidamente la distribución. Los
  // valores fuente siguen siendo sólo los nodos CIE 140: la interpolación es
  // estrictamente visual y no interviene en Lavg, U0, Ul ni en la conformidad.
  const heatColor = value => {
    const t=Math.max(0,Math.min(1,(Number(value)-Lmin)/Math.max(0.001,Lmax-Lmin)));
    const stops=[
      [0.00,[14,165,233]], [0.30,[34,211,238]], [0.58,[34,197,94]],
      [0.80,[163,230,53]], [1.00,[250,204,21]],
    ];
    const pair=stops.find((stop,index)=>index<stops.length-1&&t<=stops[index+1][0])
      || stops[stops.length-2];
    const index=stops.indexOf(pair), next=stops[index+1];
    const local=(t-pair[0])/Math.max(1e-9,next[0]-pair[0]);
    const rgb=pair[1].map((component,i)=>Math.round(component+(next[1][i]-component)*local));
    return `rgb(${rgb.join(',')})`;
  };
  const nearestGridValue = (x,y) => fieldPoints.reduce((best,point) => {
    const dx=Number(point.x)-x, dy=Number(point.y)-y;
    const distance=dx*dx+dy*dy;
    return !best||distance<best.distance ? {distance,value:Number(point.L)} : best;
  },null)?.value ?? Lmin;
  const gridBounds = (values,value) => {
    if (!values.length) return [value,value];
    if (value<=values[0]) return [values[0],values[0]];
    if (value>=values[values.length-1]) return [values[values.length-1],values[values.length-1]];
    const upper=values.findIndex(item=>item>=value);
    return [values[upper-1],values[upper]];
  };
  const interpolatedGridValue = (x,y) => {
    const [x0,x1]=gridBounds(gridXs,x), [y0,y1]=gridBounds(gridYs,y);
    const v00=valueAt(x0,y0), v10=valueAt(x1,y0), v01=valueAt(x0,y1), v11=valueAt(x1,y1);
    if (![v00,v10,v01,v11].every(Number.isFinite)) return nearestGridValue(x,y);
    const tx=x1===x0?0:(x-x0)/(x1-x0), ty=y1===y0?0:(y-y0)/(y1-y0);
    const top=v00+(v10-v00)*tx, bottom=v01+(v11-v01)*tx;
    return top+(bottom-top)*ty;
  };
  const heatMapCells=[];
  const heatColumns=88, heatRows=Math.max(36,nLanes*28);
  for(let row=0;row<heatRows;row++) {
    const y0=laneStart+(row/heatRows)*(laneEnd-laneStart);
    const y1=laneStart+((row+1)/heatRows)*(laneEnd-laneStart);
    for(let column=0;column<heatColumns;column++) {
      const x0=Number(field.field_start)+(column/heatColumns)*spacing;
      const x1=Number(field.field_start)+((column+1)/heatColumns)*spacing;
      const luminance=interpolatedGridValue((x0+x1)/2,(y0+y1)/2);
      heatMapCells.push({x:xScale(x0),y:yScale(y0),
        width:Math.max(0.5,xScale(x1)-xScale(x0)+0.25),
        height:Math.max(0.5,yScale(y1)-yScale(y0)+0.25),
        luminance});
    }
  }
  const contourLevels = Lmax-Lmin>0.01
    ? Array.from({length:6},(_,i)=>Lmin+(i+1)*(Lmax-Lmin)/7)
    : [Lmin];
  const contourSegments = [];
  const crossing = (a,b,level) => {
    if (!Number.isFinite(a.v)||!Number.isFinite(b.v)||Math.abs(a.v-b.v)<1e-9) return null;
    if (level<Math.min(a.v,b.v)||level>Math.max(a.v,b.v)) return null;
    const t=(level-a.v)/(b.v-a.v);
    if (t<0||t>1) return null;
    return {x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)};
  };
  contourLevels.forEach(level=>{
    for(let ix=0;ix<gridXs.length-1;ix++){
      for(let iy=0;iy<gridYs.length-1;iy++){
        const x0=gridXs[ix],x1=gridXs[ix+1],y0=gridYs[iy],y1=gridYs[iy+1];
        const p00={x:x0,y:y0,v:valueAt(x0,y0)}, p10={x:x1,y:y0,v:valueAt(x1,y0)};
        const p11={x:x1,y:y1,v:valueAt(x1,y1)}, p01={x:x0,y:y1,v:valueAt(x0,y1)};
        const hits=[crossing(p00,p10,level),crossing(p10,p11,level),
                    crossing(p11,p01,level),crossing(p01,p00,level)]
          .filter(Boolean)
          .filter((p,index,arr)=>arr.findIndex(q=>Math.abs(q.x-p.x)<1e-6&&Math.abs(q.y-p.y)<1e-6)===index);
        if(hits.length===2) contourSegments.push({level,a:hits[0],b:hits[1]});
        if(hits.length===4){
          contourSegments.push({level,a:hits[0],b:hits[1]});
          contourSegments.push({level,a:hits[2],b:hits[3]});
        }
      }
    }
  });
  // Unir los segmentos de marching-squares por nivel. La malla y las
  // intersecciones siguen siendo exactamente las CIE 140 calculadas; el spline
  // se emplea solo al dibujar una isoluminancia continua, no para recalcular L.
  const contourPointKey = point => (
    `${Number(point.x).toFixed(6)}|${Number(point.y).toFixed(6)}`
  );
  const contourPaths = contourLevels.flatMap(level => {
    const segments = contourSegments.filter(segment => segment.level===level);
    const pointByKey = new Map();
    const links = new Map();
    const register = (point, segmentIndex) => {
      const key=contourPointKey(point);
      pointByKey.set(key,point);
      const items=links.get(key)||[];
      items.push(segmentIndex);
      links.set(key,items);
      return key;
    };
    segments.forEach((segment,index) => {
      register(segment.a,index);
      register(segment.b,index);
    });
    const used = new Set();
    const trace = (startKey, firstIndex) => {
      const points=[pointByKey.get(startKey)];
      let currentKey=startKey, segmentIndex=firstIndex;
      while(segmentIndex!=null && !used.has(segmentIndex)) {
        used.add(segmentIndex);
        const segment=segments[segmentIndex];
        const aKey=contourPointKey(segment.a), bKey=contourPointKey(segment.b);
        const nextKey=aKey===currentKey ? bKey : aKey;
        points.push(pointByKey.get(nextKey));
        const next=(links.get(nextKey)||[]).find(index=>!used.has(index));
        if(next==null) break;
        currentKey=nextKey;
        segmentIndex=next;
      }
      return points;
    };
    const paths=[];
    // Las curvas abiertas comienzan/terminan en un borde de la malla.
    links.forEach((indices,key) => {
      if(indices.length!==2) indices.forEach(index => {
        if(!used.has(index)) paths.push({level,points:trace(key,index)});
      });
    });
    // Las curvas cerradas no tienen extremos: iniciar una vez por segmento.
    segments.forEach((segment,index) => {
      if(!used.has(index)) {
        paths.push({level,points:trace(contourPointKey(segment.a),index)});
      }
    });
    return paths.filter(path=>path.points.length>1);
  });
  const contourSplinePath = points => {
    if(!points.length) return '';
    const isClosed=points.length>3 &&
      contourPointKey(points[0])===contourPointKey(points[points.length-1]);
    const knots=isClosed ? points.slice(0,-1) : points;
    const scaled=knots.map(point=>({x:xScale(point.x),y:yScale(point.y)}));
    if(scaled.length<2) return `M${scaled[0].x.toFixed(2)},${scaled[0].y.toFixed(2)}`;
    const tension=0.42;
    let d=`M${scaled[0].x.toFixed(2)},${scaled[0].y.toFixed(2)}`;
    const segmentsToDraw=isClosed ? scaled.length : scaled.length-1;
    for(let i=0;i<segmentsToDraw;i++) {
      const p0=scaled[isClosed ? (i-1+scaled.length)%scaled.length : Math.max(0,i-1)];
      const p1=scaled[i];
      const p2=scaled[(i+1)%scaled.length];
      const p3=scaled[isClosed ? (i+2)%scaled.length : Math.min(scaled.length-1,i+2)];
      const c1x=p1.x+(p2.x-p0.x)*tension/6;
      const c1y=p1.y+(p2.y-p0.y)*tension/6;
      const c2x=p2.x-(p3.x-p1.x)*tension/6;
      const c2y=p2.y-(p3.y-p1.y)*tension/6;
      d+=` C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
    }
    return isClosed ? `${d} Z` : d;
  };

  const arrangement = luminaireResult?.arrangement || lumConfig?.arrangement || 'bilateral_sym';
  const wallOffset = Math.max(0, parseFloat(lumConfig?.wall_offset_m) || 0.30);
  const modelColors = {S:'#22c55e', M:'#3b82f6', L:'#a855f7'};
  const luminairePoints = [];
  (luminaireResult?.zones || []).forEach(z => {
    (z.setpoints || []).forEach(sp => {
      const x = Number(sp.s);
      if (!Number.isFinite(x) || x < viewStart - 0.1 || x > viewEnd + 0.1) return;
      const operation = operationResolver
        ? operationResolver(sp,z)
        : operatingScene === 'night'
        ? (
            z.control_layer === 'permanent'
              ? {
                  state:'on',
                  flux_lm:sp.night_flux_lm,
                  current_mA:sp.night_current_mA,
                  power_w:sp.night_power_w,
                }
              : {state:'off',flux_lm:0,current_mA:0,power_w:0}
          )
        : operatingScene
          ? sp.scenario_operating_points?.[operatingScene]
          : null;
      const operatingFlux = operation
        ? Number(operation.flux_lm||0)
        : Number(sp.flux_lm || z.flux_lm || 0);
      const ys = physicalLuminaireYPositions(
        arrangement, W, wallOffset, Number(sp.idx) || 1,
      );
      ys.forEach(y => luminairePoints.push({
        x, y,
        model: String(sp.model || z.model || '').replace(/^APHEX_/, '').charAt(0) || 'S',
        optic: sp.optic || z.optic || '',
        flux: operatingFlux,
        active: operation
          ? operation.state!=='off' && operatingFlux>0
          : true,
        current_mA: operation?.current_mA ?? sp.current_mA,
        power_w: operation?.power_w ?? sp.power_w,
      }));
    });
  });

  const xTicks = Array.from({length:7}, (_,i) => viewStart + i * (viewEnd - viewStart) / 6);
  const yStep = W <= 12 ? 1 : 2;
  const yTicks = [];
  for (let y=0; y<=W+1e-6; y+=yStep) yTicks.push(y);
  if (Math.abs(yTicks[yTicks.length-1] - W) > 0.05) yTicks.push(W);
  // La identidad del SVG debe cambiar al recorrer el túnel. Algunos motores
  // SVG mantienen el trazado anterior si las curvas conservan la misma clave
  // ordinal aunque la malla CIE 140 ya corresponda a otro campo.
  const planRenderKey = [
    safeFieldIndex,
    Number(field.field_start).toFixed(3),
    Number(field.field_end).toFixed(3),
    observerSelection,
    Number(selectedObserver?.lane_index ?? -1),
    Number(selectedObserver?.direction ?? 0),
    includeNatural ? 1 : 0,
    naturalContribution.toFixed(3),
    operatingScene||'',
  ].join('|');

  return (
    <div style={{background:'var(--salvi-surface)',border:'1px solid var(--salvi-line)',
                 borderRadius:8,padding:'10px 12px'}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap',marginBottom:7}}>
        <div>
          <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--salvi-grey)',
                      textTransform:'uppercase',letterSpacing:'.07em'}}>
            Planta fotométrica CIE 140{sceneLabel?` · ${sceneLabel}`:''}
          </div>
          <div style={{fontSize:'.65rem',color:'var(--salvi-grey)',marginTop:2}}>
            Campo {safeFieldIndex+1} de {fields.length} · {field.field_start.toFixed(1)}–{field.field_end.toFixed(1)} m ·
            {' '}Lavg {(
              Number(selectedObserver?.L??field.L)+naturalContribution
            ).toFixed(1)} cd/m² ·
            {' '}observador Carril {Number(selectedObserver?.lane_number??field.observer_lane_number??1)} ·
            {' '}y={Number(selectedObserver?.observer_lane_y_m??field.observer_lane_y_m).toFixed(2)} m ·
            {' '}{Number(selectedObserver?.direction??field.observer_direction)>=0?'A → B':'B → A'}
            {observerSelection==='auto'?' · gobernante':''}
            {naturalContribution>0
              ? ` · incluye ${naturalContribution.toFixed(1)} cd/m² naturales`
              : ''}
          </div>
          <div style={{fontSize:'.64rem',color:'var(--salvi-black)',marginTop:3}}>
            Campo: U0 <b>{fieldMetrics.U0.toFixed(3)}</b> · Ul <b>{fieldMetrics.Ul.toFixed(3)}</b>
            <span style={{color:'var(--salvi-grey)'}}> · Media {zoneLabel} (gobernantes): U0 <b>{zoneU0.toFixed(3)}</b> · Ul <b>{zoneUl.toFixed(3)}</b></span>
          </div>
        </div>
        <span style={{background:zoneColor,color:'#fff',borderRadius:12,padding:'3px 9px',
                     fontSize:'.64rem',fontWeight:700,whiteSpace:'nowrap'}}>
          {zoneLabel}
        </span>
      </div>

      <div style={{display:'flex',gap:7,alignItems:'center',margin:'3px 0 9px',
                   flexWrap:'wrap',padding:'6px 8px',background:'#f8fafc',
                   border:'1px solid var(--salvi-line)',borderRadius:6}}>
        <span style={{fontSize:'.64rem',fontWeight:700,color:'var(--salvi-grey)',
                      whiteSpace:'nowrap'}}>
          Observador / carril
        </span>
        <button type="button" onClick={()=>setObserverSelection('auto')}
          aria-pressed={observerSelection==='auto'}
          style={{padding:'4px 8px',fontSize:'.63rem',borderRadius:5,cursor:'pointer',
                  border:'1px solid var(--salvi-line)',
                  background:observerSelection==='auto'?'var(--salvi-black)':'#fff',
                  color:observerSelection==='auto'?'#fff':'var(--salvi-grey)'}}>
          Gobernante
        </button>
        {observerOptions.map(observer=>{
          const key=observerKey(observer);
          const active=observerSelection===key;
          return (
            <button key={key} type="button" onClick={()=>setObserverSelection(key)}
              aria-pressed={active}
              title={`Observador y=${Number(observer.observer_lane_y_m).toFixed(2)} m`}
              style={{padding:'4px 8px',fontSize:'.63rem',borderRadius:5,cursor:'pointer',
                      border:'1px solid var(--salvi-line)',
                      background:active?'#2563eb':'#fff',
                      color:active?'#fff':'var(--salvi-grey)'}}>
              Carril {observer.lane_number} · {Number(observer.direction)>=0?'A → B':'B → A'}
            </button>
          );
        })}
        {!observerOptions.length&&(
          <span style={{fontSize:'.62rem',color:'#92400e'}}>
            Solo está guardado el observador gobernante. Recalcula el diseño
            para generar las mallas de todos los carriles.
          </span>
        )}
      </div>

      <div style={{display:'flex',gap:12,alignItems:'center',margin:'3px 0 9px',flexWrap:'wrap'}}>
        <label style={{display:'grid',gridTemplateColumns:'110px minmax(220px,1fr) 92px',
                       gap:9,alignItems:'center',fontSize:'.65rem',color:'var(--salvi-grey)',flex:'1 1 560px'}}>
          <span>Recorrer túnel</span>
          <input type="range" min="0" max={sliderLength} step="any" value={fieldPositionM}
                 onChange={e=>{
                   const nextPosition=Math.max(0,Math.min(sliderLength,Number(e.target.value)||0));
                   onPositionChange(nextPosition);
                   onFieldIndexChange(nearestFieldIndex(nextPosition));
                 }}
                 aria-valuetext={`${fieldPositionM.toFixed(2)} m de ${sliderLength.toFixed(2)} m`}
                 aria-label="Seleccionar posición de cálculo a lo largo del túnel"/>
          <span style={{textAlign:'right',fontFamily:'monospace'}}>{fieldPositionM.toFixed(2)} m</span>
        </label>
        <div style={{display:'flex',border:'1px solid var(--salvi-line)',borderRadius:5,overflow:'hidden'}}>
          <button type="button" onClick={()=>setRenderMode('heatmap')} aria-pressed={renderMode==='heatmap'}
                  style={{padding:'4px 10px',fontSize:'.64rem',border:'none',cursor:'pointer',
                          background:renderMode==='heatmap'?'var(--salvi-black)':'var(--salvi-surface)',
                          color:renderMode==='heatmap'?'#fff':'var(--salvi-grey)'}}>
            Mapa L
          </button>
          <button type="button" onClick={()=>setRenderMode('contours')} aria-pressed={renderMode==='contours'}
                  style={{padding:'4px 10px',fontSize:'.64rem',border:'none',borderLeft:'1px solid var(--salvi-line)',cursor:'pointer',
                          background:renderMode==='contours'?'var(--salvi-black)':'var(--salvi-surface)',
                          color:renderMode==='contours'?'#fff':'var(--salvi-grey)'}}>
            Isoluminancias
          </button>
        </div>
      </div>

      <div style={{width:'100%',overflowX:'auto'}}>
        <svg key={`plan-${planRenderKey}`} viewBox={`0 0 ${VBW} ${VBH}`} role="img"
             aria-label={`Planta del campo CIE 140 entre ${field.field_start.toFixed(1)} y ${field.field_end.toFixed(1)} metros`}
             style={{display:'block',width:'100%',minWidth:760,background:'#f8fafc',borderRadius:5}}>
          <title>Valores de luminancia en los puntos de cálculo CIE 140</title>
          <desc>Vista en planta con carriles, arcenes, luminarias y valores de luminancia del observador más desfavorable.</desc>

          {/* Franja longitudinal de zonas */}
          {(zoneList || []).map((z, i) => {
            const a=Math.max(viewStart,Number(z.s_start)||0), b=Math.min(viewEnd,Number(z.s_end)||0);
            if (b<=a) return null;
            const zt=String(z.zone_type||'').toLowerCase();
            const fill=ZCOLOR[zt]||'#94a3b8';
            return <g key={`zone-${i}`}>
              <rect x={xScale(a)} y={24} width={Math.max(1,xScale(b)-xScale(a))} height={22}
                    fill={fill} opacity=".88"/>
              {xScale(b)-xScale(a)>70&&(
                <text x={(xScale(a)+xScale(b))/2} y={39} textAnchor="middle"
                      fill="#fff" fontSize="11" fontWeight="700">
                  {ZLABEL[zt]||z.zone_name||zt}
                </text>
              )}
            </g>;
          })}

          {/* Suelo físico pared-a-pared: acera · arcén · calzada · arcén · acera. */}
          <rect x={ML} y={MT} width={roadW} height={roadH} fill="#454b52"/>
          {sidewalkLeft>0&&(
            <rect x={ML} y={yScale(0)} width={roadW} height={yScale(sidewalkLeft)-yScale(0)}
                  fill="#9ca3af"/>
          )}
          {sidewalkRight>0&&(
            <rect x={ML} y={yScale(carriagewayEnd)} width={roadW} height={yScale(W)-yScale(carriagewayEnd)}
                  fill="#9ca3af"/>
          )}
          {shoulderLeft>0&&(
            <rect x={ML} y={yScale(carriagewayStart)} width={roadW} height={yScale(laneStart)-yScale(carriagewayStart)}
                  fill="#737b83"/>
          )}
          {shoulderRight>0&&(
            <rect x={ML} y={yScale(laneEnd)} width={roadW} height={yScale(carriagewayEnd)-yScale(laneEnd)}
                  fill="#737b83"/>
          )}
          {Array.from({length:nLanes},(_,i)=>(
            <rect key={`lane-${i}`} x={ML} y={yScale(laneStart+i*laneW)}
                  width={roadW} height={yScale(laneStart+(i+1)*laneW)-yScale(laneStart+i*laneW)}
                  fill={i%2===0?'#4b535b':'#424950'} opacity=".75"/>
          ))}

          {/* Mapa de luminancia suavizado: sólo sobre los carriles CIE 140.
              Arcenes y aceras siguen siendo geometría física, no malla L/U. */}
          {renderMode==='heatmap' && <g shapeRendering="crispEdges" opacity=".94">
            {heatMapCells.map((cell,index)=>(
              <rect key={`heat-${planRenderKey}-${index}`} x={cell.x} y={cell.y}
                    width={cell.width} height={cell.height} fill={heatColor(cell.luminance)}/>
            ))}
          </g>}

          {/* Bordes y separaciones de carril */}
          <line x1={ML} x2={ML+roadW} y1={yScale(laneStart)} y2={yScale(laneStart)}
                stroke="#f8fafc" strokeWidth="2"/>
          <line x1={ML} x2={ML+roadW} y1={yScale(laneEnd)} y2={yScale(laneEnd)}
                stroke="#f8fafc" strokeWidth="2"/>
          {Array.from({length:Math.max(0,nLanes-1)},(_,i)=>{
            const y=yScale(laneStart+(i+1)*laneW);
            return <line key={`divide-${i}`} x1={ML} x2={ML+roadW} y1={y} y2={y}
                         stroke="#f8fafc" strokeWidth="1.5" strokeDasharray="14 10" opacity=".85"/>;
          })}

          {/* Etiquetas transversales */}
          {sidewalkLeft>0.25&&(
            <text x={ML+8} y={(yScale(0)+yScale(sidewalkLeft))/2+4} fill="#111827" fontSize="10">Acera izq.</text>
          )}
          {shoulderLeft>0.25&&(
            <text x={ML+8} y={(yScale(carriagewayStart)+yScale(laneStart))/2+4} fill="#e2e8f0" fontSize="10">Arcén izq.</text>
          )}
          {Array.from({length:nLanes},(_,i)=>(
            <text key={`lane-label-${i}`} x={ML+8}
                  y={(yScale(laneStart+i*laneW)+yScale(laneStart+(i+1)*laneW))/2+4}
                  fill="#cbd5e1" fontSize="10" opacity=".75">Carril {i+1}</text>
          ))}
          {shoulderRight>0.25&&(
            <text x={ML+8} y={(yScale(laneEnd)+yScale(carriagewayEnd))/2+4} fill="#e2e8f0" fontSize="10">Arcén der.</text>
          )}
          {sidewalkRight>0.25&&(
            <text x={ML+8} y={(yScale(carriagewayEnd)+yScale(W))/2+4} fill="#111827" fontSize="10">Acera der.</text>
          )}

          {/* Límites del campo seleccionado */}
          <rect x={xScale(field.field_start)} y={MT}
                width={Math.max(1,xScale(field.field_end)-xScale(field.field_start))}
                height={roadH} fill="none" stroke="#ef4444" strokeWidth="2"/>
          <text x={(xScale(field.field_start)+xScale(field.field_end))/2} y={MT-7}
                textAnchor="middle" fill="#b91c1c" fontSize="11" fontWeight="700">
            Campo de cálculo
          </text>

          {/* Curvas de nivel calculadas por marching squares */}
          {renderMode==='contours' && contourPaths.map((contour,i)=>(
            <path key={`iso-${planRenderKey}-${contour.level.toFixed(6)}-${i}`} d={contourSplinePath(contour.points)} fill="none"
                  stroke={lColor(contour.level)} strokeWidth="3"
                  strokeLinecap="round" strokeLinejoin="round" opacity=".95">
              <title>{`Isoluminancia ${contour.level.toFixed(1)} cd/m²`}</title>
            </path>
          ))}

          {/* Proyección de luminarias */}
          {luminairePoints.map((lm,i)=>{
            const x=xScale(lm.x), y=yScale(lm.y);
            const c=lm.active?(modelColors[lm.model]||'#eab308'):'#94a3b8';
            return <g key={`lum-${i}`}>
              <polygon points={`${x},${y-10} ${x+10},${y} ${x},${y+10} ${x-10},${y}`}
                       fill={c} stroke="#fff" strokeWidth="2" opacity={lm.active?1:.45}>
                <title>{`Luminaria Aphex ${lm.model} · ${lm.active?'ON':'OFF'} · x=${lm.x.toFixed(1)} m · y=${lm.y.toFixed(2)} m · ${lm.optic} · ${Math.round(lm.flux)} lm · ${Math.round(Number(lm.current_mA||0))} mA`}</title>
              </polygon>
              <text x={x} y={y+3} textAnchor="middle" fill="#fff" fontSize="8" fontWeight="700">{lm.model}</text>
            </g>;
          })}

          {/* Valores numéricos únicamente en isoluminancias; el modo Mapa L
              sustituye los discos por una interpolación cromática continua. */}
          {renderMode==='contours' && fieldPoints.map((p,i)=>{
            const x=xScale(Number(p.x)), y=yScale(Number(p.y)), value=Number(p.L);
            return (
              <text key={`lp-${i}`} x={x} y={y+3} textAnchor="middle"
                    fill="#fff" stroke="#27313a" strokeWidth="2.4" paintOrder="stroke"
                    fontSize="9" fontWeight="700">
                <title>{`x=${Number(p.x).toFixed(2)} m · y=${Number(p.y).toFixed(2)} m · L=${value.toFixed(3)} cd/m²`}</title>
                {fmtL(value)}
              </text>
            );
          })}

          {/* Eje X */}
          <line x1={ML} x2={ML+roadW} y1={MT+roadH+12} y2={MT+roadH+12} stroke="#64748b"/>
          {xTicks.map((x,i)=>(
            <g key={`xt-${i}`}>
              <line x1={xScale(x)} x2={xScale(x)} y1={MT+roadH+8} y2={MT+roadH+17} stroke="#64748b"/>
              <text x={xScale(x)} y={MT+roadH+32} textAnchor="middle" fill="#475569" fontSize="10">{x.toFixed(1)}</text>
            </g>
          ))}
          <text x={ML+roadW/2} y={VBH-5} textAnchor="middle" fill="#334155" fontSize="11">
            Distancia al origen del túnel, x (m)
          </text>

          {/* Eje Y */}
          <line x1={ML-12} x2={ML-12} y1={MT} y2={MT+roadH} stroke="#64748b"/>
          {yTicks.map((y,i)=>(
            <g key={`yt-${i}`}>
              <line x1={ML-17} x2={ML-8} y1={yScale(y)} y2={yScale(y)} stroke="#64748b"/>
              <text x={ML-22} y={yScale(y)+3} textAnchor="end" fill="#475569" fontSize="10">{y.toFixed(1)}</text>
            </g>
          ))}
          <text x={18} y={MT+roadH/2} textAnchor="middle" fill="#334155" fontSize="11"
                transform={`rotate(-90 18 ${MT+roadH/2})`}>Posición transversal, y (m)</text>
        </svg>
      </div>

      <div style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap',fontSize:'.62rem',
                   color:'var(--salvi-grey)',marginTop:6}}>
        <span><b style={{color:'#dc2626'}}>□</b> Campo CIE 140</span>
        <span><b style={{color:'#3b82f6'}}>◆</b> Proyección luminaria</span>
        {renderMode==='heatmap' ? <>
          <span style={{display:'inline-flex',alignItems:'center',gap:5}}>
            <i style={{display:'inline-block',width:42,height:8,borderRadius:4,
              background:'linear-gradient(90deg,#0ea5e9,#22d3ee,#22c55e,#a3e635,#facc15)'}}/>
            L baja → L alta
          </span>
          <span>Interpolación visual local sobre carriles CIE 140</span>
        </> : contourLevels.map((level,i)=>(
          <span key={`level-${i}`} style={{display:'inline-flex',alignItems:'center',gap:4}}>
            <i style={{display:'inline-block',width:16,height:3,background:lColor(level)}}/>
            {level.toFixed(1)}
          </span>
        ))}
        <span>Valores en cd/m² · mínimo {Lmin.toFixed(1)} · máximo {Lmax.toFixed(1)}</span>
      </div>

      {/* La pared comparte el mismo dominio longitudinal y marcas que la
          planta; se sitúa antes de la sección transversal. */}
      <WallLuminanceSideView
        field={field}
        profile={profile}
        fieldPositionM={fieldPositionM}
        viewStart={viewStart}
        viewEnd={viewEnd}
        xTicks={xTicks}
      />

      <PhotometricSectionInspector
        profile={profile}
        field={field}
        fieldPositionM={fieldPositionM}
        luminaireResult={luminaireResult}
        form={form}
        lumConfig={lumConfig}
      />

    </div>
  );
}

function estimateSD(v_kmh) {
  const v=v_kmh/3.6; return v*1.5+(v*v)/(2*3.5);
}

/* ══════════════════════════════════════════════════════════════════
   MapSelector — Leaflet map for tunnel geolocation + OSM import
   ══════════════════════════════════════════════════════════════════ */
/* ── TunnelFloatPanel — ventana flotante y arrastrable sobre el mapa ── */
function TunnelFloatPanel({ tunnelList, selTunnel, tunFilter, setTunFilter,
    tunTypeFilter, setTunTypeFilter, selectTunnel, removeTunnelFromList,
    importTunnel, setShowTunTable, tunColor, selectedSet, selectAllTunnels,
    clearTunnelSelection }) {
  const [pos, setPos] = useState({x:8, y:56});
  const selectedRowRef = useRef(null);
  const dragging = useRef(false);
  const offset   = useRef({dx:0,dy:0});
  const [sort, setSort] = useState({key:'name', dir:'asc'});

  React.useEffect(()=>{
    const onMove = (e)=>{
      if(!dragging.current) return;
      setPos({x: e.clientX - offset.current.dx, y: e.clientY - offset.current.dy});
    };
    const onUp = ()=>{ dragging.current=false; };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return ()=>{ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); };
  },[]);

  const startDrag = (e)=>{
    if(e.target.closest('button,input,select')) return;
    dragging.current = true;
    offset.current   = {dx: e.clientX - pos.x, dy: e.clientY - pos.y};
    e.preventDefault();
  };

  const thSt={padding:'4px 6px',fontWeight:600,color:'#92400e',fontSize:'.62rem',whiteSpace:'nowrap',borderBottom:'2px solid #fde68a',userSelect:'none'};
  const tdSt={padding:'3px 6px',verticalAlign:'middle',whiteSpace:'nowrap'};
  const aBtn=(bg,cl)=>({padding:'2px 5px',fontSize:'.68rem',cursor:'pointer',lineHeight:1.3,background:bg,border:'1px solid '+cl+'55',borderRadius:4,color:cl});

  const hwTypes=[...new Set(tunnelList.map(t=>t.highway).filter(Boolean))].sort();
  const sortTh = (label, key, style={}) => (
    <th style={{...thSt,...style,cursor:'pointer'}}
      onClick={()=>setSort(prev=>prev.key===key?{key,dir:prev.dir==='asc'?'desc':'asc'}:{key,dir:'asc'})}
      title={`Ordenar por ${label}`}>
      {label} {sort.key===key?(sort.dir==='asc'?'▲':'▼'):'↕'}
    </th>
  );
  const filterText=(tunFilter||'').trim().toLowerCase();
  const filtered=tunnelList.filter(t=>{
    const searchFields=[t.name,t.ref,t.highway,t.length,t.speedKmh,t.lanes,t.entryOctant,t.exitOctant,
      t.oneway?'one way':'bidireccional'].map(value=>String(value??'').toLowerCase());
    const mN=!filterText||searchFields.some(value=>value.includes(filterText));
    const mT=tunTypeFilter==='all'||t.highway===tunTypeFilter;
    return mN&&mT;
  });
  const numericSortKeys=new Set(['length','speedKmh','lanes']);
  const sorted=[...filtered].sort((a,b)=>{
    const av=a?.[sort.key], bv=b?.[sort.key];
    if(av==null&&bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    let cmp;
    if(numericSortKeys.has(sort.key)) cmp=(Number(av)||0)-(Number(bv)||0);
    else if(sort.key==='oneway') cmp=Number(!!av)-Number(!!bv);
    else cmp=String(av).localeCompare(String(bv),'es',{numeric:true,sensitivity:'base'});
    return sort.dir==='asc'?cmp:-cmp;
  });
  const totalKm = tunnelList.reduce((sum,t)=>sum+(Number(t.length)||0),0)/1000;
  const selectedKm = tunnelList.filter(t=>selectedSet?.has(t.id))
    .reduce((sum,t)=>sum+(Number(t.length)||0),0)/1000;
  const subtotalKm = selectedSet?.size ? selectedKm : totalKm;
  const subtotalLabel = selectedSet?.size ? 'seleccionados' : 'todos';
  const subtotalText = `${subtotalKm.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})} km ${subtotalLabel}`;
  React.useEffect(()=>{selectedRowRef.current?.scrollIntoView({block:'nearest'});},[selTunnel?.id]);

  return (
    <div style={{position:'absolute',left:pos.x,top:pos.y,width:580,zIndex:900,
        background:'#fff',border:'1.5px solid #d97706',borderRadius:8,
        boxShadow:'0 6px 28px rgba(0,0,0,.22)',display:'flex',flexDirection:'column',
        maxHeight:'62vh',minHeight:140,overflow:'hidden'}}>

      {/* Header / drag handle */}
      <div onMouseDown={startDrag}
        style={{display:'flex',alignItems:'center',gap:7,padding:'5px 10px',
          background:'#fffbeb',borderBottom:'1px solid #fde68a',flexShrink:0,
          cursor:'grab',userSelect:'none',borderRadius:'6px 6px 0 0'}}>
        <span style={{fontSize:'.75rem',color:'#92400e',marginRight:2}}>⠿</span>
        <span style={{fontWeight:700,fontSize:'.72rem',color:'#92400e'}}>🚇 Túneles</span>
        <span style={{fontSize:'.65rem',color:'#b45309',marginRight:'auto'}}>
          {filtered.length}/{tunnelList.length}{selTunnel?` · "${selTunnel.name}"`:''}
          {selectedSet?.size>0?` · ${selectedSet.size} seleccionados`:''}</span>
        <input placeholder="Filtrar…" value={tunFilter} onChange={e=>setTunFilter(e.target.value)}
          style={{fontSize:'.65rem',padding:'2px 6px',border:'1px solid #fcd34d',borderRadius:4,
            width:110,outline:'none',background:'#fff'}}/>
        {hwTypes.length>1&&(
          <select value={tunTypeFilter} onChange={e=>setTunTypeFilter(e.target.value)}
            style={{fontSize:'.65rem',padding:'2px 4px',border:'1px solid #fcd34d',borderRadius:4,background:'#fff',cursor:'pointer'}}>
            <option value="all">Todos</option>
            {hwTypes.map(h=><option key={h} value={h}>{h}</option>)}
          </select>
        )}
        <button type="button" onClick={selectAllTunnels} title="Seleccionar todos los túneles cargados"
          style={{fontSize:'.62rem',padding:'2px 5px',border:'1px solid #fcd34d',borderRadius:4,background:'#fff',color:'#92400e',cursor:'pointer'}}>Todos</button>
        <button type="button" onClick={clearTunnelSelection} title="Limpiar selección"
          style={{fontSize:'.62rem',padding:'2px 5px',border:'1px solid #fcd34d',borderRadius:4,background:'#fff',color:'#92400e',cursor:'pointer'}}>Limpiar</button>
        <button onClick={()=>setShowTunTable(false)}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:'1rem',color:'#92400e',padding:'0 3px',lineHeight:1}}>✕</button>
      </div>

      {/* Table */}
      <div style={{padding:'3px 10px',fontSize:'.61rem',color:'#92400e',background:'#fffdf2',borderBottom:'1px solid #fde68a'}}>Longitud: <strong>{subtotalText}</strong> · Clic en encabezados: ordenar · Filtro por datos del túnel · Ctrl/Cmd-clic o casillas: selección múltiple · El mapa atenúa el resto</div>
      <div style={{overflowY:'auto',flex:1}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.67rem'}}>
          <thead><tr style={{background:'#fef3c7',position:'sticky',top:0,zIndex:2}}>
            <th style={{...thSt,width:20}}/>
            {sortTh('Nombre','name',{textAlign:'left',minWidth:130})}
            {sortTh('Tipo','highway',{width:70,textAlign:'center'})}
            {sortTh('L km','length',{width:52,textAlign:'right'})}
            {sortTh('v','speedKmh',{width:40,textAlign:'center'})}
            {sortTh('Car.','lanes',{width:34,textAlign:'center'})}
            {sortTh('Boca E','entryOctant',{width:38,textAlign:'center'})}
            {sortTh('Boca S','exitOctant',{width:38,textAlign:'center'})}
            {sortTh('Sentido','oneway',{width:52,textAlign:'center'})}
            <th style={{...thSt,width:74,textAlign:'center'}}>Acc.</th>
          </tr></thead>
          <tbody>
            {sorted.map(tun=>{
              const isSel=selectedSet?.has(tun.id), origIdx=tunnelList.indexOf(tun);
              return (<React.Fragment key={tun.id}>
                <tr ref={selTunnel?.id===tun.id?selectedRowRef:null}
                  onClick={e=>selectTunnel(tun,origIdx,{additive:e.ctrlKey||e.metaKey})}
                  style={{background:isSel?'#fef9c3':origIdx%2===0?'#fff':'#fafaf9',
                    cursor:'pointer',borderBottom:'1px solid #f3f4f6',
                    boxShadow:isSel?'inset 0 0 0 2px #fbbf24':'none'}}>
                  <td style={{...tdSt,textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                    <input type="checkbox" checked={!!selectedSet?.has(tun.id)}
                      onChange={()=>selectTunnel(tun,origIdx,{additive:true})}
                      title="Añadir o quitar de la selección múltiple"
                      style={{accentColor:tunColor(origIdx),cursor:'pointer'}}/>
                  </td>
                  <td style={{...tdSt,fontWeight:isSel?700:400,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis'}}>
                    {tun.name||tun.id}
                    {tun.ref&&tun.ref!==tun.name&&<span style={{color:'#9ca3af',marginLeft:4}}>({tun.ref})</span>}
                  </td>
                  <td style={{...tdSt,textAlign:'center',color:'#6b7280'}}>{tun.highway||'—'}</td>
                  <td style={{...tdSt,textAlign:'right'}}>{tun.length?(tun.length/1000).toFixed(2):'—'}</td>
                  <td style={{...tdSt,textAlign:'center'}}>{tun.speedKmh||'—'}</td>
                  <td style={{...tdSt,textAlign:'center'}}>{tun.lanes||'—'}</td>
                  <td style={{...tdSt,textAlign:'center',color:'#059669',fontWeight:600}}>{tun.entryOctant}</td>
                  <td style={{...tdSt,textAlign:'center',color:'#dc2626',fontWeight:600}}>{tun.exitOctant}</td>
                  <td style={{...tdSt,textAlign:'center',fontSize:'.61rem',color:tun.oneway?'#0284c7':'#6b7280'}}>{tun.oneway?'↑':'⇅'}</td>
                  <td style={{...tdSt,textAlign:'center'}} onClick={e=>e.stopPropagation()}>
                    <div style={{display:'flex',gap:3,justifyContent:'center'}}>
                      <button onClick={()=>selectTunnel(tun,origIdx)} style={aBtn('#f0f9ff','#0284c7')}>🔍</button>
                      <button onClick={()=>{selectTunnel(tun,origIdx);setTimeout(()=>{importTunnel();setShowTunTable(false);},80);}} style={aBtn('#f0fdf4','#059669')}>⬆</button>
                      <button onClick={()=>removeTunnelFromList(tun.id)} style={aBtn('#fff1f2','#dc2626')}>✕</button>
                    </div>
                  </td>
                </tr>
                {selTunnel?.id===tun.id&&(
                  <tr style={{background:'#fffbeb'}}>
                    <td colSpan={10} style={{padding:'5px 12px',borderBottom:'2px solid #fde68a'}}>
                      <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:'.71rem',fontWeight:700,color:'#92400e',marginBottom:3}}>🚇 {tun.name}</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:'2px 10px',fontSize:'.66rem'}}>
                            <span><b>L</b>={tun.length?tun.length.toLocaleString()+' m':'—'}</span>
                            <span><b>v</b>={tun.speedKmh?tun.speedKmh+' km/h':'—'}</span>
                            <span><b>E</b>={tun.entryOctant} <b>S</b>={tun.exitOctant}</span>
                            <span>{tun.oneway?'↑ Único sentido':'⇅ Bidireccional'}</span>
                            {tun.inclinePct!==null&&<span><b>Pend.</b>={tun.inclinePct}%</span>}
                            {tun.surface&&<span><b>Pav.</b>={tun.surface}</span>}
                          </div>
                        </div>
                        <button onClick={()=>{importTunnel();setShowTunTable(false);}}
                          style={{padding:'5px 14px',fontSize:'.7rem',fontWeight:700,cursor:'pointer',
                            background:'var(--salvi-black)',color:'#fff',border:'none',borderRadius:5,flexShrink:0}}>
                          ⬆ Importar
                        </button>
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>);
            })}
            {filtered.length===0&&(
              <tr><td colSpan={10} style={{textAlign:'center',padding:'14px',color:'var(--salvi-grey)',fontStyle:'italic'}}>Sin resultados</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MapSelector({ lat, lng, onUpdate, onImport, lumData, luminaireConfig,
    portalOrientation, tunnelLength, tunnelWidth, tunnelGeometry }) {
  // ── Refs ──────────────────────────────────────────
  const divRef         = useRef(null);
  const div3dRef       = useRef(null);
  const mapRef         = useRef(null);
  const map3dRef       = useRef(null);
  const markerRef      = useRef(null);
  const tileRef        = useRef(null);
  const tunnelGrpRef   = useRef(null);
  const lumGrpRef      = useRef(null);
  const toolGrpRef     = useRef(null);
  const plinesRef      = useRef({});
  const tunnelFeatureRefs = useRef({});
  const importedRouteRef = useRef(null);
  const lumZoomKeyRef = useRef(null);
  const routeGeometryRef = useRef([]);
  const measurePtsRef  = useRef([]);
  const tunnelListRef  = useRef([]);
  const toolActiveRef  = useRef('none');

  // ── State ─────────────────────────────────────────
  const [mapMode,       setMapMode]       = useState('streets');
  const [activeTool,    setActiveTool]    = useState('none');
  const [measureDist,   setMeasureDist]   = useState(null);
  const [showLum,       setShowLum]       = useState(true);
  const [loadingTun,    setLoadingTun]    = useState(false);
  const [tunnelList,    setTunnelList]    = useState([]);
  const [selectedSet,   setSelectedSet]   = useState(new Set());
  const selectedSetRef = useRef(new Set());
  const [selTunnel,     setSelTunnel]     = useState(null);
  const [searchVal,     setSearchVal]     = useState('');
  const [searching,     setSearching]     = useState(false);
  const [searchResults, setSearchResults] = useState([]);
  const [showResults,   setShowResults]   = useState(false);
  const [tunError,      setTunError]      = useState(null);
  const [showTunTable,  setShowTunTable]  = useState(false);
  const [tunFilter,     setTunFilter]     = useState('');
  const [tunTypeFilter, setTunTypeFilter] = useState('all');

  const initLat = parseFloat(lat) || 40.4165;
  const initLng = parseFloat(lng) || -3.7038;
  const TILE_URLS = {
    streets:   'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  };
  const PALETTE = ['#d97706','#0284c7','#059669','#7c3aed','#db2777','#ea580c'];
  const tunColor = (i) => PALETTE[i % PALETTE.length];

  // ── Mirrors ───────────────────────────────────────
  React.useEffect(() => { toolActiveRef.current = activeTool;  }, [activeTool]);
  React.useEffect(() => { tunnelListRef.current = tunnelList;  }, [tunnelList]);
  React.useEffect(() => { selectedSetRef.current = selectedSet; }, [selectedSet]);
  React.useEffect(() => {
    routeGeometryRef.current = _asArr(tunnelGeometry);
  }, [tunnelGeometry]);

  // ── Point-in-polygon ──────────────────────────────
  const pointInPolygon = (point, polygon) => {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const xi = polygon[i].lng, yi = polygon[i].lat;
      const xj = polygon[j].lng, yj = polygon[j].lat;
      if (((yi > point.lat) !== (yj > point.lat)) &&
          (point.lng < (xj - xi) * (point.lat - yi) / (yj - yi) + xi))
        inside = !inside;
    }
    return inside;
  };

  // ── Measure helpers ───────────────────────────────
  const haversineDist = (a, b) => {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  };

  const normalizedRoute = () => _asArr(tunnelGeometry)
    .map(point => ({
      lat:Number(point?.lat),
      lng:Number(point?.lng ?? point?.lon),
    }))
    .filter(point => Number.isFinite(point.lat) && Number.isFinite(point.lng));

  const routePointAtDistance = (
    distanceM, fallbackLat, fallbackLng, fallbackBearing,
  ) => {
    const route=normalizedRoute();
    if(route.length<2){
      const [pointLat,pointLng]=moveAlongBearing(
        fallbackLat,fallbackLng,distanceM,fallbackBearing,
      );
      return {lat:pointLat,lng:pointLng,bearing:fallbackBearing,onRoute:false};
    }
    let remaining=Math.max(0,Number(distanceM)||0);
    for(let index=1;index<route.length;index++){
      const start=route[index-1],end=route[index];
      const segmentLength=haversineDist(start,end);
      const segmentBearing=_bearing(
        {lat:start.lat,lon:start.lng},{lat:end.lat,lon:end.lng},
      );
      if(remaining<=segmentLength+1e-6){
        const [pointLat,pointLng]=moveAlongBearing(
          start.lat,start.lng,remaining,segmentBearing,
        );
        return {
          lat:pointLat,lng:pointLng,bearing:segmentBearing,onRoute:true,
        };
      }
      remaining-=segmentLength;
    }
    // Mantiene las distancias si OSM y el cálculo difieren por redondeo:
    // prolonga la tangente final en vez de comprimir las posiciones.
    const previous=route[route.length-2],last=route[route.length-1];
    const finalBearing=_bearing(
      {lat:previous.lat,lon:previous.lng},{lat:last.lat,lon:last.lng},
    );
    const [pointLat,pointLng]=moveAlongBearing(
      last.lat,last.lng,remaining,finalBearing,
    );
    return {lat:pointLat,lng:pointLng,bearing:finalBearing,onRoute:false};
  };

  const _drawMeasureOnMapLibre = () => {
    const m = map3dRef.current;
    if (!m) return;
    const pts = measurePtsRef.current;
    const coords = pts.map(p => [p.lng, p.lat]);
    const src = m.getSource('_measure');
    const data = { type:'FeatureCollection', features: [
      ...(coords.length>=2 ? [{type:'Feature',geometry:{type:'LineString',coordinates:coords}}] : []),
      ...coords.map(c=>({type:'Feature',geometry:{type:'Point',coordinates:c}})),
    ]};
    if (src) { src.setData(data); return; }
    m.addSource('_measure', {type:'geojson', data});
    m.addLayer({id:'_measure-line',type:'line',source:'_measure',filter:['==','$type','LineString'],
      paint:{'line-color':'#f59e0b','line-width':2,'line-dasharray':[4,3]}});
    m.addLayer({id:'_measure-dot',type:'circle',source:'_measure',filter:['==','$type','Point'],
      paint:{'circle-radius':5,'circle-color':'#f59e0b','circle-stroke-width':2,'circle-stroke-color':'#fff'}});
  };

  const _clearMeasureOnMapLibre = () => {
    const m = map3dRef.current;
    if (!m) return;
    try { if(m.getLayer('_measure-line')) m.removeLayer('_measure-line'); } catch(_){}
    try { if(m.getLayer('_measure-dot'))  m.removeLayer('_measure-dot');  } catch(_){}
    try { if(m.getSource('_measure'))     m.removeSource('_measure');      } catch(_){}
  };

  const _drawLumOnMapLibre = (
    entryLat, entryLng, bearing, widthM, arr, lumZones, wallOffsetM,
  ) => {
    const m = map3dRef.current;
    if (!m) return;
    const MODEL_CLR = {S:'#22c55e', M:'#3b82f6', L:'#a855f7'};
    const familyOf = (m) => !m ? 'M' : (/_S_|^S$/.test(m) ? 'S' : /_M_|^M$/.test(m) ? 'M' : /_L_|^L$/.test(m) ? 'L' : 'M');
    const features = [];
    const perpPositions = (
      axLat, axLng, localBearing, positionIndex,
    ) => {
      const selectedYs = physicalLuminaireYPositions(
        arr, widthM, wallOffsetM, positionIndex,
      );
      return selectedYs.map(yPos => moveAlongBearing(
        axLat, axLng, yPos - widthM / 2, (localBearing + 90) % 360,
      ));
    };
    const lastPosBySide = {};   // distancia a la luminaria precedente, por "lado"
    lumZones.forEach(zone => {
      const zLen = parseFloat(zone.zone_length)||0, n = luminairePositionCount(zone);
      const d_used = parseFloat(zone.d_used)||(n>0?zLen/n:0);
      const zStart = parseFloat(zone.s_start)||0;
      const setpointsRaw = _asArr(zone.setpoints);
      const hasSetpoints = setpointsRaw.length===n && n>0;
      // Mismo motivo que en la lista de luminarias: las zonas "_b" generan
      // sus setpoints en orden de x descendente -- ordenar por posicion real
      // antes de calcular distPrev/idx, o saldrian invertidos.
      const setpoints = hasSetpoints ? [...setpointsRaw].sort((a,b)=>parseFloat(a.s)-parseFloat(b.s)) : setpointsRaw;
      for (let i=0; i<n; i++) {
        const sp = setpoints[i];
        // Las zonas de control pueden solaparse longitudinalmente (BASE,
        // adaptación y refuerzo). `s` ya es la coordenada absoluta desde el
        // portal: concatenar zone_length desplaza cada capa como si fuese un
        // cálculo nuevo y dibuja instalaciones fantasma fuera de su posición.
        const sAbsolute = parseFloat(sp?.s);
        const d = hasSetpoints && Number.isFinite(sAbsolute)
          ? sAbsolute
          : zStart + d_used*(i+0.5);
        const axisPoint=routePointAtDistance(
          d,entryLat,entryLng,bearing,
        );
        const axLat=axisPoint.lat,axLng=axisPoint.lng;
        const model = sp?.model || zone.model || 'M';
        const pw    = sp?.power_w || zone.power_w || 0;
        const mA    = sp?.current_mA || zone.current_mA || '?';
        const Lreq  = sp?.L_req ?? zone.L_required ?? 0;
        const tilt  = zone.tilt_deg ?? 0;
        const clr   = MODEL_CLR[familyOf(model)]||'#94a3b8';
        perpPositions(
          axLat,axLng,axisPoint.bearing,sp?.idx||i+1,
        ).forEach(([pLat, pLng], sideIdx) => {
          const posObj = {lat:pLat, lng:pLng};
          const prev = lastPosBySide[sideIdx];
          const distPrev = prev ? haversineDist(prev, posObj) : null;
          lastPosBySide[sideIdx] = posObj;
          features.push({type:'Feature', geometry:{type:'Point',coordinates:[pLng,pLat]},
            properties:{model, color:clr, pw, mA, Lreq, tilt, distPrev:distPrev??-1,
                        zone_name:zone.zone_name, idx:i+1, n, tandem:sp?.tandem||''}});
        });
      }
    });
    const geojson = {type:'FeatureCollection', features};
    const src = m.getSource('_lum');
    if (src) { src.setData(geojson); return; }
    m.addSource('_lum', {type:'geojson', data:geojson});
    m.addLayer({id:'_lum-outer',type:'circle',source:'_lum',paint:{
      'circle-radius':7, 'circle-color':'#ffffff','circle-stroke-width':0}});
    m.addLayer({id:'_lum-dot',type:'circle',source:'_lum',paint:{
      'circle-radius':7, 'circle-color':['get','color'],
      'circle-stroke-width':1.5,'circle-stroke-color':'#fff','circle-opacity':0.92}});
    m.addLayer({id:'_lum-label',type:'symbol',source:'_lum',layout:{
      'text-field':['get','model'], 'text-size':9, 'text-allow-overlap':true,
      'text-ignore-placement':true}, paint:{'text-color':'#fff'}});
    m.on('click', '_lum-dot', (e) => {
      // Con la herramienta de medir activa, un click sobre una luminaria debe
      // registrar el punto de medición, no abrir su popup.
      if (toolActiveRef.current === 'measure') {
        addMeasurePoint({lat: e.lngLat.lat, lng: e.lngLat.lng});
        return;
      }
      const p = e.features?.[0]?.properties; if (!p) return;
      const tandemTag = p.tandem ? ` · Par ${p.tandem}` : '';
      const distTxt = Number(p.distPrev)>=0 ? `${Number(p.distPrev).toFixed(1)} m` : '—';
      const html = [
        `<b>${p.zone_name}</b> — Luminaria ${p.idx}/<b>${p.n}</b>${tandemTag}`,
        `<b>Aphex ${p.model}</b>  ·  <b>${Number(p.pw).toFixed(0)} W</b>  ·  ${p.mA} mA`,
        `d← anterior: <b>${distTxt}</b>  ·  Tilt: ${p.tilt}°`,
        `L<sub>req</sub> = ${Number(p.Lreq).toFixed(1)} cd/m²`,
      ].join('<br>');
      new window.maplibregl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(m);
    });
    m.on('mouseenter', '_lum-dot', () => { m.getCanvas().style.cursor = 'pointer'; });
    m.on('mouseleave', '_lum-dot', () => { m.getCanvas().style.cursor = ''; });
  };

  const _clearLumOnMapLibre = () => {
    const m = map3dRef.current;
    if (!m) return;
    try { if(m.getLayer('_lum-label')) m.removeLayer('_lum-label'); } catch(_){}
    try { if(m.getLayer('_lum-outer')) m.removeLayer('_lum-outer'); } catch(_){}
    try { if(m.getLayer('_lum-dot'))   m.removeLayer('_lum-dot');   } catch(_){}
    try { if(m.getSource('_lum'))      m.removeSource('_lum');       } catch(_){}
  };

  const addMeasurePoint = (latlng) => {
    measurePtsRef.current.push(latlng);
    const pts = measurePtsRef.current;
    // Leaflet overlay
    if (toolGrpRef.current && window.L) {
      const L = window.L;
      toolGrpRef.current.clearLayers();
      pts.forEach(p => L.circleMarker(p, {radius:4,color:'#f59e0b',fillColor:'#f59e0b',fillOpacity:1,weight:2}).addTo(toolGrpRef.current));
      if (pts.length >= 2)
        L.polyline(pts, {color:'#f59e0b',weight:2,dashArray:'6 4'}).addTo(toolGrpRef.current);
    }
    // MapLibre overlay
    if (map3dRef.current) _drawMeasureOnMapLibre();
    // Distance
    if (pts.length >= 2) {
      let dist = 0;
      for (let i = 1; i < pts.length; i++) dist += haversineDist(pts[i-1], pts[i]);
      setMeasureDist(dist < 1000 ? `${Math.round(dist)} m` : `${(dist/1000).toFixed(3)} km`);
    }
  };
  const clearMeasure = () => {
    measurePtsRef.current = [];
    if (toolGrpRef.current) toolGrpRef.current.clearLayers();
    _clearMeasureOnMapLibre();
    setMeasureDist(null);
  };

  // ── Init Leaflet ──────────────────────────────────
  React.useEffect(() => {
    if (!divRef.current || !window.L || mapRef.current) return;
    const L = window.L;
    const map = L.map(divRef.current, {zoomControl:true}).setView([initLat, initLng], 14);
    tileRef.current      = L.tileLayer(TILE_URLS.streets, {attribution:'© OSM', maxZoom:19}).addTo(map);
    tunnelGrpRef.current = L.layerGroup().addTo(map);
    lumGrpRef.current    = L.layerGroup().addTo(map);
    toolGrpRef.current   = L.layerGroup().addTo(map);
    const marker = L.marker([initLat, initLng], {
      draggable:routeGeometryRef.current.length<2,
    })
      .addTo(map).bindPopup('<b>Portal del túnel</b>').openPopup();
    marker.on('dragend', e => {
      const p = e.target.getLatLng();
      onUpdate('lat', parseFloat(p.lat.toFixed(5)));
      onUpdate('lng', parseFloat(p.lng.toFixed(5)));
    });
    map.on('click', e => {
      const tool = toolActiveRef.current;
      if      (tool === 'measure') addMeasurePoint(e.latlng);
      else if (
        tool === 'none' && routeGeometryRef.current.length<2
      ) {
        marker.setLatLng(e.latlng);
        onUpdate('lat', parseFloat(e.latlng.lat.toFixed(5)));
        onUpdate('lng', parseFloat(e.latlng.lng.toFixed(5)));
      }
    });
    mapRef.current = map; markerRef.current = marker;
    const raf = requestAnimationFrame(() => requestAnimationFrame(() => { try{map.invalidateSize();}catch(_){} }));
    return () => { cancelAnimationFrame(raf); try{map.remove();}catch(_){} mapRef.current=null; };
  }, []);

  // ── Switch tile layer ─────────────────────────────
  React.useEffect(() => {
    if (!mapRef.current || !window.L || !tileRef.current || mapMode === 'terrain3d') return;
    mapRef.current.removeLayer(tileRef.current);
    const url = TILE_URLS[mapMode] || TILE_URLS.streets;
    tileRef.current = window.L.tileLayer(url, {attribution:'© OSM/Esri', maxZoom:19}).addTo(mapRef.current);
    tileRef.current.bringToBack();
    requestAnimationFrame(() => requestAnimationFrame(() => { try{mapRef.current?.invalidateSize();}catch(_){} }));
  }, [mapMode]);

  // ── MapLibre 3D terrain ───────────────────────────
  React.useEffect(() => {
    if (mapMode !== 'terrain3d') {
      if (map3dRef.current) { try{map3dRef.current.remove();}catch(_){} map3dRef.current=null; }
      return;
    }
    if (!div3dRef.current || !window.maplibregl || map3dRef.current) return;
    const center = mapRef.current ? [mapRef.current.getCenter().lng, mapRef.current.getCenter().lat] : [initLng, initLat];
    const zoom   = mapRef.current ? Math.max(8, mapRef.current.getZoom()-1) : 12;
    const ml = window.maplibregl;
    const m = new ml.Map({
      container: div3dRef.current,
      style: { version:8, sources:{
        sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'© Esri'},
        dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',attribution:'© Mapzen/OSM'}
      }, layers:[{id:'sat',type:'raster',source:'sat'}] },
      center, zoom, pitch:60, bearing:0, antialias:true,
    });
    m.on('load', () => {
      m.setTerrain({source:'dem',exaggeration:1.5});
      m.addLayer({id:'sky',type:'sky',paint:{'sky-type':'atmosphere','sky-atmosphere-sun':[0,90],'sky-atmosphere-sun-intensity':15}});
      const el = document.createElement('div');
      el.style.cssText = 'width:14px;height:14px;border-radius:50%;background:#f59e0b;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none';
      new ml.Marker({element:el,anchor:'center'}).setLngLat([parseFloat(lng)||initLng,parseFloat(lat)||initLat]).addTo(m);
    });
    m.dragRotate.enable(); m.touchZoomRotate.enableRotation();
    m.addControl(new ml.NavigationControl({visualizePitch:true}), 'top-left');
    // Click handler para herramienta de medición en 3D

  // ── Lasso tool ────────────────────────────────────
  React.useEffect(() => {

  // El eje OSM importado es la referencia geométrica estable. Se mantiene
