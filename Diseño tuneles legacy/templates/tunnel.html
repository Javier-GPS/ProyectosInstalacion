<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SALVI Tunnel Engine — CIE 88:2004</title>
  <link rel="icon" href="data:,"/>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="/static/js/ste-data.js"></script>

  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MapLibre GL (3D terrain) -->
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Salvi Studio Design Tokens ─── */
    :root {
      --salvi-black:   #1E1E1E;
      --salvi-grey:    #6A6A6A;
      --salvi-cream:   #FCF9F5;
      --salvi-surface: #F7F4EF;
      --salvi-line:    #E8E2D8;
      --salvi-line-strong: #C8C2B8;
      --success: #1F7A4D;
      --warning: #B7791F;
      --danger:  #B42318;

      /* Legacy aliases — keeps all existing components styled correctly */
      --brand:    #1E1E1E;
      --brand-dk: #000000;
      --brand-lt: #F7F4EF;
      --gray-50:  #FCF9F5;
      --gray-100: #F7F4EF;
      --gray-200: #E8E2D8;
      --gray-300: #C8C2B8;
      --gray-400: #A8A29E;
      --gray-500: #8A8480;
      --gray-600: #6A6A6A;
      --gray-700: #4A4A4A;
      --gray-800: #1E1E1E;
      --radius: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,.07);
      --font: 'Helvetica Neue', 'Inter', system-ui, sans-serif;
    }

    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); background: var(--salvi-cream); color: var(--salvi-black); font-size: 14px; }

    /* ─── Thin black slider (Luminarias config panel) ─── */
    input.lum-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 14px; background: transparent; cursor: pointer;
    }
    input.lum-slider::-webkit-slider-runnable-track {
      height: 2px; background: var(--salvi-line-strong); border-radius: 1px;
    }
    input.lum-slider::-webkit-slider-thumb {
      -webkit-appearance: none; margin-top: -5px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--salvi-black); border: none;
    }
    input.lum-slider::-moz-range-track {
      height: 2px; background: var(--salvi-line-strong); border-radius: 1px;
    }
    input.lum-slider::-moz-range-progress {
      height: 2px; background: var(--salvi-black); border-radius: 1px;
    }
    input.lum-slider::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--salvi-black); border: none;
    }

    /* ─── App Shell — 3-column layout ─── */
    .app-shell {
      display: grid;
      grid-template-rows: 48px 1fr;
      grid-template-columns: 300px 5px 1fr 272px;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── TopBar ─── */
    .topbar {
      grid-column: 1 / -1;
      background: var(--salvi-cream);
      color: var(--salvi-black);
      border-bottom: 1px solid var(--salvi-line);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      flex-shrink: 0;
    }
    .tb-brand {
      font-size: .80rem;
      font-weight: 600;
      letter-spacing: .8px;
      color: var(--salvi-black);
    }
    .tb-badge {
      font-size: .68rem;
      background: var(--salvi-surface);
      border: 1px solid var(--salvi-line);
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--salvi-grey);
    }
    .tb-sep { width: 1px; height: 20px; background: var(--salvi-line); flex-shrink: 0; }
    .tb-spacer { flex: 1; }
    .tb-proj {
      font-size: .78rem;
      color: var(--salvi-grey);
      max-width: 200px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .tb-btn {
      font-size: .72rem;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--salvi-line);
      background: #fff;
      color: var(--salvi-grey);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex; align-items: center;
      transition: background .12s, border-color .12s;
    }
    .tb-btn:hover { background: var(--salvi-surface); border-color: var(--salvi-line-strong); color: var(--salvi-black); }
    .tb-btn.primary { background: var(--salvi-black); color: #fff; border-color: var(--salvi-black); font-weight: 600; }
    .tb-btn.primary:hover { opacity: .85; }

    .lang-switcher { display: flex; align-items: center; gap: 3px; }
    .lang-btn {
      padding: 2px 7px; border: 1px solid var(--salvi-line);
      border-radius: 4px; background: #fff; color: var(--salvi-grey);
      font-size: .70rem; font-weight: 600; cursor: pointer;
    }
    .lang-btn:hover, .lang-btn.active {
      background: var(--salvi-surface); color: var(--salvi-black); border-color: var(--salvi-line-strong);
    }

    /* ─── Left Panel ─── */
    .left-panel {
      grid-row: 2;
      grid-column: 1;
      background: var(--salvi-cream);
      border-right: 1px solid var(--salvi-line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tube selector tabs */
    .tube-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--salvi-line);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .tube-tab {
      font-size: .72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 5px;
      border: 1px solid var(--salvi-line);
      background: var(--salvi-surface);
      color: var(--salvi-grey);
      cursor: pointer;
      transition: all .12s;
    }
    .tube-tab.active { background: var(--salvi-black); color: #fff; border-color: var(--salvi-black); }
    .tube-tab.add { border-style: dashed; font-weight: 400; }
    .tube-tab.remove { color: var(--danger); border-color: #fcc; background: #fff5f5; }
    .tube-tab:hover:not(.active) { border-color: var(--salvi-line-strong); color: var(--salvi-black); }

    /* Collapsible sections */
    .lp-sections { flex: 1; overflow-y: auto; }
    .lp-section { border-bottom: 1px solid var(--salvi-line); }
    .lp-sec-hdr {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      color: var(--salvi-black);
      text-align: left;
      transition: background .1s;
    }
    .lp-sec-hdr:hover { background: var(--salvi-surface); }
    .lp-sec-hdr .sec-icon { margin-right: 6px; }
    .lp-sec-hdr .sec-arrow { font-size: .65rem; color: var(--salvi-grey); }
    .lp-sec-hdr .sec-status {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--salvi-line-strong); margin-right: 4px; flex-shrink: 0;
    }
    .lp-sec-hdr .sec-status.ok { background: var(--success); }

    /* Override card styling inside left panel */
    .lp-sec-body { padding: 0 12px 10px; }
    .lp-sec-body .card {
      background: transparent;
      box-shadow: none;
      padding: 8px 0;
      margin-bottom: 0;
      border-radius: 0;
    }
    .lp-sec-body .card-title { display: none; }
    .lp-sec-body .form-grid {
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .lp-sec-body .form-grid.col-3 { grid-template-columns: 1fr 1fr; }
    .lp-sec-body .field label {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .lp-sec-body .field input,
    .lp-sec-body .field select {
      padding: 5px 7px;
      font-size: .80rem;
      border: 1px solid var(--salvi-line);
      border-radius: 4px;
      background: #fff;
    }
    .lp-sec-body .field input:focus,
    .lp-sec-body .field select:focus {
      outline: none;
      border-color: var(--salvi-black);
      box-shadow: 0 0 0 2px rgba(30,30,30,.08);
    }
    .lp-sec-body .toggle-row { gap: 8px; }
    .lp-sec-body .toggle-label { font-size: .76rem; }
    .lp-sec-body .toggle input:checked + .toggle-slider { background: var(--salvi-black); }

    /* Calc button area */
    .lp-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--salvi-line);
      flex-shrink: 0;
      background: var(--salvi-cream);
    }
    .calc-btn {
      width: 100%;
      background: #fff;
      color: var(--salvi-black);
      border: 1.5px solid var(--salvi-line);
      border-radius: 6px;
      padding: 9px;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .calc-btn:hover:not(:disabled) { background: var(--salvi-surface); border-color: var(--salvi-black); }
    .calc-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ─── Main Canvas ─── */
    .main-canvas {
      grid-row: 2;
      grid-column: 3;
      background: var(--salvi-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .mc-tabbar {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid var(--salvi-line);
      background: var(--salvi-cream);
      flex-shrink: 0;
      padding: 0 4px;
    }
    .mc-tab {
      font-size: .76rem;
      font-weight: 500;
      padding: 10px 14px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--salvi-grey);
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }
    .mc-tab:hover { color: var(--salvi-black); }
    .mc-tab.active {
      color: var(--salvi-black);
      border-bottom-color: var(--salvi-black);
      font-weight: 600;
    }

    /* ── Left panel resize handle ── */
    .lp-resizer {
      grid-row: 2;
      grid-column: 2;
      width: 5px;
      cursor: col-resize;
      background: var(--salvi-line);
      transition: background .15s;
      z-index: 20;
      user-select: none;
    }
    .lp-resizer:hover, .lp-resizer.dragging { background: var(--salvi-grey); }

    .mc-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    /* Map fullscreen mode — no padding, flex fill */
    .mc-content.mc-map-mode {
      overflow: hidden;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .mc-content.mc-map-mode .profile-tab {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      gap: 0; padding: 0;
    }
    .map-env-fill {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }
    /* The inline-styled wrapper div inside MapSelector also stretches */
    .map-env-fill > div {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }
    .map-env-fill .map-container {
      flex: 1; min-height: 0;
      height: auto !important;
      border: none; border-radius: 0; margin: 0;
    }
    /* Leaflet container must fill its parent */
    .map-env-fill .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      min-height: 0;
    }
    .map-env-fill .map-coords {
      flex-shrink: 0;
      margin: 0; border-radius: 0;
      border-top: 1px solid var(--salvi-line);
      padding: 6px 14px;
    }

    /* Profile tab */
    .profile-tab { display: flex; flex-direction: column; gap: 12px; }
    .chart-card {
      background: #fff;
      border: 1px solid var(--salvi-line);
      border-radius: var(--radius);
      padding: 16px;
    }
    .chart-card-title {
      font-size: .78rem;
      font-weight: 600;
      color: var(--salvi-grey);
      text-transform: uppercase;
      letter-spacing: .3px;
      margin-bottom: 12px;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 300px;
      gap: 10px;
      color: var(--salvi-grey);
      text-align: center;
    }
    .empty-icon { font-size: 2.5rem; opacity: .4; }
    .empty-state p { font-size: .85rem; }
    .empty-state strong { color: var(--salvi-black); }

    /* ─── Right Panel ─── */
    .right-panel {
      grid-row: 2;
      grid-column: 4;
      background: var(--salvi-cream);
      border-left: 1px solid var(--salvi-line);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .rp-header {
      padding: 10px 14px 6px;
      font-size: .70rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--salvi-grey);
      border-bottom: 1px solid var(--salvi-line);
      flex-shrink: 0;
    }

    .status-list {
      padding: 8px 14px 10px;
      border-bottom: 1px solid var(--salvi-line);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .75rem;
      color: var(--salvi-grey);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--salvi-line-strong);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--success); }
    .status-dot.warn { background: var(--warning); }

    .compliance-badge {
      margin: 8px 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: .75rem;
      font-weight: 600;
      border: 1px solid;
    }
    .compliance-badge.ok {
      background: #f0fdf6;
      border-color: var(--success);
      color: var(--success);
    }
    .compliance-badge.warn {
      background: #fffbeb;
      border-color: var(--warning);
      color: var(--warning);
    }

    .rp-kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 8px 12px 10px;
      border-bottom: 1px solid var(--salvi-line);
    }
    .rp-kpi {
      background: var(--salvi-surface);
      border: 1px solid var(--salvi-line);
      border-radius: 6px;
      padding: 7px 9px;
    }
    .rp-kpi-label { font-size: .68rem; color: var(--salvi-grey); margin-bottom: 2px; }
    .rp-kpi-val { font-size: 1.1rem; font-weight: 700; color: var(--salvi-black); line-height: 1.1; }
    .rp-kpi-unit { font-size: .65rem; color: var(--salvi-grey); }

    .rp-actions {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid var(--salvi-line);
    }
    .rp-btn {
      padding: 7px 10px;
      border-radius: 5px;
      font-size: .76rem;
      font-weight: 500;
      border: 1px solid var(--salvi-line);
      background: #fff;
      color: var(--salvi-black);
      cursor: pointer;
      transition: background .12s;
      text-align: left;
    }
    .rp-btn:hover:not(:disabled) { background: var(--salvi-surface); }
    .rp-btn:disabled { opacity: .5; cursor: not-allowed; }
    .rp-btn.primary {
      background: var(--salvi-black);
      color: #fff;
      border-color: var(--salvi-black);
    }
    .rp-btn.primary:hover:not(:disabled) { opacity: .85; }
    .rp-report-status { padding: 6px 12px; font-size: .72rem; }

    /* ─── Shared component overrides ─── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--salvi-line);
    }
    .card-title {
      font-size: .80rem;
      font-weight: 600;
      color: var(--salvi-black);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--salvi-line);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 12px; }
    .form-grid.col-3 { grid-template-columns: repeat(3, 1fr); }
    .form-grid.col-2 { grid-template-columns: repeat(2, 1fr); }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label {
      font-size: .72rem;
      font-weight: 600;
      color: var(--salvi-grey);
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .field input, .field select {
      padding: 6px 9px;
      border: 1px solid var(--salvi-line);
      border-radius: 4px;
      font-size: .85rem;
      color: var(--salvi-black);
      background: #fff;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--salvi-black);
      box-shadow: 0 0 0 2px rgba(30,30,30,.08);
    }
    .field .hint { font-size: .68rem; color: var(--salvi-grey); }

    .toggle { position: relative; width: 38px; height: 20px; display: inline-block; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--salvi-line-strong); border-radius: 20px;
      cursor: pointer; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 14px; height: 14px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: transform .2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--salvi-black); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .toggle-label { font-size: .80rem; color: var(--salvi-black); }

    .btn {
      padding: 8px 18px; border-radius: 5px; border: none;
      font-size: .84rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--salvi-black); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-outline { background: transparent; color: var(--salvi-black); border: 1.5px solid var(--salvi-line-strong); }
    .btn-lg { padding: 10px 24px; font-size: .92rem; }
    .btn-row { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }

    .btn-xs {
      font-size: .72rem; padding: 3px 9px; border-radius: 4px;
      border: 1px solid var(--salvi-line); background: #fff;
      color: var(--salvi-grey); cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
    }
    .btn-xs:hover { border-color: var(--salvi-line-strong); color: var(--salvi-black); }
    .btn-xs.btn-xs-primary { background: var(--salvi-black); color: #fff; border-color: var(--salvi-black); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; margin-bottom: 14px; }
    .kpi-card { background: var(--salvi-surface); border: 1px solid var(--salvi-line); border-radius: var(--radius); padding: 11px 13px; text-align: center; }
    .kpi-label { font-size: .68rem; color: var(--salvi-grey); text-transform: uppercase; letter-spacing: .3px; }
    .kpi-value { font-size: 1.4rem; font-weight: 700; color: var(--salvi-black); margin: 3px 0; }
    .kpi-unit  { font-size: .72rem; color: var(--salvi-grey); }
    .kpi-card.highlight { background: #fff; border-color: var(--salvi-black); }
    .kpi-card.highlight .kpi-value { color: var(--salvi-black); }

    .result-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .result-table th { background: var(--salvi-surface); padding: 7px 10px; text-align: left; font-size: .70rem; text-transform: uppercase; color: var(--salvi-grey); border-bottom: 1px solid var(--salvi-line); }
    .result-table td { padding: 7px 10px; border-bottom: 1px solid var(--salvi-surface); }
    .result-table tr:hover td { background: var(--salvi-surface); }

    .badge-zone { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: .68rem; font-weight: 600; }
    .z-THRESHOLD  { background: #fff3cd; color: #856404; }
    .z-TRANSITION { background: #cff4fc; color: #055160; }
    .z-INTERIOR   { background: #d1e7dd; color: #0a3622; }
    .z-EXIT       { background: #e2d9f3; color: #432874; }
    .z-ACCESS     { background: #f8d7da; color: #842029; }
    .z-PARTING    { background: #f8d7da; color: #842029; }

    .alert { padding: 9px 12px; border-radius: var(--radius); font-size: .82rem; margin-bottom: 8px; }
    .alert-warning { background: #fffbeb; border-left: 3px solid var(--warning); color: #7a4800; }
    .alert-danger  { background: #fff5f5; border-left: 3px solid var(--danger);  color: #7a0000; }

<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useMemo, useRef } = React;
const {
  LineChart, BarChart, Bar, ComposedChart, Area,
  Line, XAxis, YAxis, CartesianGrid, Tooltip,
  Legend, ReferenceLine, ReferenceArea, ResponsiveContainer, Customized
} = Recharts;

const LANGS     = window.STE_LANGS    || { es:{ label:'Español', flag:'ES' } };
const TR        = window.STE_TR       || {};
const HELP_DATA = window.STE_HELP_DATA || {};

function t(key, lang) {
  const entry = TR[key];
  if (!entry) return key;
  return entry[lang] || entry['es'] || key;
}

const STEP_IDS = [0, 1, 2, 3, 4, 5, 6, 7];
/** Defensive guard: siempre devuelve array, nunca explota con objeto */
const _asArr = v => Array.isArray(v) ? v : [];

// Coordenada GPS común a las dos listas de luminarias. La progresiva x sigue
// el eje OSM cuando existe; si no, se prolonga desde el portal según su rumbo.
function tunnelLuminaireGps(form,xM,yM) {
  const entryLat=Number(form?.lat), entryLng=Number(form?.lng);
  if(!Number.isFinite(entryLat)||!Number.isFinite(entryLng)) return null;
  const toRad=value=>value*Math.PI/180;
  const moveAlong=(lat,lng,distance,bearing)=>{
    const R=6371000,d=distance/R,theta=toRad(bearing),p1=toRad(lat),l1=toRad(lng);
    const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(theta));
    const l2=l1+Math.atan2(Math.sin(theta)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
    return [p2*180/Math.PI,(l2*180/Math.PI+540)%360-180];
  };
  const route=_asArr(form?.osm_tunnel_geometry).map(point=>({
    lat:Number(point?.lat),lng:Number(point?.lng??point?.lon),
  })).filter(point=>Number.isFinite(point.lat)&&Number.isFinite(point.lng));
  const distance=(a,b)=>{
    const R=6371000,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
    const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
  };
  const bearing=(a,b)=>{
    const dLng=toRad(b.lng-a.lng);
    const y=Math.sin(dLng)*Math.cos(toRad(b.lat));
    const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(dLng);
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  };
  const octant={N:0,NE:45,E:90,SE:135,S:180,SW:225,W:270,NW:315};
  const defaultBearing=octant[form?.portal_orientation]??180;
  let axisLat=entryLat,axisLng=entryLng,axisBearing=defaultBearing;
  let remaining=Math.max(0,Number(xM)||0);
  if(route.length>=2){
    let found=false;
    for(let index=1;index<route.length;index++){
      const start=route[index-1],end=route[index],segment=distance(start,end);
      axisBearing=bearing(start,end);
      if(remaining<=segment+1e-6){
        [axisLat,axisLng]=moveAlong(start.lat,start.lng,remaining,axisBearing);
        found=true;
        break;
      }
      remaining-=segment;
      [axisLat,axisLng]=[end.lat,end.lng];
    }
    if(!found){
      const last=route[route.length-1],previous=route[route.length-2];
      axisBearing=bearing(previous,last);
      [axisLat,axisLng]=moveAlong(last.lat,last.lng,remaining,axisBearing);
    }
  } else {
    [axisLat,axisLng]=moveAlong(entryLat,entryLng,remaining,defaultBearing);
  }
  const width=Math.max(.1,Number(form?.width_m)||.1);
  const [lat,lng]=moveAlong(axisLat,axisLng,(Number(yM)||0)-width/2,(axisBearing+90)%360);
  return [lat.toFixed(6),lng.toFixed(6)];
}

/* Potencia instalada de proyecto: suma de W a la corriente individual de
   cada luminaria en Soleado. El total zonal histórico se conserva para
   compatibilidad, pero no representa necesariamente las consignas finales. */
const installedSunnyPowerKw = luminaireResult => {
  const value = luminaireResult?.totals?.installed_power_kw
    ?? luminaireResult?.scenarios?.sunny?.power_kw
    ?? luminaireResult?.totals?.power_kw;
  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
};

// ── Error Boundary: atrapa crashes de render sin pantalla blanca ──────────
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,i){console.error('[SALVI] ErrorBoundary:',e,i);}
  render(){
    if(this.state.err){
      const msg=this.state.err?.message||String(this.state.err);
      return React.createElement('div',{style:{padding:20,background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:8,margin:12,fontSize:'.8rem'}},
        React.createElement('b',{style:{color:'#b91c1c'}},'Error de interfaz: '),
        msg,
        React.createElement('br'),
        React.createElement('button',{onClick:()=>this.setState({err:null}),
          style:{marginTop:8,padding:'4px 12px',borderRadius:4,border:'none',background:'#b91c1c',color:'#fff',cursor:'pointer'}},
          'Reintentar')
      );
    }
    return this.props.children;
  }
}

function LangSwitcher({ lang, onChange }) {

function HelpBlock({ blocks }) {
  if (!blocks || !blocks.length) return null;
  return (
    <div>
      {blocks.map((b, i) => {
        if (b.h1)   return <h1 key={i}>{b.h1}</h1>;
        if (b.h2)   return <h2 key={i}>{b.h2}</h2>;
        if (b.p)    return <p  key={i}>{b.p}</p>;
        if (b.ul)   return <ul key={i}>{b.ul.map((item, j) => <li key={j}>{item}</li>)}</ul>;
        if (b.tip)  return <div key={i} className="help-tip">💡 {b.tip}</div>;
        if (b.warn) return <div key={i} className="help-warn">⚠️ {b.warn}</div>;
        if (b.table) return (
          <table key={i} className="help-table">
            <thead><tr>{b.table.heads.map((h, j) => <th key={j}>{h}</th>)}</tr></thead>
            <tbody>{b.table.rows.map((row, j) => <tr key={j}>{row.map((cell, k) => <td key={k}>{cell}</td>)}</tr>)}</tbody>
          </table>
        );
        if (b.keys) return (
          <table key={i} className="help-keys">
            <tbody>{b.keys.map(({ k, d }, j) => <tr key={j}><td>{k}</td><td>{d}</td></tr>)}</tbody>
          </table>
        );
        return null;
      })}
    </div>
  );
}

function escapePrintHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function helpBlocksToHtml(blocks) {
  return (blocks || []).map(block => {
    if (block.h1) return `<h1>${escapePrintHtml(block.h1)}</h1>`;
    if (block.h2) return `<h2>${escapePrintHtml(block.h2)}</h2>`;
    if (block.p) return `<p>${escapePrintHtml(block.p)}</p>`;
    if (block.ul) return `<ul>${block.ul.map(item => `<li>${escapePrintHtml(item)}</li>`).join('')}</ul>`;
    if (block.tip) return `<aside class="tip"><strong>Nota.</strong> ${escapePrintHtml(block.tip)}</aside>`;
    if (block.warn) return `<aside class="warn"><strong>Atención.</strong> ${escapePrintHtml(block.warn)}</aside>`;
    if (block.table) return `<table><thead><tr>${block.table.heads.map(head => `<th>${escapePrintHtml(head)}</th>`).join('')}</tr></thead><tbody>${block.table.rows.map(row => `<tr>${row.map(cell => `<td>${escapePrintHtml(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    return '';
  }).join('');
}

function printNormativeSupport(blocks, lang) {

  const generated = new Date().toLocaleDateString(LANGS[lang]?.label || lang);
  printWindow.document.open();
  printWindow.document.write(`<!doctype html><html lang="${escapePrintHtml(lang)}"><head><meta charset="utf-8"><title>${escapePrintHtml(title)}</title><style>
    @page { size: A4; margin: 18mm 16mm; }
    * { box-sizing: border-box; } body { font-family: Arial, Helvetica, sans-serif; color:#172033; font-size:10.5pt; line-height:1.48; }
    header { border-bottom:2px solid #172033; padding-bottom:10px; margin-bottom:18px; } h1 { font-size:19pt; margin:0 0 4px; } h2 { font-size:12pt; margin:20px 0 7px; padding-bottom:3px; border-bottom:1px solid #cbd5e1; } p { margin:0 0 9px; } ul { margin:5px 0 11px; padding-left:19px; } li { margin:3px 0; }
    table { width:100%; border-collapse:collapse; margin:10px 0 14px; font-size:9.3pt; } th { background:#edf1f4; text-align:left; } th,td { border:1px solid #cbd5e1; padding:5px 7px; vertical-align:top; } aside { padding:8px 10px; margin:10px 0; border-left:3px solid #172033; background:#f5f7f8; } aside.warn { border-left-color:#b7791f; background:#fffbeb; } footer { margin-top:20px; border-top:1px solid #cbd5e1; padding-top:7px; font-size:8.5pt; color:#475569; }
  </style></head><body><header><h1>${escapePrintHtml(title)}</h1><div>${escapePrintHtml(subtitle)}</div></header>${helpBlocksToHtml(blocks)}<footer>SALVI Tunnel Engine · ${escapePrintHtml(generated)}</footer><script>window.onload=()=>{ window.focus(); window.print(); };<\/script></body></html>`);
  printWindow.document.close();
}

function HelpPanel({ lang, onClose }) {
  const [section, setSection] = useState('overview');

            <div style={{fontWeight:700, fontSize:'.90rem'}}>{t('help.title', lang)}</div>
            <div style={{fontSize:'.70rem', opacity:.7}}>{t('help.sub', lang)}</div>

              </button>
            ))}

          <div className="help-content"><HelpBlock blocks={blocks} /></div>
        </div>
      </div>

function InfoTip({ content, side='right' }) {
  const [open, setOpen] = React.useState(false);
  const [pos, setPos] = React.useState(null);
  const iconRef = React.useRef(null);
  const W = 260;

  const toggle = (e) => {
    e.stopPropagation();
    if (!open && iconRef.current) {
      const r = iconRef.current.getBoundingClientRect();
      let left = side === 'left' ? r.right - W : r.left;
      left = Math.min(Math.max(8, left), window.innerWidth - W - 8);
      const top = Math.min(r.bottom + 6, window.innerHeight - 8);
      setPos({ top, left });
    }
    setOpen(o => !o);
  };

  return (
    <span style={{position:'relative',display:'inline-block',marginLeft:4,verticalAlign:'middle'}}>
      <span
        ref={iconRef}
        onClick={toggle}
        style={{display:'inline-flex',alignItems:'center',justifyContent:'center',
          width:14,height:14,borderRadius:'50%',
          background:'#6366f1',color:'#fff',
          fontSize:'9px',fontWeight:700,cursor:'pointer',lineHeight:1,
          userSelect:'none',flexShrink:0}}
      >i</span>
      {open && pos && ReactDOM.createPortal(
        <div style={{
          position:'fixed',top:pos.top,left:pos.left,width:W,zIndex:99999,
          background:'#fff',color:'#111',
          borderRadius:7,padding:'9px 11px',
          fontSize:'.67rem',lineHeight:1.6,fontWeight:400,
          boxShadow:'0 6px 20px rgba(0,0,0,.25)',
          border:'1px solid #d1d5db',
          maxHeight:'60vh',overflowY:'auto'
        }}
          onClick={e=>e.stopPropagation()}
          dangerouslySetInnerHTML={{__html:content}}
        />,
        document.body
      )}
    </span>
  );
}
