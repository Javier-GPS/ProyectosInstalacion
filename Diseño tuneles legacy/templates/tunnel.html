                              </td>
                              <td style={{padding:'2px 6px',textAlign:'center',fontWeight:700,fontSize:'.62rem',
                                  color:lm.tandem?'#7c3aed':'#d1d5db'}}>
                                {lm.tandem||'—'}
                              </td>
                              <td style={{padding:'2px 6px',textAlign:'right',fontFamily:'monospace'}}>
                                {luminaireAuditMode==='active'
                                  ? editNumber(lm,'s',lm.x,lm.originalX,{min:0,max:result.summary?.length_m||9999,step:.1,digits:1,width:62})
                                  : Number(lm.x).toFixed(1)}
                              </td>
                              <td style={{padding:'2px 6px',textAlign:'right',fontFamily:'monospace'}}>{lm.y.toFixed(2)}</td>
                              <td style={{padding:'2px 6px',textAlign:'right',color:'#64748b'}}>{lm.d_nxt}</td>
                              <td style={{padding:'2px 6px',textAlign:'right',fontFamily:'monospace',fontWeight:600}}>{lm.optic||'—'}</td>
                              <td style={{padding:'2px 6px',textAlign:'right'}}>
                                {luminaireAuditMode==='active'
                                  ? editNumber(lm,'tilt_deg',lm.tilt,lm.originalTilt,{min:-35,max:35,step:.5,digits:1,width:52})
                                  : Number(lm.tilt||0).toFixed(1)}°
                              </td>
                              <td style={{padding:'2px 6px',textAlign:'right',fontFamily:'monospace',fontWeight:600}}>
                                {lm.lumens?Math.round(parseFloat(lm.lumens)).toLocaleString('es-ES'):'-'}
                              </td>
                               <td style={{padding:'2px 6px',textAlign:'right',color:'#64748b'}}>
                                 {lm.base_mA!=null?Math.round(parseFloat(lm.base_mA)):'—'}
                               </td>
                               <td style={{padding:'2px 6px',textAlign:'right',fontWeight:600}}>
                                 {lm.physicalEditable
                                   ? editNumber(lm,'current_mA',lm.design_mA,lm.originalCurrent,{min:0,max:lum.I_max_mA||1000,step:1,digits:0,width:55})
                                   : (lm.design_mA!=null?Math.round(Number(lm.design_mA)):'—')}
                               </td>
                               <td style={{padding:'2px 6px',textAlign:'right',fontWeight:600}}>
                                  {lm.sceneEditable ? <>
                                   <input type="number" min="0" max={lum.I_max_mA||1000} step="1"
                                     value={Number(lm.sceneCurrentOverride?.current_mA??lm.mA).toFixed(0)}
                                     onChange={event=>setSceneCurrentOverride(lm,event.target.value)}
                                     style={{width:52,textAlign:'right',fontFamily:'monospace',fontSize:'.62rem',padding:'1px 3px',
                                       border:`1px solid ${lm.sceneCurrentOverride?'#f59e0b':'transparent'}`,borderRadius:3,
                                       background:lm.sceneCurrentOverride?'#fffbeb':'transparent',fontWeight:600}}/>
                                   {lm.sceneCurrentOverride&&<button type="button" onClick={()=>resetSceneCurrentOverride(lm)}
                                     title="Restablecer la consigna de esta escena"
                                     style={{marginLeft:2,padding:'0 2px',cursor:'pointer',border:'none',background:'transparent',color:'#b45309',fontWeight:700}}>↶</button>}
                                 </> : (lm.status==='OFF'?'—':Math.round(lm.mA))}
                               </td>
                               <td style={{padding:'2px 6px',textAlign:'right'}}>{lm.dali||'—'}</td>
                               <td style={{padding:'2px 6px',textAlign:'left',fontWeight:700,
                                   color:lm.status==='OFF'?'#64748b':lm.manual?'#b45309':'#166534'}}>
                                  {lm.sceneEditable ? <button type="button" onClick={()=>toggleSceneState(lm)}
                                   title={lm.status==='OFF'?'Encender luminaria en esta escena':'Apagar luminaria en esta escena'}
                                   style={{border:lm.status==='OFF'?'1px solid #94a3b8':'1px solid #16a34a',
                                     background:lm.status==='OFF'?'#f8fafc':'#f0fdf4',
                                     color:lm.status==='OFF'?'#475569':'#166534',borderRadius:999,
                                     padding:'1px 7px',fontSize:'.60rem',fontWeight:700,cursor:'pointer'}}>
                                   {lm.status==='OFF'?'OFF':'ON'}
                                 </button> : lm.status}
                                 {lm.sceneCurrentOverride&&<span style={{color:'#b45309',fontSize:'.58rem'}}> · pendiente</span>}
                               </td>
                              <td style={{padding:'2px 6px',textAlign:'right'}}>{lm.W?Math.round(parseFloat(lm.W)):'-'}</td>
                              <td style={{padding:'2px 6px',textAlign:'right',whiteSpace:'nowrap'}}
                                  title="Modelo-driver nominal; W es la potencia real al punto de corriente mostrado">
                                <span style={{background:clr,color:'#fff',borderRadius:3,padding:'1px 5px',fontWeight:700}}>
                                  {lm.modelLabel||lm.model||'—'}
                                </span>
                              </td>
                              <td style={{padding:'2px 6px',textAlign:'right',fontFamily:'monospace',fontSize:'.6rem',color:'#64748b',whiteSpace:'nowrap'}}
                                  title={governing?`Campo CIE 140 ${governing.start.toFixed(1)}–${governing.end.toFixed(1)} m; carril gobernante ${governing.lane}, sentido ${governing.direction>=0?'A → B':'B → A'}`:'No hay campo CIE 140 asociado; recalcule la verificación'}>
                                {governing?`${governing.start.toFixed(1)}–${governing.end.toFixed(1)} · C${governing.lane}`:'—'}
                              </td>
                              <td style={{padding:'2px 6px',textAlign:'right',fontWeight:insufficient?700:400,
                                  color:insufficient?'#b91c1c':'#16a34a'}}>
                                {governing?governing.Lavg.toFixed(1):'—'}
                              </td>
                              <td style={{padding:'2px 6px',textAlign:'right',color:'#64748b'}}>
                                {governing?governing.Lreq.toFixed(1):'—'}
                              </td>
                              <td style={{padding:'2px 6px',textAlign:'right',fontWeight:governing?700:400,
                                  color:!governing?'#94a3b8':insufficient?'#b91c1c':'#16a34a'}}
                                  title={governing?(insufficient
                                    ?`No cumple: Lavg ${governing.Lavg.toFixed(2)} < Lreq ${governing.Lreq.toFixed(2)} cd/m²`
                                    :`Cumple: Lavg ${governing.Lavg.toFixed(2)} ≥ Lreq ${governing.Lreq.toFixed(2)} cd/m²`):undefined}>
                                {governing?governing.ratio.toFixed(3):'—'}{insufficient?' ⚠':''}
                              </td>
                               <td style={{padding:'2px 6px',textAlign:'right',color:lm.U0!=null&&lm.U0<0.40?'#b91c1c':'#64748b'}}>
                                 {lm.U0!=null?parseFloat(lm.U0).toFixed(3):'—'}
                               </td>
                               <td style={{padding:'2px 6px',textAlign:'right',color:lm.Ul!=null&&lm.Ul<0.60?'#b91c1c':'#64748b'}}>
                                 {lm.Ul!=null?parseFloat(lm.Ul).toFixed(3):'—'}
                               </td>
                               <td style={{padding:'2px 6px',textAlign:'right',whiteSpace:'nowrap',
                                 color:lm.flickerCritical?'#b91c1c':'#64748b',fontWeight:lm.flickerCritical?700:400}}>
                                 {lm.flickerHz>0?`${lm.flickerHz.toFixed(1)}${lm.flickerCritical?' ⚠':''}`:'—'}
                               </td>
                              {hasGPS&&(()=>{const [lt,ln]=_lumGPS(lm.x,lm.y);return(<>
                                <td style={{padding:'2px 6px',textAlign:'right',fontFamily:'monospace',fontSize:'.59rem',color:'#0ea5e9'}}>{lt}</td>
                                <td style={{padding:'2px 6px',textAlign:'right',fontFamily:'monospace',fontSize:'.59rem',color:'#0ea5e9'}}>{ln}</td>
                              </>);})()}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{fontSize:'.6rem',color:'var(--salvi-grey)',marginTop:4,opacity:.7}}>
                    Pulse ID, x, Estado o W para ordenar.
                    {luminaireAuditMode==='active'&&' Campos editables: x, tilt y mA.'}
                    {luminaireAuditMode==='all'&&' La auditoría es de solo lectura: repite cada luminaria por escena con su consigna, W, flujo y campo CIE 140 propio.'}
                    Estado ON/OFF refleja la corriente de diseño; ámbar indica una modificación manual;
                    ↶ restaura el valor calculado.
                    {' · '}x = posición eje túnel (m desde portal A) · y = transversal desde pared izq. · d→ = distancia al siguiente mismo lado · Par A/B = luminarias en tándem (⊕)
                    {' · '}Campo CIE 140, Lest gob., Lreq y Lest/Lreq son el resultado normativo del campo asociado y su carril más desfavorable; sustituyen la antigua L_est puntual.
                    {' · '}mA base = corriente que mantiene Lin · la columna mA muestra la consigna de la escena visualizada; se edita el diseño físico sólo en Soleado.
                    {hasGPS?' · Lat/Lon (WGS84) calculadas desde portal A':'  · Configure posición del portal en el mapa para obtener Lat/Lon'}
                  </div>
                </div>
              );
            })()}

            {/* ── Vista 3D — recorrido del conductor ──────────────────────── */}
            {zoneList.filter(z=>z.n_luminaires>0).length>0 && (()=>{
              const W_m3    = parseFloat(form.width_m)||11.5;
              const H_m3    = parseFloat(form.height_m)||5.5;
              const Hp_m3   = parseFloat(form.H_pared_m) ?? 3.0;
              const shape3  = form.tunnel_shape||'horseshoe';
              const mountH3 = parseFloat(lum?.mounting_height_m)||4.5;
              const arr3    = lumResult.arrangement||'bilateral_sym';
              const wo3     = Math.max(0.05, parseFloat(lum?.wall_offset_m)||0.30);
              const tubeLen3 = parseFloat(result?.summary?.length_m)
                || zoneList.reduce((m,z)=>Math.max(m,parseFloat(z.s_end)||0),0);

               const buildVideoScene = sceneDef => {
                 const sceneLumList=[];
                 zoneList.filter(z=>z.n_luminaires>0).forEach(z=>{
                   const nPositions = luminairePositionCount(z);
                   const hasSP  = z.setpoints && z.setpoints.length===nPositions;
                   const dAct   = parseFloat(z.d_used)||1;
                   const sStart = parseFloat(z.s_start)||0;
                   for(let i=0;i<nPositions;i++){
                     const sp=hasSP ? z.setpoints[i] : {
                       idx:i+1,s:sStart+(i+0.5)*dAct,model:z.model,optic:z.optic,
                       tilt_deg:z.tilt_deg,current_mA:z.current_mA,power_w:z.power_w,
                       flux_lm:z.flux_lm,night_current_mA:z.night_current_mA,
                       night_power_w:z.night_power_w,night_flux_lm:z.night_flux_lm,
                     };
                     const operation=operationForLuminaireScene(sp,z,sceneDef);
                     const xPos=parseFloat(sp.s);
                     const physicalYs=physicalLuminaireYPositions(
                       arr3, W_m3, wo3, sp.idx || i + 1,
                     );
                     physicalYs.forEach(yPos=>sceneLumList.push({
                       x:xPos,y:yPos,model:sp.model||z.model,tilt:sp.tilt_deg??z.tilt_deg??0,
                       flux_lm:Number(operation?.flux_lm||0),
                       current_mA:Number(operation?.current_mA||0),
                       power_w:Number(operation?.power_w||0),
                       active:operation?.state!=='off'&&Number(operation?.flux_lm||0)>0,
                     }));
                   }
                 });
                 return {
                   ...sceneDef,
                   luminaires:sceneLumList,
                   profile:profileForLuminaireScene(sceneDef.key),
                   verification:photoResult?.scenarios?.[sceneDef.key]||null,
                 };
               };
               const sceneOptions3=LUMINAIRE_SCENE_DEFINITIONS.map(buildVideoScene);
               const activeVideoScene=sceneOptions3.find(item=>item.key===luminaireScene.key)
                 ||sceneOptions3[0];
               if (!activeVideoScene?.luminaires?.length || !(tubeLen3>0)) return null;
               return (
                 <Tunnel3DDrive lumList={activeVideoScene.luminaires}
                   sceneOptions={sceneOptions3} initialSceneKey={luminaireScene.key}
                   W_m={W_m3} H_m={H_m3} shape={shape3}
                   H_pared_m={Hp_m3} tubeLength={tubeLen3} mountH={mountH3}
                  speedKmh={parseFloat(form.speed_kmh)||80}
                  roadSurface={form.road_surface||'dark_asphalt'}
                  numLanes={parseInt(form.num_lanes)||2}
                  laneWidthM={parseFloat(form.lane_width_m)||3.5}
                  shoulderLeftM={parseFloat(form.shoulder_left_m)||0}
                  shoulderRightM={parseFloat(form.shoulder_right_m)||0}
                  sidewalkLeftM={parseFloat(form.sidewalk_left_m)||0}
                  sidewalkRightM={parseFloat(form.sidewalk_right_m)||0}
                  cct={lumResult.cct||lum?.cct||'4000K'}
                  rhoWall={parseFloat(form.rho_wall)||0.40}
                  rhoCeiling={parseFloat(form.rho_ceiling)||0.25}
                  routeGeometry={form.osm_tunnel_geometry||[]}/>
              );
            })()}

            {/* ── Panel ahorro energético y ROI paredes reflectantes ─────── */}
            {photoResult?.calc_mode==='radiosity'&&(()=>{
              /* Geometría del túnel */
              const W_roi = parseFloat(form.width_m)||10.5;
              const H_roi = parseFloat(form.height_m)||5.5;
              const L_roi = parseFloat(form.length_m)||500;
              const shp   = form.tunnel_shape||'horseshoe';
              /* Superficie a tratar: paredes + techo (sin pavimento) */
              const surfM2 = shp==='circular'
                ? Math.PI*(W_roi/2)*L_roi
                : (2*H_roi + W_roi)*L_roi;

              /* Cálculo de ahorro potencial por zona */
              const sortedZ = [..._asArr(lumResult.zones)].sort((a,b)=>parseFloat(a.s_start)-parseFloat(b.s_start));
              let totalLen=0, weightedSaving=0, hasInd=false;
              for(const z of sortedZ.filter(z=>z.n_luminaires>0)){
                const pz = photoResult.zones?.[z.zone_name];
                if(!pz) continue;
                const zLen = parseFloat(z.zone_length)||0;
                const Lreq = parseFloat(z.L_required)||0;
                const Lavg = pz.L_avg||0;
                const Lind = pz.L_indirect||0;
                totalLen += zLen;
                if(Lind>0) hasInd=true;
                /* Si la zona está sobreiluminada gracias al aporte indirecto, se puede reducir potencia */
                if(Lavg>Lreq*1.02&&Lreq>0&&Lavg>0){
                  weightedSaving += zLen*(Lavg-Lreq)/Lavg;
                }
              }
              if(!hasInd||totalLen===0) return null;

              const savFrac  = weightedSaving/totalLen;
              const totalW   = (lumResult.totals?.power_kw||0)*1000;
              const savW     = Math.round(totalW*savFrac);
              const savKwhY  = Math.round(savW*(roi.hoursYear/1000));
              const savEurY  = savKwhY*roi.kwhCost;
              const invest   = surfM2*roi.treatCostM2;
              const payback  = savEurY>0 ? invest/savEurY : null;

              const numFmt = n => Math.round(n).toLocaleString('es-ES');
              const monFmt = n => n.toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});

              return(
                <div style={{background:'var(--salvi-surface)',border:'1px solid #6366f1',
                    borderRadius:8,padding:'10px 12px',borderLeft:'4px solid #6366f1'}}>

                  {/* Cabecera colapsable */}
                  <div style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}
                       onClick={()=>setRoi(r=>({...r,open:!r.open}))}>
                    <span style={{fontSize:'1rem',color:'#6366f1'}}>✦</span>
                    <div style={{fontSize:'.68rem',fontWeight:700,color:'#6366f1',
                        textTransform:'uppercase',letterSpacing:'.07em',flex:1}}>
                      Ahorro energético · Retorno inversión paredes reflectantes
                    </div>
                    <span style={{fontSize:'.65rem',color:'#6366f1'}}>{roi.open?'▲':'▼'}</span>
                  </div>

                  {roi.open&&(
                    <div style={{marginTop:8}}>
                      <div style={{fontSize:'.64rem',color:'#4b5563',marginBottom:8,lineHeight:1.5}}>
                        El aporte indirecto de paredes y techo permite dimmear las luminarias
                        un <strong>{Math.round(savFrac*100)}%</strong> en promedio ponderado por zona,
                        manteniendo los niveles CIE 88. Ajusta los parámetros económicos:
                      </div>

                      {/* Inputs */}
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:10}}>
                        {[
                          {label:'Coste energía (€/kWh)',   key:'kwhCost',      min:0.05,max:0.60, step:0.01},
                          {label:'Horas de operación/año',  key:'hoursYear',    min:1000,max:8760, step:100},
                          {label:'Coste tratamiento (€/m²)',key:'treatCostM2',  min:1,   max:150,  step:1},
                        ].map(({label,key,min,max,step})=>(
                          <div key={key} style={{display:'flex',flexDirection:'column',gap:3}}>
                            <label style={{fontSize:'.6rem',color:'var(--salvi-grey)',fontWeight:600}}>{label}</label>
                            <input type="number" min={min} max={max} step={step}
                              value={roi[key]}
                              onChange={e=>setRoi(r=>({...r,[key]:parseFloat(e.target.value)||r[key]}))}
                              style={{width:'100%',padding:'3px 6px',border:'1px solid var(--salvi-line)',
                                borderRadius:4,fontSize:'.68rem',textAlign:'right',
                                background:'var(--salvi-bg)'}}/>
                          </div>
                        ))}
                      </div>

                      {/* KPIs */}
                      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:8}}>
                        {[
                          {label:'Reducción de potencia',
                           val:`${numFmt(savW)} W`,
                           sub:`${Math.round(savFrac*100)}% de ${numFmt(totalW)} W inst.`,
                           clr:'#059669'},
                          {label:'Ahorro energético anual',
                           val:monFmt(savEurY),
                           sub:`${numFmt(savKwhY)} kWh/año`,
                           clr:'#059669'},
                          {label:'Inversión tratamiento',
                           val:monFmt(invest),
                           sub:`${numFmt(Math.round(surfM2))} m² · ${roi.treatCostM2} €/m²`,
                           clr:'#6366f1'},
                          {label:'Retorno simple',
                           val:payback?`${payback.toFixed(1)} años`:'—',
                           sub:payback?(payback<8?'✅ Rentable':payback<15?'⚠️ Analizar':'❌ Largo plazo'):'Sin excedente',
                           clr:payback?(payback<8?'#059669':payback<15?'#d97706':'#b91c1c'):'#94a3b8'},
                        ].map(({label,val,sub,clr})=>(
                          <div key={label} style={{background:'#f8fafc',borderRadius:6,
                              padding:'8px 10px',border:'1px solid var(--salvi-line)'}}>
                            <div style={{fontSize:'.58rem',color:'var(--salvi-grey)',fontWeight:600,
                                marginBottom:2,textTransform:'uppercase',letterSpacing:'.06em'}}>{label}</div>
                            <div style={{fontSize:'.82rem',fontWeight:700,color:clr}}>{val}</div>
                            <div style={{fontSize:'.58rem',color:'#94a3b8',marginTop:1}}>{sub}</div>
                          </div>
                        ))}
                      </div>

                      <div style={{fontSize:'.58rem',color:'#94a3b8',fontStyle:'italic',lineHeight:1.4}}>
                        * Ahorro teórico asumiendo dimming DALI proporcional por zona. Sólo válido cuando el cálculo
                        en modo Radiosidad (✦) muestra zonas con L_avg &gt; L_req. Superficie estimada:
                        {' '}{numFmt(Math.round(surfM2))} m² (paredes + techo, sin pavimento).
                        ρ activos: paredes={form.rho_wall??0.40} · techo={form.rho_ceiling??0.25}.
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}
          </>
        );
      })()}
    </div>
  );
}

function TunnelAiAssistant({ form, result, phase, onChange, onClose }) {
  const [question,setQuestion]=useState('');
  const [answer,setAnswer]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [appliedChanges,setAppliedChanges]=useState({});

  const buildContext=()=>{
    const luminaireResult=form?.luminaires_result||{};
    const photometric=form?.photometric_result||{};
    const inputKeys=[
      'tube_id','project_name','length_m','width_m','height_m','H_pared_m',
      'lane_width_m','num_lanes','traffic_direction','speed_kmh','gradient_pct',
      'portal_orientation','sky_condition','daylight_penetration','wall_reflectance',
      'rho_wall','rho_ceiling','threshold_length_override_m',
      'transition_end_override_m','exit_luminance_ratio_override','Lth_override','Lin_override','L_night',
      'L_night_normal','L_night_reduced','shoulder_left_m','shoulder_right_m',
      'sidewalk_left_m','sidewalk_right_m','osm_tunnel_id',
    ];
    const inputs={};
    inputKeys.forEach(key=>{if(form?.[key]!==undefined) inputs[key]=form[key];});
    inputs.lum_config=Object.fromEntries([
      'I_max_mA','I_min_pct','cct','arrangement','optic','mounting_height_m',
      'wall_offset_m','maintenance_factor','U0_obj','Ul_obj','d_fixed','d_min',
      'optimization_goal','spacing_quantum_m','max_base_spacing_reduction_pct',
      'max_luminaire_increase_pct',
    ].filter(key=>form?.lum_config?.[key]!==undefined)
      .map(key=>[key,form.lum_config[key]]));
    const zones=Object.values(result?.zones||{}).map(zone=>({
      zone_name:zone.zone_name,zone_type:zone.zone_type,
      s_start:zone.s_start,s_end:zone.s_end,L_zone:zone.L_zone,
      L_required:zone.L_required,L_total_required:zone.L_total_required,
    }));
    const lumZones=(luminaireResult.zones||[]).map(zone=>({
      zone_name:zone.zone_name,zone_type:zone.zone_type,
      control_layer:zone.control_layer,portal:zone.portal,
      s_start:zone.s_start,s_end:zone.s_end,L_required:zone.L_required,
      n_luminaires:zone.n_luminaires,model:zone.model,
      setpoints:(zone.setpoints||[]).slice(0,240).map(point=>({
        key:`${zone.zone_name}|${Number(point.idx)||0}`,
        x_m:point.s,model:point.model,current_mA:point.current_mA,
        power_W:point.power_w,flux_lm:point.flux_lm,L_req:point.L_req,
        L_est:point.L_est,
      })),
    }));
    const scenarios=Object.fromEntries(Object.entries(photometric.scenarios||{})
      .map(([key,item])=>[key,Object.fromEntries([
        'available','compliant','minimum_Lavg_cd_m2','minimum_field_Lavg_cd_m2',
        'minimum_L_ratio','minimum_U0','minimum_Ul','maximum_TI_pct',
        'target_cd_m2','operating_power_kw','active_luminaires',
      ].filter(field=>item?.[field]!==undefined).map(field=>[field,item[field]]))]));
    const fields=(photometric.real_profile?.fields||[]).slice(0,500).map(field=>
      Object.fromEntries([
        'zone_name','zone_type','field_start','field_end','s','L','Lavg_governing',
        'L_required','L_required_total','U0','Ul','TI','natural_daylight_cd_m2',
        'governing_lane_number','governing_direction',
      ].filter(key=>field?.[key]!==undefined).map(key=>[key,field[key]]))
    );
    return {
      phase,inputs,
      calculated:{summary:result?.summary||{},zones},
      photometric:{calc_mode:photometric.calc_mode,scenarios,profile_fields:fields},
      luminaires:{totals:luminaireResult.totals||{},architecture:luminaireResult.architecture,zones:lumZones},
      manual_overrides:{luminaire:form?.manual_luminaire_overrides||{},scene_current:form?.scene_current_overrides||{}},
    };
  };

  const askAssistant=async()=>{
    if(!question.trim()||loading) return;
    setLoading(true);setError(null);setAnswer(null);setAppliedChanges({});
    try{
      const response=await fetch('/api/tunnel/ai-assistant',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question,context:buildContext()}),
      });
      const data=await response.json();
      if(!data.success) throw new Error(data.error||'No se pudo consultar el asistente.');
      setAnswer(data.answer||null);
    }catch(err){setError(err.message||String(err));}
    finally{setLoading(false);}
  };

  const applyChange=(change,index)=>{
    const path=String(change?.path||'');
    const value=change?.value;
    const parts=path.split('.');
    let applied=false;
    const rootFields=new Set([
      'width_m','height_m','length_m','lane_width_m','num_lanes','speed_kmh',
      'threshold_length_override_m','transition_end_override_m','Lth_override',
      'Lin_override','L_night','rho_wall','rho_ceiling','shoulder_left_m',
      'shoulder_right_m','sidewalk_left_m','sidewalk_right_m',
    ]);
    if(parts.length===1&&rootFields.has(parts[0])){
      onChange(parts[0],value);applied=true;
    }else if(parts.length===2&&parts[0]==='lum_config'){
      const previous=form.lum_config||{};
      onChange('lum_config',{...previous,[parts[1]]:value});applied=true;
    }else if(parts.length===3&&parts[0]==='scene_current_overrides'&&parts[2]==='current_mA'){
      const previous=form.scene_current_overrides||{};
      const key=parts[1];
      const current=previous[key]||{};
      onChange('scene_current_overrides',{...previous,[key]:{
        ...current,current_mA:Number(value),
        original_current_mA:current.original_current_mA??Number(value),
      }});applied=true;
    }else if(parts.length===4&&parts[0]==='manual_luminaire_overrides'
      &&parts[2]==='values'&&['s','tilt_deg','current_mA'].includes(parts[3])){
      const previous=form.manual_luminaire_overrides||{};
      const key=parts[1];
      const current=previous[key]||{original:{},values:{}};
      const field=parts[3];
      // Conserva el valor de partida para que el editor pueda restablecerlo.
      // Las propuestas nuevas no deben convertirse en el "original".
      const originalValue=current.original?.[field]
        ?? current.values?.[field]
        ?? Number(value);
      onChange('manual_luminaire_overrides',{...previous,[key]:{
        ...current,original:{...(current.original||{}),[field]:Number(originalValue)},
        values:{...(current.values||{}),[field]:Number(value)},
      }});applied=true;
    }
    if(applied) setAppliedChanges(previous=>({...previous,[index]:true}));
    else setError(`La propuesta «${path}» no se puede aplicar desde esta vista. Revísala manualmente.`);
  };

  const severityColor={info:'#2563eb',warning:'#b45309',error:'#b91c1c'};
  return <div style={{position:'fixed',inset:0,zIndex:1000,background:'rgba(15,23,42,.36)',
      display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'7vh 18px 18px'}}>
    <div style={{width:'min(900px,100%)',maxHeight:'86vh',overflow:'auto',background:'#fff',
        borderRadius:12,boxShadow:'0 20px 60px rgba(15,23,42,.28)',border:'1px solid var(--salvi-line)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'13px 16px',
          borderBottom:'1px solid var(--salvi-line)',position:'sticky',top:0,background:'#fff',zIndex:1}}>
        <span style={{fontSize:'1.25rem'}}>✨</span>
        <div style={{flex:1}}><div style={{fontWeight:800,fontSize:'.92rem'}}>Asistente IA · iluminación de túneles</div>
          <div style={{fontSize:'.62rem',color:'var(--salvi-grey)'}}>Consulta técnica contextual · propuestas siempre revisables</div></div>
        <button type="button" onClick={onClose} aria-label="Cerrar asistente"
          style={{border:'none',background:'transparent',fontSize:'1.2rem',cursor:'pointer',color:'var(--salvi-grey)'}}>×</button>
      </div>
      <div style={{padding:'14px 16px'}}>
        <div style={{fontSize:'.67rem',color:'#475569',lineHeight:1.5,marginBottom:9}}>
          Puedes preguntar por una zona que no cumple, la diferencia entre Lest y Lreq,
          la interpretación de U0/Ul/TI o qué ajustes manuales conviene probar. La respuesta
          usa los datos actuales del tubo y no cambia nada hasta que pulses una propuesta.
        </div>
        <textarea value={question} onChange={event=>setQuestion(event.target.value)}
          onKeyDown={event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter') askAssistant();}}
          placeholder="Ej.: En crepuscular CTR1 queda bajo Lreq. ¿Qué luminarias o corrientes conviene revisar?"
          rows={3} maxLength={2400}
          style={{width:'100%',boxSizing:'border-box',resize:'vertical',padding:'8px 10px',fontSize:'.72rem',
            border:'1px solid var(--salvi-line)',borderRadius:6,fontFamily:'inherit'}}/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginTop:7}}>
          <span style={{fontSize:'.59rem',color:'var(--salvi-grey)'}}>Ctrl/⌘ + Enter para consultar · escena/fase actual: {phase}</span>
          <button type="button" onClick={askAssistant} disabled={!question.trim()||loading}
            style={{padding:'7px 14px',borderRadius:6,border:'1px solid #1d4ed8',background:'#1d4ed8',
              color:'#fff',fontWeight:700,fontSize:'.68rem',cursor:question.trim()&&!loading?'pointer':'not-allowed',opacity:question.trim()&&!loading?1:.6}}>
            {loading?'Consultando…':'Consultar IA'}
          </button>
        </div>
        {error&&<div style={{marginTop:10,padding:'8px 10px',borderRadius:6,border:'1px solid #fecaca',background:'#fef2f2',color:'#991b1b',fontSize:'.68rem'}}>{error}</div>}
        {answer&&<div style={{marginTop:14,display:'grid',gap:10}}>
          <div style={{padding:'10px 12px',borderRadius:7,background:'#eff6ff',border:'1px solid #bfdbfe',fontSize:'.74rem',lineHeight:1.55,whiteSpace:'pre-wrap'}}>
            <strong>Lectura del asistente</strong><div style={{marginTop:5}}>{answer.answer}</div>
          </div>
          {(answer.findings||[]).length>0&&<div><div style={{fontSize:'.68rem',fontWeight:800,marginBottom:5}}>Hallazgos</div>
            <div style={{display:'grid',gap:5}}>{answer.findings.map((item,index)=><div key={index} style={{padding:'7px 9px',borderLeft:`3px solid ${severityColor[item.severity]||'#64748b'}`,background:'#f8fafc',fontSize:'.67rem'}}><b>{item.title}</b><div>{item.detail}</div>{item.evidence&&<div style={{color:'#64748b',marginTop:2}}>Evidencia: {item.evidence}</div>}</div>)}</div>
          </div>}
          {(answer.suggestions||[]).length>0&&<div><div style={{fontSize:'.68rem',fontWeight:800,marginBottom:5}}>Propuestas revisables</div>
            <div style={{display:'grid',gap:7}}>{answer.suggestions.map((suggestion,index)=><div key={index} style={{padding:'8px 10px',border:'1px solid #fde68a',background:'#fffbeb',borderRadius:6,fontSize:'.67rem'}}><b>{suggestion.title}</b><div style={{margin:'3px 0 6px'}}>{suggestion.rationale}</div>{(suggestion.changes||[]).map((change,changeIndex)=><div key={changeIndex} style={{display:'flex',alignItems:'center',gap:7,padding:'4px 0',borderTop:'1px solid #fef3c7'}}><code style={{fontSize:'.59rem',flex:1}}>{change.path}</code><span style={{fontFamily:'monospace',fontWeight:700}}>{String(change.value)}{change.unit?' '+change.unit:''}</span><button type="button" disabled={!!appliedChanges[`${index}-${changeIndex}`]} onClick={()=>applyChange(change,`${index}-${changeIndex}`)} style={{padding:'3px 6px',fontSize:'.59rem',border:'1px solid #d97706',borderRadius:4,background:appliedChanges[`${index}-${changeIndex}`]?'#dcfce7':'#fff',color:appliedChanges[`${index}-${changeIndex}`]?'#166534':'#92400e',cursor:'pointer'}}>{appliedChanges[`${index}-${changeIndex}`]?'Preparado':'Preparar'}</button></div>)}{suggestion.recalculate&&<div style={{fontSize:'.6rem',color:'#92400e',marginTop:5}}>Después: {suggestion.recalculate}</div>}</div>)}</div>
          </div>}
          {(answer.normative_references||[]).length>0&&<div style={{fontSize:'.64rem',color:'#475569'}}><b>Marco normativo indicado</b>{answer.normative_references.map((ref,index)=><div key={index} style={{marginTop:3}}>· <strong>{ref.standard}</strong> · {ref.topic}: {ref.note}</div>)}</div>}
          {(answer.limitations||[]).length>0&&<div style={{fontSize:'.62rem',color:'#64748b'}}><b>Limitaciones</b>{answer.limitations.map((item,index)=><div key={index}>· {item}</div>)}</div>}
          <div style={{fontSize:'.59rem',color:'#64748b',fontStyle:'italic'}}>La IA es una ayuda de revisión. Valida siempre cualquier propuesta con el recálculo CIE 88/CIE 140 y la documentación normativa del proyecto.</div>
        </div>}
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════════════════════════════════════
   App — componente raíz
   ══════════════════════════════════════════════════════════════════ */
function App() {
  const [lang,        setLang]        = useState('es');
  const [showHelp,    setShowHelp]    = useState(false);
  const [showAiAssistant,setShowAiAssistant] = useState(false);
  const [lpSection,   setLpSection]   = useState('entorno');
  const [lpWidth,     setLpWidth]     = useState(460);
  const [osmFields,   setOsmFields]   = useState(new Set());
  const [calculating, setCalculating] = useState(false);
  const [calcError,   setCalcError]   = useState(null);
  const [lumToolbarSlot, setLumToolbarSlot] = useState(null);
  const lpDragging = useRef(false);
  const leftPanelScrollRef = useRef(null);

  // El contenedor lateral se reutiliza entre fases; sin reiniciarlo conserva
  // la posición de la fase anterior y Luminarias puede abrirse a media altura.
  React.useEffect(() => {
    if (leftPanelScrollRef.current) {
      leftPanelScrollRef.current.scrollTop = 0;
    }
  }, [lpSection]);

  // ── Multi-tube ─────────────────────────────────────────────────
  const [activeTubeId, setActiveTubeId] = useState('T1');
  const [tubes, setTubes] = useState({ T1: _mkTube('T1') });
  const tube   = tubes[activeTubeId] || _mkTube(activeTubeId);
  const form   = tube.form;
  const result = tube.result;
  const panelInstalledPowerKw = form.luminaires_result
    ? installedSunnyPowerKw(form.luminaires_result)
    : Number(form.installed_power_kw||0);

  const patchTube = (id, patch) =>
    setTubes(prev => ({ ...prev, [id]: { ...prev[id], ...patch } }));
  // Fusiona siempre contra el estado más reciente (no contra el `form` cerrado
  // en el render) — evita que llamadas onChange consecutivas en el mismo
  // bloque síncrono (p.ej. tras un cálculo) se pisen entre sí y pierdan datos.
  const onChange = (key, val) =>
    setTubes(prev => ({
      ...prev,
      [activeTubeId]: { ...prev[activeTubeId], form: { ...prev[activeTubeId].form, [key]: val } },
    }));
  const onClearOsm = (key) =>
    setOsmFields(prev => { const s = new Set(prev); s.delete(key); return s; });
  const invalidateDerived = (importedOsmKeys = null) => {
    if (Array.isArray(importedOsmKeys)) {
      setOsmFields(new Set(importedOsmKeys));
    }
    setTubes(prev => ({
      ...prev,
      [activeTubeId]: {
        ...prev[activeTubeId],
        result: null,
        form: {
          ...prev[activeTubeId].form,
          luminaires_result: null,
          photometric_result: null,
        },
      },
    }));
  };

  // ── Calculate CIE 88 ──────────────────────────────────────────
  const handleCalculate = async () => {
    // Desde Entorno, el resultado debe pasar por Geometría para que se revise
    // la sección y el tráfico antes de abrir las zonas normativas.
    const calculationOrigin = lpSection;
    setCalculating(true); setCalcError(null);
    try {
      const resp = await fetch('/api/tunnel/calculate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(form),
      });
      const data = await resp.json();
      patchTube(activeTubeId, { result: data });
      if (data.success) setLpSection(
        calculationOrigin === 'entorno' ? 'geometria' : 'zonas'
      );
      else setCalcError(
        data.error ||
        (Array.isArray(data.errors) ? data.errors.join(' · ') : '') ||
        'Error de cálculo'
      );
    } catch(e) { setCalcError(e.message); }
    finally { setCalculating(false); }
  };

  // ── Left panel resize ─────────────────────────────────────────
  const startLpResize = useCallback((e) => {
    e.preventDefault();
    const startX = e.clientX, startW = lpWidth;
    lpDragging.current = true;
    document.body.classList.add('dragging');
    const onMove = (ev) => setLpWidth(Math.min(520, Math.max(220, startW + ev.clientX - startX)));
    const onUp = () => {
      lpDragging.current = false;
      document.body.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }, [lpWidth]);

  // ── All 6 phases in order ────────────────────────────────────
  const LP_SECTIONS = [
    { id:'entorno',    icon:'🌄', label:'Entorno',    done: !!(form.portal_orientation) },
    { id:'geometria',  icon:'📐', label:'Geometría',  done: !!(form.length_m && form.width_m && form.traffic_veh_h) },
    { id:'zonas',      icon:'📊', label:'Zonas',      done: !!(result?.success) },
    { id:'luminarias', icon:'💡', label:'Luminarias', done: !!(form.luminaires_result) },
    { id:'control',    icon:'🎛️', label:'Control',    done: false },
    { id:'informe',    icon:'📄', label:'Informe',    done: false },
  ];

  // La curva CIE 88 (result.success) es prerequisito de Zonas/Luminarias/
  // Control/Informe — no tiene sentido entrar ahi sin haber calculado.
  const cieReady = !!result?.success;
  const FORWARD_GATED = ['zonas','luminarias','control','informe'];

  const setSection = (id) => {
    if (FORWARD_GATED.includes(id) && !cieReady) {
      setCalcError('Calcula primero la curva CIE 88:2004 para continuar.');
      return;
    }
    setLpSection(prev => prev === id ? prev : id);
  };

  // ── Main canvas content driven by lpSection ───────────────────
  const renderCanvas = () => {
    switch(lpSection) {
      case 'entorno':
        return (
          <div className="mc-content mc-map-mode">
            <MapSelector
              lat={form.lat} lng={form.lng}
              onUpdate={(k,v)=>onChange(k,v)}
              onImport={(imp, options={})=>{
                setTubes(prev => ({
                  ...prev,
                  [activeTubeId]: {
                    ...prev[activeTubeId],
                    result: null,
                    form: (()=>{
                      const nextForm={
                        ...prev[activeTubeId].form,
                        ...imp,
                        luminaires_result: null,
                        photometric_result: null,
                      };
                      if(options.resetProjectOverrides){
                        ['threshold_length_override_m','threshold_length_b_override_m',
                         'transition_end_override_m','transition_end_b_override_m',
                         'exit_length_override_m','exit_luminance_ratio_override'].forEach(key=>delete nextForm[key]);
                      }
                      return nextForm;
                    })(),
                  },
                }));
                setOsmFields(new Set(Object.keys(imp)));
              }}
              lumData={result?.success?{tube_length_m:form.length_m,...(form.luminaires_result||{})}:null}
              luminaireConfig={{...DEFAULT_LUM_CONFIG,...(form.lum_config||{})}}
              portalOrientation={form.portal_orientation}
              tunnelLength={parseFloat(form.length_m)||300}
              tunnelWidth={parseFloat(form.width_m)||10.5}
              tunnelGeometry={form.osm_tunnel_geometry||[]}
            />
          </div>
        );
      case 'geometria':
        return (
          <div className="mc-content" style={{padding:0,overflow:'hidden'}}>
            <TunnelPerspective form={form} result={result} onChange={onChange}/>
          </div>
        );
      case 'zonas':
        return (
          <div className="mc-content">
            {result?.success
              ? <StepResults result={result}/>
              : <div style={{textAlign:'center',color:'var(--salvi-grey)',padding:60}}>
                  <div style={{fontSize:'2rem',marginBottom:12}}>📊</div>
                  Completa los datos de <b>Entorno</b> y <b>Geometría</b> y pulsa<br/>
                  <b>Calcular CIE 88:2004</b> para ver las zonas.
                </div>
            }
          </div>
        );
      case 'luminarias':
        return (
          <div className="mc-content" style={{padding:0,flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
            <LuminaireSectionEditor result={result} form={form} onChange={onChange}
              onGoToMap={()=>setLpSection('entorno')} toolbarSlot={lumToolbarSlot}/>
          </div>
        );
      case 'control':
        return (
          <div className="mc-content">
            {result?.success
              ? <ControlPhotometricLab result={result} form={form} onChange={onChange}/>
              : <div style={{textAlign:'center',color:'var(--salvi-grey)',padding:60}}>
                  <div style={{fontSize:'2rem',marginBottom:12}}>🎛️</div>
                  Completa el cálculo CIE 88 para configurar el control.
                </div>
            }
          </div>
        );
      case 'informe':
        return (
          <div className="mc-content">
            {result?.success
              ? <StepResults result={result}/>
              : <div style={{textAlign:'center',color:'var(--salvi-grey)',padding:60}}>
                  <div style={{fontSize:'2rem',marginBottom:12}}>📄</div>
                  Completa el cálculo CIE 88 para generar el informe.
                </div>
            }
          </div>
        );
      default:
        return null;
    }
  };

  const canvas = renderCanvas();
  return (
    <div className="app-shell" style={{gridTemplateColumns:`${lpWidth}px 5px 1fr 272px`}}>

      {/* ── TopBar ── */}
      <div className="topbar">
        <span className="tb-brand">SALVI Studio</span>
        <span className="tb-badge">Túnel · CIE 88:2004</span>
        <div className="tb-sep"/>
        <span className="tb-proj">{form.project_name || 'Sin nombre'}</span>
        <span className="tb-spacer"/>
        <LangSwitcher lang={lang} onChange={setLang}/>
        <button className="tb-btn" onClick={()=>setShowAiAssistant(true)}
          title="Consultar sobre normativa, cálculos y propuestas manuales">✨ IA túnel</button>
        <button className="tb-btn" onClick={()=>setShowHelp(h=>!h)}>{t('app.help', lang)}</button>
      </div>

      {/* ── Left Panel ── */}
      <div className="left-panel">

        {/* Tube tabs */}
        <div className="tube-tabs">
          {Object.keys(tubes).map(tid=>(
            <button key={tid} className={`tube-tab ${activeTubeId===tid?'active':''}`}
              onClick={()=>setActiveTubeId(tid)}>{tid}</button>
          ))}
          <button className="tube-tab add"
            onClick={()=>{
              const next=`T${Object.keys(tubes).length+1}`;
              setTubes(prev=>({...prev,[next]:_mkTube(next,form)}));
              setActiveTubeId(next);
            }}>+ Tubo</button>
          {Object.keys(tubes).length>1 && (
            <button className="tube-tab remove"
              onClick={()=>{
                const ids=Object.keys(tubes).filter(t=>t!==activeTubeId);
                setTubes(prev=>{const n={...prev};delete n[activeTubeId];return n;});
                setActiveTubeId(ids[ids.length-1]);
              }}>✕</button>
          )}
        </div>

        {/* Phase rail — quick-jump icons */}
        <div className="phase-rail">
          {LP_SECTIONS.map(sec=>(
            <button key={sec.id}
              className={`phase-rail-item ${lpSection===sec.id?'active':''}`}
              onClick={()=>setSection(sec.id)}>
              {sec.icon}
              <span className={`pr-dot ${sec.done?'ok':''}`}/>
              <span className="pr-tip">{sec.label}</span>
            </button>
          ))}
        </div>

        {/* Contenido contextual del panel lateral */}
        <div ref={leftPanelScrollRef}
          style={{flex:1, overflowY:'auto', borderTop:'1px solid var(--salvi-line)', display: lpSection === 'zonas' ? 'none' : 'block'}}>
          {lpSection === 'entorno' && (
            <StepEnvironment form={form} onChange={onChange} osmFields={osmFields} onClearOsm={onClearOsm} onImportComplete={invalidateDerived}/>
          )}
          {lpSection === 'geometria' && (<>
            <StepGeometry form={form} onChange={onChange} osmFields={osmFields} onClearOsm={onClearOsm}/>
            <StepTraffic  form={form} onChange={onChange} result={result}
              osmFields={osmFields} onClearOsm={onClearOsm}/>
          </>)}
          {lpSection === 'luminarias' && (
            <LumConfigPanel
              lum={{...DEFAULT_LUM_CONFIG,...(form.lum_config||{})}}
              onChange={lum=>onChange('lum_config',{...(form.lum_config||{}),...lum})}
              roadWidthM={parseFloat(form.width_m)||10.5}
              heightM={parseFloat(form.height_m)||5.5}
              hParedM={parseFloat(form.H_pared_m)||3.0}
              tunnelShape={form.tunnel_shape||'horseshoe'}
            />
          )}
          {lpSection === 'control' && (
            <StepControl result={result} form={form} onChange={onChange}/>
          )}
          {lpSection === 'informe' && (
            <StepReport result={result} form={form} tubes={tubes} onChange={onChange}/>
          )}
        </div>

        {/* Slot: barra Directo/reflexiones/Calcular de la fase Luminarias (portal) */}
        {lpSection === 'luminarias' && (
          <div style={{padding:'0 10px 8px',flexShrink:0}}>
            <div ref={setLumToolbarSlot}/>
            <button type="button" className="calc-btn"
              onClick={()=>window.dispatchEvent(new CustomEvent('salvi:calculate-luminaires-full'))}
              style={{marginTop:6,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:7}}>
              <svg width="10" height="12" viewBox="0 0 10 12" fill="currentColor"><path d="M0 0L10 6L0 12V0Z"/></svg>
              Calcular total, solar y escenas
            </button>
          </div>
        )}

        {/* Footer: CIE 88 solo se recalcula desde Entorno/Geometría */}
        {(['entorno','geometria'].includes(lpSection)) && (
          <div className="lp-footer">
            {calcError && (
              <div style={{marginBottom:7,padding:'5px 8px',background:'#fef2f2',
                  color:'#b91c1c',fontSize:'.7rem',borderRadius:4,border:'1px solid #fecaca'}}>
                {calcError}
              </div>
            )}
            <button className="calc-btn" onClick={handleCalculate} disabled={calculating}>
              {calculating?'⏳ Calculando CIE 88…':'🔍 Calcular CIE 88:2004'}
            </button>
          </div>
        )}

        {/* Anterior / Siguiente */}
        <div className="lp-nav-btns">
          {/* ◀| Anterior */}
          <button
            className="lp-nav-btn"
            title="Anterior"
            disabled={LP_SECTIONS.findIndex(s=>s.id===lpSection)===0}
            onClick={()=>{
              const idx=LP_SECTIONS.findIndex(s=>s.id===lpSection);
              if(idx>0) setSection(LP_SECTIONS[idx-1].id);
            }}>
            <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              {/* barra vertical izquierda */}
              <rect x="3" y="4" width="2.5" height="14" rx="0.8"/>
              {/* triángulo apuntando izquierda */}
              <path d="M17 4.5L7.5 11L17 17.5V4.5Z"/>
            </svg>
          </button>
          {/* ▶| Siguiente */}
          <button
            className={`lp-nav-btn${LP_SECTIONS.findIndex(s=>s.id===lpSection)<LP_SECTIONS.length-1?' next-active':''}`}
            title={FORWARD_GATED.includes(LP_SECTIONS[LP_SECTIONS.findIndex(s=>s.id===lpSection)+1]?.id) && !cieReady
              ? 'Calcula primero la curva CIE 88:2004' : 'Siguiente'}
            disabled={LP_SECTIONS.findIndex(s=>s.id===lpSection)===LP_SECTIONS.length-1 ||
              (FORWARD_GATED.includes(LP_SECTIONS[LP_SECTIONS.findIndex(s=>s.id===lpSection)+1]?.id) && !cieReady)}
            onClick={()=>{
              const idx=LP_SECTIONS.findIndex(s=>s.id===lpSection);
              if(idx<LP_SECTIONS.length-1) setSection(LP_SECTIONS[idx+1].id);
            }}>
            <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              {/* triángulo apuntando derecha */}
              <path d="M5 4.5L14.5 11L5 17.5V4.5Z"/>
              {/* barra vertical derecha */}
              <rect x="16.5" y="4" width="2.5" height="14" rx="0.8"/>
            </svg>
          </button>
        </div>
      </div>

      {/* ── Resize handle ── */}
      <div className="lp-resizer" style={{gridRow:2}} onMouseDown={startLpResize}/>

      {/* ── Main Canvas — content driven by lpSection ── */}
      <div className="main-canvas">
        <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <ErrorBoundary key={lpSection}>{canvas}</ErrorBoundary>
        </div>
      </div>

      {/* ── Right Decision Panel ── */}
      <div className="right-panel">
        <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--salvi-grey)',
            textTransform:'uppercase',letterSpacing:'.08em',marginBottom:8}}>
          Decisión
        </div>
        {result?.success ? (
          <>
            {/* Lth Portal A */}
            <KpiCard
              label={`Lth · Portal ${form.portal_orientation||'A'}`}
              value={result.summary?.Lth?.toFixed(1)}
              unit="cd/m²" highlight/>
            {/* Lth Portal B — solo bidireccional cuando Lth_b difiere */}
            {form.traffic_direction === 'two_way' &&
             result.lth?.Lth_b != null &&
             result.lth?.Lth_b !== result.summary?.Lth && (
              <KpiCard
                label={`Lth · Portal ${result.lth?.orientation_b||'B'}`}
                value={Number(result.lth?.Lth_b).toFixed(1)}
                unit="cd/m²" highlight/>
            )}
            <KpiCard label="Clase túnel" value={result.lth?.tunnel_class} unit="OC 36"/>
            <KpiCard label="k_Lth" value={result.summary?.k_factor} unit="Lth/L20"/>
            <KpiCard label="Lin (interior)" value={result.summary?.Lin?.toFixed(1)}  unit="cd/m²"/>
            <KpiCard label="SD (distancia)" value={result.summary?.SD_m?.toFixed(0)} unit="m"/>
            {Number.isFinite(panelInstalledPowerKw) && panelInstalledPowerKw>0 && (
              <KpiCard label="P. instalada · Sol" value={panelInstalledPowerKw.toFixed(1)} unit="kW"
                title="Suma de la potencia de cada luminaria a su corriente individual en la escena Soleado."/>
            )}
            <div style={{marginTop:8,marginBottom:4}}>
              {Object.values(result.zones||{}).map(z=>(
                <div key={z.zone_type} style={{display:'flex',justifyContent:'space-between',
                    alignItems:'center',padding:'4px 0',
                    borderBottom:'1px solid var(--salvi-line)',fontSize:'.7rem'}}>
                  <span style={{fontWeight:600}}>{z.zone_name}</span>
                  <span style={{color:'var(--salvi-grey)'}}>{z.L_zone?.toFixed(1)} cd/m²</span>
                </div>
              ))}
            </div>
            <LumModelsSummary luminairesResult={form.luminaires_result}/>
            <div style={{marginTop:'auto',paddingTop:10,display:'flex',flexDirection:'column',gap:6}}>
              <button onClick={()=>setSection('luminarias')}
                style={{width:'100%',padding:'7px',fontSize:'.72rem',fontWeight:600,
                  border:'1px solid var(--salvi-black)',borderRadius:5,
                  background:'transparent',cursor:'pointer',color:'var(--salvi-black)'}}>
                💡 Calcular luminarias
              </button>
              <button onClick={()=>setSection('informe')}
                style={{width:'100%',padding:'7px',fontSize:'.72rem',fontWeight:600,
                  border:'1px solid var(--salvi-line)',borderRadius:5,
                  background:'transparent',cursor:'pointer',color:'var(--salvi-grey)'}}>
                📄 Generar informe
              </button>
            </div>
          </>
        ) : (
          <div style={{fontSize:'.74rem',color:'var(--salvi-grey)',textAlign:'center',
              marginTop:40,lineHeight:1.7}}>
            Introduce los parámetros<br/>y pulsa<br/>
            <b>Calcular CIE 88:2004</b><br/>
            para ver los resultados.
          </div>
        )}
      </div>

      {showHelp && <HelpPanel lang={lang} onClose={()=>setShowHelp(false)}/>}
      {showAiAssistant && <TunnelAiAssistant form={form} result={result} phase={lpSection}
        onChange={onChange} onClose={()=>setShowAiAssistant(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
