            <input type="number" min={0} max={2} step={0.01}
              value={form.energy_tariff_eur_kwh ?? 0.15}
              onChange={e=>onChange('energy_tariff_eur_kwh',Math.max(0,+e.target.value||0))}/>
          </Field>
          <Field label="Mínimo real del driver (%)"
                 hint="No se fuerza artificialmente: si la noche requiere menos, el cálculo avisará.">
            <input type="number" min={0.1} max={100} step={0.1} value={driverMin}
              onChange={e=>onChange('driver_min_dim_pct',Math.max(.1,+e.target.value||.1))}/>
          </Field>
          <Field label="Noche normal (cd/m²)"
                 hint="Por defecto coincide con Lin. Es editable y se valida como escena independiente.">
            <input type="number" min={0.5} max={5} step={0.1}
              value={form.night_normal_luminance_cd_m2 ?? result.summary?.L_night_normal ?? result.summary?.Lin ?? 2}
              onChange={e=>onChange('night_normal_luminance_cd_m2',Math.max(.5,+e.target.value||2))}/>
          </Field>
          <Field label="Noche reducida (cd/m²)"
                 hint="Segundo régimen de explotación; AEC emplea 1,0 cd/m² frente a 2,0 cd/m² normal.">
            <input type="number" min={0.5} max={5} step={0.1}
              value={form.night_reduced_luminance_cd_m2 ?? result.summary?.L_night_reduced ?? result.summary?.L_night ?? 1}
              onChange={e=>onChange('night_reduced_luminance_cd_m2',Math.max(.5,+e.target.value||1))}/>
          </Field>
        </div>
      </div>

      <div className="card">
        <div className="card-title">🔌 Arquitectura SmartEC y comunicaciones</div>
        <div className="form-grid col-2">
          <Field label="Sistema de control">
            <select value={topology} onChange={e=>{
              const next=e.target.value;
              onChange('control_topology',next);
              onChange('control_protocol',next==='smartec_wirepas'?'SmartEC':'DALI-continuous');
            }}>
              <option value="smartec_wirepas">SmartEC + Wirepas — nodo individual por luminaria</option>
              <option value="smartec_dali_wired">SmartEC + DALI cableado — direcciones y grupos</option>
            </select>
          </Field>
          {topology==='smartec_wirepas' ? (
            <Field label="Nodos por pasarela Wirepas">
              <input type="number" min={1} max={1000} step={1}
                value={form.wirepas_nodes_per_gateway??200}
                onChange={e=>onChange('wirepas_nodes_per_gateway',Math.max(1,+e.target.value||200))}/>
            </Field>
          ) : (
            <Field label="Máx. luminarias por línea DALI">
              <input type="number" min={1} max={64} step={1}
                value={form.dali_max_addresses_per_line??64}
                onChange={e=>onChange('dali_max_addresses_per_line',Math.max(1,Math.min(64,+e.target.value||64)))}/>
            </Field>
          )}
        </div>

        {topology==='smartec_wirepas' ? <div style={{padding:'9px 11px',border:'1px solid #86efac',borderRadius:7,background:'#f0fdf4',fontSize:'.72rem',lineHeight:1.5}}>
          <b>Wirepas individual.</b> {topologyPlan.devices.length} luminarias físicas / nodos ·
          {' '}{topologyPlan.gatewayCount} pasarela{topologyPlan.gatewayCount===1?'':'s'} estimada{topologyPlan.gatewayCount===1?'':'s'}.
          Cada nodo conserva su consigna por escena y puede regularse de forma independiente conforme a las verificaciones CIE 140 mostradas en Luminarias.
        </div> : <>
          <div className="form-grid col-2" style={{marginTop:8}}>
            <Field label="Longitud objetivo de grupo DALI (m)">
              <input type="number" min={5} max={300} step={5}
                value={form.dali_group_span_m??60}
                onChange={e=>onChange('dali_group_span_m',Math.max(5,Math.min(300,+e.target.value||60)))}/>
            </Field>
            <Field label="Cuadro / pasarela DALI en s (m)">
              <input type="number" min={0} max={Number(result.summary?.length_m||10000)} step={1}
                value={form.dali_cabinet_position_m??0}
                onChange={e=>onChange('dali_cabinet_position_m',Math.max(0,+e.target.value||0))}/>
            </Field>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:7,marginTop:8}}>
            <div style={{padding:'7px 9px',border:'1px solid #bfdbfe',borderRadius:6,background:'#eff6ff',fontSize:'.7rem'}}><b>{topologyPlan.lines.length}</b> líneas DALI</div>
            <div style={{padding:'7px 9px',border:'1px solid #bfdbfe',borderRadius:6,background:'#eff6ff',fontSize:'.7rem'}}><b>{topologyPlan.groups.length}</b> grupos propuestos</div>
            <div style={{padding:'7px 9px',border:'1px solid #bfdbfe',borderRadius:6,background:'#eff6ff',fontSize:'.7rem'}}><b>{topologyPlan.routeLengthM.toFixed(0)} m</b> de trazado de bus</div>
            <div style={{padding:'7px 9px',border:'1px solid #bfdbfe',borderRadius:6,background:'#eff6ff',fontSize:'.7rem'}}><b>{topologyPlan.conductorLengthM.toFixed(0)} m</b> de conductor (2 hilos)</div>
          </div>
          <div style={{overflowX:'auto',marginTop:8,border:'1px solid var(--salvi-line)',borderRadius:6}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.66rem'}}>
              <thead><tr style={{background:'#f8fafc'}}>{['Línea','Direcciones','Grupos','Tramo','Bus','Conductor'].map(label=><th key={label} style={{padding:'5px 7px',textAlign:label==='Línea'?'left':'right'}}>{label}</th>)}</tr></thead>
              <tbody>{topologyPlan.lines.map(line=><tr key={line.id} style={{borderTop:'1px solid var(--salvi-line)'}}>
                <td style={{padding:'5px 7px',fontWeight:700}}>DALI-{line.id}</td>
                <td style={{padding:'5px 7px',textAlign:'right'}}>{line.devices.length} / {topologyPlan.maxPerLine}</td>
                <td style={{padding:'5px 7px',textAlign:'right'}}>{line.groups.length} / 16</td>
                <td style={{padding:'5px 7px',textAlign:'right'}}>{line.sStart.toFixed(0)}–{line.sEnd.toFixed(0)} m</td>
                <td style={{padding:'5px 7px',textAlign:'right'}}>{line.routeLengthM.toFixed(0)} m</td>
                <td style={{padding:'5px 7px',textAlign:'right'}}>{line.conductorLengthM.toFixed(0)} m</td>
              </tr>)}</tbody>
            </table>
          </div>
          <div style={{fontSize:'.62rem',color:'#1e3a8a',marginTop:6,lineHeight:1.4}}>
            Agrupación contigua por capa, zona y tramo. El trazado es una estimación lineal desde el cuadro; debe ajustarse al recorrido real de bandejas. Esta propuesta no altera las consignas individuales: antes de convertir una agrupación en consignas comunes habrá que revalidar CIE 140.
          </div>
        </>}
      </div>

      <div className="card">
        <div className="card-title">💡 Arquitectura física objetivo</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:10}}>
          <div style={{padding:12,border:'1px solid #86efac',borderRadius:7,background:'#f0fdf4'}}>
            <div style={{fontWeight:700,fontSize:'.82rem'}}>BASE permanente</div>
            <div style={{fontSize:'.76rem',marginTop:5}}>
              A–B · día {strategy.base_day_target_cd_m2 ?? result.summary?.Lin} cd/m² ·
              noche normal {strategy.base_night_normal_target_cd_m2 ?? result.summary?.L_night_normal ?? result.summary?.Lin} cd/m² ·
              reducida {strategy.base_night_reduced_target_cd_m2 ?? result.summary?.L_night_reduced ?? result.summary?.L_night} cd/m²
            </div>
            <div style={{fontSize:'.72rem',color:'#4b5563',marginTop:4}}>No se apaga · {base?.dimming_levels?.['5'] ?? '—'} % de noche</div>
          </div>
          <div style={{padding:12,border:'1px solid #fdba74',borderRadius:7,background:'#fff7ed'}}>
            <div style={{fontWeight:700,fontSize:'.82rem'}}>Refuerzo boca A</div>
            <div style={{fontSize:'.76rem',marginTop:5}}>{refsA.length} grupos de cálculo local</div>
            <div style={{fontSize:'.72rem',color:'#4b5563',marginTop:4}}>Regulación continua · OFF nocturno</div>
          </div>
          <div style={{padding:12,border:'1px solid #93c5fd',borderRadius:7,background:'#eff6ff'}}>
            <div style={{fontWeight:700,fontSize:'.82rem'}}>Refuerzo boca B</div>
            <div style={{fontSize:'.76rem',marginTop:5}}>{refsB.length ? `${refsB.length} grupos de cálculo local` : 'No aplica en este sentido'}</div>
            <div style={{fontSize:'.72rem',color:'#4b5563',marginTop:4}}>{refsB.length ? 'Sensor y regulación independientes' : '—'}</div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">📋 Consignas de respaldo por escena</div>
        <div style={{overflowX:'auto'}}>
          <table className="result-table">
            <thead><tr>
              <th>Grupo / capa</th>
              {scenes.map(s=><th key={s.scene_id} style={{textAlign:'center'}}>
                {s.name}<div className="scene-l20">A {s.L20} · B {s.L20_b} cd/m²</div>
              </th>)}
            </tr></thead>
            <tbody>
              {groups.map(g=><tr key={g.group_id}>
                <td>
                  <div style={{fontWeight:600,fontSize:'.77rem'}}>{g.name}</div>
                  <div style={{fontSize:'.68rem',color:'#6b7280'}}>
                    {g.layer==='permanent'?'BASE permanente':`Refuerzo ${g.portal}`}
                  </div>
                </td>
                {scenes.map(s=>{
                  const pct=g.dimming_levels?.[String(s.scene_id)] ?? 0;
                  const dali=g.dali_levels?.[String(s.scene_id)] ?? 0;
                  return <td key={s.scene_id} style={{textAlign:'center',fontSize:'.75rem'}}>
                    <strong>{pct}%</strong><div style={{fontSize:'.66rem',color:'#6b7280'}}>DALI {dali}</div>
                  </td>;
                })}
              </tr>)}
            </tbody>
          </table>
        </div>
      </div>

      {primaryCurve && <div className="chart-card">
        <div className="chart-card-title">{primaryCurve.group_name} — regulación continua</div>
        <RegulationCurveChart curve={primaryCurve}/>
      </div>}

      {(control.warnings||[]).map((warning,index)=>
        <Alert type="warning" key={index}>{warning}</Alert>
      )}

      <div className="card">
        <div className="card-title">✅ Estado del control</div>
        <div style={{fontSize:'.79rem',lineHeight:1.7}}>
          La instalación física permanece bloqueada. Las escenas verificadas
          muestran las consignas reales, potencia operativa y resultados
          <strong> L, U0, Ul y TI</strong> antes de generar el informe.
        </div>
        <button className="btn btn-outline" style={{marginTop:10}} onClick={handleExport}>
          ⬇️ Exportar plan multiescenario JSON
        </button>
      </div>
    </div>
  );
}

function ProfileChart({
  chartData, tunnelLength, Lth, Lin, zones, actualPoints,
  denseActual=false, selectedS=null, showLthReference=true,
  requiredLabel='L requerida CIE 88',
  actualLegend='Lavg de cada campo CIE 140 entre luminarias consecutivas, para el observador más desfavorable, superpuesta a Lreq CIE 88',
  overlayScenes=[],
}) {
  if (!chartData || !chartData.data || chartData.data.length === 0) {
    return <div style={{textAlign:"center",color:"#999",padding:"40px"}}>Sin datos de perfil</div>;
  }
  const { data } = chartData;

  // ── Zone metadata ────────────────────────────────────────────────
  const ZONE_LABELS = {
    ACCESS:'Acceso', THRESHOLD:'Umbral A', TRANSITION:'Trans. A',
    INTERIOR:'Interior', TRANSITION_B:'Trans. B', THRESHOLD_B:'Umbral B',
    EXIT:'Salida', PARTING:'Post-salida'
  };
  const ZONE_FILL = {
    ACCESS:'#f3f4f6', THRESHOLD:'#fef3c7', TRANSITION:'#e0f2fe',
    INTERIOR:'#d1fae5', TRANSITION_B:'#bae6fd', THRESHOLD_B:'#fef9c3',
    EXIT:'#ede9fe', PARTING:'#f3f4f6'
  };
  const ZONE_STROKE = {
    ACCESS:'#9ca3af', THRESHOLD:'#d97706', TRANSITION:'#0891b2',
    INTERIOR:'#059669', TRANSITION_B:'#0284c7', THRESHOLD_B:'#ca8a04',
    EXIT:'#7c3aed', PARTING:'#9ca3af'
  };
  const ZONE_ORDER = zones
    ? Object.keys(zones).filter(k=>zones[k]).sort((a,b)=>zones[a].s_start-zones[b].s_start).map(k=>k.toUpperCase())
    : ['ACCESS','THRESHOLD','TRANSITION','INTERIOR','EXIT','PARTING'];

  // ── Interior compression ────────────────────────────────────────
  // If interior zone is wide, compress it to INT_MAX display-units
  const INT_MAX = 250; // max visual width for interior (in s-units)
  let intStart = null, intEnd = null;
  if (zones?.interior) { intStart = zones.interior.s_start; intEnd = zones.interior.s_end; }
  else {
    // derive from data
    const intPts = data.filter(d=>d.zone.toUpperCase()==='INTERIOR');
    if (intPts.length > 1) { intStart = intPts[0].s; intEnd = intPts[intPts.length-1].s; }
  }
  const intLen = (intStart!=null && intEnd!=null) ? intEnd - intStart : 0;
  const doCompress = intLen > INT_MAX + 50;
  const compRatio  = doCompress ? INT_MAX / intLen : 1;

  const cS = (s) => {
    if (!doCompress || intStart == null) return s;
    if (s <= intStart) return s;
    if (s >= intEnd)   return intStart + INT_MAX + (s - intEnd);
    return intStart + (s - intStart) * compRatio;
  };
  const realS = (cs) => {
    if (!doCompress || intStart == null) return cs;
    if (cs <= intStart) return cs;
    const intEndC = intStart + INT_MAX;
    if (cs <= intEndC) return intStart + (cs - intStart) / compRatio;
    return intEnd + (cs - intEndC);
  };

  // ── Build unified dataset (one row per s, one column per zone) ──
  const zonesPresent = [...new Set(data.map(d=>d.zone.toUpperCase()))].filter(z=>ZONE_ORDER.includes(z)).sort((a,b)=>ZONE_ORDER.indexOf(a)-ZONE_ORDER.indexOf(b));
  const unified = data.map((pt,i)=>{
    const zone=pt.zone.toUpperCase(); const row={s:cS(pt.s), sReal:pt.s};
    zonesPresent.forEach(z=>{row[z]=null;}); row[zone]=pt.L;
    if(i>0){const prev=data[i-1].zone.toUpperCase(); if(prev!==zone&&zonesPresent.includes(prev))row[prev]=pt.L;}
    if(i<data.length-1){const next=data[i+1].zone.toUpperCase(); if(next!==zone&&zonesPresent.includes(next))row[next]=pt.L;}
    return row;
  });

  // ── Custom tick: show real s values ────────────────────────────
  const tickFormatter = (val) => {
    const r = Math.round(realS(val));
    return r + ' m';
  };

  // ── Lavg calculada por campo CIE 140 — superpuesta sobre la curva
  //    requerida CIE 88, usando el mismo eje comprimido cS(). Cada valor se
  //    sitúa en el centro de su campo y se une linealmente al siguiente, igual
  //    que en el informe Word. No se prolonga como escalón por toda la celda.
  const hasActual = actualPoints && actualPoints.length > 0;
  const positiveProfileValues = [
    ...data.map(point=>Number(point.L)),
    ...(actualPoints||[]).map(point=>Number(point.L)),
  ].filter(value=>Number.isFinite(value)&&value>0);
  const minimumPositive = positiveProfileValues.length
    ? Math.min(...positiveProfileValues) : 1;
  // En crepúsculo y noche Lcalc puede quedar por debajo de Lin diurna. El
  // límite anterior ocultaba por completo la serie roja en la escala log.
  const yFloor = Math.max(0.01,minimumPositive*0.75);
  const yTicks = [
    0.02,0.05,0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000,
  ].filter(value=>value>=yFloor);
  if (hasActual && unified.length > 0) {
    const assignActual = (row, p) => {
      // En campos solapados (p. ej. disposicion bilateral alternada),
      // representa el resultado mas desfavorable.
      if (row._ACTUAL!=null && Number(row._ACTUAL)<=Number(p.L)) return;
      row._ACTUAL      = p.L;
      row._ACTUAL_LREQ = p.Lreq ?? null;
      row._ACTUAL_U0   = p.U0 ?? null;
      row._ACTUAL_UL   = p.Ul ?? null;
      row._ACTUAL_FIELD_START = p.field_start ?? null;
      row._ACTUAL_FIELD_END   = p.field_end ?? null;
    };
    const validActual = actualPoints.filter(p => p && p.s != null && p.L != null);
    validActual.forEach(p => {
      const target = cS(p.s);
      let bestIdx = 0, bestDist = Infinity;
      for (let i = 0; i < unified.length; i++) {
        const dist = Math.abs(unified[i].s - target);
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
      }
      assignActual(unified[bestIdx], p);
      unified[bestIdx].sReal = p.s;
    });
  }
  // Curvas Lreq de las demas escenas (overlay): una columna por escena.
  overlayScenes.forEach(ov=>{
    const ovCol='_OV_'+ov.key;
    (ov.points||[]).forEach(p=>{
      if(!p || p.s==null || p.L==null || !unified.length) return;
      const target=cS(Number(p.s));
      let bestIdx=0,bestDist=Infinity;
      for(let i=0;i<unified.length;i++){
        const dist=Math.abs(unified[i].s-target);
        if(dist<bestDist){bestDist=dist;bestIdx=i;}
      }
      unified[bestIdx][ovCol]=Number(p.L);
    });
  });

  // ── Zone bar data — sorted by s_start, includes B-zones ──────────
  const zoneBarItems = zones
    ? Object.keys(zones).filter(k=>zones[k])
        .sort((a,b)=>zones[a].s_start-zones[b].s_start)
        .map(key => {
          const z = zones[key];
          const dispLen = Math.max(1, cS(z.s_end) - cS(z.s_start));
          return { key, z, dispLen,
            label: ZONE_LABELS[key.toUpperCase()] || key,
            lenStr: doCompress && key==='interior' ? `${intLen.toFixed(0)} m ✂` : `${z.length?.toFixed(0)||'?'} m`,
            color: ZONE_STROKE[key.toUpperCase()] || '#9ca3af',
          };
        })
    : [];

  // left margin of recharts chart (YAxis) ≈ 50px; right margin ≈ 95px
  const CHART_LEFT_PX  = 50;
  const CHART_RIGHT_PX = 95;

  return (
    <div style={{width:"100%"}}>
      {overlayScenes.length>0 && (
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:4,fontSize:'.66rem',color:'#64748b'}}>
          {overlayScenes.map(ov=>(
            <span key={ov.key} style={{display:'inline-flex',alignItems:'center',gap:4}}>
              <span style={{display:'inline-block',width:14,height:0,borderTop:`2px dashed ${ov.color}`}}/>
              {ov.label}
            </span>
          ))}
        </div>
      )}
      {hasActual && (
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,fontSize:'.68rem',color:'#64748b'}}>
          <span style={{display:'inline-block',width:14,height:2,background:'#dc2626'}}/>
          <span>{actualLegend}</span>
        </div>
      )}
      <div style={{height:320}}>
        <ResponsiveContainer>
          <ComposedChart data={unified} margin={{top:10,right:95,left:10,bottom:10}}>
            {/* Zone background bands */}
            {zones && ZONE_ORDER.map(zk => {
              const z = zones[zk.toLowerCase()]; if(!z) return null;
              return <ReferenceArea key={zk} x1={cS(z.s_start)} x2={cS(z.s_end)}
                fill={ZONE_FILL[zk]||'#f9f9f9'} fillOpacity={0.55} stroke="none"/>;
            })}

            {/* Marca del "corte" de compresión de la zona interior */}
            {doCompress && (
              <ReferenceLine x={intStart + INT_MAX} stroke="#94a3b8" strokeWidth={1.5}
                strokeDasharray="2 3"
                label={{value:`✂ ${intLen.toFixed(0)} m comprimidos`, position:"top",
                        fontSize:9, fill:"#64748b", fontWeight:600}}/>
            )}

            <CartesianGrid strokeDasharray="3 3" stroke="#E8E2D8"/>
            <XAxis dataKey="s" type="number" tickFormatter={tickFormatter} tick={{fontSize:9}}
              tickCount={doCompress?10:14}
              domain={[0, cS(tunnelLength || data[data.length-1]?.s || 0)]}/>
            <YAxis label={{value:"L (cd/m²) — escala log",angle:-90,position:"insideLeft",offset:10,fontSize:11}}
              tick={{fontSize:10}} scale="log" domain={[yFloor, 'auto']}
              allowDataOverflow={true}
              ticks={yTicks}
              tickFormatter={(v)=>Number(v)>=1?Math.round(v):v}/>

            <Tooltip content={({active,payload,label})=>{
              if(!active||!payload)return null;
              const pts=payload.filter(p=>p.value!=null); if(!pts.length)return null;
              const actualRow = payload.find(p=>p.dataKey==='_ACTUAL' && p.value!=null)?.payload;
              const pt = pts.find(p=>p.dataKey!=='_ACTUAL') || pts[0];
              const realM = Math.round(realS(label));
              return (
                <div style={{background:'#fff',border:`2px solid ${pt.color}`,borderRadius:5,padding:'7px 11px',fontSize:12}}>
                  <div style={{fontWeight:700,marginBottom:3}}>s = {realM} m</div>
                  <div style={{color:pt.color}}>{ZONE_LABELS[pt.dataKey]||pt.dataKey}</div>
                  <div style={{color:'#333',marginTop:2}}>{requiredLabel} = <strong>{Number(pt.value).toFixed(1)} cd/m²</strong></div>
                  {actualRow && actualRow._ACTUAL!=null && (
                    <div style={{marginTop:5,paddingTop:5,borderTop:'1px dashed #e2e8f0'}}>
                      <div style={{color:'#dc2626',fontWeight:600}}>Lavg calculada CIE 140</div>
                      <div style={{color:'#333'}}>Lavg = <strong>{Number(actualRow._ACTUAL).toFixed(1)} cd/m²</strong></div>
                      {actualRow._ACTUAL_FIELD_START!=null && actualRow._ACTUAL_FIELD_END!=null && (
                        <div style={{color:'#64748b'}}>
                          Campo: {Number(actualRow._ACTUAL_FIELD_START).toFixed(1)}–{Number(actualRow._ACTUAL_FIELD_END).toFixed(1)} m
                        </div>
                      )}
                      {actualRow._ACTUAL_LREQ!=null && <div style={{color:'#333'}}>L req. = {Number(actualRow._ACTUAL_LREQ).toFixed(1)} cd/m²</div>}
                      {actualRow._ACTUAL_U0!=null && <div style={{color:'#333'}}>U0 = {Number(actualRow._ACTUAL_U0).toFixed(3)}</div>}
                      {actualRow._ACTUAL_UL!=null && <div style={{color:'#333'}}>Ul = {Number(actualRow._ACTUAL_UL).toFixed(3)}</div>}
                    </div>
                  )}
                </div>
              );
            }}/>

            {zonesPresent.map(zone=>(
              <Area key={zone} type="monotone" dataKey={zone} name={zone}
                fill={ZONE_COLORS[zone]||"#aaa"} stroke={ZONE_COLORS[zone]||"#aaa"}
                fillOpacity={0.5} strokeWidth={2.5} connectNulls={false} dot={false}
                legendType="none" activeDot={{r:4,strokeWidth:0}}/>
            ))}

            {selectedS!=null && Number.isFinite(Number(selectedS)) && (
              <ReferenceLine x={cS(Number(selectedS))} stroke="#7c3aed" strokeWidth={2.5}
                label={{value:`Centro campo · ${Number(selectedS).toFixed(1)} m`,
                        position:'insideTopRight',fontSize:10,fill:'#6d28d9',fontWeight:700}}/>
            )}

            {showLthReference && (
              <ReferenceLine y={Lth} stroke="#f39c12" strokeDasharray="6 3" strokeWidth={1.5}
                label={{value:`Lth en boca = ${Math.round(Lth)} cd/m²`,position:"right",fontSize:10,fill:"#c87f0a",fontWeight:600}}/>
            )}
            <ReferenceLine y={Lin} stroke="#27ae60" strokeDasharray="6 3" strokeWidth={1.5}
              label={{value:`Lin = ${Lin!=null?Lin.toFixed(1):'—'} cd/m²`,position:"right",fontSize:10,fill:"#1e8449",fontWeight:600}}/>

            {/* Overlay: curvas Lreq de las demas escenas (lineas finas). */}
            {overlayScenes.map(ov=>(
              <Line key={ov.key} type="linear" dataKey={`_OV_${ov.key}`}
                name={ov.label} stroke={ov.color} strokeWidth={1.4}
                strokeDasharray="5 4" dot={false} connectNulls={true}
                legendType="none" isAnimationActive={false}/>
            ))}
            {/* Se dibuja al final para que Lcalc siga siendo visible cuando
                coincide con Lin (frecuente en crepusculo y noche). */}
            {hasActual && (
              <Line type="linear" dataKey="_ACTUAL" name="Lavg CIE 140"
                stroke="#dc2626" strokeWidth={3}
                dot={denseActual ? false : {r:2.5,fill:'#dc2626',strokeWidth:0}}
                connectNulls={true} activeDot={{r:5,strokeWidth:0}} isAnimationActive={false}/>
            )}
          </ComposedChart>
        </ResponsiveContainer>
      </div>

      {/* ── Zone label strip (HTML, always visible) ── */}
      {zoneBarItems.length > 0 && (
        <div style={{display:'flex', marginLeft:CHART_LEFT_PX, marginRight:CHART_RIGHT_PX, marginTop:2}}>
          {zoneBarItems.map(({key, dispLen, label, lenStr, color, bg}) => (
            <div key={key} style={{
              flex: dispLen,
              borderTop: `3px solid ${color}`,
              padding: '3px 2px 0',
              textAlign: 'center',
              overflow: 'hidden',
              minWidth: 0,
            }}>
              <div style={{fontSize:'9px', fontWeight:700, color, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>
                {label}
              </div>
              <div style={{fontSize:'8px', color:'#94a3b8', whiteSpace:'nowrap'}}>
                {lenStr}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Perfil fÃ­sico compartido con el informe Word. La fuente es siempre
// `real_profile` (campos CIE 140), nunca las consignas estimadas de DALI.
// Esto evita que la curva de la fase Luminarias y la del informe representen
// magnitudes distintas o usen muestras de posiciones diferentes.
function PhysicalLuminanceProfile({
  result, profile, zones=null, selectedS=null, Lth=null, Lin=null,
  chartData=null,
  title='Perfil fisico CIE 140 - igual al informe',
  actualLegend='Lavg CIE 140 calculada - mismo perfil fisico que el informe',
}) {
  const activeChart=chartData||result?.chart;
  if (!activeChart?.data?.length) return null;
  if (!profile?.available || profile.metric !== 'CIE140_Lavg') return null;

  // El informe utiliza `points`; en escenas antiguas puede faltar alguno y
  // entonces se conserva el registro canÃ³nico de `fields` como respaldo.
  const source = Array.isArray(profile.points) && profile.points.length
    ? profile.points
    : (Array.isArray(profile.fields) ? profile.fields : []);
  const actualPoints = source.map(point => ({
    s: Number(point?.s),
    L: Number(point?.Lavg_governing ?? point?.L ?? point?.Lavg),
    field_start: point?.field_start,
    field_end: point?.field_end,
    Lreq: point?.L_required ?? point?.Lreq ?? null,
    U0: point?.U0,
    Ul: point?.Ul,
  })).filter(point => Number.isFinite(point.s)
    && Number.isFinite(point.L) && point.L > 0);
  if (!actualPoints.length) return null;

  return (
    <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--salvi-line)'}}>
      <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--salvi-grey)',
                   marginBottom:4,textTransform:'uppercase',letterSpacing:'.07em'}}>
        {title}
      </div>
      <div style={{fontSize:'.64rem',color:'#64748b',marginBottom:5}}>
        Lavg de cada campo bidimensional entre luminarias consecutivas; curva roja y
        valores exactamente los usados en el capitulo 4 del informe.
      </div>
      <ProfileChart
        chartData={activeChart}
        tunnelLength={result.summary?.length_m}
        Lth={Lth ?? result.summary?.Lth}
        Lin={Lin ?? result.summary?.Lin}
        zones={zones ?? result.zones}
        actualPoints={actualPoints}
        denseActual={true}
        selectedS={selectedS}
        actualLegend={actualLegend}
      />
    </div>
  );
}

                       style={{borderTop:'1px solid var(--salvi-line)',

              <td style={{padding:'5px 7px',...metricStyle(lOk)}}>{Number(row.L_avg).toFixed(2)}</td>
              <td style={{padding:'5px 7px',textAlign:'right',color:'#64748b'}}>{Number(row.L_required).toFixed(2)}</td>
              <td style={{padding:'5px 7px',...metricStyle(u0Ok)}}>{Number(row.U0).toFixed(3)}</td>

              <td style={{padding:'5px 7px',textAlign:'right',color:'#64748b'}}>{Number(row.critical_s_m).toFixed(1)} m</td>

      <div style={{padding:'5px 9px',fontSize:'.60rem',color:'#64748b'}}>
