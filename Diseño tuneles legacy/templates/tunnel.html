          </div>
        )}
        {mapMode==='terrain3d'&&(
          <div style={{position:'absolute',top:10,left:10,zIndex:600,background:'rgba(30,30,30,.78)',color:'#fff',borderRadius:5,padding:'4px 10px',fontSize:'.65rem'}}>
            🖱 Arrastrar: mover · Ctrl+arrastrar: inclinar · Rueda: zoom
            {activeTool==='measure' ? ' · 📏 Clic para medir' : ''}
          </div>
        )}

        {/* ── Tunnel table (floating bottom) ── */}
        {showTunTable&&tunnelList.length>0&&(
          <TunnelFloatPanel
            tunnelList={tunnelList} selTunnel={selTunnel}
            tunFilter={tunFilter} setTunFilter={setTunFilter}
            tunTypeFilter={tunTypeFilter} setTunTypeFilter={setTunTypeFilter}
            selectTunnel={selectTunnel} removeTunnelFromList={removeTunnelFromList}
            importTunnel={importTunnel} setShowTunTable={setShowTunTable}
            tunColor={tunColor} selectedSet={selectedSet}
            selectAllTunnels={selectAllTunnels} clearTunnelSelection={clearTunnelSelection}
          />
        )}
      </div>
    </div>
  );
}
// ── Componente: preview de sección transversal del túnel ──────────────────
function TunnelSectionPreview({ form, lumConfig=null }) {
  const W     = parseFloat(form.width_m)   || 10.5;
  const H     = parseFloat(form.height_m)  || 5.5;
  const shape = form.tunnel_shape || 'horseshoe';
  const Hp    = Math.min(parseFloat(form.H_pared_m) ?? 3.0, H);

  // Wall offset + mount height from lum config (optional)
  const wo    = lumConfig ? Math.max(0.05, parseFloat(lumConfig.wall_offset_m)  || 0.30) : null;
  const hm    = lumConfig ? Math.min(H,   parseFloat(lumConfig.mounting_height_m) || 4.5) : null;
  const arr   = lumConfig ? (lumConfig.arrangement || 'central_single') : null;

  // Carriles pintados: carril/arcén son campos de Geometría, independientes de lumConfig.
  const numLanes = Math.max(1, parseInt(form.num_lanes) || 2);
  const laneW    = parseFloat(form.lane_width_m)     || 3.5;
  const shLeft   = Math.max(0, parseFloat(form.shoulder_left_m)  || 0);
  const shRight  = Math.max(0, parseFloat(form.shoulder_right_m) || 0);
  const swLeft   = Math.max(0, parseFloat(form.sidewalk_left_m)  || 0);
  const swRight  = Math.max(0, parseFloat(form.sidewalk_right_m) || 0);
  const carriagewayStart_m = swLeft;
  const laneStart_m = swLeft + shLeft;
  const laneEnd_m   = Math.min(W, laneStart_m + numLanes * laneW);
  const carriagewayEnd_m   = Math.min(W, laneEnd_m + shRight);
  const laneDividers_m = Array.from({length: Math.max(0, numLanes - 1)},
    (_, i) => laneStart_m + (i + 1) * laneW).filter(y => y > 0 && y < W);

  const SVG_W = 420, SVG_H = 180;
  const mg = { l:44, r:16, t:14, b:20 };
  const tW = SVG_W - mg.l - mg.r;
  const tH = SVG_H - mg.t - mg.b;
  const sc = Math.min(tW / (W + 2), tH / (H + 1));
  const tw = W * sc, th = H * sc;
  const ox = mg.l + (tW - tw) / 2;
  const oy = mg.t + (tH - th);
  const roadH = 5;
  const roadY = oy + th - roadH;

  // Arch geometry
  const wallH_px = (Hp / H) * th;
  const archH_px = th - wallH_px;
  let tunnelPath;
  if (shape === 'rectangular') {
    tunnelPath = `M ${ox} ${oy} L ${ox} ${oy+th} L ${ox+tw} ${oy+th} L ${ox+tw} ${oy} Z`;
  } else if (shape === 'circular') {
    // Sección circular: galería perforada. R calculado de W y H.
    const R_m = ((W/2)**2 + H**2) / (2*H);
    const R_px = R_m * sc;
    const z_ctr = H - R_m;   // positivo si centro por encima de calzada
    const largeArc = z_ctr >= -0.001 ? 1 : 0;
    // Arco desde pared izq a pared der pasando por la clave, cerrado por la calzada
    tunnelPath = `M ${ox} ${oy+th} A ${R_px} ${R_px} 0 ${largeArc} 1 ${ox+tw} ${oy+th} Z`;
  } else {
    // Horseshoe: straight walls + semi-elliptical arch
    const ax = ox + tw / 2, ay = oy + archH_px;
    const rx = tw / 2, ry = archH_px;
    tunnelPath = `M ${ox} ${oy+th} L ${ox} ${ay} A ${rx} ${ry} 0 0 1 ${ox+tw} ${ay} L ${ox+tw} ${oy+th} Z`;
  }

  // Luminaire positions in pixels (only if lumConfig provided). El tilt real
  // varía por posición a lo largo del túnel (curva CIE 88) — mostrar aquí un
  // único ángulo representativo puede despistar, así que la luminaria se
  // dibuja siempre horizontal (sin rotación).
  const lumPts = [];
  let outsideWarning = false;
  let transverseDist_m = null;   // distancia entre las 2 luminarias de esta sección (si aplica)
  if (arr && wo !== null && hm !== null) {
    const pts = luminaireYPositions(arr, W, wo).map(yM => [yM, hm]);

    if (pts.length === 2) transverseDist_m = Math.abs(pts[1][0] - pts[0][0]);

    pts.forEach(([yM, zM]) => {
      const px = ox + (yM / W) * tw;
      const py = roadY - (zM / H) * th;
      // Inside check
      let inside = (zM >= 0 && zM <= H && yM >= 0 && yM <= W);
      if (inside && shape === 'horseshoe' && zM > Hp) {
        const a = W / 2, b = H - Hp;
        if (b > 0) inside = ((yM - W/2)**2 / a**2 + (zM - Hp)**2 / b**2) <= 1.02;
      }
      if (!inside) outsideWarning = true;
      lumPts.push({ px, py, inside });
    });
  }

  // Dimension lines helpers
  const dimLine = (x1,y1,x2,y2,label,lx,ly,rot=0) => (
    React.createElement(React.Fragment, null,
      React.createElement('line', {x1,y1,x2,y2,stroke:'#64748b',strokeWidth:0.8,strokeDasharray:'3 2'}),
      React.createElement('text', {x:lx,y:ly,fill:'#94a3b8',fontSize:8,textAnchor:'middle',
        transform:rot?`rotate(${rot},${lx},${ly})`:undefined}, label)
    )
  );

  return (
    <div style={{marginTop:10,background:'#0f172a',borderRadius:8,padding:'8px 10px',border:'1px solid #1e293b'}}>
      <div style={{fontSize:'.66rem',fontWeight:700,color:'#64748b',marginBottom:6,letterSpacing:'.07em',textTransform:'uppercase'}}>
        Vista de sección transversal
      </div>
      <svg viewBox={`0 0 ${SVG_W} ${SVG_H}`} style={{width:'100%',height:'auto',display:'block'}}>
        {/* Ground */}
        <rect x={0} y={roadY+roadH} width={SVG_W} height={SVG_H-(roadY+roadH)+1} fill="#1e293b"/>
        {/* Tunnel body */}
        <path d={tunnelPath} fill="#1e293b" stroke="#334155" strokeWidth="1.5"/>
        {/* Road */}
        <rect x={ox} y={roadY} width={tw} height={roadH} fill="#374151"/>
        {/* Aceras: superficie física independiente, no malla L/U0/Ul de calzada */}
        {swLeft > 0.01 && <rect x={ox} y={roadY} width={(swLeft/W)*tw} height={roadH} fill="#64748b"/>}
        {swRight > 0.01 && <rect x={ox+tw-(swRight/W)*tw} y={roadY} width={(swRight/W)*tw} height={roadH} fill="#64748b"/>}
        {/* Carriles pintados — borde de calzada (continuo) + separadores de carril (discontinuos) */}
        {carriagewayStart_m > 0.01 && (
          <line x1={ox+(carriagewayStart_m/W)*tw} y1={roadY} x2={ox+(carriagewayStart_m/W)*tw} y2={roadY+roadH}
            stroke="#f8fafc" strokeWidth="1"/>
        )}
        {carriagewayEnd_m < W - 0.01 && (
          <line x1={ox+(carriagewayEnd_m/W)*tw} y1={roadY} x2={ox+(carriagewayEnd_m/W)*tw} y2={roadY+roadH}
            stroke="#f8fafc" strokeWidth="1"/>
        )}
        {laneStart_m > carriagewayStart_m + 0.01 && (
          <line x1={ox+(laneStart_m/W)*tw} y1={roadY} x2={ox+(laneStart_m/W)*tw} y2={roadY+roadH}
            stroke="#cbd5e1" strokeWidth="0.7" opacity=".8"/>
        )}
        {laneEnd_m < carriagewayEnd_m - 0.01 && (
          <line x1={ox+(laneEnd_m/W)*tw} y1={roadY} x2={ox+(laneEnd_m/W)*tw} y2={roadY+roadH}
            stroke="#cbd5e1" strokeWidth="0.7" opacity=".8"/>
        )}
        {laneDividers_m.map((yM,i)=>(
          <line key={i} x1={ox+(yM/W)*tw} y1={roadY} x2={ox+(yM/W)*tw} y2={roadY+roadH}
            stroke="#f8fafc" strokeWidth="0.8" strokeDasharray="2 1.5" opacity="0.85"/>
        ))}
        {/* Arch / wall division (horseshoe only) */}
        {shape==='horseshoe' && Hp > 0 && Hp < H && (
          <line x1={ox} y1={oy+archH_px} x2={ox+tw} y2={oy+archH_px}
            stroke="#334155" strokeWidth="0.6" strokeDasharray="4 3" opacity="0.6"/>
        )}
        {shape==='circular' && (
          <React.Fragment>
            {/* Radio label */}
            {(()=>{const R_m=((W/2)**2+H**2)/(2*H);const R_px=R_m*sc;
              return <text x={ox+tw/2} y={oy+th/2+4} textAnchor="middle" fill="#475569" fontSize="8" opacity="0.8">
                R = {R_m.toFixed(2)} m
              </text>;})()}
          </React.Fragment>
        )}
        {/* Width dimension */}
        <line x1={ox} y1={roadY+roadH+8} x2={ox+tw} y2={roadY+roadH+8} stroke="#64748b" strokeWidth="0.8"/>
        <line x1={ox} y1={roadY+roadH+4} x2={ox} y2={roadY+roadH+12} stroke="#64748b" strokeWidth="0.8"/>
        <line x1={ox+tw} y1={roadY+roadH+4} x2={ox+tw} y2={roadY+roadH+12} stroke="#64748b" strokeWidth="0.8"/>
        <text x={ox+tw/2} y={roadY+roadH+18} textAnchor="middle" fill="#94a3b8" fontSize="9">W = {W.toFixed(1)} m</text>
        {/* Height dimension */}
        <line x1={ox-8} y1={oy} x2={ox-8} y2={roadY} stroke="#64748b" strokeWidth="0.8"/>
        <line x1={ox-12} y1={oy} x2={ox-4} y2={oy} stroke="#64748b" strokeWidth="0.8"/>
        <line x1={ox-12} y1={roadY} x2={ox-4} y2={roadY} stroke="#64748b" strokeWidth="0.8"/>
        <text x={ox-22} y={oy+(roadY-oy)/2+3} textAnchor="middle" fill="#94a3b8" fontSize="9"
          transform={`rotate(-90,${ox-22},${oy+(roadY-oy)/2+3})`}>H = {H.toFixed(1)} m</text>
        {/* H_pared dimension (horseshoe only) */}
        {shape==='horseshoe' && Hp>0 && Hp<H && (
          <React.Fragment>
            <line x1={ox+tw+6} y1={oy+archH_px} x2={ox+tw+6} y2={roadY} stroke="#475569" strokeWidth="0.7"/>
            <line x1={ox+tw+3} y1={oy+archH_px} x2={ox+tw+9} y2={oy+archH_px} stroke="#475569" strokeWidth="0.7"/>
            <line x1={ox+tw+3} y1={roadY} x2={ox+tw+9} y2={roadY} stroke="#475569" strokeWidth="0.7"/>
            <text x={ox+tw+22} y={oy+archH_px+(roadY-oy-archH_px)/2+3} textAnchor="middle" fill="#64748b" fontSize="8"
              transform={`rotate(90,${ox+tw+22},${oy+archH_px+(roadY-oy-archH_px)/2+3})`}>Hp={Hp.toFixed(1)}m</text>
          </React.Fragment>
        )}
        {/* Distancia entre luminarias (transversal, si hay 2 en esta sección) */}
        {lumPts.length === 2 && transverseDist_m !== null && (()=>{
          const y = Math.min(lumPts[0].py, lumPts[1].py) - 10;
          const x1 = lumPts[0].px, x2 = lumPts[1].px;
          return (
            <React.Fragment>
              <line x1={x1} y1={y} x2={x2} y2={y} stroke="#64748b" strokeWidth="0.7"/>
              <line x1={x1} y1={y-3} x2={x1} y2={y+3} stroke="#64748b" strokeWidth="0.7"/>
              <line x1={x2} y1={y-3} x2={x2} y2={y+3} stroke="#64748b" strokeWidth="0.7"/>
              <text x={(x1+x2)/2} y={y-4} textAnchor="middle" fill="#94a3b8" fontSize="8">
                {transverseDist_m.toFixed(2)} m
              </text>
            </React.Fragment>
          );
        })()}
        {/* Luminaire markers — rectángulo horizontal (cuerpo de la luminaria).
            El tilt real varía por posición a lo largo del túnel (curva CIE 88),
            así que aquí se dibuja siempre horizontal para no sugerir un único
            ángulo fijo que no se corresponde con ninguna luminaria en concreto. */}
        {lumPts.map(({px,py,inside},i)=>{
          const rectW = 16, rectH = rectW * 0.25;   // altura = 25% de la anchura transversal
          return (
            <g key={i}>
              <line x1={px} y1={py+rectH/2} x2={px} y2={roadY} stroke={inside?"#fbbf24":"#f87171"} strokeWidth="0.7" strokeDasharray="3 2" opacity="0.5"/>
              <rect x={px-rectW/2} y={py-rectH/2} width={rectW} height={rectH} rx={1}
                fill={inside?"#fbbf24":"#f87171"} stroke="#fff" strokeWidth="1.2" opacity="0.9"/>
              {/* Distancia al suelo de la luminaria (altura de montaje) */}
              <text x={px+9} y={(py+roadY)/2+3} textAnchor="start" fill="#94a3b8" fontSize="7.5">
                h={hm.toFixed(1)}m
              </text>
              {!inside && (
                <text x={px} y={py-10} textAnchor="middle" fill="#f87171" fontSize="9" fontWeight="700">⚠</text>
              )}
            </g>
          );
        })}
        {/* Outside warning banner */}
        {outsideWarning && (
          <React.Fragment>
            <rect x={ox} y={oy} width={tw} height={20} fill="#7f1d1d" opacity="0.6" rx="3"/>
            <text x={ox+tw/2} y={oy+14} textAnchor="middle" fill="#fca5a5" fontSize="9" fontWeight="600">
              ⚠ Luminaria fuera del contorno del túnel
            </text>
          </React.Fragment>
        )}
        {/* Shape label */}
        <text x={ox+tw/2} y={oy+8} textAnchor="middle" fill="#475569" fontSize="8" opacity="0.7">
          {shape==='horseshoe'?'Sección en herradura':shape==='circular'?'Sección circular (galería)':'Sección rectangular'}
        </text>
      </svg>
    </div>
  );
}

// ── Vista 3D en primera persona: recorrido del conductor por el túnel ────────
// Construye la sección transversal real (rectangular/circular/herradura, misma
// geometría que TunnelSectionPreview) extruida a lo largo del eje, coloca las
// luminarias reales (posición/óptica→color) y anima una cámara a la altura del
// ojo del conductor recorriendo el túnel de punta a punta.
const _MODEL_COLOR_3D = { S: 0x22c55e, M: 0x3b82f6, L: 0xa855f7 };
const _ROAD_SURFACE_COLOR_3D = {
  dark_asphalt: 0x1a1a1c, medium_asphalt: 0x28282b, light_asphalt: 0x3c3c3e,
  concrete: 0x716f66, bright_concrete: 0xa8a69b,
};
const _CCT_LIGHT_COLOR_3D = { '3000K': 0xffc38a, '4000K': 0xfff2e0 };
// Distancia (m) antes del portal donde empieza el recorrido -- coincide
// con el punto de toma de la foto de boca subida por el usuario.
const _APPROACH_M_3D = 25;

// ── Mapeo del dial de "Exposición" (0-1) a renderer.toneMappingExposure ──
// Una asignacion directa (dial 1.0 -> exposicion 1.0) seguia viendose muy
// brillante incluso sin luz ambiental: con 60 luces del pool solapando su
// alcance, la suma de todas ellas es grande y una exposicion "neutra" (1.0)
// no la compensa. Se usa una escala logaritmica tipo "pasos de diafragma"
// (stops fotograficos, cada paso dobla/parte por dos el brillo) en vez de
// lineal -- da mucho mas control fino en la zona oscura (donde esta el
// ajuste correcto) que un dial lineal, y el techo (dial=1.0) se reduce muy
// por debajo de la exposicion neutra en vez de igualarla.
const _EXPOSURE_CEILING_3D = 0.35;   // exposicion real al dial=1.0 (antes: 1.0)
const _EXPOSURE_STOPS_3D   = 6;      // rango dinamico del dial en stops (2^6 = 64x)
const _exposureFromDial3D = (dial) => {
  const d = Math.max(0, Math.min(1, Number(dial) || 0));
  if (d <= 0) return 0;
  return _EXPOSURE_CEILING_3D * Math.pow(2, (d - 1) * _EXPOSURE_STOPS_3D);
};

function _familyOf3D(model) {
  if (!model) return 'M';
  if (/_S_|^S$/.test(model)) return 'S';
  if (/_L_|^L$/.test(model)) return 'L';
  return 'M';
}

function _tunnelCrossSectionPoints3D(W, H, shape, Hp) {
  // Devuelve puntos [y, z] desde la pared izq (y=0,z=0) hasta la pared der
  // (y=W,z=0), pasando por la clave — misma geometría que TunnelSectionPreview.
  const segs = 24;
  const pts = [[0, 0]];
  if (shape === 'rectangular') {
    pts.push([0, H], [W, H]);
  } else if (shape === 'circular') {
    const R  = ((W / 2) ** 2 + H ** 2) / (2 * H);
    const zc = H - R;
    const aMax = Math.acos(Math.max(-1, Math.min(1, -zc / R)));
    for (let i = 0; i <= segs; i++) {
      const a = -aMax + (i / segs) * 2 * aMax;
      pts.push([W / 2 + R * Math.sin(a), zc + R * Math.cos(a)]);
    }
  } else { // horseshoe
    pts.push([0, Hp]);
    for (let i = 0; i <= segs; i++) {
      const a = Math.PI - (i / segs) * Math.PI;
      pts.push([W / 2 + (W / 2) * Math.cos(a), Hp + (H - Hp) * Math.sin(a)]);
    }
    pts.push([W, Hp]);
  }
  pts.push([W, 0]);
  return pts;
}

function Tunnel3DDrive({ lumList, W_m, H_m, shape, H_pared_m, tubeLength, mountH, speedKmh = 80,
                           roadSurface = 'dark_asphalt', numLanes = 2, laneWidthM = 3.5,
                           shoulderLeftM = 0, shoulderRightM = 0, sidewalkLeftM = 0, sidewalkRightM = 0, cct = '4000K',
                           rhoWall = 0.40, rhoCeiling = 0.25, routeGeometry = [],
                           sceneOptions = [], initialSceneKey = 'sunny' }) {
  const mountRef = React.useRef(null);
  const engineRef = React.useRef(null);
  const fileInputRef = React.useRef(null);
  const [playing, setPlaying] = React.useState(false);
  const [speed, setSpeed] = React.useState(speedKmh || 80);
  const [posM, setPosM] = React.useState(-_APPROACH_M_3D);
  const [laneIdx, setLaneIdx] = React.useState(null);
  const [portalImg, setPortalImg] = React.useState(null);
  const [lightIntensity, setLightIntensity] = React.useState(1.0);
  const [imgOffX, setImgOffX] = React.useState(0);
  const [imgOffY, setImgOffY] = React.useState(0);
  const [imgZoom, setImgZoom] = React.useState(1);
  const [showGuide, setShowGuide] = React.useState(true);
  const [videoSceneKey, setVideoSceneKey] = React.useState(initialSceneKey || 'sunny');
  const [selectedPoint, setSelectedPoint] = React.useState(null);
  const speedRef = React.useRef(speed);
  const laneIdxRef = React.useRef(null);
  // "lightIntensity" ahora controla la EXPOSICION del tone mapping (ACES
  // Filmic) del renderer, no la intensidad bruta de cada luz -- ver
  // comentario junto a renderer.toneMapping mas abajo.
  const lightIntensityRef = React.useRef(lightIntensity);
  React.useEffect(() => { speedRef.current = speed; }, [speed]);
  React.useEffect(() => { laneIdxRef.current = laneIdx; }, [laneIdx]);
  React.useEffect(() => { lightIntensityRef.current = lightIntensity; }, [lightIntensity]);
  React.useEffect(() => {
    if (sceneOptions.some(option => option.key === initialSceneKey)) {
      setVideoSceneKey(initialSceneKey);
    }
  }, [initialSceneKey, sceneOptions.length]);
  React.useEffect(() => { setSelectedPoint(null); }, [videoSceneKey]);

  const activeScene = sceneOptions.find(option => option.key === videoSceneKey)
    || sceneOptions[0]
    || {key:'sunny', label:'Soleado', color:'#d97706', luminaires:lumList || [], profile:null};
  const activeLumList = activeScene.luminaires || lumList || [];
  const activeProfile = activeScene.profile || null;
  const activeVerification = activeScene.verification || null;
  const activeLavgValues = _asArr(activeProfile?.fields)
    .map(field=>Number(field?.Lavg_governing??field?.L))
    .filter(Number.isFinite);
  const activeLavgMin = activeLavgValues.length ? Math.min(...activeLavgValues) : null;
  const activeLavgMax = activeLavgValues.length ? Math.max(...activeLavgValues) : null;
  const hasRealRoadProfile = !!activeProfile?.available
    && _asArr(activeProfile?.fields).some(field => _asArr(field?.grid_points)
      .some(point => Number.isFinite(Number(point?.L))));

  const nLanesEff = Math.max(1, parseInt(numLanes) || 2);
  const usesOsmAlignment = _asArr(routeGeometry).filter(point =>
    Number.isFinite(Number(point?.lat))
    && Number.isFinite(Number(point?.lng ?? point?.lon))
  ).length >= 2;
  // La prop puede ser un array nuevo en cada render; la clave estable evita
  // reconstruir la escena WebGL cuando solo cambia el estado de reproduccion.
  const routeGeometryKey = _asArr(routeGeometry).map(point => {
    const lat = Number(point?.lat), lng = Number(point?.lng ?? point?.lon);
    return Number.isFinite(lat) && Number.isFinite(lng) ? `${lat.toFixed(7)},${lng.toFixed(7)}` : '';
  }).filter(Boolean).join('|');

  React.useEffect(() => {
    if (!mountRef.current || typeof THREE === 'undefined' || !(tubeLength > 0)) return;
    const mount = mountRef.current;
    const width  = mount.clientWidth || 640;
    const height = 380;
    const eyeH   = 1.5;

    // No sustituir una malla CIE 140 ausente por un color de pavimento:
    // el recorrido debe dejar claro que necesita un perfil fotométrico real.
    if (!hasRealRoadProfile) {
      mount.innerHTML = '';
      return undefined;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03040a);
    // Horizonte llevado hasta el limite de vision (antes se cortaba en
    // niebla a 240 m, dando la sensacion de que los focos se "encendian"
    // segun se acercaba la camara). El propio tunel recto ya actua de
    // "vanishing point" natural mucho antes de este limite.
    scene.fog = new THREE.Fog(0x03040a, 25, 500);

    const camera = new THREE.PerspectiveCamera(72, width / height, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    // Tone mapping ACES Filmic: el rango real de flujo de las luminarias
    // (miles a >100.000 lm) es demasiado amplio para acumular linealmente y
    // recortar en 1.0 (NoToneMapping por defecto) sin que las zonas oscuras
    // del tunel se vean planas/negras junto a las brillantes -- ACES Filmic
    // comprime ese rango de forma perceptual (la misma curva que usan la
    // mayoria de motores graficos para HDR), evitando el recorte brusco a
    // blanco y conservando detalle en el interior oscuro. El slider de
    // "Exposición" controla la EXPOSICION de este tone mapping via una escala
    // logaritmica de stops (ver _exposureFromDial3D), no la intensidad bruta
    // de cada luz -- asi compensa pantallas de distinto brillo sin alterar el
    // contraste relativo real entre luminarias.
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = _exposureFromDial3D(lightIntensityRef.current);
    mount.innerHTML = '';
    mount.appendChild(renderer.domElement);

    const toWorldZ = (y) => W_m / 2 - y;

    // Eje 3D a partir de la polilínea OSM. Se conserva la progresiva de
    // proyecto: si el eje OSM es algo más corto/largo, se prolonga su última
    // tangente en vez de comprimir la implantación fotométrica.
    const osmRoute = _asArr(routeGeometry).map(point => ({
      lat:Number(point?.lat), lng:Number(point?.lng ?? point?.lon),
    })).filter(point => Number.isFinite(point.lat) && Number.isFinite(point.lng));
    const routeNodes = [];
    if(osmRoute.length>=2){
      const R=6371000, toRad=value=>value*Math.PI/180;
      const origin=osmRoute[0], lat0=toRad(origin.lat);
      osmRoute.forEach(point=>{
        const east=R*toRad(point.lng-origin.lng)*Math.cos(lat0);
        const north=R*toRad(point.lat-origin.lat);
        const previous=routeNodes[routeNodes.length-1];
        const distance=previous
          ? previous.s+Math.hypot(east-previous.x, -north-previous.z)
          : 0;
        if(!previous || distance-previous.s>0.02){
          routeNodes.push({x:east,z:-north,s:distance});
        }
      });
    }
    const hasOsmRoute=routeNodes.length>=2;
    const _routeFrameAt3D = sValue => {
      if(!hasOsmRoute){
        return {x:Number(sValue)||0,z:0,tx:1,tz:0};
      }
      const sRoute=Number(sValue)||0;
      const first=routeNodes[0], last=routeNodes[routeNodes.length-1];
      const _segmentFrame=(a,b,ratio)=>{
        const dx=b.x-a.x,dz=b.z-a.z;
        const length=Math.max(1e-9,Math.hypot(dx,dz));
        return {x:a.x+dx*ratio,z:a.z+dz*ratio,tx:dx/length,tz:dz/length};
      };
      if(sRoute<=0){
        const next=routeNodes[1], base=_segmentFrame(first,next,0);
        return {x:base.x+base.tx*sRoute,z:base.z+base.tz*sRoute,tx:base.tx,tz:base.tz};
      }
      if(sRoute>=last.s){
        const previous=routeNodes[routeNodes.length-2], base=_segmentFrame(previous,last,1);
        const extra=sRoute-last.s;
        return {x:base.x+base.tx*extra,z:base.z+base.tz*extra,tx:base.tx,tz:base.tz};
      }
      for(let index=1;index<routeNodes.length;index++){
        const end=routeNodes[index], start=routeNodes[index-1];
        if(sRoute<=end.s+1e-6){
          return _segmentFrame(start,end,(sRoute-start.s)/Math.max(end.s-start.s,1e-9));
        }
      }
      return {x:last.x,z:last.z,tx:1,tz:0};
    };
    const _worldPointOnRoute3D = (sValue,lateral=0,elevation=0) => {
      const frame=_routeFrameAt3D(sValue);
      // Normal izquierda del sentido de avance: con eje recto (+X), y=0 de
      // la sección local queda en +Z, igual que el recorrido histórico.
      return new THREE.Vector3(
        frame.x-frame.tz*lateral,
        elevation,
        frame.z+frame.tx*lateral,
      );
    };
    // El suelo visual no se aproxima con una luz puntual: se reconstruye con
    // los mismos campos CIE 140 que alimentan Lavg, U0 y Ul. Cada campo aporta
    // sus puntos x/y, por lo que los máximos y mínimos entre luminarias se
    // convierten en franjas visibles durante el recorrido.
    const profileFields = _asArr(activeProfile?.fields).filter(field =>
      _asArr(field?.grid_points).length > 0
      && Number.isFinite(Number(field?.field_start))
      && Number.isFinite(Number(field?.field_end))
    );
    const profileValues = profileFields.flatMap(field =>
      _asArr(field.grid_points).map(point => Number(point?.L)).filter(Number.isFinite)
    );
    const profileMin = profileValues.length ? Math.min(...profileValues) : 0;
    const profileMax = profileValues.length ? Math.max(...profileValues) : 1;
    const fieldForPosition = xValue => {
      if (!profileFields.length) return null;
      return profileFields.reduce((best, candidate) => {
        const start = Number(candidate.field_start), end = Number(candidate.field_end);
        const distance = xValue < start ? start - xValue : xValue > end ? xValue - end : 0;
        const bestDistance = !best ? Infinity : (
          xValue < Number(best.field_start)
            ? Number(best.field_start) - xValue
            : xValue > Number(best.field_end)
              ? xValue - Number(best.field_end) : 0
        );
        return distance < bestDistance ? candidate : best;
      }, null);
    };
    const luminanceAt = (xValue, yValue) => {
      const field = fieldForPosition(xValue);
      if (!field) return null;
      const points = _asArr(field?.grid_points).map(point => ({
        x:Number(point?.x), y:Number(point?.y), L:Number(point?.L),
      })).filter(point => Number.isFinite(point.x) && Number.isFinite(point.y) && Number.isFinite(point.L));
      if (!points.length) return null;
      const nearest = points.sort((a,b) =>
        (Math.abs(a.x-xValue) + Math.abs(a.y-yValue))
        - (Math.abs(b.x-xValue) + Math.abs(b.y-yValue))
      ).slice(0, 4);
      const weights = nearest.map(point => 1 / Math.max(0.05,
        Math.hypot(point.x-xValue, point.y-yValue)));
      const totalWeight = weights.reduce((sum,value) => sum + value, 0);
      return nearest.reduce((sum,point,index) => sum + point.L * weights[index], 0)
        / Math.max(1e-9, totalWeight);
    };
    const wallLuminanceAt = (xValue, yValue, zValue) => {
      const field = fieldForPosition(xValue);
      const wall = field?.wall;
      if (!wall?.sample_x_m?.length || !wall?.sample_z_m?.length) return null;
      const side = yValue <= W_m / 2 ? 'left' : 'right';
      const grid = side === 'left' ? wall.L_left_grid : wall.L_right_grid;
      const xs = wall.sample_x_m.map(Number), zs = wall.sample_z_m.map(Number);
      if (!Array.isArray(grid) || grid.length !== xs.length) return null;
      const nearestX = xs.reduce((best, value, index) =>
        Math.abs(value - xValue) < Math.abs(xs[best] - xValue) ? index : best, 0);
      const nearestZ = zs.reduce((best, value, index) =>
        Math.abs(value - zValue) < Math.abs(zs[best] - zValue) ? index : best, 0);
      const row = Array.isArray(grid[nearestX]) ? grid[nearestX] : [];
      const value = Number(row[nearestZ]);
      return Number.isFinite(value) ? value : null;
    };
    const profileStationValues = profileFields.flatMap(field => [
      Number(field.field_start), Number(field.field_end),
      ..._asArr(field.grid_points).map(point => Number(point?.x)),
    ]).filter(sValue => Number.isFinite(sValue) && sValue > 0.02 && sValue < tubeLength - 0.02);
    const routeStations = [0, tubeLength, ...routeNodes
      .map(node=>node.s), ...profileStationValues]
      .filter(sValue=>sValue>=0 && sValue<=tubeLength)
      .sort((a,b)=>a-b)
      .filter((sValue,index,values)=>index===0||Math.abs(sValue-values[index-1])>0.02)
      .map(sValue=>({s:sValue,frame:_routeFrameAt3D(sValue)}));
    let tunnelSurfaceMesh = null;
    let roadMesh = null;

    // ── Túnel extruido (dos anillos: x=0 y x=tubeLength) — recubrimiento
    //    pared/techo por color de vertice, interpolado segun altura real
    //    entre el tono de ρ pared (por debajo de Hp) y ρ techo (arco/clave),
    //    para reflejar visualmente las reflectancias configuradas. ─────────
    const Hp_eff = Math.min(H_pared_m, H_m);
    const crossPts = _tunnelCrossSectionPoints3D(W_m, H_m, shape, Hp_eff);
    const _rhoToRgb3D = (rho, tint) => {
      const g = Math.max(0.10, Math.min(0.92, 0.14 + (rho || 0.3) * 1.05));
      const r = Math.min(1, g * tint[0]);
      const gg = Math.min(1, g * tint[1]);
      const b = Math.min(1, g * tint[2]);
      return [r, gg, b];
    };
    const wallRGB = _rhoToRgb3D(rhoWall, [1.06, 1.0, 0.94]);      // ligero tono calido
    const ceilRGB = _rhoToRgb3D(rhoCeiling, [0.96, 0.99, 1.06]);  // ligero tono frio
    {
      const positions = [];
      const colors = [];
      const denom = Math.max(0.01, H_m - Hp_eff);
      for (const station of routeStations) {
        for (const [y, z] of crossPts) {
          const point=_worldPointOnRoute3D(station.s,toWorldZ(y),z);
          positions.push(point.x,point.y,point.z);
          const t = Math.max(0, Math.min(1, (z - Hp_eff) / denom));
          colors.push(
            wallRGB[0] + (ceilRGB[0] - wallRGB[0]) * t,
            wallRGB[1] + (ceilRGB[1] - wallRGB[1]) * t,
            wallRGB[2] + (ceilRGB[2] - wallRGB[2]) * t,
          );
        }
      }
      const n = crossPts.length;
      const indices = [];
      for (let section = 0; section < routeStations.length - 1; section++) {
        const offset=section*n, nextOffset=(section+1)*n;
        for (let i = 0; i < n - 1; i++) {
          const a=offset+i,b=offset+i+1,c=nextOffset+i,d=nextOffset+i+1;
          indices.push(a,c,b,b,c,d);
        }
      }
      const wallGeo = new THREE.BufferGeometry();
      wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      wallGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      wallGeo.setIndex(indices);
      wallGeo.computeVertexNormals();
      const wallMat = new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide,
      });
      tunnelSurfaceMesh = new THREE.Mesh(wallGeo, wallMat);
      scene.add(tunnelSurfaceMesh);

      // Referencia visual de las paredes reflectantes: dos bandas longitudinales
      // discretas, colocadas sobre ambas paredes y siguiendo el eje OSM. El
      // color se deriva de ρ paredes, igual que el material de la superficie.
      const wallBandZ = Math.max(0.35, Math.min(Hp_eff * 0.55, H_m - 0.15));
      const wallBandOffset = Math.max(0.035, Math.min(0.12, W_m * 0.008));
      const wallBandColor = new THREE.Color(
        Math.min(1, wallRGB[0] * 1.35),
        Math.min(1, wallRGB[1] * 1.35),
        Math.min(1, wallRGB[2] * 1.35),
      );
      const wallBandMaterial = new THREE.LineBasicMaterial({
        color: wallBandColor, transparent: true, opacity: 0.62,
        depthWrite: false, toneMapped: false,
      });
      [wallBandOffset, W_m - wallBandOffset].forEach(yWall => {
        const points = routeStations.map(station =>
          _worldPointOnRoute3D(station.s, toWorldZ(yWall), wallBandZ)
        );
        const bandGeo = new THREE.BufferGeometry().setFromPoints(points);
        scene.add(new THREE.Line(bandGeo, wallBandMaterial.clone()));
      });
    }

    // ── Calzada: color según los valores CIE 140 del escenario activo ─────
    const roadColor = _ROAD_SURFACE_COLOR_3D[roadSurface] || _ROAD_SURFACE_COLOR_3D.dark_asphalt;
    {
      // La malla CIE 140 solo cubre carriles. Arcenes y aceras conservan su
      // material físico y no reciben por extensión una luminancia de carril.
      const visualShoulderLeft = Math.max(0, parseFloat(shoulderLeftM) || 0);
      const visualShoulderRight = Math.max(0, parseFloat(shoulderRightM) || 0);
      const visualSidewalkLeft = Math.max(0, parseFloat(sidewalkLeftM) || 0);
      const visualSidewalkRight = Math.max(0, parseFloat(sidewalkRightM) || 0);
      const visualLaneWidth = Math.max(0.1, parseFloat(laneWidthM) || 3.5);
      const visualLaneStart = visualSidewalkLeft + visualShoulderLeft;
      const visualLaneEnd = Math.min(
        W_m - visualSidewalkRight - visualShoulderRight,
        visualLaneStart + nLanesEff * visualLaneWidth,
      );
      const visualRoadStart = Math.max(0, Math.min(W_m, visualLaneStart));
      const visualRoadEnd = Math.max(visualRoadStart, Math.min(W_m, visualLaneEnd));
      const roadSampleCount = Math.max(12, Math.min(28, Math.round(W_m * 2)));
      const roadSampleYs = Array.from({length:roadSampleCount + 1}, (_, index) =>
        visualRoadStart + (visualRoadEnd - visualRoadStart) * index / roadSampleCount
      );
      const roadGeo = new THREE.BufferGeometry();
      const positions=[];
      const colors=[];
      const indices=[];
      const baseRoadColor = new THREE.Color(roadColor);
      routeStations.forEach(station=>{
        roadSampleYs.forEach(yValue=>{
          const point=_worldPointOnRoute3D(station.s,toWorldZ(yValue),0.012);
          positions.push(point.x,point.y,point.z);
          const value=luminanceAt(station.s,yValue);
          if (profileValues.length) {
            const profileRange=profileMax-profileMin;
            const normalized=profileRange<0.001 ? 0.45 : Math.max(0,Math.min(1,
              (Number(value ?? profileMin)-profileMin) / profileRange));
            // Escala perceptual deliberada: conserva contraste entre campos sin
            // fingir que un RGB de pantalla es una medida fotométrica absoluta.
            const brightness=0.055 + normalized * 0.40;
            colors.push(brightness*0.82,brightness*0.88,brightness);
          } else {
            colors.push(baseRoadColor.r,baseRoadColor.g,baseRoadColor.b);
          }
        });
      });
      for(let section=0;section<routeStations.length-1;section++){
        const offset=section*roadSampleYs.length;
        const nextOffset=(section+1)*roadSampleYs.length;
        for(let band=0;band<roadSampleYs.length-1;band++){
          const a=offset+band,b=a+1,c=nextOffset+band,d=c+1;
          indices.push(a,c,b,b,c,d);
        }
      }
      roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      roadGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      roadGeo.setIndex(indices);
      roadGeo.computeVertexNormals();
      const roadMat = new THREE.MeshBasicMaterial({
        vertexColors:true, color:0xffffff, roughness:1.0,
      });
      roadMat.toneMapped = false;
      roadMesh = new THREE.Mesh(roadGeo, roadMat);
      scene.add(roadMesh);
    }

    // ── Carriles y arcenes: borde de calzada continuo + separadores
    //    discontinuos, mismo criterio que TunnelSectionPreview ─────────────
    const shL = Math.max(0, parseFloat(shoulderLeftM) || 0);
    const shR = Math.max(0, parseFloat(shoulderRightM) || 0);
    const swL = Math.max(0, parseFloat(sidewalkLeftM) || 0);
    const swR = Math.max(0, parseFloat(sidewalkRightM) || 0);
    const laneW = parseFloat(laneWidthM) || 3.5;
    const carriagewayStart = swL;
    const laneStart = swL + shL;
    const laneEnd = Math.min(W_m, laneStart + nLanesEff * laneW);
    const carriagewayEnd   = Math.min(W_m, laneEnd + shR);
    const laneDividerYs = Array.from({ length: Math.max(0, nLanesEff - 1) }, (_, i) => laneStart + (i + 1) * laneW)
      .filter(y => y > 0.05 && y < W_m - 0.05);

    const _dashTex3D = (() => {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 8;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 64, 8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 2, 30, 4);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      return tex;
    })();

    const _buildLineStrip3D = (yPos, widthM, dashed) => {
      const geo = new THREE.BufferGeometry();
      const positions=[];
      const uvs=[];
      const indices=[];
      const lateral=toWorldZ(yPos);
      routeStations.forEach(station=>{
        const left=_worldPointOnRoute3D(station.s,lateral+widthM/2,0.012);
        const right=_worldPointOnRoute3D(station.s,lateral-widthM/2,0.012);
        positions.push(left.x,left.y,left.z,right.x,right.y,right.z);
        uvs.push(station.s/6,0,station.s/6,1);
      });
      for(let section=0;section<routeStations.length-1;section++){
        const a=section*2,b=a+1,c=a+2,d=a+3;
        indices.push(a,c,b,b,c,d);
      }
      geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
      geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      let mat;
      if (dashed) {
        const tex = _dashTex3D.clone();
        tex.repeat.set(1, 1);
        tex.needsUpdate = true;
        mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
      } else {
        mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      }
      // Pintura vial: no debe verse afectada por la exposicion del tone
      // mapping (que representa la luz de la escena, no la reflectancia de
      // la marca) -- sin esto, con exposicion baja la marca blanca se ve
      // negra igual que el resto de la escena oscura.
      mat.toneMapped = false;
      return new THREE.Mesh(geo, mat);
    };
    // Marcas viales: 100 mm de ancho, blanco -- tanto la linea continua entre
    // carril y arcen como la discontinua entre carriles.
    const _LANE_MARK_W_3D = 0.10;
    if (laneStart > 0.05) scene.add(_buildLineStrip3D(laneStart, _LANE_MARK_W_3D, false));
    if (laneEnd < W_m - 0.05) scene.add(_buildLineStrip3D(laneEnd, _LANE_MARK_W_3D, false));
    laneDividerYs.forEach(y => scene.add(_buildLineStrip3D(y, _LANE_MARK_W_3D, true)));

    // ── Iluminacion: color segun la temperatura de color seleccionada ────
    const lightColor = _CCT_LIGHT_COLOR_3D[cct] || _CCT_LIGHT_COLOR_3D['4000K'];

    // Luz de portal (simula luz de dia entrando por ambas bocas)
    const _PORTAL_BASE_I_3D = 2.2;
    const portalA = new THREE.PointLight(0xdbe9ff, _PORTAL_BASE_I_3D, 60, 1.2);
    portalA.position.copy(_worldPointOnRoute3D(-2,0,eyeH+1));
    scene.add(portalA);
    const portalB = new THREE.PointLight(0xdbe9ff, _PORTAL_BASE_I_3D, 60, 1.2);
    portalB.position.copy(_worldPointOnRoute3D(tubeLength+2,0,eyeH+1));
    scene.add(portalB);
    // Sin luz ambiental: es un tunel, la unica luz real viene de las
    // luminarias (mas la de portal, que simula la luz de dia entrando por
    // las bocas). Una ambiental de relleno iluminaba por igual Umbral e
    // Interior sin relacion con el diseno real -- justo lo contrario de
    // "realista".

    // ── Luminarias: esfera emisiva por unidad (color por familia S/M/L) —
    //    posicion, modelo y tilt tal cual los calculo el motor de diseno ──
    const lumPts = (activeLumList || []).filter(lm => lm && isFinite(lm.x) && isFinite(lm.y));
    const sphereGeo = new THREE.SphereGeometry(0.14, 10, 8);
    lumPts.forEach((lm) => {
      const color = lm.active === false
        ? 0x64748b
        : (_MODEL_COLOR_3D[_familyOf3D(lm.model || lm.pcb)] || 0x93c5fd);
      const mat = new THREE.MeshBasicMaterial({ color, transparent:lm.active===false,
        opacity:lm.active===false?0.35:1 });
      // Marcador de luminaria: color identificativo fijo (familia S/M/L), no
      // debe apagarse con la exposicion igual que la pintura vial.
      mat.toneMapped = false;
      const mesh = new THREE.Mesh(sphereGeo, mat);
      mesh.position.copy(_worldPointOnRoute3D(lm.x,toWorldZ(lm.y),mountH));
      if (lm.tilt) mesh.rotation.x = THREE.MathUtils.degToRad(lm.tilt);
      scene.add(mesh);
    });

    // ── Intensidad de cada luz a partir de su flujo real (lm) calculado por
    //    el motor -- antes todas las luminarias brillaban igual (constante
    //    3.2) sin relacion con el diseno real. El flujo real de un proyecto
    //    abarca ~5.000-120.000 lm (>20x): mapearlo LINEALMENTE a intensidad
    //    haria que las luminarias mas pequenas se vean casi apagadas junto a
    //    las mayores. Se usa una escala logaritmica (percepcion visual del
    //    brillo, igual que decibelios/luminancia CIE) normalizada al rango
    //    de flujo REAL presente en este proyecto -- adaptativa, no rangos
    //    fijos -- y comprimida al rango visual [I_LO, I_HI]. El resultado
    //    entra en la escena de forma fija (no depende del slider): el brillo
    //    percibido en pantalla se ajusta despues via la EXPOSICION del tone
    //    mapping (ver renderer.toneMappingExposure), no reescalando cada luz.
    const fluxVals = lumPts.map(lm => Number(lm.flux_lm) || 0).filter(v => v > 0);
    const fluxMin = fluxVals.length ? Math.min(...fluxVals) : 5000;
    const fluxMax = fluxVals.length ? Math.max(...fluxVals) : 100000;
    const logMin = Math.log10(1 + fluxMin);
    const logRange = Math.max(1e-6, Math.log10(1 + fluxMax) - logMin);
    const I_LO = 1.6, I_HI = 6.0;
    const fluxToIntensity3D = (flux) => {
      const f = Math.max(fluxMin, Number(flux) || fluxMin);
      const t = (Math.log10(1 + f) - logMin) / logRange;
      return I_LO + t * (I_HI - I_LO);
    };

    // ── Pool de luces dinamicas: las N luminarias mas cercanas a la camara
    //    reciben una luz real con caida fisica (WebGL no soporta miles de
    //    luces simultaneas) -- se amplia la ventana y el alcance de cada
    //    una para que se solapen y no se note el limite del pool. ─────────
    const N_LIGHTS = 60;
    const lightPool = [];
    for (let i = 0; i < N_LIGHTS; i++) {
      const pl = new THREE.PointLight(lightColor, 0, 45, 1.3);
      scene.add(pl);
      lightPool.push(pl);
    }
    const sortedLums = [...lumPts].sort((a, b) => a.x - b.x);

    const updateLights = (xCam) => {
      let lo = 0, hi = sortedLums.length - 1, mid;
      while (lo < hi) { mid = (lo + hi) >> 1; sortedLums[mid].x < xCam ? lo = mid + 1 : hi = mid; }
      const startIdx = Math.max(0, lo - Math.ceil(N_LIGHTS / 2));
      for (let i = 0; i < N_LIGHTS; i++) {
         const lm = sortedLums[startIdx + i];
         const pl = lightPool[i];
         if (!lm) { pl.intensity = 0; continue; }
         pl.position.copy(_worldPointOnRoute3D(lm.x,toWorldZ(lm.y),mountH));
         // Una luminaria OFF debe desaparecer también del pool dinámico. La
         // función logarítmica tiene un suelo visual para luminarias pequeñas,
         // por lo que no se puede aplicar a flujo cero.
         pl.intensity = lm.active === false || Number(lm.flux_lm||0) <= 0
           ? 0 : fluxToIntensity3D(lm.flux_lm);
       }
     };

    // ── Carriles disponibles para el cambio de carril ─────────────────────
    const laneCenters = Array.from({ length: nLanesEff }, (_, i) => toWorldZ(shL + (i + 0.5) * laneW));
    let defaultLaneIdx = 0;
    let bestDist = Infinity;
    laneCenters.forEach((z, i) => { const dd = Math.abs(z); if (dd < bestDist) { bestDist = dd; defaultLaneIdx = i; } });
    if (laneIdxRef.current == null) { laneIdxRef.current = defaultLaneIdx; setLaneIdx(defaultLaneIdx); }

    // ── Camara: altura de ojo del conductor, recorre el eje del tunel;
    //    la posicion lateral (carril) se suaviza con una interpolacion
    //    exponencial en vez de saltar de golpe (cambio de carril fluido) ───
    // El recorrido empieza _APPROACH_M_3D metros ANTES del portal -- el
    // mismo punto (aprox.) desde el que se tomo la foto real de la boca,
    // si el usuario ha subido una (ver overlay de imagen mas abajo).
    let s = -_APPROACH_M_3D;
    let laneOffsetCurrent = laneCenters[laneIdxRef.current] ?? 0;
    const setCam = (sVal, dt) => {
      s = Math.max(-_APPROACH_M_3D, Math.min(tubeLength, sVal));
      const targetOffset = laneCenters[laneIdxRef.current] ?? 0;
      const k = dt != null ? 1 - Math.exp(-dt * 5) : 1;
      laneOffsetCurrent += (targetOffset - laneOffsetCurrent) * k;
      camera.position.copy(_worldPointOnRoute3D(s,laneOffsetCurrent,eyeH));
      camera.lookAt(_worldPointOnRoute3D(s+12,laneOffsetCurrent,eyeH-0.15));
      updateLights(s);
    };
    setCam(-_APPROACH_M_3D, null);

    const nearestRoutePoint = point => routeStations.reduce((best, station) => {
      const dx=point.x-station.frame.x, dz=point.z-station.frame.z;
      const distance=dx*dx+dz*dz;
      if (best && distance>=best.distance) return best;
      const lateral=(-station.frame.tz*dx)+(station.frame.tx*dz);
      return {
        distance,
        s:station.s,
        y:W_m/2-lateral,
        z:point.y,
      };
    }, null);
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const onCanvasClick = event => {
      if (engineRef.current?.playing) return;
      const rect=renderer.domElement.getBoundingClientRect();
      pointer.x=((event.clientX-rect.left)/Math.max(1,rect.width))*2-1;
      pointer.y=-((event.clientY-rect.top)/Math.max(1,rect.height))*2+1;
      raycaster.setFromCamera(pointer,camera);
      const hit=raycaster.intersectObjects(
        [roadMesh,tunnelSurfaceMesh].filter(Boolean), false,
      )[0];
      if (!hit) { setSelectedPoint(null); return; }
      const local=nearestRoutePoint(hit.point);
      if (!local) return;
      const field=fieldForPosition(local.s);
      const isRoad=hit.object===roadMesh;
      const surface=isRoad
        ? 'Calzada'
        : local.y<=Math.max(0.5,W_m*0.12) || local.y>=W_m-Math.max(0.5,W_m*0.12)
          ? 'Pared'
          : 'Techo';
      const localL=isRoad
        ? luminanceAt(local.s,local.y)
        : wallLuminanceAt(local.s,local.y,local.z);
      setSelectedPoint({
        surface,
        s:local.s,
        y:local.y,
        z:local.z,
        L:localL,
        fieldStart:Number(field?.field_start),
        fieldEnd:Number(field?.field_end),
        Lavg:Number(field?.Lavg_governing??field?.L),
        U0:Number(field?.U0),
        Ul:Number(field?.Ul),
        TI:Number(field?.TI),
      });
    };
    renderer.domElement.addEventListener('click', onCanvasClick);

    let raf = null, lastT = null;
    const animate = (t) => {
      raf = requestAnimationFrame(animate);
      if (lastT == null) lastT = t;
      const dt = Math.min(0.1, (t - lastT) / 1000);
      lastT = t;
      const eng = engineRef.current;
      if (eng && eng.playing) {
        const v_ms = (speedRef.current || 80) / 3.6;
        setCam(s + v_ms * dt, dt);
        eng.onProgress(s);
        if (s >= tubeLength) eng.stop();
      } else {
        setCam(s, dt);
      }
      renderer.toneMappingExposure = _exposureFromDial3D(lightIntensityRef.current);
      renderer.render(scene, camera);
    };
    raf = requestAnimationFrame(animate);

    const onResize = () => {
      const w = mount.clientWidth || width;
      camera.aspect = w / height;
      camera.updateProjectionMatrix();
      renderer.setSize(w, height);
    };
    window.addEventListener('resize', onResize);

    engineRef.current = {
      playing: false,
      onProgress: (sVal) => setPosM(sVal),
      stop: () => { engineRef.current.playing = false; setPlaying(false); },
      seek: (sVal) => setCam(sVal, null),
    };

    return () => {
      cancelAnimationFrame(raf);
      renderer.domElement.removeEventListener('click', onCanvasClick);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      scene.traverse(obj => { if (obj.geometry) obj.geometry.dispose(); if (obj.material) obj.material.dispose(); });
      mount.innerHTML = '';
      engineRef.current = null;
    };
  }, [activeLumList, activeProfile, videoSceneKey, W_m, H_m, shape, H_pared_m, tubeLength, mountH, roadSurface, numLanes, laneWidthM,
      shoulderLeftM, shoulderRightM, sidewalkLeftM, sidewalkRightM, cct, rhoWall, rhoCeiling, routeGeometryKey]);

  React.useEffect(() => {
    if (engineRef.current) engineRef.current.playing = playing;
  }, [playing]);

  const onSeek = (v) => {
    const sVal = parseFloat(v);
    setPosM(sVal);
    engineRef.current?.seek(sVal);
  };
  const changeLane = (delta) => {
    setLaneIdx(prev => {
      const cur = prev ?? 0;
      return Math.max(0, Math.min(nLanesEff - 1, cur + delta));
    });
  };

  const onUploadPortalImg = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => { setPortalImg(ev.target.result); setImgOffX(0); setImgOffY(0); setImgZoom(1); };
    reader.readAsDataURL(f);
    e.target.value = '';
  };
  const fadeOpacity = portalImg ? Math.max(0, Math.min(1, -posM / _APPROACH_M_3D)) : 0;

  // ── Guia de encuadre: silueta real del tunel (misma geometria que el 3D
  //    y que la vista de seccion transversal) para que el usuario pueda
  //    alinear la boca de SU foto con la forma/proporciones reales, ya que
  //    no hay forma fiable de detectar automaticamente la boca en una foto
  //    arbitraria. ────────────────────────────────────────────────────────
  const Hp_eff_guide = Math.min(H_pared_m, H_m);
  const guidePts = _tunnelCrossSectionPoints3D(W_m, H_m, shape, Hp_eff_guide);
  const guideMarginX = W_m * 0.15;
  const guideTopMargin = H_m * 0.15;
  const guideVbW = W_m + guideMarginX * 2;
  const guideVbH = H_m + guideTopMargin;
  const guidePathD = 'M ' + guidePts.map(([y, z]) => `${y + guideMarginX},${guideVbH - z}`).join(' L ')
    + ` L ${guideMarginX},${guideVbH} Z`;

  return (
    <div style={{background:'#03040a',border:'1px solid var(--salvi-line)',borderRadius:8,padding:'10px 12px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
        <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--salvi-grey)',
            textTransform:'uppercase',letterSpacing:'.07em'}}>
          Vista 3D — recorrido del conductor (primera persona)
        </div>
        {usesOsmAlignment&&<span style={{fontSize:'.58rem',fontWeight:700,color:'#0369a1',background:'#e0f2fe',borderRadius:10,padding:'2px 7px'}}>
          Eje curvo OSM
        </span>}
        <span style={{fontSize:'.58rem',fontWeight:700,color:'#dbeafe',background:'#1e3a8a',borderRadius:10,padding:'2px 7px'}}
          title="Las superficies de las paredes se colorean y representan con la reflectancia ρ configurada">
          Paredes reflectantes · ρ {Number(rhoWall).toFixed(2)}
        </span>
        <input ref={fileInputRef} type="file" accept="image/*" style={{display:'none'}} onChange={onUploadPortalImg}/>
        <button onClick={()=>fileInputRef.current?.click()}
          style={{marginLeft:'auto',padding:'3px 10px',fontSize:'.68rem',fontWeight:600,cursor:'pointer',
                  borderRadius:4,border:'1px solid var(--salvi-line)',background:'#fff',color:'var(--salvi-black)'}}>
          📷 {portalImg ? 'Cambiar foto del portal' : 'Cargar foto del portal'}
        </button>
         {portalImg && (
           <button onClick={()=>setPortalImg(null)}
             style={{padding:'3px 10px',fontSize:'.68rem',fontWeight:600,cursor:'pointer',
                     borderRadius:4,border:'1px solid var(--salvi-line)',background:'#fff',color:'#b91c1c'}}>
             ✕ Quitar
           </button>
         )}
       </div>
       <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:7,
                    padding:'6px 8px',background:'#0b1220',border:'1px solid #1e293b',borderRadius:6}}>
         <span style={{fontSize:'.62rem',fontWeight:700,color:'#cbd5e1',marginRight:2}}>
           Escena del vídeo
         </span>
         {(sceneOptions.length ? sceneOptions : [activeScene]).map(option=>{
           const selected=option.key===activeScene.key;
           const verification=option.verification||{};
           const profile=option.profile||{};
           return <button type="button" key={option.key}
             onClick={()=>setVideoSceneKey(option.key)}
             title={profile.available
               ? `${option.label}: perfil CIE 140 cargado`
               : `${option.label}: perfil CIE 140 pendiente`}
             style={{padding:'4px 8px',borderRadius:999,cursor:'pointer',
               border:`1px solid ${selected?(option.color||'#60a5fa'):'#475569'}`,
               background:selected?(option.color||'#2563eb'):'#111827',
               color:'#fff',fontSize:'.61rem',fontWeight:selected?700:500,
               opacity:profile.available||selected?1:.55}}>
             {option.label}
           </button>;
         })}
         <span style={{fontSize:'.60rem',color:'#cbd5e1',marginLeft:'auto',fontFamily:'monospace'}}>
            {activeLumList.filter(lm=>Number(lm.flux_lm||0)>0).length} ud · {' '}
            {activeLumList.reduce((sum,lm)=>sum+Number(lm.current_mA||0),0).toFixed(0)} mA
           {activeLavgMin!=null && <> · L {activeLavgMin.toFixed(1)}–{activeLavgMax.toFixed(1)} cd/m²</>}
           {activeVerification?.minimum_U0!=null && <> · U₀ {Number(activeVerification.minimum_U0).toFixed(3)}</>}
            {activeVerification?.minimum_Ul!=null && <> · Uₗ {Number(activeVerification.minimum_Ul).toFixed(3)}</>}
          </span>
        </div>
        <div style={{fontSize:'.61rem',color:'#94a3b8',marginBottom:7}}>
          Pausa el recorrido y haz clic en la calzada, pared o techo para consultar la luminancia local.
        </div>
        {selectedPoint && (
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:7,
                       padding:'7px 9px',background:'#172033',border:'1px solid #334155',borderRadius:6,
                       color:'#e2e8f0',fontSize:'.64rem'}}>

            </div>
          </div>
        )}

              onChange={e=>setImgOffY(parseFloat(e.target.value)||0)} style={{width:70}}/>
          </label>
          <label style={{display:'flex',alignItems:'center',gap:5,fontSize:'.62rem',color:'var(--salvi-grey)'}}>
            Zoom
            <input type="range" min={0.5} max={2.5} step={0.05} value={imgZoom}

        <button onClick={()=>setPlaying(p=>!p)}
          style={{padding:'5px 14px',fontSize:'.72rem',fontWeight:700,cursor:'pointer',

          style={{padding:'5px 12px',fontSize:'.72rem',cursor:'pointer',borderRadius:999,
                  border:'1.5px solid var(--salvi-line)',background:'#fff',color:'var(--salvi-black)'}}>
          ⟲ Inicio
        </button>
        {nLanesEff > 1 && (
          <div style={{display:'flex',alignItems:'center',gap:3}}>

                      border:'1.5px solid var(--salvi-line)',background:'#fff',color:'var(--salvi-black)'}}>

            </button>

        <input type="range" min={-_APPROACH_M_3D} max={tubeLength} step={1} value={posM}
          onChange={e=>onSeek(e.target.value)}
          style={{flex:'1 1 160px',minWidth:120}}/>
        <span style={{fontSize:'.68rem',color:'var(--salvi-grey)',fontFamily:'monospace',whiteSpace:'nowrap'}}>
          {posM.toFixed(0)} / {tubeLength.toFixed(0)} m
        </span>
        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:'.68rem',color:'var(--salvi-grey)'}}>
          Velocidad
          <input type="range" min={10} max={130} step={5} value={speed}
            onChange={e=>setSpeed(parseFloat(e.target.value)||80)}
            style={{width:90}}/>
          <span style={{fontFamily:'monospace',minWidth:32,textAlign:'right'}}>{speed}</span> km/h
        </label>
        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:'.68rem',color:'var(--salvi-grey)'}}
          title="Exposición del renderizado (escala logarítmica, en pasos de diafragma) — compensa pantallas de distinto brillo; el brillo relativo entre luminarias viene de su flujo real calculado">
          ☀️ Exposición
          <input type="range" min={0} max={1} step={0.02} value={lightIntensity}
            onChange={e=>{const v=parseFloat(e.target.value); if(!isNaN(v)) setLightIntensity(v);}}
            style={{width:90}}/>
          <input type="number" min={0} max={1} step={0.01} value={lightIntensity.toFixed(2)}
            onChange={e=>{
              const v = parseFloat(e.target.value);
              if(!isNaN(v)) setLightIntensity(Math.max(0, Math.min(1, v)));
            }}
            style={{width:46,padding:'2px 4px',fontSize:'.68rem',
              border:'1px solid var(--salvi-line)',borderRadius:4,textAlign:'right'}}/>
        </label>
      </div>
    </div>
