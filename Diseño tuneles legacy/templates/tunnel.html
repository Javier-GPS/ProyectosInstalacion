function StepControlLegacy({ result, form, onChange }) {
  if (!result?.success) return <Alert type="info">Completa el cálculo primero.</Alert>;

  const protocol   = form.control_protocol   || 'DALI-continuous';
  const sensorType = form.sensor_type        || 'luminancemeter_L20';
  const interval   = +(form.sample_interval_min || 10);
  const dimMin     = +(form.dim_min_pct      || 20);
  const dimMax     = +(form.dim_max_pct      || 100);
  const rampTime   = +(form.ramp_time_s      || 60);

  const { summary } = result;
  const Lth_d = summary.Lth;
  const L20_d = summary.L20;
  const k     = L20_d > 0 ? Lth_d / L20_d : 0;

  // Dimming curve: L20 from 0 → L20_design; dim% = clamp(L20/L20_design×100, dimMin, dimMax)
  const curveData = useMemo(() => {
    const pts = [];
    for (let i = 0; i <= 25; i++) {
      const L20  = +(( i / 25) * L20_d).toFixed(1);
      const frac = L20_d > 0 ? i / 25 : 0;
      const dim  = +Math.min(dimMax, Math.max(dimMin, frac * 100)).toFixed(1);
      pts.push({ L20, dim });
    }
    return pts;
  }, [L20_d, dimMin, dimMax]);

  // Annual energy estimate
  const SKY_HOURS = {
    clear:        [{ label:'Día soleado',         L20f:1.00, hrs:1600 },
                   { label:'Día parcial',          L20f:0.40, hrs:1200 },
                   { label:'Amanecer/anochecer',   L20f:0.05, hrs:600  },
                   { label:'Noche',                L20f:0.00, hrs:5360 }],
    intermediate: [{ label:'Día soleado',         L20f:1.00, hrs:800  },
                   { label:'Día parcial',          L20f:0.40, hrs:1600 },
                   { label:'Amanecer/anochecer',   L20f:0.05, hrs:600  },
                   { label:'Noche',                L20f:0.00, hrs:5760 }],
    overcast:     [{ label:'Día soleado',         L20f:1.00, hrs:200  },
                   { label:'Día parcial',          L20f:0.40, hrs:2000 },
                   { label:'Amanecer/anochecer',   L20f:0.05, hrs:600  },
                   { label:'Noche',                L20f:0.00, hrs:5960 }],
  };
  const skyDist    = SKY_HOURS[form.sky_condition] || SKY_HOURS.intermediate;
  const installedKw = form.luminaires_result
    ? installedSunnyPowerKw(form.luminaires_result)
    : +(form.installed_power_kw || 0);

  const energyRows = skyDist.map(({ label, L20f, hrs }) => {
    const dim     = +Math.min(dimMax, Math.max(dimMin, L20f * 100)).toFixed(0);
    const kWh     = installedKw > 0 ? +(installedKw * (dim / 100) * hrs).toFixed(0) : null;
    const kWh_fix = installedKw > 0 ? +(installedKw * hrs).toFixed(0)               : null;
    return { label, hrs, dim, kWh, kWh_fix };
  });
  const totalKwh    = installedKw > 0 ? energyRows.reduce((s, r) => s + (r.kWh    || 0), 0) : null;
  const totalKwhFix = installedKw > 0 ? energyRows.reduce((s, r) => s + (r.kWh_fix || 0), 0) : null;
  const savingsPct  = totalKwh && totalKwhFix && totalKwhFix > 0
    ? Math.round((1 - totalKwh / totalKwhFix) * 100) : null;

  const handleExport = () => {
    const data = {
      protocol, sensor_type: sensorType,
      sample_interval_min: interval,
      dim_min_pct: dimMin, dim_max_pct: dimMax, ramp_time_s: rampTime,
      design_L20: L20_d, design_Lth: Lth_d, k_factor: +k.toFixed(4),
      energy_estimate: totalKwh
        ? { total_kwh: Math.round(totalKwh), total_kwh_fixed: Math.round(totalKwhFix), savings_pct: savingsPct }
        : null,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `control_${form.tube_id||'T1'}.json`; a.click();
  };

  return (
    <div>
      {/* ── Sistema de control ── */}
      <div className="card">
        <div className="card-title">🎛️ Sistema de control — CIE 88:2004 §87–111</div>
        <div className="form-grid col-2">
          <Field label="Protocolo">
            <select value={protocol} onChange={e => onChange('control_protocol', e.target.value)}>
              <option value="DALI-continuous">DALI continuo (IEC 62386)</option>
              <option value="SmartEC">SmartEC continuo</option>
              <option value="DALI-scenes">DALI escenas preset</option>
              <option value="0-10V">Analógico 0-10V</option>
            </select>
          </Field>
          <Field label="Sensor de luminancia">
            <select value={sensorType} onChange={e => onChange('sensor_type', e.target.value)}>
              <option value="luminancemeter_L20">Luminancímetro L₂₀ (CIE §5)</option>
              <option value="photocell_Lad">Célula fotoeléctrica Lad</option>
              <option value="schedule">Sin sensor (horario)</option>
            </select>
          </Field>
          <Field label="Intervalo de muestreo">
            <select value={interval} onChange={e => onChange('sample_interval_min', +e.target.value)}>
              <option value={5}>5 minutos</option>
              <option value={10}>10 minutos</option>
              <option value={15}>15 minutos</option>
              <option value={30}>30 minutos</option>
            </select>
          </Field>
          <Field label="Rampa de transición">
            <select value={rampTime} onChange={e => onChange('ramp_time_s', +e.target.value)}>
              <option value={30}>30 s</option>
              <option value={60}>60 s</option>
              <option value={120}>2 min</option>
              <option value={300}>5 min</option>
            </select>
          </Field>
        </div>
        {sensorType === 'schedule' && (
          <div className="alert alert-warning" style={{marginTop:8,fontSize:'.78rem'}}>
            ⚠️ Sin luminancímetro la regulación no sigue el modelo continuo CIE 88. Se recomienda al menos una célula fotoeléctrica Lad.
          </div>
        )}
      </div>

      {/* ── Límites de dimerado ── */}
      <div className="card">
        <div className="card-title">📊 Límites de dimerado</div>
        <div className="form-grid col-2" style={{marginBottom:8}}>
          <Field label="Mínimo (noche / seguridad)" hint={`Nivel nocturno: ${dimMin}%`}>
            <input type="range" min={5} max={40} step={5} value={dimMin}
              onChange={e => onChange('dim_min_pct', +e.target.value)}
              style={{width:'100%',accentColor:'var(--salvi-black)'}}/>
          </Field>
          <Field label="Máximo (pico solar)" hint={`Nivel de diseño: ${dimMax}%`}>
            <input type="range" min={80} max={100} step={5} value={dimMax}
              onChange={e => onChange('dim_max_pct', +e.target.value)}
              style={{width:'100%',accentColor:'var(--salvi-black)'}}/>
          </Field>
        </div>
        <div style={{display:'flex',gap:20,fontSize:'.74rem',color:'var(--salvi-grey)',flexWrap:'wrap'}}>
          <span>L₂₀ diseño: <strong style={{color:'var(--salvi-black)'}}>{L20_d} cd/m²</strong></span>
          <span>Lth diseño: <strong style={{color:'var(--salvi-black)'}}>{Lth_d} cd/m²</strong></span>
          <span>k = Lth/L₂₀: <strong style={{color:'var(--salvi-black)'}}>{+k.toFixed(3)}</strong></span>
        </div>
      </div>

      {/* ── Curva de regulación ── */}
      <div className="chart-card">
        <div className="chart-card-title">Curva de regulación continua — Zona Umbral</div>
        <ResponsiveContainer width="100%" height={200}>
          <ComposedChart data={curveData} margin={{top:8,right:55,left:0,bottom:22}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#E8E2D8"/>
            <XAxis dataKey="L20" tick={{fontSize:10}}
              label={{value:'L₂₀ (cd/m²)',position:'insideBottom',offset:-10,fontSize:10,fill:'#6A6A6A'}}/>
            <YAxis domain={[0,105]} tick={{fontSize:10}} tickFormatter={v=>`${v}%`}/>
            <Tooltip formatter={v=>[`${v}%`,'Dimerado']} labelFormatter={l=>`L₂₀ = ${l} cd/m²`}/>
            <ReferenceLine y={dimMin} stroke="#B7791F" strokeDasharray="4 2"
              label={{value:`min ${dimMin}%`,fontSize:9,fill:'#B7791F',position:'insideRight'}}/>
            <ReferenceLine y={dimMax} stroke="#1F7A4D" strokeDasharray="4 2"
              label={{value:`max ${dimMax}%`,fontSize:9,fill:'#1F7A4D',position:'insideRight'}}/>
            <ReferenceLine x={L20_d} stroke="#1E1E1E" strokeDasharray="3 3"
              label={{value:'diseño',fontSize:9,fill:'#1E1E1E',position:'top'}}/>
            <Line type="monotone" dataKey="dim" stroke="#1E1E1E" strokeWidth={2} dot={false} name="Dimerado (%)"/>
          </ComposedChart>
        </ResponsiveContainer>
      </div>

      {/* ── Estimación energética anual ── */}
      <div className="card">
        <div className="card-title">⚡ Estimación energética anual</div>
        {installedKw === 0 ? (
          <div>
            <div className="alert alert-info" style={{fontSize:'.78rem',marginBottom:10}}>
              💡 Completa el paso de <strong>Luminarias</strong> primero — la potencia instalada se transferirá automáticamente.
            </div>
            <Field label="O introduce la potencia instalada (kW)">
              <input type="number" min={0} step={0.5} value={form.installed_power_kw||''}
                placeholder="ej. 12.5"
                onChange={e=>onChange('installed_power_kw', +e.target.value)}/>
            </Field>
          </div>
        ) : (
          <>
            <div style={{marginBottom:10,fontSize:'.74rem',color:'var(--salvi-grey)'}}>
              Potencia instalada (Soleado): <strong style={{color:'var(--salvi-black)'}}>{installedKw} kW</strong>
              {' — '}Distribución anual según cielo: <strong style={{color:'var(--salvi-black)'}}>{form.sky_condition||'intermediate'}</strong>
            </div>
            <table className="result-table" style={{marginBottom:10}}>
              <thead>
                <tr>
                  <th>Condición</th>
                  <th style={{textAlign:'right'}}>h/año</th>
                  <th style={{textAlign:'center'}}>Nivel</th>
                  <th style={{textAlign:'right'}}>kWh control</th>
                  <th style={{textAlign:'right',color:'var(--salvi-grey)'}}>kWh 100%</th>
                </tr>
              </thead>
              <tbody>
                {energyRows.map((r,i) => (
                  <tr key={i}>
                    <td style={{fontSize:'.78rem'}}>{r.label}</td>
                    <td style={{textAlign:'right',fontSize:'.80rem'}}>{r.hrs.toLocaleString()}</td>
                    <td style={{textAlign:'center'}}>
                      <div style={{display:'inline-flex',alignItems:'center',gap:5,minWidth:80}}>
                        <div style={{width:44,height:7,borderRadius:4,background:'var(--salvi-line)',overflow:'hidden'}}>
                          <div style={{width:`${r.dim}%`,height:'100%',background:'var(--salvi-black)'}}/>
                        </div>
                        <span style={{fontSize:'.75rem',fontWeight:600}}>{r.dim}%</span>
                      </div>
                    </td>
                    <td style={{textAlign:'right',fontWeight:600,fontSize:'.82rem'}}>{r.kWh?.toLocaleString()}</td>
                    <td style={{textAlign:'right',fontSize:'.78rem',color:'var(--salvi-grey)'}}>{r.kWh_fix?.toLocaleString()}</td>
                  </tr>
                ))}
                <tr style={{fontWeight:700,borderTop:'2px solid var(--salvi-line)'}}>
                  <td>Total</td>
                  <td style={{textAlign:'right'}}>8.760</td>
                  <td/>
                  <td style={{textAlign:'right'}}>{totalKwh?.toLocaleString()} kWh</td>
                  <td style={{textAlign:'right',color:'var(--salvi-grey)'}}>{totalKwhFix?.toLocaleString()} kWh</td>
                </tr>
              </tbody>
            </table>
            {savingsPct !== null && (
              <div className="alert alert-success" style={{fontSize:'.80rem'}}>
                ✅ Ahorro estimado con control continuo: <strong>{savingsPct}%</strong>
                {totalKwhFix && totalKwh
                  ? ` — ${Math.round((totalKwhFix - totalKwh) / 1000)} MWh/año ahorrados`
                  : ''}
              </div>
            )}
          </>
        )}
      </div>

      {/* ── Exportar ── */}
      <div className="card">
        <div className="card-title">💾 Exportar parámetros</div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={handleExport}>⬇️ JSON</button>
        </div>
      </div>
    </div>
  );
}

const _controlLerp = (a,b,t) => (
  Number(a||0)+(Number(b||0)-Number(a||0))*t
);

function _interpolateControlProfile(lower,upper,t,factor) {
  if(t<=1e-9) return lower;
  if(t>=1-1e-9) return upper;
  const nearestByS=(items,target)=>(
    (items||[]).reduce((best,item)=>
      !best||Math.abs(Number(item.s)-Number(target.s))
        <Math.abs(Number(best.s)-Number(target.s))?item:best
    ,null)
  );
  const interpolateObserver=(lowObserver,highObservers)=>{
    const high=(highObservers||[]).find(item=>
      Number(item.lane_index)===Number(lowObserver.lane_index)
      && Number(item.direction)===Number(lowObserver.direction)
    ) || (highObservers||[])[0];
    if(!high) return lowObserver;
    return {
      ...lowObserver,
      L:_controlLerp(lowObserver.L,high.L,t),
      U0:_controlLerp(lowObserver.U0,high.U0,t),
      Ul:_controlLerp(lowObserver.Ul,high.Ul,t),
      TI:_controlLerp(lowObserver.TI,high.TI,t),
      values:(lowObserver.values||[]).map((value,index)=>
        _controlLerp(value,high.values?.[index]??value,t)
      ),
    };
  };
  // La vista lateral de pared debe acompañar a la escena interpolada, no
  // quedarse con las muestras de la escena inmediatamente inferior.
  const interpolateWall=(lowWall,highWall,lowRoadL,highRoadL)=>{
    if(!lowWall || !highWall) return lowWall || highWall || {};
    const grid=(lowGrid,highGrid)=>(lowGrid||[]).map((row,rowIndex)=>(
      (row||[]).map((value,columnIndex)=>_controlLerp(
        value,highGrid?.[rowIndex]?.[columnIndex]??value,t
      ))
    ));
    const leftAvg=_controlLerp(lowWall.L_left_avg,highWall.L_left_avg,t);
    const rightAvg=_controlLerp(lowWall.L_right_avg,highWall.L_right_avg,t);
    const roadL=_controlLerp(lowRoadL,highRoadL,t);
    const ratio=Math.min(leftAvg,rightAvg)/Math.max(.001,roadL);
    const ratioRequired=Number(lowWall.ratio_required??highWall.ratio_required??0);
    return {
      ...lowWall,
      L_left_avg:leftAvg, L_right_avg:rightAvg,
      L_left_min:_controlLerp(lowWall.L_left_min,highWall.L_left_min,t),
      L_right_min:_controlLerp(lowWall.L_right_min,highWall.L_right_min,t),
      L_indirect_left:_controlLerp(lowWall.L_indirect_left,highWall.L_indirect_left,t),
      L_indirect_right:_controlLerp(lowWall.L_indirect_right,highWall.L_indirect_right,t),
      L_left_grid:grid(lowWall.L_left_grid,highWall.L_left_grid),
      L_right_grid:grid(lowWall.L_right_grid,highWall.L_right_grid),
      ratio, ratio_required:ratioRequired,
      compliant:ratio+1e-9>=ratioRequired,
      governing_side:leftAvg<=rightAvg?'left':'right',
    };
  };
  const fields=(lower.fields||[]).map(lowField=>{
    const highField=nearestByS(upper.fields,lowField);
    if(!highField) return lowField;
    return {
      ...lowField,
      L:_controlLerp(lowField.L,highField.L,t),
      L_min:_controlLerp(lowField.L_min,highField.L_min,t),
      U0:_controlLerp(lowField.U0,highField.U0,t),
      Ul:_controlLerp(lowField.Ul,highField.Ul,t),
      TI:_controlLerp(lowField.TI,highField.TI,t),
      L_required:_controlLerp(lowField.L_required,highField.L_required,t),
      L_required_total:_controlLerp(
        lowField.L_required_total??lowField.L_required,
        highField.L_required_total??highField.L_required,t
      ),
      natural_daylight_cd_m2:_controlLerp(
        lowField.natural_daylight_cd_m2,
        highField.natural_daylight_cd_m2,t
      ),
      grid_points:(lowField.grid_points||[]).map((point,index)=>({
        ...point,
        L:_controlLerp(point.L,highField.grid_points?.[index]?.L??point.L,t),
      })),
      observer_grids:(lowField.observer_grids||[]).map(observer=>
        interpolateObserver(observer,highField.observer_grids)
      ),
      wall:interpolateWall(
        lowField.wall,highField.wall,
        lowField.Lavg_governing??lowField.L,
        highField.Lavg_governing??highField.L,
      ),
    };
  });
  const points=(lower.points||[]).map(lowPoint=>{
    const highPoint=nearestByS(upper.points,lowPoint);
    if(!highPoint) return lowPoint;
    return {
      ...lowPoint,
      L:_controlLerp(lowPoint.L,highPoint.L,t),
      L_required:_controlLerp(
        lowPoint.L_required,highPoint.L_required,t
      ),
      L_required_total:_controlLerp(
        lowPoint.L_required_total??lowPoint.L_required,
        highPoint.L_required_total??highPoint.L_required,t
      ),
      natural_daylight_cd_m2:_controlLerp(
        lowPoint.natural_daylight_cd_m2,
        highPoint.natural_daylight_cd_m2,t
      ),
      U0:_controlLerp(lowPoint.U0,highPoint.U0,t),
      Ul:_controlLerp(lowPoint.Ul,highPoint.Ul,t),
    };
  });
  return {
    ...lower,
    scene:'intermediate',
    L20_factor:factor,
    Lth_cd_m2:_controlLerp(lower.Lth_cd_m2,upper.Lth_cd_m2,t),
    Lth_b_cd_m2:_controlLerp(lower.Lth_b_cd_m2,upper.Lth_b_cd_m2,t),
    fields,points,
  };
}

function ControlPhotometricLab({ result, form, onChange }) {
  // Sistema unificado de escenas derivado del unico SCENE_DEFINITIONS.
  // El orden de calculo del deslizador es ascendente por factor.
  const sceneDefinitions = SCENE_DEFINITIONS
    .filter(item=>item.key!=='night_reduced')
    .slice()
    .sort((a,b)=>a.factor-b.factor);
  // Orden de presentacion para los botones del laboratorio.
  const sceneDisplayDefinitions = [
    'sunny','normal','overcast','dusk','night_normal',
  ].map(key=>sceneDefinitions.find(item=>item.key===key));
  const nightReducedDefinition = SCENE_DEFINITIONS.find(
    item=>item.key==='night_reduced'
  );
  const [l20Percent,setL20Percent] = useState(100);
  const [nightRegime,setNightRegime] = useState('normal');
  const [planFieldIndex,setPlanFieldIndex] = useState(0);
  const [planPositionM,setPlanPositionM] = useState(null);
  const [includeNatural,setIncludeNatural] = useState(true);
  const [validatingControl,setValidatingControl] = useState(false);
  const [validationError,setValidationError] = useState(null);
  const [recalcSceneRunning,setRecalcSceneRunning] = useState(false);
  const [sceneLumSort,setSceneLumSort] = useState({key:'id',direction:'asc'});
  const [sceneFilter,setSceneFilter] = useState('all');
  const [sceneLumFilters,setSceneLumFilters] = useState({});
  // La tabla puede mostrar el estado que se está inspeccionando o la traza
  // completa de consignas de las seis escenas. La segunda es de auditoría y
  // por ello se mantiene en sólo lectura: evita editar por error una escena
  // distinta de la que se está verificando en la gráfica.
  const [sceneAuditMode,setSceneAuditMode] = useState('active');
  const lumResult = form.luminaires_result || null;
  const photoResult = form.photometric_result || null;
  const calcMode = form.calc_mode || photoResult?.calc_mode || 'direct';
  const sceneCurrentOverrides = form.scene_current_overrides || {};
  const manualLuminaireOverrides = form.manual_luminaire_overrides || {};
  const hasGPS=!!(parseFloat(form.lat)&&parseFloat(form.lng));
  const factor=Math.max(0,Math.min(1,Number(l20Percent)/100));
  let upperIndex=sceneDefinitions.findIndex(item=>item.factor>=factor-1e-9);
  if(upperIndex<0) upperIndex=sceneDefinitions.length-1;
  const lowerIndex=Math.max(
    0,
    sceneDefinitions.findLastIndex
      ? sceneDefinitions.findLastIndex(item=>item.factor<=factor+1e-9)
      : sceneDefinitions.reduce((best,item,index)=>
          item.factor<=factor+1e-9?index:best,0
        )
  );
  const lowerScene=sceneDefinitions[lowerIndex];
  const upperScene=sceneDefinitions[upperIndex];
  const blend=upperScene.factor>lowerScene.factor
    ? (factor-lowerScene.factor)/(upperScene.factor-lowerScene.factor)
    : 0;
  const interpolatedExactScene=Math.abs(lowerScene.factor-factor)<1e-9
    ? lowerScene
    : Math.abs(upperScene.factor-factor)<1e-9
      ? upperScene : null;
  const exactScene=factor===0&&nightRegime==='reduced'
    ? nightReducedDefinition : interpolatedExactScene;
  const scene=exactScene||{
    key:'intermediate',
    label:`${Math.round(factor*100)}% L20`,
    factor,
    color:'#2563eb',
  };
  const profileFor=item=>(
    photoResult?.scenarios?.[item.key]?.profile
    || photoResult?.scenarios?.[item.key]?.verification?.profile
    || (item.key==='sunny'?photoResult?.real_profile:null)
  );
  const lowerVerification=photoResult?.scenarios?.[lowerScene.key]||null;
  const upperVerification=photoResult?.scenarios?.[upperScene.key]||null;
  const verification=exactScene
    ? photoResult?.scenarios?.[exactScene.key]||null
    : {
        available:true,scene:'intermediate',compliant:null,
        minimum_U0:_controlLerp(
          lowerVerification?.minimum_U0,upperVerification?.minimum_U0,blend
        ),
        minimum_Ul:_controlLerp(
          lowerVerification?.minimum_Ul,upperVerification?.minimum_Ul,blend
        ),
      };
  const profile=exactScene
    ? profileFor(exactScene)
    : _interpolateControlProfile(
        profileFor(lowerScene),profileFor(upperScene),blend,factor
      );
  const completeProfiles = [...sceneDefinitions,nightReducedDefinition].every(item => {
    const sceneProfile = profileFor(item);
    return !!sceneProfile?.available;
  });

  const setSceneCurrentOverride = (row, nextValue) => {
    if (!row.sceneEditable) return;
    if (!['sunny','normal','overcast','dusk','night_normal','night_reduced']
        .includes(row.sceneKey)) return;
    const requested=Number(nextValue);
    if (!Number.isFinite(requested)) return;
    const rawMin=Number(lumConfig.I_min_pct??30);
    const minCurrent=Math.max(1,(rawMin>1?rawMin/100:rawMin)*350);
    const current=requested<=0?0:Math.min(Imax,Math.max(minCurrent,requested));
    const previous=sceneCurrentOverrides[row.sceneOverrideKey] || {};
    const original=Number(
      previous.original_current_mA ?? row.current
    );
    const next={...sceneCurrentOverrides};
    if (Math.abs(current-original)<1e-8) {
      delete next[row.sceneOverrideKey];
    } else {
      next[row.sceneOverrideKey]={
        original_current_mA:original,
        current_mA:current,
      };
    }
    onChange('scene_current_overrides',next);
  };
  const resetSceneCurrentOverride = row => {
    if (!sceneCurrentOverrides[row.sceneOverrideKey]) return;
    const next={...sceneCurrentOverrides};
    delete next[row.sceneOverrideKey];
    onChange('scene_current_overrides',next);
  };
  // Cambia el estado ON/OFF de una luminaria en la escena de la fila.
  // OFF -> mA 0; ON -> restaura la corriente original o la de diseno.
  const toggleSceneState = row => {
    if (!row.sceneEditable) return;
    if (row.state) {
      setSceneCurrentOverride(row, 0);
    } else {
      const target=Number(
        row.sceneCurrentOverride?.original_current_mA
        || row.designCurrent
        || 350
      );
      setSceneCurrentOverride(row, Math.max(1, target));
    }
  };
  const setManualControlField=(row,field,nextValue)=>{
    if(!row.physicalEditable) return;
    const numericValue=Number(nextValue);
    if(!Number.isFinite(numericValue)) return;
    const previous=manualLuminaireOverrides[row.physicalOverrideKey]||{original:{}};
    const values={...(previous.values||{})};
    const original=Number(row[field==='s'?'originalX':'originalTilt']);
    if(Math.abs(numericValue-original)<1e-8) delete values[field];
    else values[field]=numericValue;
    const next={...manualLuminaireOverrides};
    if(!Object.keys(values).length) delete next[row.physicalOverrideKey];
    else next[row.physicalOverrideKey]={original:{...(previous.original||{}),[field]:original},values};
    onChange('manual_luminaire_overrides',next);
  };
  const resetManualControlField=row=>{
    if(!manualLuminaireOverrides[row.physicalOverrideKey]) return;
    const next={...manualLuminaireOverrides};
    delete next[row.physicalOverrideKey];
    onChange('manual_luminaire_overrides',next);
  };
  const toggleSceneLumSort = key => setSceneLumSort(previous => ({
    key,
    direction:previous.key===key&&previous.direction==='asc'?'desc':'asc',
  }));
  const sceneLumFiltersActive=Object.values(sceneLumFilters).some(value=>value);
  const exportSceneLumListXls=()=>{
    const headers=[
      ...(sceneAuditMode==='all'?['Escena']:[]),
      'ID','Zona','Capa','Par','x (m)','y (m)','d→ (m)','Óptica','Tilt (°)','Modelo',
      'mA base','mA escena','Estado','DALI est.','W','lm','Campo CIE 140','Lavg campo',
      'Lreq art.','Lreq total','Lavg/Lreq','U0','Ul','Flicker (Hz)',...(hasGPS?['Lat','Lon']:[]),
    ];
    const rows=sortedOperatingRows.map(row=>[
      ...(sceneAuditMode==='all'?[row.sceneLabel]:[]),row.id,row.zone,row.layer,row.pair||'',
      Number(row.x).toFixed(1),Number(row.y).toFixed(2),Number(row.d_nxt||0).toFixed(1),row.optic||'',
      Number(row.tilt||0).toFixed(1),row.modelLabel||row.model||'',row.base_mA??'',row.current,
      row.state?'ON':'OFF',row.dali,Number(row.power||0).toFixed(1),Number(row.flux||0).toFixed(0),
      row.governingField?`${row.governingField.start.toFixed(1)}-${row.governingField.end.toFixed(1)} C${row.governingField.lane}`:'',
      row.governingField?.Lavg?.toFixed(1)??'',Number(row.LreqArtificial||0).toFixed(1),
      Number(row.LreqTotal||0).toFixed(1),Number(row.Lratio||0).toFixed(3),row.U0??'',row.Ul??'',
      Number(row.flickerHz||0).toFixed(1),
      ...(hasGPS?(tunnelLuminaireGps(form,row.x,row.y)||['','']):[]),
    ]);
    const esc=value=>`"${String(value??'').replace(/"/g,'""')}"`;
    const csv=[headers,...rows].map(row=>row.map(esc).join(';')).join('\r\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob), anchor=document.createElement('a');
    anchor.href=url; anchor.download=`lista_luminarias_control_${form.tube_id||'T1'}.csv`;
    document.body.appendChild(anchor); anchor.click(); anchor.remove(); URL.revokeObjectURL(url);
  };

  const validateControlNow = async (modeOverride=calcMode) => {
    if (!onChange || validatingControl) return;
    setValidatingControl(true);
    setValidationError(null);
    try {
      const lumConfig = {...DEFAULT_LUM_CONFIG,...(form.lum_config||{})};
      const response = await fetch('/api/tunnel/luminaires', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          ...form,
          luminaire:lumConfig,
          tilt_overrides:form.tilt_overrides||{},
          tandem_overrides:form.tandem_overrides||{},
          calc_mode:modeOverride,
          calculation_phase:'full',
        }),
      });
      const data = await response.json();
      if (!data.success) {
        throw new Error(data.error||'No se pudo validar el control DALI');
      }
      onChange('luminaires_result',{
        ...data.luminaires,
        arrangement:lumConfig.arrangement,
      });
      onChange('photometric_result',data.photometric||null);
      onChange('installed_power_kw',installedSunnyPowerKw(data.luminaires));
    } catch(error) {
      setValidationError(error.message||String(error));
    } finally {
      setValidatingControl(false);
    }
  };
  const recalculateWithCalcMode = mode => {
    if (validatingControl) return;
    onChange('calc_mode',mode);
    validateControlNow(mode);
  };
  // Recalcula SOLO la escena crepuscular conservando los mA editados en
  // la tabla: no re-optimiza corrientes (los datos manuales no se mueven).
  // Recalcula SOLO la escena activa conservando los mA editados en la
  // tabla: no re-optimiza corrientes (los datos manuales no se mueven).
  const recalcActiveScene = async () => {
    const targetSceneKey = exactScene?.key || lowerScene?.key || 'sunny';
    const targetScene = sceneDefinitions.find(
      item=>item.key===targetSceneKey
    ) || lowerScene;
    if (recalcSceneRunning || !onChange || !form.luminaires_result || !targetScene) return;
    setRecalcSceneRunning(true);
    setValidationError(null);
    try {
      const lumConfig={...DEFAULT_LUM_CONFIG,...(form.lum_config||{})};
      const response=await fetch('/api/tunnel/recalc-scene',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...form, luminaire:lumConfig, scene:targetSceneKey}),
      });
      const data=await response.json();
      if(!data.success) throw new Error(data.error||`No se pudo recalcular ${targetScene.label}`);
      const photo=form.photometric_result||{};
      onChange('photometric_result',{
        ...photo,
        scenarios:{...(photo.scenarios||{}), [targetSceneKey]:data.verification},
      });
      // Mostrar la grafica de la escena recalculada con la nueva curva Lest
      setNightRegime('normal');
      setL20Percent(Math.round(targetScene.factor*100));
    } catch(error) {
      setValidationError(error.message||String(error));
    } finally {
      setRecalcSceneRunning(false);
    }
  };

  if (!lumResult) return (
    <Alert type="info">
      Calcula primero la instalación física en la fase Luminarias.
    </Alert>
  );
  if (!photoResult?.scenarios || !completeProfiles || !profile?.available) return (
    <div className="card" style={{padding:18}}>
      <div className="card-title">Curvas multiescenario pendientes</div>
      <div style={{fontSize:'.75rem',color:'var(--salvi-grey)',lineHeight:1.55}}>
        La instalación física está calculada. Falta verificar las mallas CIE 140
        de soleado, normal, cubierto, crepuscular, noche normal y reducida.
      </div>
      <button type="button" className="calc-btn" onClick={validateControlNow}
        disabled={validatingControl} style={{marginTop:12,maxWidth:320}}>
        {validatingControl
          ? 'Validando seis escenarios…'
          : '▶ Validar y mostrar curvas'}
      </button>
      {validatingControl&&(
        <div style={{fontSize:'.65rem',color:'#1d4ed8',marginTop:8}}>
          Se mantiene la instalación y se calculan sus consignas operativas.
          Este proceso puede tardar unos minutos.
        </div>
      )}
      {validationError&&(
        <div style={{fontSize:'.68rem',color:'#b91c1c',marginTop:8}}>
          ❌ {validationError}
        </div>
      )}
    </div>
  );

  const L20Design = Number(result.summary?.L20||0);
  const L20Selected = L20Design * factor;
  const Lin = Number(result.summary?.Lin||0);
  const LnightNormal = Number(
    result.summary?.L_night_normal
    ?? form.night_normal_luminance_cd_m2
    ?? result.summary?.Lin
    ?? 0
  );
  const LnightReduced = Number(
    result.summary?.L_night_reduced
    ?? form.night_reduced_luminance_cd_m2
    ?? result.summary?.L_night
    ?? form.night_luminance_cd_m2
    ?? 1
  );
  const designLth=Number(result.summary?.Lth||0);
  const anchorLth=item=>(
    item.key==='night_normal'
      ? LnightNormal
      : item.key==='night_reduced'
        ? LnightReduced
      : Math.max(Lin,designLth*item.factor)
  );
  const LthSelected=exactScene
    ? Number(verification?.Lth_cd_m2??anchorLth(exactScene))
    : _controlLerp(anchorLth(lowerScene),anchorLth(upperScene),blend);
  // La curva roja se alimenta exclusivamente de campos CIE 140 completos.
  // `fields` es el registro canónico: `points` es sólo su resumen ligero y
  // puede estar incompleto en escenas con refuerzos apagados.
  const profileSeries = (() => {
    const points = Array.isArray(profile?.points) ? profile.points : [];
    const fields = Array.isArray(profile?.fields) ? profile.fields : [];
    const valid = values => values.filter(item =>
      Number.isFinite(Number(item?.s))
      && Number.isFinite(Number(item?.Lavg_governing ?? item?.L ?? item?.Lavg))
    );
    const fieldSeries = valid(fields);
    return fieldSeries.length ? fieldSeries : valid(points);
  })();
  const originalChart = result.chart || {};
  const controlledZones = new Set([
    'THRESHOLD','TRANSITION','INTERIOR','TRANSITION_B','THRESHOLD_B',
  ]);
  const nightTunnelZones = new Set([
    ...controlledZones,'EXIT',
  ]);
  const exitZone=result.zones?.exit;
  const exitStart=Number(exitZone?.s_start);
  const exitEnd=Number(exitZone?.s_end);
  const exitTargetRaw=Number(
    exitZone?.L_end ?? exitZone?.L_min_required ?? Lin
  );
  // Compatibilidad con resultados guardados antes del ajuste de CEX: si el
  // motor no marcó una anulación explícita, nunca se acepta una salida por
  // debajo de Lin.
  const exitTarget=exitZone?.project_override
    ? exitTargetRaw
    : Math.max(Lin,exitTargetRaw);
  const exitRequiredAt=s=>{
    if(!exitZone||!Number.isFinite(exitStart)||!Number.isFinite(exitEnd)
      ||exitEnd<=exitStart) return null;
    const fraction=Math.min(1,Math.max(0,(Number(s)-exitStart)/(exitEnd-exitStart)));
    return Math.max(0,Lin+fraction*(exitTarget-Lin));
  };
  const requiredAtAnchor=(point,item)=>{
    const zone=String(point.zone||'').toUpperCase();
    const designRequired=Number(point.L||0);
    if(item.key==='night_normal'||item.key==='night_reduced'){
      const target=item.key==='night_normal'?LnightNormal:LnightReduced;
      return nightTunnelZones.has(zone)?target:0;
    }
    // La salida no depende de L20. Conserva Lin o el perfil manual de
    // proyecto configurado para CEX, con continuidad desde el interior.
    if(zone==='EXIT') return Math.max(0,exitRequiredAt(point.s) ?? designRequired);
    if(controlledZones.has(zone)){
      return Math.max(
        Lin,
        Lin+item.factor*(designRequired-Lin),
      );
    }
    return Math.max(0,designRequired*item.factor);
  };
   // La fuente normativa de Lreq en una escena validada es el perfil CIE 140
   // enriquecido por backend. Recalcular aquí Lin + factor * (L-Lin) no es
   // equivalente a evaluar de nuevo la curva CIE 88 con el Lth de la escena.
   const profileRequiredAt = (s, includeTotal=false) => {
     const source = (profile?.fields||[])
       .filter(item => Number.isFinite(Number(item?.s)))
       .map(item => ({
         s:Number(item.s),
         value:Number(item?.[includeTotal ? 'L_required_total' : 'L_required']),
       }))
       .filter(item => Number.isFinite(item.value))
       .sort((a,b)=>a.s-b.s);
     if (!source.length) return null;
     if (source.length===1 || Number(s)<=source[0].s) return source[0].value;
     if (Number(s)>=source[source.length-1].s) return source[source.length-1].value;
     for (let i=1;i<source.length;i++) {
       const low=source[i-1], high=source[i];
       if (Number(s)<=high.s) {
         const span=Math.max(1e-9,high.s-low.s);
         return _controlLerp(low.value,high.value,(Number(s)-low.s)/span);
       }
     }
     return source[source.length-1].value;
   };
   // Overlay con la curva Lreq de todas las escenas para que la grafica
   // de Control muestre tambien las demas escenas, igual que Luminarias.
   const overlayScenes = [...sceneDefinitions,nightReducedDefinition]
     .filter(item=>item.key!==scene.key)
     .map(item=>({
       key:item.key,
       label:item.label,
       color:item.color,
       points:(result.chart?.data||[]).map(point=>({
         s:Number(point.s),
         L:requiredAtAnchor(point,item),
       })),
     }));
   const sceneChart = {
    ...originalChart,
     data:(originalChart.data||[]).map(point=>{
       const zone=String(point.zone||'').toUpperCase();
       const profileRequired=profileRequiredAt(point.s,includeNatural);
       let required=Number.isFinite(profileRequired)
         ? profileRequired
         : exactScene
           ? requiredAtAnchor(point,exactScene)
           : _controlLerp(
               requiredAtAnchor(point,lowerScene),
               requiredAtAnchor(point,upperScene),
               blend,
             );
       if(!Number.isFinite(profileRequired)
         && !includeNatural&&factor>0&&profileSeries.length&&zone!=='EXIT'){
         const nearest=profileSeries.reduce((best,item)=>
          !best||Math.abs(Number(item.s)-Number(point.s))<Math.abs(Number(best.s)-Number(point.s))
            ? item : best
        ,null);
        required=Math.max(
          factor<.05?LnightNormal:Lin,
          required-Number(nearest?.natural_daylight_cd_m2||0),
        );
      }
      return {...point,L:required};
    }),
  };
   const sceneRequirementAt = s => {
     const samples = sceneChart.data||[];
     const nearest = samples.reduce((best,item) =>
       !best || Math.abs(Number(item.s)-Number(s)) < Math.abs(Number(best.s)-Number(s))
         ? item : best
       , null);
     return Number(nearest?.L||0);
   };
   const validNumberOr = (value, fallback=0) => (
    Number.isFinite(Number(value)) ? Number(value) : fallback
  );
  const actualPoints = profileSeries.map(point=>{
    const LreqScene = sceneRequirementAt(point.s);
    const LreqArtificial = validNumberOr(point.L_required, LreqScene);
    const LreqTotal = validNumberOr(point.L_required_total, LreqScene);
    return {
      s:Number(point.s),
      L:Math.max(0.01,
        Number(point.Lavg_governing ?? point.L ?? point.Lavg)
        +(includeNatural?Number(point.natural_daylight_cd_m2||point.L_natural||0):0)
      ),
      field_start:point.field_start,
      field_end:point.field_end,
      // La comparación normativa usa el requisito de ESTE campo; no Lth,
      // que sólo es la referencia de boca del umbral.
      Lreq:includeNatural ? LreqTotal : LreqArtificial,
      U0:point.U0,
      Ul:point.Ul,
    };
  });
  const zoneList=[...(lumResult.zones||[])].sort(
    (a,b)=>Number(a.s_start||0)-Number(b.s_start||0)
  );
  const lumConfig={...DEFAULT_LUM_CONFIG,...(form.lum_config||{})};
  const arrangement=lumResult.arrangement||lumConfig.arrangement||'bilateral_sym';
  const width=Number(form.width_m||lumResult.road_width_m||10.5);
  const wallOffset=Number(lumConfig.wall_offset_m||.3);
  const Imax=Math.max(1,Number(lumResult.I_max_mA||lumConfig.I_max_mA||750));
  const fields=profile.fields||[];
  const selectedFieldForSlider=fields[Math.max(
    0,Math.min(planFieldIndex,Math.max(0,fields.length-1))
  )]||null;
  const sliderTargetS=planPositionM!=null && Number.isFinite(Number(planPositionM))
    ? Number(planPositionM) : Number(selectedFieldForSlider?.s);
  const fieldValueForComparison=field=>({
    Lavg:Number(field?.Lavg_governing??field?.L??0),
    Lreq:Number(field?.L_required_total??field?.L_required??0),
  });
  const fieldForLuminaire=(fieldSet,x,zoneName)=>{
    const sameZone=fieldSet.filter(field=>field.zone_name===zoneName);
    const inRange=(sameZone.length?sameZone:fieldSet).filter(field=>
      Number(x)>=Number(field.field_start)-1e-6
      && Number(x)<=Number(field.field_end)+1e-6
    );
    const candidates=inRange.length ? inRange : (sameZone.length?sameZone:fieldSet);
    return [...candidates].sort((a,b)=>{
      const va=fieldValueForComparison(a);
      const vb=fieldValueForComparison(b);
      const ratioA=va.Lavg/Math.max(va.Lreq,1e-9);
      const ratioB=vb.Lavg/Math.max(vb.Lreq,1e-9);
      if(Math.abs(ratioA-ratioB)>1e-8) return ratioA-ratioB;
      return Math.abs(Number(a.s)-Number(x))-Math.abs(Number(b.s)-Number(x));
    })[0]||null;
  };
  const operationAtAnchor=(setpoint,zone,item)=>{
    const storedOperation=setpoint.scenario_operating_points?.[item.key];
    // Las cuatro escenas diurnas tienen siempre operación almacenada. Para
    // noche sólo se da prioridad a una consigna manual específica de escena.
    if (
      storedOperation && (
        !item.key.startsWith('night_')
        || storedOperation.manual_current_override
      )
    ) return storedOperation;
    if(item.key==='night_normal'){
      return zone.control_layer==='permanent'
        ? {
            state:'on',
            current_mA:setpoint.current_mA,
            power_w:setpoint.power_w,
            flux_lm:setpoint.flux_lm,
            driver_floor:false,
          }
        : {state:'off',current_mA:0,power_w:0,flux_lm:0};
    }
    if(item.key==='night_reduced'){
      return zone.control_layer==='permanent'
        ? {
            state:'on',
            current_mA:setpoint.night_current_mA,
            power_w:setpoint.night_power_w,
            flux_lm:setpoint.night_flux_lm,
            driver_floor:setpoint.night_driver_floor,
          }
        : {state:'off',current_mA:0,power_w:0,flux_lm:0};
    }
    return storedOperation||{state:'off',current_mA:0,power_w:0,flux_lm:0};
  };
  const operationFor=(setpoint,zone)=>{
    if(exactScene) return operationAtAnchor(setpoint,zone,exactScene);
    const low=operationAtAnchor(setpoint,zone,lowerScene);
    const high=operationAtAnchor(setpoint,zone,upperScene);
    const flux=_controlLerp(low.flux_lm,high.flux_lm,blend);
    return {
      state:flux>1e-9?'on':'off',
      current_mA:_controlLerp(low.current_mA,high.current_mA,blend),
      power_w:_controlLerp(low.power_w,high.power_w,blend),
      flux_lm:flux,
      driver_floor:!!(low.driver_floor||high.driver_floor),
    };
  };
  const buildOperatingRows=(item,fieldSet,operationResolver,{editable=false,sceneRank=0}={})=>{
    const rows=[];
    let rowId=1;
    const _speedKmh=Math.max(1,Number(form.speed_kmh||80)||80);
    const _vMs=_speedKmh/3.6;
    const _fRange=(lumResult?.performance?.flicker?.range_hz)||[2.5,15];
    const _fMin=Number(_fRange[0]||2.5);
    const _fMax=Number(_fRange[1]||15);
    zoneList.forEach(zone=>{
      const _sortedXs=(zone.setpoints||[])
        .map(sp=>Number(sp.s||0)).sort((a,b)=>a-b);
      const _spacingFor=(s)=>{
        const idx=_sortedXs.indexOf(s);
        if(idx<0) return Math.max(0.01,Number(zone.d_used||0)||1);
        const next=_sortedXs[idx+1];
        if(next!=null) return Math.max(0.01,next-s);
        const prev=idx>0?_sortedXs[idx-1]:null;
        if(prev!=null) return Math.max(0.01,s-prev);
        return Math.max(0.01,Number(zone.d_used||0)||1);
      };
      (zone.setpoints||[]).forEach((setpoint,index)=>{
        const operation=operationResolver(setpoint,zone);
        const sceneOverrideKey=editable
          ? `${item.key}|${zone.zone_name}|${Number(setpoint.idx)||index+1}`
          : null;
        const sceneCurrentOverride=sceneOverrideKey
          ? sceneCurrentOverrides[sceneOverrideKey]
          : null;
        const sceneEditable=editable && (
          !item.key.startsWith('night_') || zone.control_layer==='permanent'
        );
        const physicalOverrideKey=`${zone.zone_name}|${Number(setpoint.idx)||index+1}`;
        const physicalOverride=manualLuminaireOverrides[physicalOverrideKey]||null;
        const originalX=Number(setpoint.s||0);
        const originalTilt=Number(setpoint.tilt_deg??zone.tilt_deg??0);
        const physicalEditable=editable&&sceneAuditMode==='active';
        const x=Number(physicalOverride?.values?.s??originalX);
        const field=fieldForLuminaire(fieldSet,x,zone.zone_name)
          || fieldSet.reduce((best,candidate)=>
            !best||Math.abs(Number(candidate.s)-x)<Math.abs(Number(best.s)-x)
              ? candidate : best
          ,null);
        const natural=Number(field?.natural_daylight_cd_m2||0);
        const fieldValues=fieldValueForComparison(field);
        const requestedCurrent=Number((sceneCurrentOverride?.current_mA??operation.current_mA)||0);
        const state=operation.state!=='off'&&requestedCurrent>0&&Number(operation.flux_lm||0)>0;
        const current=state?requestedCurrent:0;
        const dali=state?Math.max(1,Math.min(254,Math.round(254*current/Imax))):0;
        const LfieldArtificial=fieldValues.Lavg;
        const LfieldTotal=LfieldArtificial+natural;
        const LreqArtificial=Number(field?.L_required||0);
        const LreqTotal=fieldValues.Lreq;
        const fieldU0=Number(field?.U0);
        const fieldUl=Number(field?.Ul);
        const governingField=field && Number.isFinite(Number(field?.field_start))
          ? {
              start:Number(field.field_start),end:Number(field.field_end),
              lane:Number(field.governing_lane_number??field.observer_lane_number??1),
              direction:Number(field.governing_direction??field.observer_direction??1),
              Lavg:LfieldArtificial,Lreq:LreqTotal,
              ratio:LfieldArtificial/Math.max(LreqTotal,1e-9),
            }
          : null;
        const _spacing=_spacingFor(x);
        const fHz=_spacing>0? _vMs/_spacing : 0;
        const flickerCritical=fHz>=_fMin-1e-9 && fHz<=_fMax+1e-9;
        const flickerUnavoidable=(
          lumResult?.performance?.flicker?.zones?.[zone.zone_name]?.status
            ==='unavoidable'
        );
        physicalLuminaireYPositions(
          arrangement,width,wallOffset,Number(setpoint.idx)||index+1
        ).forEach(y=>rows.push({
          id:rowId++,sceneKey:item.key,sceneLabel:item.label,sceneColor:item.color,
          sceneRank,zone:zone.zone_name,layer:zone.control_layer,
          x,y,originalX,originalTilt,physicalOverrideKey,physicalOverride,physicalEditable,
          model:setpoint.model||zone.model,modelLabel:setpoint.model||zone.model,
          pair:setpoint.tandem||setpoint.pair||null,
          optic:setpoint.optic||zone.optic,tilt:Number(physicalOverride?.values?.tilt_deg??originalTilt),
          state,current,dali,designCurrent:Number(setpoint.current_mA||zone.current_mA||0),
          base_mA:zone.control_layer==='permanent'
            ? Number((setpoint.base_current_mA??setpoint.current_mA??zone.current_mA)||0) : null,
          flickerHz:fHz,flickerCritical,flickerUnavoidable,spacingM:_spacing,
          d_nxt:_spacing,
          power:state?Number(operation.power_w||0):0,
          flux:state?Number(operation.flux_lm||0):0,
          driverFloor:!!operation.driver_floor,
           sceneOverrideKey,sceneCurrentOverride,sceneEditable,
           scenePending:!!sceneCurrentOverride&&Math.abs(
             Number(sceneCurrentOverride.current_mA)-Number(operation.current_mA||0)
           )>1e-8,
          LreqArtificial,LreqTotal,LfieldArtificial,LfieldTotal,
          governingField,U0:Number.isFinite(fieldU0)?fieldU0:null,
          Ul:Number.isFinite(fieldUl)?fieldUl:null,
          Lratio:(includeNatural?LfieldTotal:LfieldArtificial)/Math.max(
            includeNatural?LreqTotal:LreqArtificial,1e-9
          ),
        }));
      });
    });
    return rows;
  };
  // Éste es el conjunto asociado a la curva y al deslizador actual. Siempre
  // se usa para los KPI, aunque la tabla esté desplegada en seis escenas.
  const operatingRows=buildOperatingRows(
    scene,
    fields,
    operationFor,
    {editable:!!exactScene}
  );
  const auditScenes=[...sceneDisplayDefinitions,nightReducedDefinition];
  const tableOperatingRows=sceneAuditMode==='all'
    ? auditScenes.flatMap((item,sceneRank)=>buildOperatingRows(
        item,
        profileFor(item)?.fields||[],
        (setpoint,zone)=>operationAtAnchor(setpoint,zone,item),
        {editable:!item.key.startsWith('night_'),sceneRank}
      ))
    : operatingRows;
  const sceneColumnDefs=[
    ...(sceneAuditMode==='all'?[{type:'text',get:row=>row.sceneLabel}]:[]),
    {type:'num',get:row=>row.id},
    {type:'text',get:row=>`${row.zone} ${row.layer}`},
    {type:'text',get:row=>row.pair||''},
    {type:'num',get:row=>row.x},{type:'num',get:row=>row.y},
    {type:'num',get:row=>row.d_nxt},{type:'text',get:row=>row.optic||''},
    {type:'num',get:row=>row.tilt},{type:'text',get:row=>row.modelLabel||row.model||''},
    {type:'num',get:row=>row.base_mA},{type:'num',get:row=>row.current},
    {type:'text',get:row=>row.state?'ON':'OFF'},{type:'num',get:row=>row.dali},
    {type:'num',get:row=>row.power},{type:'num',get:row=>row.flux},
    {type:'text',get:row=>row.governingField
      ? `${row.governingField.start.toFixed(1)}-${row.governingField.end.toFixed(1)}` : ''},
    {type:'num',get:row=>row.governingField?.Lavg},
    {type:'num',get:row=>row.LreqArtificial},{type:'num',get:row=>row.LreqTotal},
    {type:'num',get:row=>row.Lratio},{type:'num',get:row=>row.U0},
    {type:'num',get:row=>row.Ul},{type:'num',get:row=>row.flickerHz},
    ...(hasGPS?[{type:'num',get:row=>Number(tunnelLuminaireGps(form,row.x,row.y)?.[0])},
      {type:'num',get:row=>Number(tunnelLuminaireGps(form,row.x,row.y)?.[1])}]:[]),
  ];
  const matchSceneNumber=(value,filterValue)=>{
    if(value==null||!Number.isFinite(Number(value))) return false;
    const text=String(filterValue||'').trim();
    const direct=text.match(/^(>=|<=|!=|>|<|=)?\s*(-?\d+(?:\.\d+)?)$/);
    if(direct){
      const op=direct[1]||'=',target=Number(direct[2]),number=Number(value);
      if(op==='>') return number>target;
      if(op==='>=') return number>=target;
      if(op==='<') return number<target;
      if(op==='<=') return number<=target;
      if(op==='!=') return Math.abs(number-target)>1e-9;
      return Math.abs(number-target)<1e-9;
    }
    const range=text.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/);
    if(range){
      const low=Math.min(Number(range[1]),Number(range[2]));
      const high=Math.max(Number(range[1]),Number(range[2]));
      return Number(value)>=low&&Number(value)<=high;
    }
    return String(value).includes(text);
  };
  const filteredOperatingRows=tableOperatingRows.filter(row=>
    sceneColumnDefs.every((column,index)=>{
      const filterValue=sceneLumFilters[index];
      if(!filterValue) return true;
      const value=column.get(row);
      return column.type==='num'
        ? matchSceneNumber(value,filterValue)
        : String(value??'').toLowerCase().includes(String(filterValue).trim().toLowerCase());
    })
  );
  const visibleOperatingRows=(
    sceneAuditMode==='all' && sceneFilter!=='all'
      ? filteredOperatingRows.filter(row=>row.sceneKey===sceneFilter)
      : filteredOperatingRows
  );
  const nearestLuminaireDistance=Number.isFinite(sliderTargetS)
    ? Math.min(...operatingRows.map(row=>Math.abs(row.x-sliderTargetS)),Infinity)
    : Infinity;
  visibleOperatingRows.forEach(row=>{
    row.nearestToSlider=Number.isFinite(nearestLuminaireDistance)
      && Math.abs(Math.abs(row.x-sliderTargetS)-nearestLuminaireDistance)<1e-6;
  });
  const sortedOperatingRows=[...visibleOperatingRows].sort((a,b)=>{
    if(sceneAuditMode==='all'&&a.sceneRank!==b.sceneRank){
      return a.sceneRank-b.sceneRank;
    }
      const value=row=>({
        id:row.id,
        x:row.x,
        state:row.state?0:1,
        power:row.power,
        current:row.current,
        U0:row.U0,
        Ul:row.Ul,
        Lavg:row.governingField?.Lavg,
        flicker:row.flickerHz,
      })[sceneLumSort.key];
    const av=value(a), bv=value(b);
    const compared=typeof av==='number'&&typeof bv==='number'
      ? av-bv : String(av).localeCompare(String(bv),'es');
    return (sceneLumSort.direction==='asc'?1:-1)
      *(Math.abs(compared)>1e-9?compared:a.id-b.id);
  });
  const operatingPower = Number(
    exactScene
      ? (
          verification?.operating_power_kw
          ?? lumResult.scenarios?.[exactScene.key]?.power_kw
          ?? operatingRows.reduce((sum,row)=>sum+row.power,0)/1000
        )
      : operatingRows.reduce((sum,row)=>sum+row.power,0)/1000
  );
  const activeLuminaires = Number(
    exactScene
      ? verification?.active_luminaires
        ?? operatingRows.filter(row=>row.state).length
      : operatingRows.filter(row=>row.state).length
  );
  const minimumRatio = Number(
    exactScene
      ? verification?.minimum_L_ratio
        ?? (
          (exactScene.key==='night_normal'||exactScene.key==='night_reduced')
            ? Number(verification?.minimum_field_Lavg_cd_m2||0)/Math.max(
                exactScene.key==='night_normal'?LnightNormal:LnightReduced,1e-9
              )
            : 0
        )
      : Math.min(...fields.map(field=>
          Number(field.L||0)/Math.max(Number(field.L_required||0),1e-9)
        ))
  );
  const daylightScene=exactScene
    ? lumResult.daylight?.scenes?.[exactScene.key]||{}
    : {};
  const daylightPeak=Math.max(
    Number(daylightScene.portal_a_mouth_cd_m2||0),
    Number(daylightScene.portal_b_mouth_cd_m2||0),
    ...fields.map(field=>Number(field.natural_daylight_cd_m2||0)),
  );
  const maxExcess = (
    exactScene && Number(verification?.maximum_L_ratio||0) > 0
  ) ? Number(verification.maximum_L_ratio) : null;
  const lShortfallScenes = Object.entries(photoResult?.scenarios||{})
    .filter(([_k,v])=>v && typeof v==='object'
      && Number(v?.minimum_L_ratio||0) > 0
      && Number(v.minimum_L_ratio) < 1)
    .map(([k,v])=>`${k} (${Number(v.minimum_L_ratio).toFixed(3)})`);

  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      {lShortfallScenes.length>0 && (
        <div style={{padding:'10px 12px',border:'1px solid #b91c1c',borderRadius:8,
                     background:'#fef2f2',color:'#991b1b',fontSize:'.72rem',fontWeight:600}}>
          ⛔ L por debajo de Lreq (no negociable): {lShortfallScenes.join(', ')}.
          Esta instalación NO es válida. Aumenta la densidad de luminarias o revisa el proyecto.
        </div>
      )}
      <div className="card">
        <div className="card-title">🔬 Laboratorio fotométrico de Control</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
          {sceneDisplayDefinitions.map(item=>(
            <button key={item.key} type="button"
              onClick={()=>{
                setNightRegime('normal');
                setL20Percent(Math.round(item.factor*100));
              }}
              style={{padding:'5px 10px',borderRadius:999,cursor:'pointer',
                      border:`1px solid ${exactScene?.key===item.key?item.color:'var(--salvi-line)'}`,
                      background:exactScene?.key===item.key?item.color:'#fff',
                      color:exactScene?.key===item.key?'#fff':'var(--salvi-grey)',
                      fontSize:'.68rem',fontWeight:700}}>
              {item.label} · {Math.round(item.factor*100)}%
            </button>
          ))}
          <button type="button"
            onClick={()=>{setNightRegime('reduced');setL20Percent(0);}}
            style={{padding:'5px 10px',borderRadius:999,cursor:'pointer',
                    border:`1px solid ${exactScene?.key==='night_reduced'?'#111827':'var(--salvi-line)'}`,
                    background:exactScene?.key==='night_reduced'?'#111827':'#fff',
                    color:exactScene?.key==='night_reduced'?'#fff':'var(--salvi-grey)',
                    fontSize:'.68rem',fontWeight:700}}>
            Noche reducida Â· 0%
          </button>
        </div>
        <label style={{display:'grid',gridTemplateColumns:'105px minmax(240px,1fr) 150px',
                       gap:10,alignItems:'center',fontSize:'.68rem',color:'var(--salvi-grey)'}}>
          <span>Nivel exterior L20</span>
          <input type="range" min="0" max="100" step="1" value={l20Percent}
            onChange={event=>{
              setNightRegime('normal');
              setL20Percent(Number(event.target.value));
            }}/>
          <span style={{textAlign:'right',fontFamily:'monospace'}}>
            {L20Selected.toFixed(0)} cd/m² · {Math.round(factor*100)}%
          </span>
        </label>
        <div style={{fontSize:'.61rem',color:'var(--salvi-grey)',marginTop:5}}>
          La geometría instalada permanece bloqueada; solo cambian las
          consignas DALI.
          {!exactScene&&(
            <strong style={{color:'#1d4ed8'}}>
              {' '}Interpolación instantánea entre {lowerScene.label} y {upperScene.label};
              no se está lanzando un nuevo cálculo.
            </strong>
          )}
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(145px,1fr))',gap:8}}>
        {[
          ['L20 exterior',L20Selected.toFixed(0),'cd/m²'],
          ['Lth operativo',LthSelected.toFixed(1),'cd/m²'],
          ['Potencia operativa',operatingPower.toFixed(2),'kW'],
          ['Luminarias activas',activeLuminaires.toFixed(0),'ud'],
          ['Peor L/Lreq',minimumRatio?minimumRatio.toFixed(3):'—',''],
          ['Exceso L/Lreq',maxExcess!=null
            ? `${((maxExcess-1)*100).toFixed(0)}%`
            : '—',
            `techo ${lumConfig.scene_excess_ratio_pct??4}%`],
        ].map(([label,value,unit])=>(
          <div key={label} style={{padding:'8px 10px',border:'1px solid var(--salvi-line)',
                                  borderRadius:7,background:'var(--salvi-surface)'}}>
            <div style={{fontSize:'.62rem',color:'var(--salvi-grey)'}}>{label}</div>
            <div style={{fontSize:'1rem',fontWeight:700,marginTop:2}}>
              {value} <span style={{fontSize:'.64rem',fontWeight:400}}>{unit}</span>
            </div>
          </div>
        ))}
      </div>

      <div style={{padding:'8px 10px',
                  border:`1px solid ${!exactScene?'#93c5fd':verification.compliant?'#86efac':'#fca5a5'}`,
                  borderRadius:7,
                  background:!exactScene?'#eff6ff':verification.compliant?'#f0fdf4':'#fff1f2',
                  fontSize:'.69rem',
                  color:!exactScene?'#1e3a8a':verification.compliant?'#166534':'#991b1b'}}>
        <strong>
          {!exactScene
            ? 'Estado interpolado'
            : `${verification.compliant?'Cumple':'Revisar'} CIE 140`}
        </strong>
        {' · '}U0 mín. {Number(verification.minimum_U0||0).toFixed(3)}
        {' · '}Ul mín. {Number(verification.minimum_Ul||0).toFixed(3)}
        {daylightPeak>0&&` · aporte natural en boca ${daylightPeak.toFixed(1)} cd/m²`}
      </div>

      <div style={{background:'var(--salvi-surface)',border:'1px solid var(--salvi-line)',
                   borderRadius:8,padding:'10px 12px'}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:10,
                    alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
          <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--salvi-grey)',
                      textTransform:'uppercase',letterSpacing:'.07em'}}>
            {scene.label} · Lreq frente a Lcalc
          </div>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            <div style={{display:'inline-flex',border:'1px solid var(--salvi-line)',borderRadius:5,overflow:'hidden'}}
              title="Recalcula la misma instalación y las seis escenas con la fuente fotométrica seleccionada.">
              <button type="button" onClick={()=>recalculateWithCalcMode('direct')}
                disabled={validatingControl}
                style={{border:0,padding:'4px 8px',fontSize:'.62rem',fontWeight:700,cursor:validatingControl?'wait':'pointer',
                  background:calcMode==='direct'?'#1f2937':'#fff',color:calcMode==='direct'?'#fff':'#475569'}}>
                ⚡ Directo
              </button>
              <button type="button" onClick={()=>recalculateWithCalcMode('radiosity')}
                disabled={validatingControl}
                style={{border:0,borderLeft:'1px solid var(--salvi-line)',padding:'4px 8px',fontSize:'.62rem',fontWeight:700,cursor:validatingControl?'wait':'pointer',
                  background:calcMode==='radiosity'?'#4f46e5':'#fff',color:calcMode==='radiosity'?'#fff':'#475569'}}>
                ✦ Con reflexiones
              </button>
            </div>
            <label style={{fontSize:'.63rem',color:'var(--salvi-grey)',display:'flex',gap:5,alignItems:'center'}}>
              <input type="checkbox" checked={includeNatural}
                onChange={event=>setIncludeNatural(event.target.checked)}/>
              Incluir aporte natural modelado
            </label>
          </div>
         </div>
         {(()=>{
           const override=Number.parseFloat(form.interior_luminance_override);
           const calculated=Number(result.summary?.Lin||0);
           return Number.isFinite(override)&&override>0
             && Math.abs(override-calculated)>1e-6
             ? <div style={{marginBottom:8,padding:'7px 10px',border:'1px solid #fbbf24',borderRadius:7,background:'#fffbeb',color:'#92400e',fontSize:'.68rem'}}>
                 Lin de proyecto = <strong>{override.toFixed(1)} cd/m²</strong> pendiente de recalcular; la gráfica muestra el último cálculo validado = <strong>{calculated.toFixed(1)} cd/m²</strong>.
               </div>
             : null;
         })()}
         <ProfileChart chartData={sceneChart}
          tunnelLength={result.summary?.length_m}
          Lth={LthSelected}
          Lin={factor===0
            ? (exactScene?.key==='night_reduced'?LnightReduced:LnightNormal)
            : Math.min(Lin,LthSelected)}
          zones={result.zones}
          actualPoints={actualPoints}
          denseActual={true}
          overlayScenes={overlayScenes}
          showLthReference={false}
          requiredLabel={`Lreq ${scene.label} (variable)`}
          actualLegend="Lavg CIE 140 de la escena — misma serie física que el capítulo 4; Lreq es variable por campo"
          selectedS={planPositionM!=null && Number.isFinite(Number(planPositionM))
            ? Number(planPositionM) : profile.fields?.[planFieldIndex]?.s??null}/>
      </div>

      <NormativePlanView
        profile={profile}
        zoneList={zoneList}
        luminaireResult={lumResult}
        form={form}
        lumConfig={lumConfig}
        fieldIndex={planFieldIndex}
        onFieldIndexChange={setPlanFieldIndex}
        positionM={planPositionM}
        onPositionChange={setPlanPositionM}
        resetKey={photoResult}
        operatingScene={exactScene?.key||'intermediate'}
        operationResolver={operationFor}
        includeNatural={includeNatural}
      />

      <div className="card">
        <div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'space-between',flexWrap:'wrap'}}>
          <div className="card-title" style={{marginBottom:0}}>
            💡 Auditoría de luminarias y campos CIE 140
          </div>
          <div style={{display:'inline-flex',border:'1px solid var(--salvi-line)',borderRadius:5,overflow:'hidden'}}>
            <button type="button" onClick={()=>{setSceneAuditMode('active');setSceneLumFilters({});}}
              style={{border:0,padding:'4px 8px',fontSize:'.62rem',fontWeight:700,cursor:'pointer',
                background:sceneAuditMode==='active'?'#1f2937':'#fff',color:sceneAuditMode==='active'?'#fff':'#475569'}}>
              Escena activa
            </button>
            <button type="button" onClick={()=>{setSceneAuditMode('all');setSceneLumFilters({});}}
              style={{border:0,borderLeft:'1px solid var(--salvi-line)',padding:'4px 8px',fontSize:'.62rem',fontWeight:700,cursor:'pointer',
                background:sceneAuditMode==='all'?'#1f2937':'#fff',color:sceneAuditMode==='all'?'#fff':'#475569'}}>
              Las 6 escenas
            </button>
          </div>
          {sceneAuditMode==='all' && (
            <select value={sceneFilter} onChange={event=>setSceneFilter(event.target.value)}
              style={{fontSize:'.62rem',padding:'4px 6px',border:'1px solid var(--salvi-line)',borderRadius:4,background:'#fff'}}>
              <option value="all">Todas las escenas</option>
              {[...sceneDisplayDefinitions,nightReducedDefinition].map(item=>(
                <option key={item.key} value={item.key}>{item.label}</option>
              ))}
            </select>
          )}
          <button type="button" onClick={recalcActiveScene}
            disabled={recalcSceneRunning||!form.luminaires_result}
            style={{padding:'4px 9px',fontSize:'.62rem',fontWeight:700,cursor:'pointer',
              borderRadius:4,border:'1px solid #7c3aed',background:'#f5f3ff',color:'#5b21b6'}}>
            {recalcSceneRunning

function buildControlTopologyPlan(lumResult, form) {
  const layout=lumResult||{};
  const zones=[...(layout.zones||[])].sort((a,b)=>Number(a.s_start||0)-Number(b.s_start||0));
  const arrangement=layout.arrangement||form.lum_config?.arrangement||'central_single';
  const width=Math.max(.1,Number(form.width_m)||Number(layout.road_width_m)||7);
  const wallOffset=Number(form.lum_config?.wall_offset_m??.30);
  const span=Math.max(5,Number(form.dali_group_span_m)||60);
  const maxPerLine=Math.max(1,Math.min(64,Math.round(Number(form.dali_max_addresses_per_line)||64)));
  const cabinet=Math.max(0,Number(form.dali_cabinet_position_m)||0);
  const devices=[];
  const groupMap=new Map();

  zones.forEach((zone,zoneIndex)=>{
    const start=Number(zone.s_start||0);
    const setpoints=[...(zone.setpoints||[])].sort((a,b)=>Number(a.s||0)-Number(b.s||0));
    setpoints.forEach((setpoint,setpointIndex)=>{
      const position=Number(setpoint.s||0);
      const segment=Math.max(0,Math.floor((position-start)/span));
      const layer=zone.control_layer||'legacy';
      const groupKey=`${zone.zone_name||`Z${zoneIndex+1}`}|${layer}|${segment}`;
      if(!groupMap.has(groupKey)) groupMap.set(groupKey,{
        key:groupKey,
        name:`${zone.zone_name||`Zona ${zoneIndex+1}`} · ${segment+1}`,
        zone:zone.zone_name||zone.zone_type||`Zona ${zoneIndex+1}`,
        layer,
        devices:[],
      });
      const physicalY=physicalLuminaireYPositions(arrangement,width,wallOffset,setpointIndex+1);
      physicalY.forEach((y,rowIndex)=>{
        const device={
          id:`${zone.zone_name||`Z${zoneIndex+1}`}-${setpoint.idx??setpointIndex+1}-${rowIndex+1}`,
          s:position,
          y:Number(y),
          model:setpoint.model||zone.model||'APHEX',
          groupKey,
        };
        devices.push(device);
        groupMap.get(groupKey).devices.push(device);
      });
    });
  });
  const rawGroups=[...groupMap.values()].filter(group=>group.devices.length).sort((a,b)=>
    Math.min(...a.devices.map(device=>device.s))-Math.min(...b.devices.map(device=>device.s))
  );
  const daliGroups=[];
  rawGroups.forEach(raw=>{
    for(let offset=0;offset<raw.devices.length;offset+=maxPerLine){
      const members=raw.devices.slice(offset,offset+maxPerLine);
      daliGroups.push({
        ...raw,
        name:raw.devices.length>maxPerLine?`${raw.name} · tramo ${Math.floor(offset/maxPerLine)+1}`:raw.name,
        devices:members,
        sStart:Math.min(...members.map(device=>device.s)),
        sEnd:Math.max(...members.map(device=>device.s)),
      });
    }
  });
  const lines=[];
  let current=null;
  daliGroups.forEach(group=>{
    const needsLine=!current
      || current.devices.length+group.devices.length>maxPerLine
      || current.groups.length>=16;
    if(needsLine){
      current={id:lines.length+1,devices:[],groups:[]};
      lines.push(current);
    }
    const groupWithLine={...group,line:current.id,groupAddress:current.groups.length};
    current.groups.push(groupWithLine);
    group.devices.forEach(device=>{
      const assigned={...device,line:current.id,address:current.devices.length};
      current.devices.push(assigned);
    });
  });
  const cable=lines.map(line=>{
    const positions=line.devices.map(device=>device.s);
    const farthest=Math.max(...positions.map(position=>Math.abs(position-cabinet)),0);
    return {...line,
      sStart:Math.min(...positions),sEnd:Math.max(...positions),
      routeLengthM:Math.round(farthest*10)/10,
      conductorLengthM:Math.round(farthest*2*10)/10,
    };
  });
  return {
    devices,
    gatewayCount:Math.ceil(devices.length/Math.max(1,Number(form.wirepas_nodes_per_gateway)||200)),
    rawGroups,
    groups:lines.flatMap(line=>line.groups),
    lines:cable,
    routeLengthM:cable.reduce((sum,line)=>sum+line.routeLengthM,0),
    conductorLengthM:cable.reduce((sum,line)=>sum+line.conductorLengthM,0),
    maxPerLine,
  };
}

function StepControl({ result, form, onChange }) {
  if (!result?.success) return <Alert type="info">Completa el cálculo primero.</Alert>;

  const control    = result.control || {};
  const groups     = control.groups || [];
  const scenes     = control.scenes || [];
  const curves     = control.regulation_curves || [];
  const strategy   = control.strategy || {};
  const protocolRaw= form.control_protocol || 'DALI-continuous';
  const topology   = form.control_topology || 'smartec_wirepas';
  const protocol   = topology==='smartec_wirepas'
    ? 'SmartEC'
    : (protocolRaw === 'DALI' ? 'DALI-continuous' : protocolRaw);
  const topologyPlan = buildControlTopologyPlan(form.luminaires_result,form);
  const sensorType = form.sensor_type || 'luminancemeter_L20';
  const interval   = +(form.sample_interval_min || 10);
  const rampTime   = +(form.ramp_time_s || 60);
  const driverMin  = +(form.driver_min_dim_pct ?? 0.1);
  const base       = groups.find(g=>g.layer==='permanent');
  const refsA      = groups.filter(g=>g.layer==='reinforcement' && g.portal==='A');
  const refsB      = groups.filter(g=>g.layer==='reinforcement' && g.portal==='B');
  const primaryCurve = curves.find(c=>c.group_name?.includes('REF-A-TH'))
                    || curves.find(c=>c.group_name?.startsWith('REF-'));

  const handleExport = () => {
    const data = {
      ...control,
      operation: {
        protocol, topology, sensor_type:sensorType,
        sample_interval_min:interval, ramp_time_s:rampTime,
        configured_driver_min_pct:driverMin,
      },
      topology_plan: topologyPlan,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `control_multiescenario_${form.tube_id||'T1'}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="card">
        <div className="card-title">🎛️ Control multiescenario — BASE + refuerzos</div>
        <div className="alert alert-info" style={{fontSize:'.80rem',marginBottom:12}}>
          La capa <strong>BASE</strong> recorre el túnel completo. Los refuerzos de umbral y
          transición se regulan por boca y quedan <strong>apagados de noche</strong>.
        </div>
        <div className="form-grid col-2">
          <Field label="Protocolo">
            <select value={protocol} onChange={e=>onChange('control_protocol',e.target.value)}>
              <option value="DALI-continuous">DALI continuo (IEC 62386)</option>
              <option value="SmartEC">SmartEC continuo</option>
              <option value="DALI-scenes">DALI escenas de respaldo</option>
              <option value="0-10V">Analógico 0-10V</option>
            </select>
          </Field>
          <Field label={strategy.independent_portals ? "Sensores L₂₀ (uno por boca)" : "Sensor L₂₀"}>
            <select value={sensorType} onChange={e=>onChange('sensor_type',e.target.value)}>
              <option value="luminancemeter_L20">Luminancímetro L₂₀</option>
              <option value="photocell_Lad">Célula fotoeléctrica Lad</option>
              <option value="schedule">Sin sensor (solo respaldo horario)</option>
            </select>
          </Field>
          <Field label="Intervalo de muestreo">
            <select value={interval} onChange={e=>onChange('sample_interval_min',+e.target.value)}>
              <option value={5}>5 minutos</option><option value={10}>10 minutos</option>
              <option value={15}>15 minutos</option><option value={30}>30 minutos</option>
            </select>
          </Field>
          <Field label="Rampa de transición">
            <select value={rampTime} onChange={e=>onChange('ramp_time_s',+e.target.value)}>
              <option value={30}>30 s</option><option value={60}>60 s</option>
              <option value={120}>2 min</option><option value={300}>5 min</option>
            </select>
          </Field>
          <Field label="Horas de operación/año" hint="8.760 h para túnel iluminado 24 h; 4.300 h si se evalúa exclusivamente el régimen nocturno.">
            <input type="number" min={1000} max={8760} step={100}
              value={form.annual_operation_hours ?? 8760}
              onChange={e=>onChange('annual_operation_hours',Math.max(1000,Math.min(8760,+e.target.value||8760)))}/>
          </Field>
          <Field label="Horas nocturnas/año" hint="Hipótesis trazable para la memoria energética. Referencia inicial: 4.300 h/año.">
            <input type="number" min={0} max={form.annual_operation_hours ?? 8760} step={100}
              value={form.night_operation_hours ?? 4300}
              onChange={e=>onChange('night_operation_hours',Math.max(0,Math.min(form.annual_operation_hours ?? 8760,+e.target.value||0)))}/>
