services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME_URL: http://keycloak:8080
      KC_HOSTNAME_STRICT: false
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/auth
      KC_DB_USERNAME: ${POSTGRES_USER:-luxstudio}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-luxstudio-local-only}
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
