services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://keycloak:8080}
      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/auth
      KC_DB_USERNAME: ${POSTGRES_USER:-luxstudio}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-local-test-pg-password-2024}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
