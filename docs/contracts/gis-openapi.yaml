openapi: "3.1.0"
info:
  title: GIS API
  version: "1.0.0"
  description: Posicionamiento de luminarias en calle
servers:
  - url: /api/gis/v1
paths:
  /zones:
    get:
      summary: Listar zonas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de zonas
  /luminaires:
    get:
      summary: Listar luminarias
      security:
        - bearerAuth: []
      parameters:
        - name: zone_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de luminarias
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
