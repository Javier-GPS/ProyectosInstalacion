openapi: "3.1.0"
info:
  title: LuxStudio API
  version: "1.0.0"
  description: Cálculo fotométrico EN 13201
servers:
  - url: /api/lux/v1
paths:
  /projects:
    get:
      summary: Listar proyectos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de proyectos
  /calculate:
    post:
      summary: Calcular luminaria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Resultado del cálculo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
