# OAuth2 Proxy configuration — TOML format
# Uses Auth0 by default. Switch to Keycloak by changing OIDC_ISSUER_URL.

# OIDC Provider
oidc_issuer_url = "${OIDC_ISSUER_URL}"
client_id = "${OIDC_CLIENT_ID}"
client_secret = "${OIDC_CLIENT_SECRET}"

# Upstream
upstream = "http://gateway:80"
email_domains = [ "*" ]

# Auth
skip_auth_regex = [ "^/api/auth/login$", "^/api/auth/setup$", "^/api/health$" ]

# Token forwarding
pass_access_token = true
set_xauth = true
set_authorization_header = true

# Session
session_store_type = "redis"
redis_connection_url = "redis://redis-cache:6379"

# Security
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
