[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salvi-luminaria-optimizer"
version = "0.1.0"
description = "Photometric and electrical optimizer for repeated-module HL2X luminaires"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "numpy>=1.26", "pydantic>=2.0", "uvicorn>=0.29"]

[project.optional-dependencies]
geometry = ["cadquery>=2.8,<3", "trimesh>=5,<6", "embreex>=4,<5"]
solidworks = ["pywin32>=306; sys_platform == 'win32'", "rarfile>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
